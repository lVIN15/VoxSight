spring.application.name=voxsight

# ── H2 In-Memory DataSource (local dev / testing, no MySQL needed) ─────────
spring.datasource.url=jdbc:h2:mem:voxsightdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ───────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop: auto-generates the schema from @Entity classes on startup,
# drops it on shutdown. Safe for dev; switch to 'validate' with a real DB.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── H2 Web Console (accessible at http://localhost:8080/h2-console) ───────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
