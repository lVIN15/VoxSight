spring.application.name=voxsight

# Dynamic Server Port Configuration
server.port=${PORT:8080}

# Configurable Binary Paths (Windows local development defaults with cloud env var overrides)
audiveris.path=${AUDIVERIS_PATH:C:\\Program Files\\Audiveris\\Audiveris.exe}
python.path=${PYTHON_PATH:python}
tessdata.prefix=${TESSDATA_PREFIX:}

# Configurable Storage Directories (Empty defaults fallback to System Temp / Working Dir)
voxsight.storage.uploads-dir=${UPLOADS_DIR:}
voxsight.storage.outputs-dir=${OUTPUTS_DIR:}

# CORS Origin Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Health Endpoint (Spring Boot Actuator) - Only expose health for cloud health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# App Version Requirements & Force Update Gate
voxsight.app.min-version-code=${VOXSIGHT_MIN_APP_VERSION_CODE:2}
voxsight.app.min-version-name=${VOXSIGHT_MIN_APP_VERSION_NAME:1.1.0}
voxsight.app.latest-version-name=${VOXSIGHT_LATEST_APP_VERSION_NAME:1.1.0}
voxsight.app.download-url=${VOXSIGHT_DOWNLOAD_URL:https://github.com/lVIN15/VoxSight/releases/download/v1.1.0/voxsight-v1.1.0.apk}
voxsight.app.release-notes-url=${VOXSIGHT_RELEASE_NOTES_URL:https://github.com/lVIN15/VoxSight/releases/tag/v1.1.0}

