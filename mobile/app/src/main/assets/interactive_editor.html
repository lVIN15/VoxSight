                    var firstPartMeasures = Array.from(firstPart.getElementsByTagName('measure'));
                    for (var mIdx = 0; mIdx < firstPartMeasures.length; mIdx++) {
                        var mElem = firstPartMeasures[mIdx];
                        var mrElem = mElem.querySelector('measure-style > multiple-rest');
                        if (mrElem && (mrElem.textContent || '').trim() === '1') {
                            var matchedCredit = null;
                            var matchedN = null;
                            var creditsList = Array.from(doc.getElementsByTagName('credit'));
                            for (var ci = 0; ci < creditsList.length; ci++) {
                                var cr = creditsList[ci];
                                var pageAttr = cr.getAttribute('page') || '1';
                                if (pageAttr !== '1') continue;
                                var cwList = cr.getElementsByTagName('credit-words');
                                for (var cwi = 0; cwi < cwList.length; cwi++) {
                                    var cw = cwList[cwi];
                                    var txt = (cw.textContent || '').trim();
                                    if (/^\d+$/.test(txt)) {
                                        var val = parseInt(txt, 10);
                                        if (val >= 2 && val <= 99) {
                                            var x = parseFloat(cw.getAttribute('default-x') || '0');
                                            var y = parseFloat(cw.getAttribute('default-y') || '0');
                                            if (x > 250 && y > 1400) {
                                                matchedCredit = cr;
                                                matchedN = val;
                                                break;
                                            }
                                        }
                                    }
                                }
                                if (matchedCredit) break;
                            }

                            if (matchedCredit && matchedN) {
                                var N = matchedN;
                                var startNumRaw = mElem.getAttribute('number') || '1';
                                var startNum = /^\d+$/.test(startNumRaw) ? parseInt(startNumRaw, 10) : 1;
                                var noteElem = mElem.getElementsByTagName('note')[0];
                                var durText = '12';
                                if (noteElem) {
                                    var dElem = noteElem.getElementsByTagName('duration')[0];
                                    if (dElem && dElem.textContent) durText = dElem.textContent.trim();
                                }

                                partsForRest.forEach(function(p) {
                                    var pMeasures = Array.from(p.getElementsByTagName('measure'));
                                    if (mIdx >= pMeasures.length) return;
                                    var currM = pMeasures[mIdx];
                                    var currMr = currM.querySelector('measure-style > multiple-rest');
                                    if (currMr) currMr.textContent = String(N);

                                    // Remove print-object="no" on rest notes so OSMD renders the rest
                                    var notes = Array.from(currM.getElementsByTagName('note'));
                                    notes.forEach(function(n) {
                                        if (n.hasAttribute('print-object')) n.removeAttribute('print-object');
                                    });

                                    var nextMIdx = mIdx + 1;
                                    var offset = N - 1;
                                    if (nextMIdx < pMeasures.length) {
                                        var nextNumRaw = pMeasures[nextMIdx].getAttribute('number') || '1';
                                        if (/^\d+$/.test(nextNumRaw)) {
                                            offset = (startNum + N) - parseInt(nextNumRaw, 10);
                                        }
                                    }

                                    var refNode = currM.nextSibling;
                                    for (var k = 1; k < N; k++) {
                                        var placeholderNum = String(startNum + k);
                                        var placeholderM = doc.createElement('measure');
                                        placeholderM.setAttribute('number', placeholderNum);
                                        var nElem = doc.createElement('note');
                                        var rElem = doc.createElement('rest');
                                        rElem.setAttribute('measure', 'yes');
                                        var durEl = doc.createElement('duration');
                                        durEl.textContent = durText;
                                        nElem.appendChild(rElem);
                                        nElem.appendChild(durEl);
                                        placeholderM.appendChild(nElem);
                                        p.insertBefore(placeholderM, refNode);
                                    }

                                    var updatedMeasures = Array.from(p.getElementsByTagName('measure'));
                                    for (var smIdx = mIdx + N; smIdx < updatedMeasures.length; smIdx++) {
                                        var sm = updatedMeasures[smIdx];
                                        var smNumRaw = sm.getAttribute('number');
                                        if (smNumRaw && /^\d+$/.test(smNumRaw)) {
                                            sm.setAttribute('number', String(parseInt(smNumRaw, 10) + offset));
                                        }
                                    }
                                });

                                if (matchedCredit.parentNode) {
                                    matchedCredit.parentNode.removeChild(matchedCredit);
                                }
                                console.log('[cleanMusicXmlDom] Repaired multimeasure rest to N=' + N);
                                break;
                            }
                        }
                    }
                }
            } catch (err) {
                console.warn('[cleanMusicXmlDom] Multimeasure rest repair error:', err);
            }

            // 3b. Prune Non-SATB Accompaniment (Piano, Organ, Keyboard, Guitar, etc.) and Solo staves
            var accompKeywords = ['piano', 'pno', 'keyboard', 'kbd', 'organ', 'org', 'accomp', 'accompaniment', 'guitar', 'gtr', 'harp', 'strings', 'orchestra', 'synth', 'continuo'];
            var soloKeywords = ['solo', 'cantor', 'leader', 'soloist', 'obbligato', 'descant'];
            var vocalKeywords = ['soprano', 'alto', 'tenor', 'bass', 's/a', 'sa', 't/b', 'tb', 's', 'a', 't', 'b', 'women', 'men', 'treble'];

            var allPartsList = Array.from(doc.getElementsByTagName('part'));
            var partListElem = doc.getElementsByTagName('part-list')[0];

            if (partListElem && allPartsList.length > 1) {
                var partMeta = allPartsList.map(function(p) {
                    var pid = p.getAttribute('id');
                    var sp = partListElem.querySelector("score-part[id='" + pid + "']");
                    var pName = (sp && sp.querySelector('part-name')) ? (sp.querySelector('part-name').textContent || '').trim().toLowerCase() : '';
                    var pAbbr = (sp && sp.querySelector('part-abbreviation')) ? (sp.querySelector('part-abbreviation').textContent || '').trim().toLowerCase() : '';
                    var instr = (sp && sp.querySelector('instrument-name')) ? (sp.querySelector('instrument-name').textContent || '').trim().toLowerCase() : '';
                    var midiProgElem = sp ? sp.querySelector('midi-program') : null;
                    var midiProg = midiProgElem ? parseInt(midiProgElem.textContent, 10) : -1;

                    var stavesElem = p.querySelector('attributes > staves');
                    var stavesCount = stavesElem ? (parseInt(stavesElem.textContent, 10) || 1) : 1;

                    var lyrics = p.querySelectorAll('lyric text');
                    var validLyrics = 0;
                    lyrics.forEach(function(l) {
                        var txt = (l.textContent || '').trim();
                        if (txt.length > 1 || /[a-zA-Z]/.test(txt)) validLyrics++;
                    });

                    var notes = p.querySelectorAll('note');
                    var noteCount = notes.length;
                    var chords = p.querySelectorAll('note > chord').length;

                    var pNameNorm = pName.replace(/[\s.]+/g, '');
                    var pAbbrNorm = pAbbr.replace(/[\s.]+/g, '');

                    var isExplicitSolo = soloKeywords.some(function(kw) {
                        return pName.indexOf(kw) !== -1 || pAbbr.indexOf(kw) !== -1 || instr.indexOf(kw) !== -1;
                    }) || pNameNorm === 'sol' || pNameNorm === 'solo' || pAbbrNorm === 'sol' || pAbbrNorm === 'solo' || pName.indexOf('sol.') !== -1;

                    var isExplicitAccomp = accompKeywords.some(function(kw) {
                        return pName.indexOf(kw) !== -1 || pAbbr.indexOf(kw) !== -1 || instr.indexOf(kw) !== -1;
                    }) || ['piano', 'pno', 'org', 'organ', 'kbd', 'keyboard', 'gtr', 'guitar'].indexOf(pNameNorm) !== -1 || (midiProg >= 1 && midiProg <= 8) || (midiProg >= 17 && midiProg <= 24);

                    var isVocalName = vocalKeywords.some(function(kw) {
                        var kwNorm = kw.replace(/[\s.]+/g, '');
                        return pName === kw || pAbbr === kw || pNameNorm === kwNorm || pName.startsWith(kw + ' ') || pName.indexOf('/' + kw) !== -1;
                    });

                    return {
                        partElem: p,
                        scorePartElem: sp,
                        id: pid,
                        name: pName,
                        abbr: pAbbr,
                        staves: stavesCount,
                        noteCount: noteCount,
                        validLyrics: validLyrics,
                        chords: chords,
                        isExplicitSolo: isExplicitSolo,
                        isExplicitAccomp: isExplicitAccomp,
                        isVocalName: isVocalName
                    };
                });

                // Prune only true OCR artifacts (empty phantom staves with 0 notes).
                // We explicitly preserve Vocal Solos, Choral Staves, and Instrumental Accompaniments (Others)
                var toPrune = [];
                partMeta.forEach(function(m) {
                    if (m.noteCount === 0) {
                        toPrune.push(m);
                    }
                });

                if (toPrune.length > 0 && (allPartsList.length - toPrune.length) >= 1) {
                    toPrune.forEach(function(m) {
                        if (m.partElem && m.partElem.parentNode) {
                            m.partElem.parentNode.removeChild(m.partElem);
                        }
                        if (m.scorePartElem && m.scorePartElem.parentNode) {
                            m.scorePartElem.parentNode.removeChild(m.scorePartElem);
                        }
                    });
                }
            }

            // 4. Detect and merge complementary parts (e.g. S/A + Alto, T/B + Bass, or S, A, T, B + Soprano, Alto, Tenor, Bass)
            var partList = doc.getElementsByTagName('part-list')[0];
            var parts = doc.getElementsByTagName('part');
            if (!partList || parts.length < 2) return;

            function normalizeChoralPartName(rawName) {
                if (!rawName) return '';
                var sClean = rawName.trim().toLowerCase().replace(/[.\s_-]+/g, '');
                var m = sClean.match(/^(soprano|sopr|sop|s)([1-4]?)$/);
                if (m) return m[2] ? ('Soprano ' + m[2]) : 'Soprano';
                m = sClean.match(/^(alto|alt|a|contralto)([1-4]?)$/);
                if (m) return m[2] ? ('Alto ' + m[2]) : 'Alto';
                m = sClean.match(/^(tenor|ten|t)([1-4]?)$/);
                if (m) return m[2] ? ('Tenor ' + m[2]) : 'Tenor';
                m = sClean.match(/^(bass|bas|b)([1-4]?)$/);
                if (m) return m[2] ? ('Bass ' + m[2]) : 'Bass';
                m = sClean.match(/^(baritone|bar)([1-4]?)$/);
                if (m) return m[2] ? ('Baritone ' + m[2]) : 'Baritone';
                if (/^(sa|sopranoalto)$/.test(sClean)) return 'Soprano / Alto';
                if (/^(tb|tenorbass)$/.test(sClean)) return 'Tenor / Bass';
                return rawName;
            }

            function getChoralTier(n) {
                if (!n) return 0;
                var s = n.trim().toLowerCase().replace(/[.\s_-]+/g, '');
                if (/^(soprano|sopr|sop|s)[1-4]?$/.test(s) ||
                    /^(alto|alt|a|contralto|mezzo|mezzosoprano)[1-4]?$/.test(s) ||
                    /^(sa|sopranoalto|women|treble)[1-4]?$/.test(s)) {
                    return 1;
                }
                if (/^(tenor|ten|t)[1-4]?$/.test(s) ||
                    /^(baritone|bar)[1-4]?$/.test(s) ||
                    /^(bass|bas|b)[1-4]?$/.test(s) ||
                    /^(tb|tenorbass|men)[1-4]?$/.test(s)) {
                    return 2;
                }
                return 0;
            }

            function getCompositePartNameAndAbbr(raw1, raw2) {
                var r1 = (raw1 || '').trim();
                var r2 = (raw2 || '').trim();
                var compMap = {
                    's/a': ['Soprano / Alto', 'S/A'],
                    'sa': ['Soprano / Alto', 'S/A'],
                    't/b': ['Tenor / Bass', 'T/B'],
                    'tb': ['Tenor / Bass', 'T/B'],
                    's/t': ['Soprano / Tenor', 'S/T'],
                    'st': ['Soprano / Tenor', 'S/T'],
                    'a/b': ['Alto / Bass', 'A/B'],
                    'ab': ['Alto / Bass', 'A/B']
                };
                if (compMap[r1.toLowerCase()]) return compMap[r1.toLowerCase()];
                if (compMap[r2.toLowerCase()]) return compMap[r2.toLowerCase()];

                var t1 = getChoralTier(r1);
                var t2 = getChoralTier(r2);
                if (t1 === 1 || t2 === 1) {
                    if ((r1.toLowerCase().indexOf('alto') !== -1 || r2.toLowerCase().indexOf('alto') !== -1) &&
                        (r1.toLowerCase().indexOf('sop') !== -1 || r2.toLowerCase().indexOf('sop') !== -1 || r1.toLowerCase().indexOf('s/a') !== -1 || r2.toLowerCase().indexOf('s/a') !== -1)) {
                        return ['Soprano / Alto', 'S/A'];
                    }
                }
                if (t1 === 2 || t2 === 2) {
                    if ((r1.toLowerCase().indexOf('bass') !== -1 || r2.toLowerCase().indexOf('bass') !== -1) &&
                        (r1.toLowerCase().indexOf('ten') !== -1 || r2.toLowerCase().indexOf('ten') !== -1 || r1.toLowerCase().indexOf('t/b') !== -1 || r2.toLowerCase().indexOf('t/b') !== -1)) {
                        return ['Tenor / Bass', 'T/B'];
                    }
                }

                var cName = r1.length >= r2.length ? r1 : r2;
                var abbr = cName.length > 4 ? cName.slice(0, 4) : cName;
                return [cName, abbr];
            }

            var partInfo = [];
            for (var i = 0; i < parts.length; i++) {
                var p = parts[i];
                var pid = p.getAttribute('id');
                var sp = doc.querySelector("score-part[id='" + pid + "']");
                var rawName = (sp && sp.getElementsByTagName('part-name')[0]) ? sp.getElementsByTagName('part-name')[0].textContent.trim() : pid;
                var rawAbbr = (sp && sp.getElementsByTagName('part-abbreviation')[0]) ? sp.getElementsByTagName('part-abbreviation')[0].textContent.trim() : rawName;
                var normName = normalizeChoralPartName(rawName);
                var tier = getChoralTier(rawName);

                var nameLower = rawName.toLowerCase();
                var abbrLower = rawAbbr.toLowerCase();
                var isSolo = ['solo', 'cantor', 'leader', 'descant'].some(function(w) { return nameLower.indexOf(w) !== -1 || abbrLower.indexOf(w) !== -1; });
                var isAccomp = ['piano', 'organ', 'keyboard', 'guitar', 'acc', 'accomp', 'orch', 'strings'].some(function(w) { return nameLower.indexOf(w) !== -1 || abbrLower.indexOf(w) !== -1; });

                var measures = {};
                var measElems = p.getElementsByTagName('measure');
                for (var m = 0; m < measElems.length; m++) {
                    var me = measElems[m];
                    var mnum = me.getAttribute('number');
                    var notes = me.getElementsByTagName('note');
                    var nonRest = 0;
                    for (var n = 0; n < notes.length; n++) {
                        if (notes[n].getElementsByTagName('rest').length === 0) nonRest++;
                    }
                    measures[mnum] = (measures[mnum] || 0) + nonRest;
                }
                partInfo.push({ element: p, scorePart: sp, pid: pid, rawName: rawName, rawAbbr: rawAbbr, normName: normName, tier: tier, isSolo: isSolo, isAccomp: isAccomp, measures: measures });
            }

            // Strategy A: Name-based Solo continuation harmonization
            var hasExplicitSolo = partInfo.some(function(info) { return info.isSolo; });
            if (hasExplicitSolo) {
                var choirMeasures = new Set();
                partInfo.forEach(function(info) {
                    if (info.isSolo || info.isAccomp) return;
                    var isChoirVoice = (info.tier >= 2 && info.tier <= 4) ||
                        ['alto', 'tenor', 'bass', 'choir', 'satb'].some(function(kw) { return info.normName.toLowerCase().indexOf(kw) !== -1; });
                    var firstM = info.element.getElementsByTagName('measure')[0];
                    var clefSign = firstM ? firstM.querySelector('clef > sign') : null;
                    var hasFClef = clefSign && (clefSign.textContent || '').trim() === 'F';
                    if (isChoirVoice || hasFClef) {
                        for (var m in info.measures) {
                            if (info.measures[m] > 0 && /^\d+$/.test(m)) {
                                choirMeasures.add(parseInt(m, 10));
                            }
                        }
                    }
                });
                var firstChoirM = choirMeasures.size > 0 ? Math.min.apply(null, Array.from(choirMeasures)) : -1;

                if (firstChoirM > 0) {
                    partInfo.forEach(function(info) {
                        if (!info.isSolo && !info.isAccomp) {
                            var normLow = info.normName.toLowerCase();
                            var rawLow = info.rawName.toLowerCase();
                            var isShorthand = ['s', 's.', 'sop', 'solo'].indexOf(normLow) !== -1 || ['s', 's.', 'sop', 'solo'].indexOf(rawLow) !== -1;
                            if (isShorthand) {
                                var activeM = [];
                                for (var m in info.measures) {
                                    if (info.measures[m] > 0 && /^\d+$/.test(m)) {
                                        activeM.push(parseInt(m, 10));
                                    }
                                }
                                if (activeM.length > 0 && activeM.every(function(m) { return m < firstChoirM; })) {
                                    info.isSolo = true;
                                    var rawLow = info.rawName.toLowerCase();
                                    if (rawLow.indexOf('baritone') !== -1) {
                                        info.normName = 'Baritone Solo';
                                    } else {
                                        info.normName = 'Solo';
                                    }
                                    info.tier = 0;
                                }
                            }
                        }
                    });
                }
            }

            // Strategy B: Position-based Universal Solo Detection (when Audiveris labels everything "Voice")
            var hasChoralParts = partInfo.some(function(info) { return info.tier >= 1 && info.tier <= 4; });
            if (!hasChoralParts && !partInfo.some(function(info) { return info.isSolo; })) {
                var nonAccompParts = partInfo.filter(function(info) { return !info.isAccomp; });
                var measureActiveParts = {};
                nonAccompParts.forEach(function(info) {
                    for (var m in info.measures) {
                        if (info.measures[m] > 0 && /^\d+$/.test(m)) {
                            var mi = parseInt(m, 10);
                            if (!measureActiveParts[mi]) measureActiveParts[mi] = new Set();
                            measureActiveParts[mi].add(info.pid);
                        }
                    }
                });

                var firstPolyM = 9999;
                var allActiveMs = Object.keys(measureActiveParts).map(function(k) { return parseInt(k, 10); }).sort(function(a, b) { return a - b; });
                for (var idx = 0; idx < allActiveMs.length; idx++) {
                    var mNum = allActiveMs[idx];
                    if (measureActiveParts[mNum].size >= 3) {
                        firstPolyM = mNum;
                        break;
                    }
                }

                var bassClefPids = new Set();
                nonAccompParts.forEach(function(info) {
                    var firstM = info.element.getElementsByTagName('measure')[0];
                    if (firstM) {
                        var clefSign = firstM.querySelector('clef > sign');
                        if (clefSign && (clefSign.textContent || '').trim() === 'F') {
                            bassClefPids.add(info.pid);
                        }
                    }
                });

                var firstBassM = 9999;
                bassClefPids.forEach(function(pid) {
                    var info = partInfo.find(function(pi) { return pi.pid === pid; });
                    if (info) {
                        for (var m in info.measures) {
                            if (info.measures[m] > 0 && /^\d+$/.test(m)) {
                                var mi = parseInt(m, 10);
                                if (measureActiveParts[mi] && measureActiveParts[mi].size >= 2) {
                                    if (mi < firstBassM) firstBassM = mi;
                                }
                            }
                        }
                    }
                });

                var choirEntranceM = Math.min(firstPolyM, firstBassM);
                if (allActiveMs.length > 0 && choirEntranceM < 9999) {
                    var earliestM = allActiveMs[0];
                    if (choirEntranceM > earliestM) {
                        var introMeasures = allActiveMs.filter(function(m) { return m < choirEntranceM; });
                        var isSoloIntro = introMeasures.length > 0 && introMeasures.every(function(m) {
                            return measureActiveParts[m].size <= 2;
                        });

                        if (isSoloIntro) {
                            nonAccompParts.forEach(function(info) {
                                if (info.tier >= 1 && info.tier <= 4) return;
                                var activeM = [];
                                for (var m in info.measures) {
                                    if (info.measures[m] > 0 && /^\d+$/.test(m)) {
                                        activeM.push(parseInt(m, 10));
                                    }
                                }
                                if (activeM.length > 0 && activeM.some(function(m) { return m < choirEntranceM; })) {
                                    info.isSolo = true;
                                    var rawLow = info.rawName.toLowerCase();
                                    if (rawLow.indexOf('baritone') !== -1) {
                                        info.normName = 'Baritone Solo';
                                    } else {
                                        info.normName = 'Solo';
                                    }
                                    info.tier = 0;
                                }
                            });
                        }
                    }
                }
            }

            // Multi-fragment Solo assembly: consolidate all Solo-tagged parts into one continuous line
            var soloParts = partInfo.filter(function(info) { return info.isSolo; });
            if (soloParts.length > 1) {
                soloParts.sort(function(a, b) {
                    var sumA = Object.values(a.measures).reduce(function(acc, val) { return acc + val; }, 0);
                    var sumB = Object.values(b.measures).reduce(function(acc, val) { return acc + val; }, 0);
                    return sumB - sumA;
                });
                var anchor = soloParts[0];
                var anchorP = anchor.element;
                var anchorSp = anchor.scorePart;
                if (anchorSp) {
                    var pn = anchorSp.getElementsByTagName('part-name')[0];
                    if (!pn) { pn = doc.createElement('part-name'); anchorSp.appendChild(pn); }
                    var curPn = (pn.textContent || '').trim().toLowerCase();
                    if (!curPn || ['voice', 's', 's.', 'sop'].indexOf(curPn) !== -1) {
                        pn.textContent = anchor.normName || 'Solo';
                    }
                    var pa = anchorSp.getElementsByTagName('part-abbreviation')[0];
                    if (!pa) { pa = doc.createElement('part-abbreviation'); anchorSp.appendChild(pa); }
                    var curPa = (pa.textContent || '').trim().toLowerCase();
                    if (!curPa || ['voice', 's', 's.', 'sop'].indexOf(curPa) !== -1) {
                        pa.textContent = anchor.normName || 'Solo';
                    }
                }

                for (var sIdx = 1; sIdx < soloParts.length; sIdx++) {
                    var frag = soloParts[sIdx];
                    var fragP = frag.element;
                    var fragSp = frag.scorePart;
                    var fragMeasures = Array.from(fragP.getElementsByTagName('measure'));

                    for (var fmIdx = 0; fmIdx < fragMeasures.length; fmIdx++) {
                        var m2 = fragMeasures[fmIdx];
                        var mnum = m2.getAttribute('number');
                        var m2Notes = Array.from(m2.getElementsByTagName('note')).filter(function(n) {
                            return n.getElementsByTagName('rest').length === 0;
                        });
                        if (m2Notes.length === 0) continue;

                        var m1Candidates = Array.from(anchorP.querySelectorAll("measure[number='" + mnum + "']"));
                        if (m1Candidates.length > 0) {
                            var targetM1 = m1Candidates[0];
                            var tNonRest = Array.from(targetM1.getElementsByTagName('note')).filter(function(n) {
                                return n.getElementsByTagName('rest').length === 0;
                            });
                            if (tNonRest.length === 0) {
                                var m2Clone = m2.cloneNode(true);
                                var m2Attrs = m2Clone.querySelector('attributes');
                                var tAttrs = targetM1.querySelector('attributes');
                                if (tAttrs && !m2Attrs) {
                                    m2Clone.insertBefore(tAttrs.cloneNode(true), m2Clone.firstChild);
                                }
                                anchorP.replaceChild(m2Clone, targetM1);
                            }
                        } else {
                            anchorP.appendChild(m2.cloneNode(true));
                        }
                    }

                    if (fragP.parentNode) fragP.parentNode.removeChild(fragP);
                    if (fragSp && fragSp.parentNode) fragSp.parentNode.removeChild(fragSp);
                }

                partInfo = partInfo.filter(function(info) {
                    return !soloParts.slice(1).some(function(frag) { return frag.pid === info.pid; });
                });
            } else if (soloParts.length === 1) {
                var singleSp = soloParts[0].scorePart;
                if (singleSp) {
                    var pn = singleSp.getElementsByTagName('part-name')[0];
                    if (!pn) { pn = doc.createElement('part-name'); singleSp.appendChild(pn); }
                    var curPn = (pn.textContent || '').trim().toLowerCase();
                    if (!curPn || ['voice', 's', 's.', 'sop'].indexOf(curPn) !== -1) {
                        pn.textContent = 'Solo';
                    }
                    var pa = singleSp.getElementsByTagName('part-abbreviation')[0];
                    if (!pa) { pa = doc.createElement('part-abbreviation'); singleSp.appendChild(pa); }
                    var curPa = (pa.textContent || '').trim().toLowerCase();
                    if (!curPa || ['voice', 's', 's.', 'sop'].indexOf(curPa) !== -1) {
                        pa.textContent = 'Solo';
                    }
                }
            }

            var mergedPids = new Set();

                    canonicalMeasureNumbers.sort(function (a, b) { return parseInt(a, 10) - parseInt(b, 10); });
                }

                for (var pi = 0; pi < finalParts.length; pi++) {
                    var p = finalParts[pi];
                    var partPid = (p.getAttribute('id') || '').toLowerCase();
                    var sp = doc.querySelector("score-part[id='" + p.getAttribute('id') + "']");
                    var partPname = ((sp && sp.querySelector('part-name')) ? (sp.querySelector('part-name').textContent || '') : '').toLowerCase();
                    var isBassClef = ['bass', 'tenor', 't/b', 'men'].some(function(w) { return partPid.indexOf(w) !== -1 || partPname.indexOf(w) !== -1; });

                    var existingMap = {};
                    var curMList = Array.from(p.getElementsByTagName('measure'));
                    for (var ci = 0; ci < curMList.length; ci++) {
                        var curM = curMList[ci];
                        existingMap[curM.getAttribute('number')] = curM;
                    }

                    for (var cmi = 0; cmi < canonicalMeasureNumbers.length; cmi++) {
                        var targetNum = canonicalMeasureNumbers[cmi];
                        if (!existingMap[targetNum]) {
                            var newMeasure = doc.createElement('measure');
                            newMeasure.setAttribute('number', targetNum);
                            var tmpl = measureTemplates[targetNum] || { divisions: globalDivisions, attrs: null };

                            var newAttrs = doc.createElement('attributes');
                            var divEl = doc.createElement('divisions');
                            divEl.textContent = tmpl.divisions || globalDivisions;
                            newAttrs.appendChild(divEl);

                            if (targetNum === canonicalMeasureNumbers[0]) {
                                var clefEl = doc.createElement('clef');
                                var signEl = doc.createElement('sign');
                                signEl.textContent = isBassClef ? 'F' : 'G';
                                var lineEl = doc.createElement('line');
                                lineEl.textContent = isBassClef ? '4' : '2';
                                clefEl.appendChild(signEl);
                                clefEl.appendChild(lineEl);
                                newAttrs.appendChild(clefEl);
                            }
                            if (tmpl.attrs) {
                                var keyEl = tmpl.attrs.getElementsByTagName('key')[0];
                                if (keyEl) newAttrs.appendChild(keyEl.cloneNode(true));
                                var timeEl = tmpl.attrs.getElementsByTagName('time')[0];
                                if (timeEl) newAttrs.appendChild(timeEl.cloneNode(true));
                            }
                            newMeasure.appendChild(newAttrs);

                            var restNote = doc.createElement('note');
                            var restElem = doc.createElement('rest');
                            restElem.setAttribute('measure', 'yes');
                            var durElem = doc.createElement('duration');
                            durElem.textContent = String(parseInt(tmpl.divisions || '4', 10) * 4);
                            var voiceElem = doc.createElement('voice');
                            voiceElem.textContent = '1';
                            restNote.appendChild(restElem);
                            restNote.appendChild(durElem);
                            restNote.appendChild(voiceElem);
                            newMeasure.appendChild(restNote);

                            p.appendChild(newMeasure);
                        }
                    }

                    // Re-sort measures strictly in canonical order
                    var updatedMList = Array.from(p.getElementsByTagName('measure'));
                    var updatedMap = {};
                    for (var ui = 0; ui < updatedMList.length; ui++) {
                        var uM = updatedMList[ui];
                        updatedMap[uM.getAttribute('number')] = uM;
                        if (uM.parentNode === p) p.removeChild(uM);
                    }
                    for (var cmi = 0; cmi < canonicalMeasureNumbers.length; cmi++) {
                        var numToAppend = canonicalMeasureNumbers[cmi];
                        if (updatedMap[numToAppend]) {
                            p.appendChild(updatedMap[numToAppend]);
                        }
                    }
                }
            }

        }

        // ─── XML Serialization & Sanitization ─────────────────────────────────
                function ensureMeasureAndLyricIntegrity(doc) {
            if (!doc) return;
            try {
                // Remap reserved percussion MIDI channel 10 for pitched parts to prevent OSMD from suppressing key signature
                const midiChannels = doc.querySelectorAll('midi-channel');
                midiChannels.forEach(mc => {
                    if (mc.textContent && mc.textContent.trim() === '10') {
                        mc.textContent = '15';
                    }
                });

                // Ensure print new-page also has new-system="yes" so OSMD breaks systems properly in endless view
                doc.querySelectorAll('print[new-page="yes"]').forEach(pr => {
                    if (!pr.hasAttribute('new-system')) pr.setAttribute('new-system', 'yes');
                });

                // Strip fixed measure widths so OSMD dynamically allocates natural spacing for notes and lyrics
                doc.querySelectorAll('measure[width]').forEach(m => {
                    m.removeAttribute('width');
                });

                const parts = doc.querySelectorAll('part');
                parts.forEach((part, partIdx) => {
                    let partName = '';
                    const pid = part.getAttribute('id');
                    const sp = doc.querySelector("score-part[id='" + pid + "']");
                    if (sp) {
                        const pn = sp.querySelector('part-name');
                        if (pn) partName = pn.textContent.toLowerCase();
                    }

                    let prevDivisions = '4';
                    let prevBeats = 4;
                    let prevBeatType = 4;
                    const measures = part.querySelectorAll('measure');
                    measures.forEach(m => {
                        const mNum = m.getAttribute('number');
                        const divElem = m.querySelector('divisions');
                        if (divElem && divElem.textContent) {
                            prevDivisions = divElem.textContent.trim();
                        }
                        const beatsEl = m.querySelector('time > beats');
                        const beatTypeEl = m.querySelector('time > beat-type');
                        if (beatsEl && beatsEl.textContent) {
                            const b = parseInt(beatsEl.textContent.trim(), 10);
                            if (b > 0) prevBeats = b;
                        }
                        if (beatTypeEl && beatTypeEl.textContent) {
                            const bt = parseInt(beatTypeEl.textContent.trim(), 10);
                            if (bt > 0) prevBeatType = bt;
                        }
                        const fullDur = Math.round(prevBeats * (4.0 / prevBeatType) * parseInt(prevDivisions, 10));

                        const allNotes = Array.from(m.querySelectorAll('note'));
                        const pitchedNotes = allNotes.filter(n => !n.querySelector('rest'));

                        // Dynamic Unresolved Incoming Tie Resolution across any measure
                        if (pitchedNotes.length === 0 && m.previousElementSibling) {
                            const prevM = m.previousElementSibling;
                            const prevNotes = Array.from(prevM.querySelectorAll('note')).filter(n => !n.querySelector('rest'));
                            let incomingTieNote = null;
                            for (let pi = prevNotes.length - 1; pi >= 0; pi--) {
                                const pn = prevNotes[pi];
                                const hasTieStart = Boolean(pn.querySelector('tie[type="start"], tied[type="start"]'));
                                const hasTieStop = Boolean(pn.querySelector('tie[type="stop"], tied[type="stop"]'));
                                if (hasTieStart && !hasTieStop) {
                                    incomingTieNote = pn;
                                    break;
                                }
                            }
                            if (incomingTieNote) {
                                const prevPitch = incomingTieNote.querySelector('pitch');
                                if (prevPitch) {
                                    allNotes.forEach(n => n.remove());
                                    const newNote = doc.createElement('note');
                                    newNote.appendChild(prevPitch.cloneNode(true));
                                    const dur = doc.createElement('duration'); dur.textContent = String(fullDur); newNote.appendChild(dur);
                                    const v = doc.createElement('voice'); v.textContent = '1'; newNote.appendChild(v);
                                    const t = doc.createElement('type'); t.textContent = 'whole'; newNote.appendChild(t);
                                    const s = doc.createElement('stem'); s.textContent = 'none'; newNote.appendChild(s);
                                    const notat = doc.createElement('notations');
                                    const tied = doc.createElement('tied'); tied.setAttribute('type', 'stop');
                                    notat.appendChild(tied);
                                    newNote.appendChild(notat);
                                    m.appendChild(newNote);
                                    return;
                                }
                            }
                        }

                        // 4. Standard Empty Measure and Whole Measure Rest Preservation
                        if (allNotes.length === 0) {
                            const isCutaway = m.getAttribute('print-object') === 'no' ||
                                (m.querySelector('staff-details') && m.querySelector('staff-details').getAttribute('print-object') === 'no');

                            const note = doc.createElement('note');
                            if (isCutaway) {
                                note.setAttribute('print-object', 'no');
                            }
                            const rest = doc.createElement('rest');
                            rest.setAttribute('measure', 'yes');
                            note.appendChild(rest);
                            const dur = doc.createElement('duration');
                            dur.textContent = String(fullDur);
                            note.appendChild(dur);
                            const voice = doc.createElement('voice');
                            voice.textContent = '1';
                            note.appendChild(voice);
                            m.appendChild(note);
                        } else if (pitchedNotes.length === 0 && allNotes.length === 1) {
                            const n0 = allNotes[0];
                            const r = n0.querySelector('rest');
                            if (r) {
                                const durEl = n0.querySelector('duration');
                                const curDur = durEl ? parseInt(durEl.textContent.trim(), 10) : 0;
                                if (r.getAttribute('measure') === 'yes' || curDur >= fullDur) {
                                    r.setAttribute('measure', 'yes');
                                    const dot = n0.querySelector('dot');
                                    if (dot) dot.remove();
                                    const type = n0.querySelector('type');
                                    if (type) type.remove();
                                    const ds = r.querySelector('display-step');
                                    if (ds) ds.remove();
                                    const doEl = r.querySelector('display-octave');
                                    if (doEl) doEl.remove();
                                    if (durEl) durEl.textContent = String(fullDur);
                                }
                            }
                        }
                    });

                    const allNotes = Array.from(part.querySelectorAll('note'));
                    allNotes.forEach((n, idx) => {
                        const syl = n.querySelector('lyric > syllabic');
                        if (syl && (syl.textContent === 'begin' || syl.textContent === 'middle')) {
                            let restsAhead = 0;
                            let hasPitchedAhead = false;
                            for (let j = idx + 1; j < allNotes.length; j++) {
                                if (allNotes[j].querySelector('rest')) {
                                    restsAhead++;
                                } else {
                                    hasPitchedAhead = true;
                                    break;
                                }
                            }
                            if (!hasPitchedAhead || restsAhead >= 2) {
                                syl.textContent = syl.textContent === 'begin' ? 'single' : 'end';
                            }
                        }
                    });
                });

                sanitizeBeamMisreadSlursAndOrphans(doc);
            } catch (err) {
                console.warn('[VoxSight] ensureMeasureAndLyricIntegrity warning:', err);
            }
        }

        function sanitizeBeamMisreadSlursAndOrphans(doc) {
            if (!doc) return;
            const childByTag = (el, tag) => {
                const kids = el ? el.children : null;
                if (!kids) return null;
                for (let i = 0; i < kids.length; i++) {
                    if (kids[i].tagName === tag) return kids[i];
                }
                return null;
            };
            const childrenByTag = (el, tag) => {
                const res = [];
                const kids = el ? el.children : null;
                if (!kids) return res;
                for (let i = 0; i < kids.length; i++) {
                    if (kids[i].tagName === tag) res.push(kids[i]);
                }
                return res;
            };
            const childText = (el, tag, defVal) => {
                const c = childByTag(el, tag);
                return (c && c.textContent !== null) ? c.textContent.trim() : defVal;
            };
            const pitchKey = (nEl) => {
                const p = childByTag(nEl, 'pitch');
                if (!p) return null;
                return childText(p, 'step', '') + ':' + childText(p, 'alter', '0') + ':' + childText(p, 'octave', '');
            };
            const isBeamMisreadSlur = (noteEl, slurEl) => {
                if ((slurEl.getAttribute('type') || '').trim() !== 'start') return false;
                if (childByTag(noteEl, 'rest') || childByTag(noteEl, 'beam')) return false;
                const stemEl = childByTag(noteEl, 'stem');
                if (!stemEl || !stemEl.textContent || !stemEl.hasAttribute('default-y')) return false;
                if (!slurEl.hasAttribute('default-x') || !slurEl.hasAttribute('default-y') || !slurEl.hasAttribute('bezier-y')) return false;
                const stemDir = stemEl.textContent.trim();
                const stemY = parseFloat(stemEl.getAttribute('default-y'));
                const sx = parseFloat(slurEl.getAttribute('default-x'));
                const sy = parseFloat(slurEl.getAttribute('default-y'));
                const by = parseFloat(slurEl.getAttribute('bezier-y'));
                if (isNaN(stemY) || isNaN(sx) || isNaN(sy) || isNaN(by)) return false;
                const placement = (slurEl.getAttribute('placement') || '').trim();
                const diffY = sy - stemY;
                if (stemDir === 'down' && placement === 'below') {
                    return sx >= -4.0 && sx <= 6.0 && diffY >= -2.0 && diffY <= 13.5 && Math.abs(by) <= 4.5;
                }
                if (stemDir === 'up' && placement === 'above') {
                    return sx >= 7.0 && sx <= 18.0 && diffY >= -13.5 && diffY <= 2.0 && Math.abs(by) <= 4.5;
                }
                return false;
            };
            const insertBeamsOrdered = (noteEl, beamSpecs) => {
                childrenByTag(noteEl, 'beam').forEach(b => b.remove());
                const afterTags = { notations: true, lyric: true, play: true, listen: true };
                let refNode = null;
                const kids = noteEl.children;
                for (let i = 0; i < kids.length; i++) {
                    if (afterTags[kids[i].tagName]) {
                        refNode = kids[i];
                        break;
                    }
                }
                beamSpecs.forEach(spec => {
                    const bEl = doc.createElement('beam');
                    bEl.setAttribute('number', String(spec[0]));
                    bEl.textContent = spec[1];
                    if (refNode) noteEl.insertBefore(bEl, refNode);
                    else noteEl.appendChild(bEl);
                });
            };
            const scaleScoreDivisions = (factor) => {
                if (factor <= 1) return;
                doc.querySelectorAll('divisions, duration').forEach(el => {
                    if (el.textContent) {
                        const v = parseInt(el.textContent.trim(), 10);
                        if (!isNaN(v)) el.textContent = String(v * factor);
                    }
                });
            };

            const parts = Array.from(doc.querySelectorAll('part'));
            if (parts.length === 0) return;

            // Pass 1: Strip stem-tip beam-misread slurs and record same-measure candidate spans
            const partSpans = new Map();
            parts.forEach((part, pIdx) => {
                const measures = childrenByTag(part, 'measure');
                const openBeamSlurs = new Map();
                const mSpans = new Map();

                measures.forEach((m, mIdx) => {
                    childrenByTag(m, 'note').forEach(n => {
                        const notat = childByTag(n, 'notations');
                        if (!notat) return;
                        childrenByTag(notat, 'slur').forEach(s => {
                            const sType = (s.getAttribute('type') || '').trim();
                            const sNum = (s.getAttribute('number') || '1').trim();
                            if (sType === 'start') {
                                if (isBeamMisreadSlur(n, s)) {
                                    s.remove();
                                    openBeamSlurs.set(sNum, { mIdx: mIdx, note: n });
                                } else {
                                    openBeamSlurs.delete(sNum);
                                }
                            } else if (sType === 'stop') {
                                if (openBeamSlurs.has(sNum)) {
                                    const st = openBeamSlurs.get(sNum);
                                    openBeamSlurs.delete(sNum);
                                    s.remove();
                                    if (st.mIdx === mIdx && st.note !== n) {
                                        if (!mSpans.has(mIdx)) mSpans.set(mIdx, []);
                                        const arr = mSpans.get(mIdx);
                                        if (!arr.some(pair => pair[0] === st.note && pair[1] === n)) {
                                            arr.push([st.note, n]);
                                        }
                                    }
                                }
                            }
                        });
                        if (notat.children.length === 0) notat.remove();
                    });
                });

                if (mSpans.size > 0) partSpans.set(pIdx, mSpans);
            });

            // Pass 2: Reconstruct beamed eighth / 16th rhythms in overflowed measures
            if (partSpans.size > 0) {
                const partMeta = new Map();
                let globalScale = 1;

                partSpans.forEach((mSpans, pIdx) => {
                    const measures = childrenByTag(parts[pIdx], 'measure');
                    let divs = 1, beats = 4, beatType = 4;
                    const meta = measures.map(m => {
                        const dEl = m.querySelector('divisions');
                        if (dEl && dEl.textContent) {
                            const dv = parseInt(dEl.textContent.trim(), 10);
                            if (dv > 0) divs = dv;
                        }
                        const bEl = m.querySelector('time > beats');
                        const btEl = m.querySelector('time > beat-type');
                        if (bEl && bEl.textContent) {
                            const bv = parseInt(bEl.textContent.trim(), 10);
                            if (bv > 0) beats = bv;
                        }
                        if (btEl && btEl.textContent) {
                            const btv = parseInt(btEl.textContent.trim(), 10);
                            if (btv > 0) beatType = btv;
                        }
                        return { divs: divs, beats: beats, beatType: beatType };
                    });
                    partMeta.set(pIdx, meta);

                    mSpans.forEach((rawSpans, mIdx) => {
                        const cur = meta[mIdx];
                        const expDur = Math.round(cur.beats * (4.0 / cur.beatType) * cur.divs);
                        const m = measures[mIdx];
                        const byVoice = new Map();
                        rawSpans.forEach(pair => {
                            const vId = childText(pair[0], 'voice', '1');
                            if (childText(pair[1], 'voice', '1') === vId) {
                                if (!byVoice.has(vId)) byVoice.set(vId, []);
                                byVoice.get(vId).push(pair);
                            }
                        });
                        byVoice.forEach((vSpans, vId) => {
                            const vNotes = childrenByTag(m, 'note').filter(x =>
                                !childByTag(x, 'chord') && !childByTag(x, 'grace') && childText(x, 'voice', '1') === vId
                            );
                            const actualDur = vNotes.reduce((acc, x) => acc + (parseInt(childText(x, 'duration', '0'), 10) || 0), 0);
                            const excess = actualDur - expDur;
                            if (excess <= 0) return;
                            let validKSum = 0, singleK = 0;
                            const used = new Set();
                            vSpans.forEach(pair => {
                                const i0 = vNotes.indexOf(pair[0]);
                                let i1 = vNotes.indexOf(pair[1]);
                                if (i0 < 0 || i1 <= i0) return;
                                const endType = childText(vNotes[i1], 'type', '');
                                if (i1 - i0 >= 2 && (endType === 'half' || endType === 'whole')) {
                                    let allPrevQ = true;
                                    for (let k = i0; k < i1; k++) {
                                        if (childText(vNotes[k], 'type', '') !== 'quarter') { allPrevQ = false; break; }
                                    }
                                    if (allPrevQ) i1 -= 1;
                                }
                                for (let k = i0; k <= i1; k++) {
                                    if (used.has(k)) return;
                                }
                                const seg = vNotes.slice(i0, i1 + 1);
                                const ok = seg.length >= 2 && seg.every(x =>
                                    !childByTag(x, 'rest') &&
                                    childText(x, 'type', '') === 'quarter' &&
                                    !childByTag(x, 'dot') &&
                                    !childByTag(x, 'beam') &&
                                    parseInt(childText(x, 'duration', '0'), 10) === cur.divs
                                );
                                if (ok) {
                                    validKSum += seg.length;
                                    singleK = seg.length;
                                    for (let k = i0; k <= i1; k++) used.add(k);
                                }
                            });
                            if (validKSum === 0) return;
                            if (2 * excess === validKSum * cur.divs) {
                                if ((cur.divs * globalScale) % 2 !== 0) globalScale = Math.max(globalScale, 2);
                            } else if (4 * excess === 3 * validKSum * cur.divs || (used.size === 3 && singleK === 3 && excess === 2 * cur.divs)) {
                                while ((cur.divs * globalScale) % 4 !== 0) globalScale *= 2;
                            }
                        });
                    });
                });

                if (globalScale > 1) {
                    scaleScoreDivisions(globalScale);
                    partMeta.forEach(meta => {
                        meta.forEach(item => { item.divs *= globalScale; });
                    });
                }

                partSpans.forEach((mSpans, pIdx) => {
                    const measures = childrenByTag(parts[pIdx], 'measure');
                    const meta = partMeta.get(pIdx);
                    mSpans.forEach((rawSpans, mIdx) => {
                        const cur = meta[mIdx];
                        const expDur = Math.round(cur.beats * (4.0 / cur.beatType) * cur.divs);
                        const m = measures[mIdx];
                        const byVoice = new Map();
                        rawSpans.forEach(pair => {
                            const vId = childText(pair[0], 'voice', '1');
                            if (childText(pair[1], 'voice', '1') === vId) {
                                if (!byVoice.has(vId)) byVoice.set(vId, []);
                                byVoice.get(vId).push(pair);
                            }
                        });

                        byVoice.forEach((vSpans, vId) => {
                            const vNotes = childrenByTag(m, 'note').filter(x =>
                                !childByTag(x, 'chord') && !childByTag(x, 'grace') && childText(x, 'voice', '1') === vId
                            );
                            const oldActualDur = vNotes.reduce((acc, x) => acc + (parseInt(childText(x, 'duration', '0'), 10) || 0), 0);
                            const excess = oldActualDur - expDur;
                            if (excess <= 0) return;

                            const resolvedSegs = [];
                            const usedIndices = new Set();
                            vSpans.forEach(pair => {
                                const i0 = vNotes.indexOf(pair[0]);
                                let i1 = vNotes.indexOf(pair[1]);
                                if (i0 < 0 || i1 <= i0) return;
                                const endType = childText(vNotes[i1], 'type', '');
                                if (i1 - i0 >= 2 && (endType === 'half' || endType === 'whole')) {
                                    let allPrevQ = true;
                                    for (let k = i0; k < i1; k++) {
                                        if (childText(vNotes[k], 'type', '') !== 'quarter') { allPrevQ = false; break; }
                                    }
                                    if (allPrevQ) i1 -= 1;
                                }
                                for (let k = i0; k <= i1; k++) {
                                    if (usedIndices.has(k)) return;
                                }
                                const seg = vNotes.slice(i0, i1 + 1);
                                const ok = seg.length >= 2 && seg.every(x =>
                                    !childByTag(x, 'rest') &&
                                    childText(x, 'type', '') === 'quarter' &&
                                    !childByTag(x, 'dot') &&
                                    !childByTag(x, 'beam') &&
                                    parseInt(childText(x, 'duration', '0'), 10) === cur.divs
                                );
                                if (ok) {
                                    resolvedSegs.push(seg);
                                    for (let k = i0; k <= i1; k++) usedIndices.add(k);
                                }
                            });

                            if (resolvedSegs.length === 0) return;
                            const totalK = resolvedSegs.reduce((acc, s) => acc + s.length, 0);
                            let reconstructed = false;

                            if (2 * excess === totalK * cur.divs && cur.divs % 2 === 0) {
                                const eDur = cur.divs / 2;
                                resolvedSegs.forEach(seg => {
                                    seg.forEach((nEl, idxInSeg) => {
                                        const dNode = childByTag(nEl, 'duration');
                                        const tNode = childByTag(nEl, 'type');
                                        if (dNode) dNode.textContent = String(eDur);
                                        if (tNode) tNode.textContent = 'eighth';
                                        const bVal = idxInSeg === 0 ? 'begin' : (idxInSeg === seg.length - 1 ? 'end' : 'continue');
                                        insertBeamsOrdered(nEl, [['1', bVal]]);
                                    });
                                });
                                reconstructed = true;
                            } else if (4 * excess === 3 * totalK * cur.divs && cur.divs % 4 === 0) {
                                const sDur = cur.divs / 4;
                                resolvedSegs.forEach(seg => {
                                    seg.forEach((nEl, idxInSeg) => {
                                        const dNode = childByTag(nEl, 'duration');
                                        const tNode = childByTag(nEl, 'type');
                                        if (dNode) dNode.textContent = String(sDur);
                                        if (tNode) tNode.textContent = '16th';
                                        const bVal = idxInSeg === 0 ? 'begin' : (idxInSeg === seg.length - 1 ? 'end' : 'continue');
                                        insertBeamsOrdered(nEl, [['1', bVal], ['2', bVal]]);
                                    });
                                });
                                reconstructed = true;
                            } else if (resolvedSegs.length === 1 && resolvedSegs[0].length === 3 && excess === 2 * cur.divs && cur.divs % 4 === 0) {
                                const seg = resolvedSegs[0];
                                const eDur = cur.divs / 2;
                                const sDur = cur.divs / 4;
                                const xs = seg.map(x => parseFloat(x.getAttribute('default-x')));
                                const hasX = xs.every(v => !isNaN(v));
                                const is16168 = hasX && (xs[1] - xs[0]) < (xs[2] - xs[1]) * 0.85;
                                const specs = is16168
                                    ? [
                                        ['16th', sDur, [['1', 'begin'], ['2', 'begin']]],
                                        ['16th', sDur, [['1', 'continue'], ['2', 'end']]],
                                        ['eighth', eDur, [['1', 'end']]]
                                    ]
                                    : [
                                        ['eighth', eDur, [['1', 'begin']]],
                                        ['16th', sDur, [['1', 'continue'], ['2', 'begin']]],
                                        ['16th', sDur, [['1', 'end'], ['2', 'end']]]
                                    ];
                                seg.forEach((nEl, idxInSeg) => {
                                    const sp = specs[idxInSeg];
                                    const dNode = childByTag(nEl, 'duration');
                                    const tNode = childByTag(nEl, 'type');
                                    if (dNode) dNode.textContent = String(sp[1]);
                                    if (tNode) tNode.textContent = sp[0];
                                    insertBeamsOrdered(nEl, sp[2]);
                                });
                                reconstructed = true;
                            }

                            if (reconstructed) {
                                const newActualDur = oldActualDur - excess;
                                childrenByTag(m, 'backup').forEach(bk => {
                                    const bkDur = childByTag(bk, 'duration');
                                    if (bkDur && bkDur.textContent && parseInt(bkDur.textContent.trim(), 10) === oldActualDur) {
                                        bkDur.textContent = String(newActualDur);
                                    }
                                });
                            }
                        });
                    });
                });
            }

            // Pass 3: Sanitize orphan stops, colliding starts, and runaway (>4 measure) unclosed slurs
            parts.forEach(part => {
                const measures = childrenByTag(part, 'measure');
                const openSlurs = new Map();

                const resolveUnclosedStart = (sNum, stInfo) => {
                    const vId = childText(stInfo.note, 'voice', '1');
                    const mVNotes = childrenByTag(stInfo.mEl, 'note').filter(x =>
                        !childByTag(x, 'chord') && !childByTag(x, 'grace') && childText(x, 'voice', '1') === vId
                    );
                    let closedLocally = false;
                    const pos = mVNotes.indexOf(stInfo.note);
                    if (pos >= 0 && pos + 1 < mVNotes.length) {
                        const cand = mVNotes[pos + 1];
                        if (!childByTag(cand, 'rest') && pitchKey(cand) !== pitchKey(stInfo.note)) {
                            let cNotat = childByTag(cand, 'notations');
                            const alreadyHas = cNotat && childrenByTag(cNotat, 'slur').some(
                                cs => (cs.getAttribute('number') || '1').trim() === sNum
                            );
                            if (!alreadyHas) {
                                if (!cNotat) {
                                    cNotat = doc.createElement('notations');
                                    let refNode = null;
                                    const cKids = cand.children;
                                    for (let ci = 0; ci < cKids.length; ci++) {
                                        const tn = cKids[ci].tagName;
                                        if (tn === 'lyric' || tn === 'play' || tn === 'listen') {
                                            refNode = cKids[ci];
                                            break;
                                        }
                                    }
                                    if (refNode) cand.insertBefore(cNotat, refNode);
                                    else cand.appendChild(cNotat);
                                }
                                const stopSlur = doc.createElement('slur');
                                stopSlur.setAttribute('type', 'stop');
                                stopSlur.setAttribute('number', sNum);
                                cNotat.appendChild(stopSlur);
                                closedLocally = true;
                            }
                        }
                    }
                    if (!closedLocally) {
                        const stNotat = childByTag(stInfo.note, 'notations');
                        if (stNotat && stInfo.slur.parentNode === stNotat) {
                            stInfo.slur.remove();
                            if (stNotat.children.length === 0) stNotat.remove();
                        }
                    }
                };

                measures.forEach((m, mIdx) => {
                    Array.from(openSlurs.keys()).forEach(sNum => {
                        const stInfo = openSlurs.get(sNum);
                        if (mIdx - stInfo.mIdx > 4) {
                            openSlurs.delete(sNum);
                            resolveUnclosedStart(sNum, stInfo);
                        }
                    });

                    childrenByTag(m, 'note').forEach(n => {
                        const notat = childByTag(n, 'notations');
                        if (!notat) return;
                        childrenByTag(notat, 'slur').forEach(s => {
                            const sType = (s.getAttribute('type') || '').trim();
                            const sNum = (s.getAttribute('number') || '1').trim();
                            if (sType === 'start') {
                                if (openSlurs.has(sNum)) {
                                    const prevInfo = openSlurs.get(sNum);
                                    openSlurs.delete(sNum);
                                    resolveUnclosedStart(sNum, prevInfo);
                                }
                                openSlurs.set(sNum, { mIdx: mIdx, mEl: m, note: n, slur: s });
                            } else if (sType === 'stop') {
                                if (openSlurs.has(sNum)) {
                                    openSlurs.delete(sNum);
                                } else {
                                    s.remove();
                                }
                            }
                        });
                        if (notat.children.length === 0) notat.remove();
                    });
                });

                Array.from(openSlurs.keys()).forEach(sNum => {
                    const stInfo = openSlurs.get(sNum);
                    openSlurs.delete(sNum);
                    resolveUnclosedStart(sNum, stInfo);
                });
            });
        }

        // Multi-touch pinch-to-zoom support (60 FPS CSS transform with debounced re-render)
        let initialDistance = null;
        let initialZoom = 0.40;
        let isEditorPinching = false;
        let pendingEditorZoom = null;
        let editorZoomDebounceTimer = null;
        let editorRenderTargetDiv = null;

        scoreContainer.addEventListener('touchstart', function (e) {
            if (e.touches.length === 2) {
                isEditorPinching = true;
                if (editorZoomDebounceTimer) {
                    clearTimeout(editorZoomDebounceTimer);
                    editorZoomDebounceTimer = null;
                }
                initialDistance = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                initialZoom = currentZoom;
                pendingEditorZoom = currentZoom;
                if (!editorRenderTargetDiv) {
                    editorRenderTargetDiv = document.getElementById('osmd-render');
                }
                if (editorRenderTargetDiv) {
                    editorRenderTargetDiv.style.transformOrigin = 'top left';
                }
            }
        }, { passive: true });

        scoreContainer.addEventListener('touchmove', function (e) {
            if (e.touches.length === 2 && initialDistance) {
                let dist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                let factor = dist / initialDistance;
                pendingEditorZoom = Math.max(0.25, Math.min(1.2, initialZoom * factor));
                if (editorRenderTargetDiv) {
                    const scale = pendingEditorZoom / initialZoom;
                    editorRenderTargetDiv.style.transform = 'scale(' + scale + ')';
                }
            }
        }, { passive: true });

        scoreContainer.addEventListener('touchend', function (e) {
            if (e.touches.length < 2) {
                initialDistance = null;
            }
            if (isEditorPinching && pendingEditorZoom !== null) {
                isEditorPinching = false;
                if (editorZoomDebounceTimer) clearTimeout(editorZoomDebounceTimer);
                const targetZ = pendingEditorZoom;
                editorZoomDebounceTimer = setTimeout(function () {
                    if (editorRenderTargetDiv) {
                        editorRenderTargetDiv.style.transform = 'none';
                    }
                    applyZoom(targetZ);
                    editorZoomDebounceTimer = null;
                    pendingEditorZoom = null;
                }, 150);

        }, { passive: true });

        let pitchDragCurrentDiatonicIndex = 28;
        let pitchDragVoiceCode = '';

        const DIATONIC_STEPS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
        const STEP_MIDI_OFFSETS = { 'C': 0, 'D': 2, 'E': 4, 'F': 5, 'G': 7, 'A': 9, 'B': 11 };

        let lastPitchDragEndTime = 0;

        function startPitchDrag(noteId, clientX, clientY) {
            if (noteId === null || noteId === undefined) return;
            var noteEl = getXmlNoteElement(noteId);
            if (!noteEl) return;

            selectedNoteId = noteId;
            drawHighlight(noteId);

            var ind = document.getElementById('selection-indicator');
            isPitchDragging = true;
            pitchDragStartX = clientX;
            pitchDragStartY = clientY;
            isOverTrash = false;

            var pEl = noteEl.getElementsByTagName('pitch')[0];
            var isRest = (noteEl.getElementsByTagName('rest').length > 0);
            if (pEl && !isRest) {
                pitchDragStartStep = (pEl.getElementsByTagName('step')[0] ? pEl.getElementsByTagName('step')[0].textContent.trim().toUpperCase() : 'C');
                var altEl = pEl.getElementsByTagName('alter')[0];
                pitchDragStartAlter = altEl ? (parseInt(altEl.textContent.trim(), 10) || 0) : 0;
                pitchDragStartOctave = parseInt(pEl.getElementsByTagName('octave')[0] ? pEl.getElementsByTagName('octave')[0].textContent.trim() : '4', 10) || 4;
            } else {
                pitchDragStartStep = 'C';
                pitchDragStartAlter = 0;
                pitchDragStartOctave = 4;
            }

            var stepIdx = DIATONIC_STEPS.indexOf(pitchDragStartStep);
            if (stepIdx === -1) stepIdx = 0;
            pitchDragInitialDiatonicIndex = pitchDragStartOctave * 7 + stepIdx;
            pitchDragCurrentDiatonicIndex = pitchDragInitialDiatonicIndex;

            var vOverride = noteEl.getAttribute('data-vx-voice');
            pitchDragVoiceCode = vOverride || '';

            if (ind) ind.classList.add('dragging');

            var badge = document.getElementById('drag-pitch-badge');
            var trashZone = document.getElementById('trash-drop-zone');
            if (badge) {
                badge.style.left = clientX + 'px';
                badge.style.top = (clientY - 38) + 'px';
                var nameEl = document.getElementById('drag-pitch-name');
                var voiceEl = document.getElementById('drag-pitch-voice');
                var altSign = (pitchDragStartAlter > 0) ? '♯' : ((pitchDragStartAlter < 0) ? '♭' : '');
                if (nameEl) nameEl.textContent = pitchDragStartStep + altSign + pitchDragStartOctave;
                if (voiceEl) {
                    voiceEl.textContent = pitchDragVoiceCode || 'Voice';
                    voiceEl.style.display = pitchDragVoiceCode ? 'inline-block' : 'none';
                }
                badge.classList.remove('danger');
                badge.classList.add('visible');
            }
            if (trashZone) {
                trashZone.classList.add('visible');
                trashZone.classList.remove('active-hover');
            }

            var startMidi = (pitchDragStartOctave + 1) * 12 + (STEP_MIDI_OFFSETS[pitchDragStartStep] || 0) + pitchDragStartAlter;
            playNotePreview(startMidi, 140);

            window.addEventListener('mousemove', onDragMove, { passive: false });
            window.addEventListener('mouseup', onDragEnd);
            window.addEventListener('touchmove', onDragMove, { passive: false });

        function onDragMove(e) {
            if (!isPitchDragging) return;
            if (e.cancelable) e.preventDefault();

            var clientY = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;

            var dy = pitchDragStartY - clientY;
            var stepPx = Math.max(4.0, 5.0 * (osmd ? osmd.zoom : 1.0));
            var deltaSteps = Math.round(dy / stepPx);

            var newDiatonicIndex = Math.max(14, Math.min(50, pitchDragInitialDiatonicIndex + deltaSteps));
            var newOctave = Math.floor(newDiatonicIndex / 7);
            var newStep = DIATONIC_STEPS[((newDiatonicIndex % 7) + 7) % 7];

            var badge = document.getElementById('drag-pitch-badge');
            var trashZone = document.getElementById('trash-drop-zone');
            var ind = document.getElementById('selection-indicator');

            if (badge) {
                badge.style.left = clientX + 'px';

        }

        function initPitchDragging() {
            var ind = document.getElementById('selection-indicator');
            var scoreContainer = document.getElementById('score-container');
            if (!scoreContainer) return;

            var touchTrackCandidateId = null;
            var touchStartX = 0, touchStartY = 0;
            var isTrackingTouch = false;
            var didStartPitchDrag = false;

            function onTouchStartScore(e) {
                var target = e.target;
                if (target && target.closest && (
                    target.closest('#note-micro-hud') ||
                    target.closest('#soundslice-deck') ||
                    target.closest('#multirest-stepper-panel') ||
                    target.closest('#zoom-controls') ||
                    target.closest('#palette-drag-ghost')
                )) {
                    return;
                }

                var clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
                var clientY = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;

                if (ind && (ind.contains(target) || target === ind) && selectedNoteId !== null) {
                    touchTrackCandidateId = selectedNoteId;
                } else {
                    touchTrackCandidateId = findNoteAtPoint(clientX, clientY);

                touchStartX = clientX;
                touchStartY = clientY;
                isTrackingTouch = true;
                didStartPitchDrag = false;
            }

                if (!isTrackingTouch || didStartPitchDrag) return;
                var clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
                var clientY = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;

                var dx = clientX - touchStartX;
                var dy = clientY - touchStartY;
                var dist = Math.hypot(dx, dy);

                // If user dragged finger vertically more than 7px on a note, start direct drag!
                if (dist > 7) {
                    if (touchTrackCandidateId !== null) {
                        didStartPitchDrag = true;
                        isTrackingTouch = false;
                        if (e.cancelable) e.preventDefault();
                        startPitchDrag(touchTrackCandidateId, clientX, clientY);
                    } else {
                        isTrackingTouch = false;
                    }
                }
            }

                if (!isTrackingTouch) return;
                isTrackingTouch = false;
            }

            scoreContainer.addEventListener('mousedown', onTouchStartScore);
            window.addEventListener('mousemove', onTouchMoveScore, { passive: false });
            window.addEventListener('mouseup', onTouchEndScore);

            scoreContainer.addEventListener('touchstart', onTouchStartScore, { passive: false });
            window.addEventListener('touchmove', onTouchMoveScore, { passive: false });
            window.addEventListener('touchend', onTouchEndScore);

                    }

            }
