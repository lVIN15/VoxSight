            });

            console.log('[VoxSight Editor] Note map built: ' + noteMap.size + ' notes/rests mapped with 100% deterministic precision');

            // Step 6: Attach click handlers
            setupClickListeners();
        }

        // ─── Click Handlers ─────────────────────────────────────────────
        function setupClickListeners() {
            var clickTarget = document.getElementById('score-container');
            if (clickTarget) {
                clickTarget.onclick = function (e) {
                    var containerRect = clickTarget.getBoundingClientRect();
                    var clickX = e.clientX - containerRect.left + clickTarget.scrollLeft;
                    var clickY = e.clientY - containerRect.top + clickTarget.scrollTop;

                    var candidates = [];
                    function addCandidate(id) {
                        if (!isNaN(id) && noteMap.has(id) && candidates.indexOf(id) === -1) {
                            candidates.push(id);
                        }
                    }

                    // 1. Direct SVG target
                    var targetEl = e.target;
                    if (targetEl) {
                        var noteEl = targetEl.closest ? targetEl.closest('[data-vx-id]') : null;
                        if (noteEl && noteEl.hasAttribute('data-vx-id')) {
                            addCandidate(parseInt(noteEl.getAttribute('data-vx-id'), 10));
                        }
                    }

                    // 2. Multi-element point hit test (all overlapping SVG layers)
                    if (typeof document.elementsFromPoint === 'function') {
                        var elements = document.elementsFromPoint(e.clientX, e.clientY);
                        for (let i = 0; i < elements.length; i++) {
                            var el = elements[i];
                            var matchEl = el.closest ? el.closest('[data-vx-id]') : null;
                            if (matchEl && matchEl.hasAttribute('data-vx-id')) {
                                addCandidate(parseInt(matchEl.getAttribute('data-vx-id'), 10));
                            }
                        }
                    }

                    // 3. Proximity search from noteCoordinates within 45px radius
                    for (let i = 0; i < noteCoordinates.length; i++) {
                        var nc = noteCoordinates[i];
                        var dx = nc.cx - clickX;
                        var dy = nc.cy - clickY;
                        var dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 45) {
                            addCandidate(nc.id);
                        }
                    }

                    // 4. Distance-weighted selection: pick candidate closest to tap coordinate
                    if (candidates.length > 0) {
                        var bestId = candidates[0];
                        var bestDist = Infinity;
                        for (let i = 0; i < candidates.length; i++) {
                            var cId = candidates[i];
                            var entry = noteMap.get(cId);
                            if (entry && entry.coord) {
                                var dx = entry.coord.cx - clickX;
                                var dy = entry.coord.cy - clickY;
                                var d = Math.sqrt(dx * dx + dy * dy);
                                if (d < bestDist) {
                                    bestDist = d;
                                    bestId = cId;
                                }
                            }
                        }
                        selectNote(bestId);
                    }
                };
            }
        }

        // ─── SVG H-Bar Rest Renderer for Multi-Measure Rests (Data-Driven) ────
        function renderHBarRests() {
            if (!osmd || !osmd.graphic || !xmlDoc) return;

            var svgRoot = renderDiv.querySelector('svg');
            if (!svgRoot) return;

            // Remove any previous custom H-bar overlays across all SVG pages
            var oldHBars = renderDiv.querySelectorAll('.voxsight-hbar-rest');
            for (let i = 0; i < oldHBars.length; i++) {
                oldHBars[i].parentNode.removeChild(oldHBars[i]);
            }

            var svgs = renderDiv.querySelectorAll('svg');
            if (!svgs || svgs.length === 0) return;
            var pages = (osmd.graphic && osmd.graphic.MusicPages) ? osmd.graphic.MusicPages : [];

            var xmlParts = xmlDoc ? xmlDoc.getElementsByTagName('part') : [];
            var measureList = osmd.graphic.measureList;
            if (!measureList) return;

            var unitToPx = 10;
            if (osmd.graphic && osmd.graphic.rules && osmd.graphic.rules.unitInPixels) unitToPx = osmd.graphic.rules.unitInPixels;
            else if (osmd.rules && osmd.rules.unitInPixels) unitToPx = osmd.rules.unitInPixels;

            for (let mIdx = 0; mIdx < measureList.length; mIdx++) {
                var mRow = measureList[mIdx];
                if (!mRow) continue;

                for (let sIdx = 0; sIdx < mRow.length; sIdx++) {
                    var gMeas = mRow[sIdx];
                    if (!gMeas) continue;

                    // Skip extra preamble / decorative graphical measures (e.g. system clef headers)
                    if (gMeas.IsExtraGraphicalMeasure || gMeas.isExtraGraphicalMeasure || !gMeas.parentMusicSystem) continue;

                    var multirestCount = 0;
                    if (gMeas.parentSourceMeasure && gMeas.parentSourceMeasure.multipleRestMeasures) {
                        multirestCount = gMeas.parentSourceMeasure.multipleRestMeasures;
                    }

                    // Fallback lookup from XML by measure number or measure index
                    var mNum = gMeas.parentSourceMeasure ? gMeas.parentSourceMeasure.MeasureNumber : (mIdx + 1);
                    var xmlPart = (sIdx < xmlParts.length) ? xmlParts[sIdx] : null;
                    var xmlMeas = null;
                    if (xmlPart) {
                        var allM = xmlPart.getElementsByTagName('measure');
                        if (mIdx < allM.length) xmlMeas = allM[mIdx];
                    }

                    if (multirestCount <= 0 && xmlMeas) {
                        var msEl = xmlMeas.querySelector('measure-style > multiple-rest');
                        if (msEl) multirestCount = parseInt(msEl.textContent.trim(), 10) || 0;
                    }

                    // Strict Guard: An H-bar rest must ONLY be rendered on pure rest measures.
                    // If a measure has pitched notes, lyrics, or subdivided rhythm rests (quarter rests, eighth rests, etc.),
                    // it is an active playing measure and must NEVER have an H-bar or white mask drawn over it.
                    if (xmlMeas) {
                        var pitches = xmlMeas.getElementsByTagName('pitch');
                        if (pitches.length > 0) continue;

                        var lyrics = xmlMeas.getElementsByTagName('lyric');
                        if (lyrics.length > 0) continue;

                        var notes = xmlMeas.getElementsByTagName('note');
                        var hasRhythmNotes = false;
                        for (var ni = 0; ni < notes.length; ni++) {
                            var nType = notes[ni].getElementsByTagName('type')[0];
                            var typeStr = nType ? nType.textContent.trim().toLowerCase() : '';
                            if (typeStr && typeStr !== 'whole' && typeStr !== 'breve') {
                                hasRhythmNotes = true;
                                break;
                            }
                        }
                        if (hasRhythmNotes) continue;
                    }

                    // Only render genuine multi-measure rests (count >= 2)
                    if (multirestCount >= 2) {

                        var bbox = gMeas.PositionAndShape || gMeas.positionAndShape;
                        var absPos = bbox ? (bbox.absolutePosition || bbox.AbsolutePosition) : null;
                        var size = bbox ? (bbox.size || bbox.Size) : null;
                        if (!absPos || !size) continue;

                        var sys = gMeas.parentMusicSystem;
                        var page = sys ? (sys.Parent || sys.parentMusicPage || sys.ParentMusicPage) : null;
                        var pIdx = (pages && page) ? pages.indexOf(page) : 0;
                        if (pIdx < 0) pIdx = 0;
                        var targetSvg = (pIdx < svgs.length) ? svgs[pIdx] : svgs[0];

                        var pageY = (page && page.PositionAndShape && svgs.length > 1) ? page.PositionAndShape.AbsolutePosition.y : 0;
                        var pageX = (page && page.PositionAndShape && svgs.length > 1) ? page.PositionAndShape.AbsolutePosition.x : 0;

                        var sx = (absPos.x - pageX) * unitToPx;
                        var sy = (absPos.y - pageY) * unitToPx;
                        var sw = size.width * unitToPx;
                        var sh = size.height * unitToPx;

                        // Ensure this measure has valid staff dimensions
                        if (!sw || sw < 20 || !sh || sh < 15) continue;

                        var line1Y = sy;
                        var line3Y = sy + (sh * 0.5);       // Line 3 (Middle staff line)
                        var serifTop = sy + (sh * 0.25);    // Line 2
                        var serifBottom = sy + (sh * 0.75); // Line 4

                        var barWidth = Math.max(36, Math.min(70, sw * 0.38));
                        var leftX = sx + (sw - barWidth) / 2;
                        var rightX = leftX + barWidth;

                        // Create SVG H-Bar element
                        var gEl = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                        gEl.setAttribute('class', 'voxsight-hbar-rest');
                        gEl.setAttribute('data-measure-num', mNum.toString());
                        gEl.setAttribute('data-staff-idx', sIdx.toString());

                        // Mask rectangle behind H-Bar to cleanly conceal any default rest symbol
                        var bgMask = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                        bgMask.setAttribute('x', (leftX - 4).toFixed(2));
                        bgMask.setAttribute('y', (line1Y + 2).toFixed(2));
                        bgMask.setAttribute('width', (barWidth + 8).toFixed(2));
                        bgMask.setAttribute('height', (sh - 4).toFixed(2));
                        bgMask.setAttribute('fill', '#ffffff');
                        bgMask.setAttribute('opacity', '0.92');
                        gEl.appendChild(bgMask);

                        // Middle horizontal beam (on Line 3)
                        var beam = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        beam.setAttribute('x1', leftX.toFixed(2));
                        beam.setAttribute('y1', line3Y.toFixed(2));
                        beam.setAttribute('x2', rightX.toFixed(2));
                        beam.setAttribute('y2', line3Y.toFixed(2));
                        beam.setAttribute('stroke', '#000000');
                        beam.setAttribute('stroke-width', '5.5');
                        beam.setAttribute('stroke-linecap', 'square');
                        gEl.appendChild(beam);

                        // Left vertical serif (Line 2 to Line 4)
                        var lSerif = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        lSerif.setAttribute('x1', leftX.toFixed(2));
                        lSerif.setAttribute('y1', serifTop.toFixed(2));
                        lSerif.setAttribute('x2', leftX.toFixed(2));
                        lSerif.setAttribute('y2', serifBottom.toFixed(2));
                        lSerif.setAttribute('stroke', '#000000');
                        lSerif.setAttribute('stroke-width', '3.2');
                        gEl.appendChild(lSerif);

                        // Right vertical serif (Line 2 to Line 4)
                        var rSerif = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        rSerif.setAttribute('x1', rightX.toFixed(2));
                        rSerif.setAttribute('y1', serifTop.toFixed(2));
                        rSerif.setAttribute('x2', rightX.toFixed(2));
                        rSerif.setAttribute('y2', serifBottom.toFixed(2));
                        rSerif.setAttribute('stroke', '#000000');
                        rSerif.setAttribute('stroke-width', '3.2');
                        gEl.appendChild(rSerif);

                        // Bold Count Number above staff
                        var text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        text.setAttribute('x', (sx + sw / 2).toFixed(2));
                        text.setAttribute('y', (line1Y - 7).toFixed(2));
                        text.setAttribute('font-family', 'serif, "Times New Roman", sans-serif');
                        text.setAttribute('font-weight', 'bold');
                        text.setAttribute('font-size', '16');
                        text.setAttribute('text-anchor', 'middle');
                        text.setAttribute('fill', '#000000');
                        text.textContent = multirestCount.toString();
                        gEl.appendChild(text);

                        targetSvg.appendChild(gEl);
                    }
                }
            }
        }

        // ─── Direct Notehead Highlight System ────────────────────────────
        function clearHighlights() {
            var ind = document.getElementById('selection-indicator');
            if (ind) ind.style.display = 'none';

            var oldHighlights = renderDiv.querySelectorAll('.voxsight-selection-highlight');
            for (let i = 0; i < oldHighlights.length; i++) {
                if (oldHighlights[i].parentNode) oldHighlights[i].parentNode.removeChild(oldHighlights[i]);
            }
            if (highlightCtx) {
                highlightCtx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        window.clearHighlights = clearHighlights;
        window.clearHighlight = function () {
            clearHighlights();
            selectedNoteId = null;
        };

        function drawHighlight(vxId) {
            clearHighlights();
            if (vxId === null || vxId === undefined) return;
            var entry = noteMap.get(vxId);
            if (!entry || !entry.gNote) return;

            var ind = document.getElementById('selection-indicator');
            var domEls = getSvgElements(entry.gNote);
            var targetEl = (domEls && domEls.length > 0 && domEls[0]) ? domEls[0] : null;

            var rect = null;
            if (targetEl) {
                // If chord (multiple noteheads inside targetEl), pick the notehead closest to entry.coord.cy
                var noteheads = targetEl.querySelectorAll ? targetEl.querySelectorAll('.vf-notehead, path') : [];
                if (noteheads.length > 1 && entry.coord) {
                    var bestDist = 9999;
                    for (let n = 0; n < noteheads.length; n++) {
                        var nhRect = noteheads[n].getBoundingClientRect();
                        if (nhRect.width === 0 || nhRect.height === 0) continue;
                        var dist = Math.abs((nhRect.top + nhRect.height / 2) - entry.coord.cy);
                        if (dist < bestDist) {
                            bestDist = dist;
                            targetEl = noteheads[n];
                        }
                    }
                }
                try {
                    rect = targetEl.getBoundingClientRect();
                } catch (e) { }
            }

            var scoreContainer = document.getElementById('score-container');
            if (ind && rect && rect.width > 0 && rect.height > 0) {
                var containerRect = scoreContainer.getBoundingClientRect();
                var left = (rect.left - containerRect.left) + scoreContainer.scrollLeft - 5;
                var top = (rect.top - containerRect.top) + scoreContainer.scrollTop - 5;
                var width = rect.width + 10;
                var height = rect.height + 10;

                ind.style.left = left + 'px';
                ind.style.top = top + 'px';
                ind.style.width = width + 'px';
                ind.style.height = height + 'px';
                ind.style.display = 'block';
            } else if (ind && entry.coord) {
                ind.style.left = (entry.coord.x - 5) + 'px';
                ind.style.top = (entry.coord.y - 5) + 'px';
                ind.style.width = (entry.coord.w + 10) + 'px';
                ind.style.height = (entry.coord.h + 10) + 'px';
                ind.style.display = 'block';
            }
        }

        // ─── Note Selection (sends info to Android bridge) ──────────────
        function selectNote(vxId) {
            selectedNoteId = vxId;
            var entry = noteMap.get(vxId);
            if (!entry) {
                console.warn('[VoxSight Editor] selectNote: vxId', vxId, 'not in noteMap');
                return;
            }

            // Draw direct SVG highlight locked to the exact notehead
            drawHighlight(vxId);

            // Extract note properties directly from XML DOM (100% ground truth)
            var xmlNoteEl = getXmlNoteElement(vxId);
            var pitchStep = 'C', alterVal = 0, octaveVal = 4;
            var durationType = 'quarter';
            var voiceId = 1;
            var measureNum = 1;
            var isRest = false;
            var isDotted = false;

            var lyricText = '';
            if (xmlNoteEl) {
                isRest = (xmlNoteEl.getElementsByTagName('rest').length > 0);
                isDotted = (xmlNoteEl.getElementsByTagName('dot').length > 0);

                var lyricEl = xmlNoteEl.getElementsByTagName('lyric')[0];
                if (lyricEl) {
                    var textEl = lyricEl.getElementsByTagName('text')[0];
                    if (textEl && textEl.textContent) {
                        lyricText = textEl.textContent.trim();
                    }
                }

                var pitchEl = xmlNoteEl.getElementsByTagName('pitch')[0];
                if (pitchEl) {
                    var stepEl = pitchEl.getElementsByTagName('step')[0];
                    if (stepEl && stepEl.textContent.trim()) {
                        pitchStep = stepEl.textContent.trim().toUpperCase().charAt(0);
                    }
                    var alterEl = pitchEl.getElementsByTagName('alter')[0];
                    if (alterEl && alterEl.textContent.trim()) {
                        alterVal = parseFloat(alterEl.textContent.trim()) || 0;
                    }
                    var octEl = pitchEl.getElementsByTagName('octave')[0];
                    if (octEl && octEl.textContent.trim()) {
                        octaveVal = parseInt(octEl.textContent.trim(), 10) || 4;
                    }
                }

                var typeEl = xmlNoteEl.getElementsByTagName('type')[0];
                if (typeEl && typeEl.textContent.trim()) {
                    durationType = typeEl.textContent.trim().toLowerCase();
                }

                var voiceEl = xmlNoteEl.getElementsByTagName('voice')[0];
                var parsedVoice = voiceEl ? (parseInt(voiceEl.textContent.trim(), 10) || 1) : 1;

                // Check explicit override
                var customVoiceStr = xmlNoteEl.getAttribute('data-vx-voice');
                if (customVoiceStr) {
                    voiceId = parseInt(customVoiceStr, 10) || 1;
                } else if (entry.staffIdx !== undefined && entry.chordPos) {
                    // In 2-part scores: determine SATB voice (1=S, 2=A, 3=T, 4=B)
                    if (entry.staffIdx === 0) {
                        voiceId = (entry.chordPos === 'bottom' || parsedVoice === 2) ? 2 : 1;
                    } else if (entry.staffIdx === 1) {
                        voiceId = (entry.chordPos === 'bottom' || parsedVoice === 2 || parsedVoice === 4) ? 4 : 3;
                    } else {
                        voiceId = parsedVoice;
                    }
                } else {
                    voiceId = parsedVoice;
                }

                var measEl = xmlNoteEl.parentNode;
                while (measEl && measEl.tagName !== 'measure') measEl = measEl.parentNode;
                if (measEl && measEl.getAttribute('number')) {
                    measureNum = parseInt(measEl.getAttribute('number'), 10) || 1;
                }
            } else {
                // Fallback from OSMD SourceNote
                var srcNote = entry.srcNote;
                if (srcNote) {
                    isRest = (typeof srcNote.isRest === 'function') ? srcNote.isRest() : (srcNote.isRest || srcNote.IsRest || false);
                    var pitch = srcNote.pitch || srcNote.Pitch;
                    if (pitch) {
                        // Handle numeric pitch.step enum (0=C,1=D,...6=B) same as buildNoteMap
                        var sNames = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
                        if (typeof pitch.step === 'string') pitchStep = pitch.step.toUpperCase();
                        else if (typeof pitch.Step === 'string') pitchStep = pitch.Step.toUpperCase();
                        else if (typeof pitch.step === 'number') pitchStep = sNames[pitch.step % 7] || 'C';
                        else if (typeof pitch.Step === 'number') pitchStep = sNames[pitch.Step % 7] || 'C';
                        else if (typeof pitch.fundamentalNote === 'number') pitchStep = sNames[pitch.fundamentalNote % 7] || 'C';
                        if (typeof pitch.alter === 'number') alterVal = pitch.alter;
                        else if (typeof pitch.Alter === 'number') alterVal = pitch.Alter;
                        else if (typeof pitch.accidental === 'number') alterVal = pitch.accidental;
                        else if (typeof pitch.Accidental === 'number') alterVal = pitch.Accidental;
                        octaveVal = (pitch.octave !== undefined) ? pitch.octave : (pitch.Octave || 4);
                    }
                }
            }

            console.log('[VoxSight Editor] Note selected: vxId=' + vxId + ' isRest=' + isRest + ' isDotted=' + isDotted + ' pitch=' + pitchStep + alterVal + ' oct=' + octaveVal + ' dur=' + durationType + ' voice=' + voiceId + ' measure=' + measureNum + ' lyric=' + lyricText);

            // Send to Android bridge
            if (window.VoxSightBridge) {
                window.VoxSightBridge.onNoteSelected(
                    vxId, pitchStep, alterVal, octaveVal,
                    durationType, voiceId, measureNum, lyricText, isRest, isDotted
                );
            }
        }

        // ─── XML Mutation API (called from Android via evaluateJavascript) ────
        function getXmlNoteElement(noteId) {
            if (!xmlDoc) return null;
            return xmlDoc.querySelector('note[data-vx-id="' + noteId + '"]') || null;
        }

        function getMeasureDivisions(noteEl) {
            var parentMeas = noteEl ? noteEl.parentNode : null;
            while (parentMeas && parentMeas.tagName !== 'measure') parentMeas = parentMeas.parentNode;
            if (parentMeas) {
                // Walk backwards through preceding measures in this part to find the active divisions
                var curMeas = parentMeas;
                while (curMeas) {
                    if (curMeas.tagName === 'measure') {
                        var dEl = curMeas.getElementsByTagName('divisions')[0];
                        if (dEl) {
                            var dVal = parseInt(dEl.textContent.trim(), 10);
                            if (!isNaN(dVal) && dVal > 0) return dVal;
                        }
                    }
                    curMeas = curMeas.previousElementSibling || curMeas.previousSibling;
                }
            }
            var divEls = xmlDoc ? xmlDoc.getElementsByTagName('divisions') : [];
            if (divEls.length > 0) {
                var dVal = parseInt(divEls[0].textContent.trim(), 10);
                if (!isNaN(dVal) && dVal > 0) return dVal;
            }
            return 1;
        }

        function getNextVxId() {
            let maxId = 0;
            var allNoteEls = xmlDoc.getElementsByTagName('note');
            for (let i = 0; i < allNoteEls.length; i++) {
                var idStr = allNoteEls[i].getAttribute('data-vx-id');
                if (idStr) {
                    var val = parseInt(idStr, 10);
                    if (!isNaN(val) && val > maxId) maxId = val;
                }
            }
            return maxId + 1;
        }

        window.updateNoteLyric = function (noteId, lyricText) {
            var noteEl = getXmlNoteElement(noteId);
            if (!noteEl) { console.warn('updateNoteLyric: note', noteId, 'not found in XML'); return; }

            var lyricEl = noteEl.getElementsByTagName('lyric')[0];
            if (!lyricText || lyricText.trim() === '') {
                if (lyricEl) noteEl.removeChild(lyricEl);
            } else {
                if (!lyricEl) {
                    lyricEl = xmlDoc.createElement('lyric');
                    var syllabicEl = xmlDoc.createElement('syllabic');
                    syllabicEl.textContent = 'single';
                    lyricEl.appendChild(syllabicEl);
                    noteEl.appendChild(lyricEl);
                }
                var textEl = lyricEl.getElementsByTagName('text')[0];
                if (!textEl) {
                    textEl = xmlDoc.createElement('text');
                    lyricEl.appendChild(textEl);
                }
                textEl.textContent = lyricText.trim();
            }
            reloadScore();
        };

        window.updateNoteVoice = function (noteId, newVoice) {
            var noteEl = getXmlNoteElement(noteId);
            if (!noteEl) { console.warn('updateNoteVoice: note', noteId, 'not found in XML'); return; }

            var voiceEl = noteEl.getElementsByTagName('voice')[0];
            if (!voiceEl) {
                voiceEl = xmlDoc.createElement('voice');
                var typeEl = noteEl.getElementsByTagName('type')[0];
                if (typeEl) noteEl.insertBefore(voiceEl, typeEl);
                else noteEl.appendChild(voiceEl);
            }

            var parts = xmlDoc.getElementsByTagName('part');
            var currPart = noteEl.parentNode;
            while (currPart && currPart.tagName !== 'part') currPart = currPart.parentNode;

            var currMeas = noteEl.parentNode;
            while (currMeas && currMeas.tagName !== 'measure') currMeas = currMeas.parentNode;

            // 1. Four-part score (S=1, A=2, T=3, B=4 mapped to parts[0..3])
            if (parts.length >= 4) {
                var targetPartIdx = Math.max(0, Math.min(parts.length - 1, newVoice - 1));
                voiceEl.textContent = '1';
                noteEl.removeAttribute('data-vx-voice');

                if (currPart && currMeas && currPart !== parts[targetPartIdx]) {
                    var currPartMeasures = currPart.getElementsByTagName('measure');
                    var mIdx = -1;
                    for (let i = 0; i < currPartMeasures.length; i++) {
                        if (currPartMeasures[i] === currMeas) { mIdx = i; break; }
                    }

                    var targetPartMeasures = parts[targetPartIdx].getElementsByTagName('measure');
                    if (mIdx >= 0 && mIdx < targetPartMeasures.length) {
                        var targetMeas = targetPartMeasures[mIdx];

                        // If note was part of a chord, drop chord tag
                        var chordTag = noteEl.getElementsByTagName('chord')[0];
                        if (chordTag) noteEl.removeChild(chordTag);

                        noteEl.parentNode.removeChild(noteEl);

                        // If target measure had only a dummy full-measure rest, remove the dummy rest
                        var targetNotes = targetMeas.getElementsByTagName('note');
                        if (targetNotes.length === 1 && targetNotes[0].getElementsByTagName('rest').length > 0) {
                            targetMeas.removeChild(targetNotes[0]);
                        }
                        targetMeas.appendChild(noteEl);
                    }
                }
            }
            // 2. Two-part score (Part 0 = Treble S/A: S=1, A=2; Part 1 = Bass T/B: T=3, B=4)
            else if (parts.length === 2) {
                var targetPartIdx = (newVoice <= 2) ? 0 : 1;
                var localVoice = (newVoice <= 2) ? newVoice : (newVoice - 2); // 1 or 2

                if (currPart && currMeas && currPart !== parts[targetPartIdx]) {
                    // Moving across parts (e.g. from Treble to Bass or vice versa)
                    var currPartMeasures = currPart.getElementsByTagName('measure');
                    var mIdx = -1;
                    for (let i = 0; i < currPartMeasures.length; i++) {
                        if (currPartMeasures[i] === currMeas) { mIdx = i; break; }
                    }

                    var targetPartMeasures = parts[targetPartIdx].getElementsByTagName('measure');
                    if (mIdx >= 0 && mIdx < targetPartMeasures.length) {
                        var targetMeas = targetPartMeasures[mIdx];

                        // Remove chord tag if moving across parts
                        var chordTag = noteEl.getElementsByTagName('chord')[0];
                        if (chordTag) noteEl.removeChild(chordTag);

                        voiceEl.textContent = localVoice.toString();
                        noteEl.setAttribute('data-vx-voice', newVoice.toString());

                        noteEl.parentNode.removeChild(noteEl);

                        var targetNotes = targetMeas.getElementsByTagName('note');
                        if (targetNotes.length === 1 && targetNotes[0].getElementsByTagName('rest').length > 0) {
                            targetMeas.removeChild(targetNotes[0]);
                        }
                        targetMeas.appendChild(noteEl);
                    }
                } else {
                    // Moving within the same part (e.g. Soprano <-> Alto in Part 0)
                    // Note: Keep MusicXML voice attribute safe while explicitly recording data-vx-voice
                    noteEl.setAttribute('data-vx-voice', newVoice.toString());
                }
            } else {
                // Single part score
                voiceEl.textContent = newVoice.toString();
                noteEl.setAttribute('data-vx-voice', newVoice.toString());
            }

            reloadScore();
        };

        window.updateNotePitch = function (noteId, step, alter, octave) {
            var noteEl = getXmlNoteElement(noteId);
            if (!noteEl) { console.warn('updateNotePitch: note', noteId, 'not found in XML'); return; }

            // If it was a rest, remove the rest tag
            var restEl = noteEl.getElementsByTagName('rest')[0];
            if (restEl) noteEl.removeChild(restEl);

            var pitchEl = noteEl.getElementsByTagName('pitch')[0];
            if (!pitchEl) {
                pitchEl = xmlDoc.createElement('pitch');
                noteEl.insertBefore(pitchEl, noteEl.firstChild);
            }

            var stepEl = pitchEl.getElementsByTagName('step')[0];
            if (!stepEl) { stepEl = xmlDoc.createElement('step'); pitchEl.appendChild(stepEl); }
            stepEl.textContent = step.toUpperCase();

            var octaveEl = pitchEl.getElementsByTagName('octave')[0];
            if (!octaveEl) { octaveEl = xmlDoc.createElement('octave'); pitchEl.appendChild(octaveEl); }
            octaveEl.textContent = octave.toString();

            }

                var cr = credits[c];

                var fM1 = fPart.getElementsByTagName('measure')[0];
                if (fM1) {
                    var clefEl = fM1.querySelector('attributes > clef, clef');
                    if (!clefEl) {
                        var totalPitch = 0;
                        var countPitch = 0;
                        var stepToSemi = { 'C': 0, 'D': 2, 'E': 4, 'F': 5, 'G': 7, 'A': 9, 'B': 11 };
                        var allNotes = fPart.getElementsByTagName('note');
                        for (var nIdx = 0; nIdx < allNotes.length; nIdx++) {
                            var pEl = allNotes[nIdx].getElementsByTagName('pitch')[0];
                            if (pEl) {
                                var st = (pEl.getElementsByTagName('step')[0] ? pEl.getElementsByTagName('step')[0].textContent.trim().toUpperCase() : 'C');
                                var oc = parseInt(pEl.getElementsByTagName('octave')[0] ? pEl.getElementsByTagName('octave')[0].textContent.trim() : '4', 10);
                                var semi = (oc + 1) * 12 + (stepToSemi[st] || 0);
                                totalPitch += semi;
                                countPitch++;
                            }
                        }
                        var avgMidi = countPitch > 0 ? (totalPitch / countPitch) : 60;
                        var attrsEl = fM1.getElementsByTagName('attributes')[0];
                        if (!attrsEl) {
                            attrsEl = doc.createElement('attributes');
                            fM1.insertBefore(attrsEl, fM1.firstChild);
                        }
                        var newClef = doc.createElement('clef');
                        var newSign = doc.createElement('sign');
                        var newLine = doc.createElement('line');
                        var pNameLower = ((fPart.getAttribute('id') || '') + ' ' + (fPart.getElementsByTagName('part-name')[0] ? fPart.getElementsByTagName('part-name')[0].textContent : '')).toLowerCase();
                        if (avgMidi < 60 || pNameLower.indexOf('bass') !== -1 || pNameLower.indexOf('tenor') !== -1 || pNameLower.indexOf('t/b') !== -1) {
                            newSign.textContent = 'F';
                            newLine.textContent = '4';
                        } else {
                            newSign.textContent = 'G';
                            newLine.textContent = '2';
                        }
                        newClef.appendChild(newSign);
                        newClef.appendChild(newLine);
                        attrsEl.appendChild(newClef);
                    }
                }
            }

            // 6. Ensure any measure without notes has an explicit full-measure rest
            for (var pIdx = 0; pIdx < finalParts.length; pIdx++) {
                var fPart = finalParts[pIdx];
                var fMeasures = fPart.getElementsByTagName('measure');
                for (var mIdx = 0; mIdx < fMeasures.length; mIdx++) {
                    var fM = fMeasures[mIdx];
                    if (fM.getElementsByTagName('note').length === 0) {
                        var restNote = doc.createElement('note');
                        var restElem = doc.createElement('rest');
                        restElem.setAttribute('measure', 'yes');
                        var durElem = doc.createElement('duration');
                        durElem.textContent = '12';
                        var voiceElem = doc.createElement('voice');
                        voiceElem.textContent = '1';
                        restNote.appendChild(restElem);
                        restNote.appendChild(durElem);
                        restNote.appendChild(voiceElem);
                        fM.appendChild(restNote);
                    } else {
                        // NOTE: Do NOT strip <measure-style> here. After voice merging,
                        // a measure may legitimately have both pitched notes (from one voice)
                        // and <multiple-rest> (from the other voice's rest). Stripping would
                        // destroy valid H-bar rendering data.
                    }
                }
            }

        }

        // ─── XML Serialization & Sanitization ─────────────────────────────────
        function sanitizeMusicXmlString(xmlString) {
            if (!xmlString) return '';
            return xmlString
                .replace(/\s+xmlns=""/g, '')
                .replace(/\s+xmlns="http:\/\/www\.w3\.org\/1999\/xhtml"/g, '')
                .replace(/\s+data-vx-id="[^"]*"/g, '');
                // NOTE: data-vx-voice is intentionally PRESERVED — it carries the user's custom SATB voice assignment
        }

        function reloadScore() {
            loadScore('', currentTpq, true);
        }

        window.getModifiedXml = function () {
            if (!xmlDoc) return '';
            var serializer = new XMLSerializer();
            var rawXml = serializer.serializeToString(xmlDoc);
            return sanitizeMusicXmlString(rawXml);
        };

        // ─── Highlight rendering & Resize ──────────────────────────────────────
        function resizeCanvas() {
            var osmdDiv = document.getElementById('osmd-render');
            if (osmdDiv && canvas) {
                canvas.width = osmdDiv.offsetWidth;
                canvas.height = osmdDiv.offsetHeight;
            }
        }

        function updateStatus(msg) { statusText.textContent = msg; }

        var resizeTimer = null;
        window.addEventListener('resize', function () {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function () {
                resizeCanvas();
                buildNoteMap();
                renderHBarRests();
                if (selectedNoteId !== null) {
                    drawHighlight(selectedNoteId);
                }
            }, 300);
        });

        // ─── Dynamic Zoom & Pinch Gesture Support ─────────────────────────────
        let currentZoom = 0.40;

        function applyZoom(newZoom) {
            if (!osmd) return;
            currentZoom = Math.max(0.25, Math.min(1.2, newZoom));
            osmd.zoom = currentZoom;
            osmd.render();
            resizeCanvas();
            buildNoteMap();
            renderHBarRests();
            if (selectedNoteId !== null) {
                var entry = noteMap.get(selectedNoteId);
                if (entry && entry.coord) {
                    drawHighlight(entry.coord.x, entry.coord.y, entry.coord.w, entry.coord.h);
                }
            }
        }

        window.zoomIn = function () {
            applyZoom(currentZoom + 0.08);
        };

        window.zoomOut = function () {
            applyZoom(currentZoom - 0.08);
        };

        window.zoomFit = function () {
            applyZoom(0.40);
        };

        window.setZoom = function (val) {
            applyZoom(val);
        };

        // Multi-touch pinch-to-zoom support
        let initialDistance = null;
        let initialZoom = 0.40;
        scoreContainer.addEventListener('touchstart', function (e) {
            if (e.touches.length === 2) {
                initialDistance = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                initialZoom = currentZoom;
            }
        }, { passive: true });

        scoreContainer.addEventListener('touchmove', function (e) {
            if (e.touches.length === 2 && initialDistance) {
                let dist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                let factor = dist / initialDistance;
                applyZoom(initialZoom * factor);
            }
        }, { passive: true });

        scoreContainer.addEventListener('touchend', function (e) {
            if (e.touches.length < 2) {
                initialDistance = null;
            }
        }, { passive: true });

        // ─── Score Direction & Metadata Word Editing ──────────────────────────
        window.updateDirectionWord = function (oldText, newText) {
            if (!xmlDoc) return;
            var words = xmlDoc.getElementsByTagName('words');
            var changed = false;
            for (var i = 0; i < words.length; i++) {
                if (words[i].textContent && words[i].textContent.trim().toLowerCase() === oldText.trim().toLowerCase()) {
                    words[i].textContent = newText;
                    changed = true;
                }
            }
            if (changed) {
                reloadScore();
            }
        };

        window.updateScoreMetadata = function (title, composer, arranger) {
            if (!xmlDoc) return;
            var workTitle = xmlDoc.querySelector('work > work-title');
            if (workTitle && title) workTitle.textContent = title;

            var comp = xmlDoc.querySelector("identification > creator[type='composer']");
            if (comp && composer) comp.textContent = composer;

            var arr = xmlDoc.querySelector("identification > creator[type='arranger']");
            if (arr && arranger) arr.textContent = arranger;

            reloadScore();
        };

        window.getDirectionsList = function () {
            if (!xmlDoc) return '[]';
            var words = xmlDoc.getElementsByTagName('words');
            var list = [];
            for (var i = 0; i < words.length; i++) {
                var txt = words[i].textContent ? words[i].textContent.trim() : '';
                if (txt) list.push(txt);
            }
            return JSON.stringify(list);
        };

        initOSMD();

        var urlParams = new URLSearchParams(window.location.search);
        var targetFile = urlParams.get('score') || urlParams.get('file');
        if (targetFile) {
            fetch(targetFile).then(function (r) { return r.text(); }).then(function (xml) {
                loadScore(xml);
            }).catch(function (err) {
                console.error('Failed to load file:', err);
                loadingOverlay.classList.add('hidden');
            });
        } else {
            loadingOverlay.classList.add('hidden');
        }
    </script>
</body>
