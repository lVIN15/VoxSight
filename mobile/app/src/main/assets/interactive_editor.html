<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>VoxSight OMR Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            overflow-x: auto;
            -webkit-user-select: none;
            user-select: none;
        }

        #score-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background: #ffffff;
            padding: 16px;
            cursor: pointer;
        }

        #osmd-render {
            width: 100%;
            min-height: 200px;
        }

        /* Floating Selection Ring Overlay */
        #selection-indicator {
            position: absolute;
            border: 2.5px solid #0284c7;
            background: rgba(56, 189, 248, 0.28);
            border-radius: 8px;
            pointer-events: none;
            transition: all 0.1s ease;
            display: none;
            z-index: 100;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.7);
        }

        /* Canvas overlay for selected note highlighting */
        #highlight-canvas {
            position: absolute;
            top: 16px;
            left: 16px;
            width: calc(100% - 32px);
            height: calc(100% - 32px);
            pointer-events: none;
            z-index: 10;
        }

        #status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        #status-text {
            font-size: 12px;
            color: #94a3b8;
        }

        #editor-hint {
            font-size: 11px;
            color: #38bdf8;
            font-weight: 500;
        }

        /* Floating Zoom Controls */
        #zoom-controls {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(10px);
            padding: 4px 8px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 100;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }

        #zoom-controls button {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            font-weight: 600;
            font-size: 14px;
            height: 32px;
            min-width: 32px;
            padding: 0 8px;
            border-radius: 16px;
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        #zoom-controls button:active {
            background: #38bdf8;
            color: #0f172a;
            transform: scale(0.92);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <!-- Floating Zoom Bar -->
    <div id="zoom-controls">
        <button id="btn-zoom-in" onclick="zoomIn()" title="Zoom In">+</button>
        <button id="btn-zoom-fit" onclick="zoomFit()" title="Fit Width">Fit</button>
        <button id="btn-zoom-out" onclick="zoomOut()" title="Zoom Out">−</button>
    </div>

    <div id="score-container">
        <div id="osmd-render"></div>
        <div id="selection-indicator"></div>
        <canvas id="highlight-canvas"></canvas>
    </div>

    <div id="status-bar">
        <span id="status-text">Ready</span>
        <span id="editor-hint">Tap notes to edit</span>
    </div>

    <script src="opensheetmusicdisplay.min.js"></script>

    <script>
        // ─── Globals ───────────────────────────────────────────────────────────
        let osmd = null;
        let highlightCtx = null;
        let xmlDoc = null;
        let selectedNoteId = null;
        let currentTpq = 960;

        // noteMap: vxId (number) → { gNote, srcNote, coord }
        let noteMap = new Map();
        // noteCoordinates: flat array of { id, x, y, w, h, cx, cy } for nearest-neighbor click
        let noteCoordinates = [];
        // allGraphicalNotes: cached from DFS traversal (same approach as renderer.html)
        let allGraphicalNotes = [];

        const scoreContainer = document.getElementById('score-container');
        const renderDiv = document.getElementById('osmd-render');
        const canvas = document.getElementById('highlight-canvas');
        const statusText = document.getElementById('status-text');
        const loadingOverlay = document.getElementById('loading-overlay');

        // ─── OSMD init ─────────────────────────────────────────────────────────
        function initOSMD() {
            osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(renderDiv, {
                backend: 'svg',
                autoResize: false,
                newSystemFromXML: true,
                newPageFromXML: true,
                drawTitle: true,
                drawComposer: true,
                drawPartNames: true,
                drawMeasureNumbers: true,
                drawLyrics: true,
                drawSlurs: true,
                drawCredits: true,
                drawFingerings: true,
                drawDynamics: false,
                drawOrnaments: false,
                drawingParameters: 'default',
                coloringEnabled: true,
                colorStemsLikeNoteheads: true,
                autoGenerateMultipleRestMeasuresFromRestMeasures: true,
                renderMultipleRestMeasures: true
            });
            if (osmd.rules) {
                osmd.rules.AutoGenerateMultipleRestMeasuresFromRestMeasures = true;
                osmd.rules.RenderMultipleRestMeasures = true;
            }
            highlightCtx = canvas.getContext('2d');
            updateStatus('Editor Ready');
        }

        // ─── Helper: DFS to find all GraphicalNote objects (proven approach from renderer.html) ──
        function findGraphicalNotes(obj, visited, results) {
            if (!obj || typeof obj !== 'object') return results;
            if (visited.has(obj)) return results;
            visited.add(obj);

            const srcNote = obj.sourceNote || obj.SourceNote;
            const bbox = obj.positionAndShape || obj.PositionAndShape;

            if (srcNote && bbox && (bbox.absolutePosition || bbox.AbsolutePosition)) {
                results.push(obj);
                return results;
            }

            if (obj instanceof HTMLElement || obj instanceof SVGElement || obj instanceof Node) return results;
            if (Array.isArray(obj)) {
                for (let i = 0; i < obj.length; i++) {
                    findGraphicalNotes(obj[i], visited, results);
                }
            } else {
                for (let key of Object.keys(obj)) {
                    findGraphicalNotes(obj[key], visited, results);
                }
            }
            return results;
        }

        // ─── Helper: Extract SVG elements from a GraphicalNote ──
        function getSvgElements(gNote) {
            const svgs = [];
            if (!gNote) return svgs;

            function addEl(el) {
                if (el && svgs.indexOf(el) === -1) svgs.push(el);
            }

            var src = gNote.sourceNote || gNote.SourceNote;
            var isRest = false;
            if (src) {
                isRest = (typeof src.isRest === 'function') ? src.isRest() : (src.isRest || src.IsRest || false);
            }

            var vf = null;
            if (gNote.vfnote && gNote.vfnote.length > 0) vf = gNote.vfnote[0];
            else if (gNote.parentVoiceEntry && gNote.parentVoiceEntry.vfnote && gNote.parentVoiceEntry.vfnote.length > 0) {
                vf = gNote.parentVoiceEntry.vfnote[0];
            }

            if (vf) {
                var vfG = null;
                if (typeof vf.getSVGGElement === 'function') vfG = vf.getSVGGElement();
                else if (vf.getAttribute && typeof vf.getAttribute === 'function') vfG = vf.getAttribute('el');
                else if (vf.elem) vfG = vf.elem;

                if (vfG) {
                    if (isRest) {
                        // Tag rest container and all its child path/glyph elements
                        addEl(vfG);
                        var restPaths = vfG.querySelectorAll ? vfG.querySelectorAll('path, polygon, rect') : [];
                        for (let p = 0; p < restPaths.length; p++) addEl(restPaths[p]);
                    } else {
                        var nhs = vfG.querySelectorAll ? Array.from(vfG.querySelectorAll('.vf-notehead')) : [];
                        var targetNh = null;
                        if (nhs.length > 1) {
                            // Sort noteheads by screen top coordinate descending (bottom of screen = lowest pitch, top of screen = highest pitch)
                            nhs.sort(function (a, b) {
                                var rA = a.getBoundingClientRect();
                                var rB = b.getBoundingClientRect();
                                return rB.top - rA.top; // descending Y: lowest pitch first
                            });
                            var nhIdx = (typeof gNote.vfnoteIndex === 'number') ? gNote.vfnoteIndex : 0;
                            targetNh = nhs[Math.min(nhIdx, nhs.length - 1)] || nhs[0];
                        } else if (nhs.length === 1) {
                            targetNh = nhs[0];
                        }

                        if (targetNh) {
                            addEl(targetNh);
                            var paths = targetNh.querySelectorAll ? targetNh.querySelectorAll('path, ellipse, polygon') : [];
                            for (let p = 0; p < paths.length; p++) addEl(paths[p]);
                        }

                        // Stems (.vf-stem) - only tag if single note or base note (index 0)
                        var nhIdx = (typeof gNote.vfnoteIndex === 'number') ? gNote.vfnoteIndex : 0;
                        if (nhIdx === 0 || nhs.length <= 1) {
                            var stems = vfG.querySelectorAll ? vfG.querySelectorAll('.vf-stem, path.vf-stem, rect.vf-stem, [class*="stem"]') : [];
                            for (let s = 0; s < stems.length; s++) addEl(stems[s]);

                            var flags = vfG.querySelectorAll ? vfG.querySelectorAll('.vf-flag, path.vf-flag, [class*="flag"]') : [];
                            for (let f = 0; f < flags.length; f++) addEl(flags[f]);
                        }

                        // Modifiers (accidentals, dots)
                        var mods = vfG.querySelectorAll ? vfG.querySelectorAll('.vf-modifiers, .vf-accidental, [class*="accidental"], [class*="dot"]') : [];
                        for (let m = 0; m < mods.length; m++) {
                            addEl(mods[m]);
                            var modPaths = mods[m].querySelectorAll ? mods[m].querySelectorAll('path') : [];
                            for (let mp = 0; mp < modPaths.length; mp++) addEl(modPaths[mp]);
                        }
                    }
                }
            }

            // Direct gNote getSVGGElement fallback
            if (typeof gNote.getSVGGElement === 'function') {
                var el = gNote.getSVGGElement();
                if (el) {
                    addEl(el);
                    var subPaths = el.querySelectorAll ? el.querySelectorAll('path, ellipse, polygon') : [];
                    for (let sp = 0; sp < subPaths.length; sp++) addEl(subPaths[sp]);
                }
            }

            return svgs;
        }

        function getFractionValue(fraction) {
            if (!fraction) return 0;
            if (typeof fraction.RealValue === 'number') return fraction.RealValue;
            if (typeof fraction.realValue === 'number') return fraction.realValue;
            if (fraction.numerator !== undefined && fraction.denominator !== undefined)
                return fraction.numerator / fraction.denominator;
            return 0;
        }

        // ─── Base64 & UTF-8 Decoder Helper ────────────────────────────
        function decodeBase64ToXml(b64) {
            if (!b64) return '';
            try {
                var binary = atob(b64);
                var bytes = new Uint8Array(binary.length);
                for (var i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return new TextDecoder('utf-8').decode(bytes);
            } catch (e) {
                try {
                    return decodeURIComponent(escape(atob(b64)));
                } catch (e2) {
                    return atob(b64);
                }
            }
        }

        // ─── Load & render ─────────────────────────────────────────────
        async function loadScore(musicXml, tpq, preserveDoc) {
            if (tpq !== undefined && typeof tpq === 'number' && tpq > 0) currentTpq = tpq;
            if (!osmd) initOSMD();

            try {
                loadingOverlay.classList.remove('hidden');

                if (!preserveDoc || !xmlDoc) {
                    var xmlString = musicXml;
                    if (typeof xmlString === 'string' && !xmlString.trim().startsWith('<')) {
                        xmlString = decodeBase64ToXml(xmlString.trim());
                    }

                    if (!xmlString || typeof xmlString !== 'string' || xmlString.trim().length === 0) {
                        console.error('[VoxSight Editor] loadScore: Empty MusicXML string');
                        updateStatus('Error: No XML provided');
                        loadingOverlay.classList.add('hidden');
                        return;
                    }

                    // Parse the XML DOM from the string
                    xmlDoc = new DOMParser().parseFromString(xmlString, 'text/xml');

                    // Check for XML parse errors
                    var parseError = xmlDoc.querySelector('parsererror');
                    if (parseError) {
                        console.error('XML parse error:', parseError.textContent);
                        updateStatus('Error: Invalid XML');
                        loadingOverlay.classList.add('hidden');
                        return;
                    }

                    // Clean duplicate/split parts and misplaced credits
                    try {
                        cleanMusicXmlDom(xmlDoc);
                    } catch (e) {
                        console.warn('cleanMusicXmlDom error:', e);
                    }

                    // Stamp stable IDs on XML notes that don't already have one.
                    stampNoteIds();
                }

                // Strip data-vx-id attributes before passing to OSMD.
                var cleanXml = sanitizeMusicXmlString(new XMLSerializer().serializeToString(xmlDoc));
                if (!cleanXml || cleanXml.indexOf('<score-partwise') === -1) {
                    cleanXml = new XMLSerializer().serializeToString(xmlDoc);
                }

                await osmd.load(cleanXml);
                osmd.zoom = currentZoom;
                osmd.render();

                resizeCanvas();
                buildNoteMap();
                renderHBarRests();

                loadingOverlay.classList.add('hidden');
                updateStatus('Score loaded – ' + noteMap.size + ' elements – tap to edit');

                // Re-draw selection highlight if a note was previously selected
                if (selectedNoteId !== null) {
                    drawHighlight(selectedNoteId);
                } else {
                    clearHighlights();
                }

            } catch (err) {
                console.error('OSMD load error:', err);
                updateStatus('Error: ' + err.message);
                loadingOverlay.classList.add('hidden');
            }
        }

        function loadScoreBase64(b64, tpq = 960) {
            try {
                const xmlStr = decodeBase64ToXml(b64);
                loadScore(xmlStr, tpq);
            } catch (e) {
                console.error('Base64 decoding failed:', e);
                updateStatus('Error decoding MusicXML');
            }
        }

        window.loadScore = loadScore;
        window.loadScoreBase64 = loadScoreBase64;

        // ─── Stamp stable IDs ──────────────────────────────────────────
        // Assigns data-vx-id to every <note> element (both pitch notes and rests) in the XML DOM.
        function stampNoteIds() {
            if (!xmlDoc) return;
            let maxId = 0;
            var allNoteEls = xmlDoc.getElementsByTagName('note');
            for (let i = 0; i < allNoteEls.length; i++) {
                var existing = allNoteEls[i].getAttribute('data-vx-id');
                if (existing !== null) {
                    var parsed = parseInt(existing, 10);
                    if (!isNaN(parsed) && parsed > maxId) maxId = parsed;
                }
            }
            var nextId = maxId + 1;

            for (let i = 0; i < allNoteEls.length; i++) {
                var noteEl = allNoteEls[i];
                if (!noteEl.hasAttribute('data-vx-id')) {
                    noteEl.setAttribute('data-vx-id', String(nextId++));
                }
            }
        }

        // ─── Staff Index & Measure Number Helpers for OSMD GraphicalNotes ──────
        function getStaffIndex(gNote) {
            if (!gNote) return 0;
            if (gNote.ParentStaffEntry && gNote.ParentStaffEntry.parentStaff && typeof gNote.ParentStaffEntry.parentStaff.idInMusicSheet === 'number') {
                return gNote.ParentStaffEntry.parentStaff.idInMusicSheet;
            }
            if (gNote.parentStaffEntry && gNote.parentStaffEntry.parentStaff && typeof gNote.parentStaffEntry.parentStaff.idInMusicSheet === 'number') {
                return gNote.parentStaffEntry.parentStaff.idInMusicSheet;
            }
            var src = gNote.sourceNote || gNote.SourceNote;
            if (src) {
                if (src.ParentStaffEntry && src.ParentStaffEntry.ParentStaff && typeof src.ParentStaffEntry.ParentStaff.idInMusicSheet === 'number') {
                    return src.ParentStaffEntry.ParentStaff.idInMusicSheet;
                }
                if (src.parentStaffEntry && src.parentStaffEntry.parentStaff && typeof src.parentStaffEntry.parentStaff.idInMusicSheet === 'number') {
                    return src.parentStaffEntry.parentStaff.idInMusicSheet;
                }
                if (src.ParentStaffEntry && src.ParentStaffEntry.ParentStaff && typeof src.ParentStaffEntry.ParentStaff.Id === 'number') {
                    return src.ParentStaffEntry.ParentStaff.Id - 1;
                }
            }
            return 0;
        }

        function getMeasureIndex(gNote) {
            var src = gNote ? (gNote.sourceNote || gNote.SourceNote) : null;
            if (src) {
                var sm = src.SourceMeasure || src.sourceMeasure;
                if (sm) {
                    if (typeof sm.measureListIndex === 'number') return sm.measureListIndex;
                    if (typeof sm.MeasureListIndex === 'number') return sm.MeasureListIndex;
                }
            }
            if (gNote) {
                var pm = gNote.parentMeasure || gNote.ParentMeasure;
                if (pm) {
                    if (typeof pm.measureListIndex === 'number') return pm.measureListIndex;
                    if (typeof pm.MeasureListIndex === 'number') return pm.MeasureListIndex;
                    var psm = pm.parentSourceMeasure || pm.ParentSourceMeasure;
                    if (psm) {
                        if (typeof psm.measureListIndex === 'number') return psm.measureListIndex;
                        if (typeof psm.MeasureListIndex === 'number') return psm.MeasureListIndex;
                    }
                }
                var pse = gNote.parentStaffEntry || gNote.ParentStaffEntry;
                if (pse) {
                    var pm2 = pse.parentMeasure || pse.ParentMeasure;
                    if (pm2) {
                        if (typeof pm2.measureListIndex === 'number') return pm2.measureListIndex;
                        if (typeof pm2.MeasureListIndex === 'number') return pm2.MeasureListIndex;
                        var psm2 = pm2.parentSourceMeasure || pm2.ParentSourceMeasure;
                        if (psm2) {
                            if (typeof psm2.measureListIndex === 'number') return psm2.measureListIndex;
                            if (typeof psm2.MeasureListIndex === 'number') return psm2.MeasureListIndex;
                        }
                    }
                }
            }
            return 0;
        }

        function getMeasureNumber(gNote) {
            var src = gNote.sourceNote || gNote.SourceNote;
            if (src) {
                if (src.SourceMeasure && typeof src.SourceMeasure.MeasureNumber === 'number') return src.SourceMeasure.MeasureNumber;
                if (src.sourceMeasure && typeof src.sourceMeasure.MeasureNumber === 'number') return src.sourceMeasure.MeasureNumber;
            }
            if (gNote.parentStaffEntry && gNote.parentStaffEntry.parentMeasure) {
                var m = gNote.parentStaffEntry.parentMeasure;
                if (typeof m.MeasureNumber === 'number') return m.MeasureNumber;
                if (m.ParentSourceMeasure && typeof m.ParentSourceMeasure.MeasureNumber === 'number') return m.ParentSourceMeasure.MeasureNumber;
            }
            return 1;
        }

        // ─── Pitch Signature Helpers for Deterministic 1:1 Notehead Mapping ───
        function getSourceNotePitchSignature(src) {
            if (!src) return null;
            if (typeof src.isRest === 'function' && src.isRest()) return 'REST';
            if (src.isRest === true) return 'REST';

            var pitchObj = src.Pitch || src.pitch;
            if (pitchObj) {
                var step = '';
                if (typeof pitchObj.step === 'string') step = pitchObj.step.toUpperCase();
                else if (typeof pitchObj.Step === 'string') step = pitchObj.Step.toUpperCase();
                else if (typeof pitchObj.step === 'number') {
                    var stepNames = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
                    step = stepNames[pitchObj.step % 7] || '';
                }

                var octave = (typeof pitchObj.octave === 'number') ? pitchObj.octave : ((typeof pitchObj.Octave === 'number') ? pitchObj.Octave : 4);
                var alter = (typeof pitchObj.accidental === 'number') ? pitchObj.accidental : ((typeof pitchObj.Accidental === 'number') ? pitchObj.Accidental : 0);
                var altStr = alter !== 0 ? (alter > 0 ? '#' : 'b') : '';
                return step + altStr + octave;
            }
            return null;
        }

        function getXmlNotePitchSignature(xmlNote) {
            if (!xmlNote) return null;
            if (xmlNote.getElementsByTagName('rest').length > 0) return 'REST';
            var pEl = xmlNote.getElementsByTagName('pitch')[0];
            if (!pEl) return null;
            var step = (pEl.getElementsByTagName('step')[0] ? pEl.getElementsByTagName('step')[0].textContent.trim().toUpperCase() : '');
            var oct = (pEl.getElementsByTagName('octave')[0] ? pEl.getElementsByTagName('octave')[0].textContent.trim() : '4');
            var altEl = pEl.getElementsByTagName('alter')[0];
            var alt = altEl ? parseInt(altEl.textContent.trim(), 10) : 0;
            var altStr = alt !== 0 ? (alt > 0 ? '#' : 'b') : '';
            return step + altStr + oct;
        }

        function getVoiceNumber(gNote) {
            var src = gNote ? (gNote.sourceNote || gNote.SourceNote) : null;
            if (src) {
                if (src.VoiceEntry && src.VoiceEntry.ParentVoice && src.VoiceEntry.ParentVoice.VoiceId !== undefined) {
                    return parseInt(src.VoiceEntry.ParentVoice.VoiceId, 10) || 1;
                }
                if (src.voice && typeof src.voice === 'object' && (src.voice.VoiceId || src.voice.voiceId)) {
                    return parseInt(src.voice.VoiceId || src.voice.voiceId, 10) || 1;
                }
                if (typeof src.voice === 'number') return src.voice;
                if (src.ParentVoice && src.ParentVoice.VoiceId !== undefined) {
                    return parseInt(src.ParentVoice.VoiceId, 10) || 1;
                }
            }
            if (gNote && gNote.ParentStaffEntry && gNote.ParentStaffEntry.ParentVoice && gNote.ParentStaffEntry.ParentVoice.VoiceId !== undefined) {
                return parseInt(gNote.ParentStaffEntry.ParentVoice.VoiceId, 10) || 1;
            }
            return 1;
        }

        // ─── Vocal Part Color Coding Helper (SATB - Identical to Playback Mode) ─
        function getVocalPartColor(voiceNum, staffIdx, partIdx, totalParts, chordPos, customVoice) {
            // Explicit user override via data-vx-voice attribute
            if (typeof customVoice === 'number' && customVoice >= 1 && customVoice <= 4) {
                switch (customVoice) {
                    case 1: return '#E91E63'; // Soprano - Pink
                    case 2: return '#9C27B0'; // Alto - Purple
                    case 3: return '#2196F3'; // Tenor - Blue
                    case 4: return '#4CAF50'; // Bass - Green
                }
            }

            // 4-part score (Soprano, Alto, Tenor, Bass separated by Part)
            if (totalParts >= 4) {
                var p = (typeof partIdx === 'number') ? partIdx : (voiceNum - 1);
                switch (p) {
                    case 0: return '#E91E63'; // Soprano - Pink
                    case 1: return '#9C27B0'; // Alto - Purple
                    case 2: return '#2196F3'; // Tenor - Blue
                    case 3: return '#4CAF50'; // Bass - Green
                    default: break;
                }
            }

            // 2-part score or 2-staff score (Treble = S/A, Bass = T/B)
            if (totalParts === 2 || staffIdx !== undefined) {
                var isStaff1 = (staffIdx === 0 || partIdx === 0);
                var isStaff2 = (staffIdx === 1 || partIdx === 1);

                if (isStaff1) {
                    if (chordPos === 'bottom') return '#9C27B0'; // Alto - Purple
                    if (chordPos === 'top') return '#E91E63'; // Soprano - Pink
                    if (voiceNum === 2) return '#9C27B0'; // Alto - Purple
                    return '#E91E63'; // Soprano - Pink
                } else if (isStaff2) {
                    if (chordPos === 'bottom') return '#4CAF50'; // Bass - Green
                    if (chordPos === 'top') return '#2196F3'; // Tenor - Blue
                    if (voiceNum === 2 || voiceNum === 4) return '#4CAF50'; // Bass - Green
                    return '#2196F3'; // Tenor - Blue
                }
            }

            // Fallback based on voice number
            switch (voiceNum) {
                case 1: return '#E91E63'; // Soprano - Pink
                case 2: return '#9C27B0'; // Alto - Purple
                case 3: return '#2196F3'; // Tenor - Blue
                case 4: return '#4CAF50'; // Bass - Green
                default: return '#E91E63';
            }
        }

        // ─── Color Notehead, Stem, Tail/Flag & Beam ─────────────────────
        function applyNoteVoiceColor(gNote, voiceColor) {
            if (!gNote || !voiceColor) return;

            // Set OSMD source note properties
            if (gNote.sourceNote) {
                gNote.sourceNote.NoteheadColor = voiceColor;
                gNote.sourceNote.StemColor = voiceColor;
                gNote.sourceNote.Color = voiceColor;

                        targetNh.setAttribute('stroke', voiceColor);

                        for (let p = 0; p < paths.length; p++) {

                            paths[p].style.stroke = voiceColor;
                            paths[p].setAttribute('fill', voiceColor);
                            paths[p].setAttribute('stroke', voiceColor);

                        flags[f].style.fill = voiceColor;
                        flags[f].setAttribute('stroke', voiceColor);
                        flags[f].setAttribute('fill', voiceColor);
                        var fPaths = flags[f].querySelectorAll ? flags[f].querySelectorAll('path') : [];
                        for (let fp = 0; fp < fPaths.length; fp++) {
                            fPaths[fp].style.stroke = voiceColor;
                            fPaths[fp].style.fill = voiceColor;
                            fPaths[fp].setAttribute('stroke', voiceColor);
                            fPaths[fp].setAttribute('fill', voiceColor);
                        }
                    }

                    // 4. Color Beam if connected
                    if (vf.beam) {
                        var beamG = (typeof vf.beam.getSVGGElement === 'function') ? vf.beam.getSVGGElement() : (vf.beam.elem || null);
                        if (beamG) {
                            beamG.style.fill = voiceColor;
                            beamG.style.stroke = voiceColor;
                            beamG.setAttribute('fill', voiceColor);
                            beamG.setAttribute('stroke', voiceColor);
                            var bPaths = beamG.querySelectorAll ? beamG.querySelectorAll('path, rect, polygon') : [];
                            for (let bp = 0; bp < bPaths.length; bp++) {
                                bPaths[bp].style.fill = voiceColor;
                                bPaths[bp].style.stroke = voiceColor;
                                bPaths[bp].setAttribute('fill', voiceColor);
                                bPaths[bp].setAttribute('stroke', voiceColor);
                            }
                        }
                    }
                }
            }
        }

        // ─── Build Note Map (100% Deterministic Measure & Timestamp 1:1 Match) ──
        function buildNoteMap() {
            noteMap = new Map();
            noteCoordinates = [];
            allGraphicalNotes = [];

            if (!xmlDoc || !osmd) return;

            // Step 0: Calculate cumulative staff offsets across all parts in the score
            var xmlParts = xmlDoc.getElementsByTagName('part');
            var partStaffOffsets = [];
            var cumulativeStaves = 0;
            for (let p = 0; p < xmlParts.length; p++) {
                partStaffOffsets.push(cumulativeStaves);
                var partEl = xmlParts[p];
                var stavesCount = 1;
                var stavesEl = partEl.getElementsByTagName('staves')[0];
                if (stavesEl) {
                    var sVal = parseInt(stavesEl.textContent.trim(), 10);
                    if (!isNaN(sVal) && sVal > 1) stavesCount = sVal;
                }
                cumulativeStaves += stavesCount;
            }

            // Step 1: Build a map of ALL XML notes grouped by 0-based measure sequence index (mIdx)
            var xmlMeasureNotes = new Map(); // key: mIdx (0-based measure list index) -> array of XML note info

            for (let p = 0; p < xmlParts.length; p++) {
                var partEl = xmlParts[p];
                var measEls = partEl.getElementsByTagName('measure');
                var currentDivisions = 1;
                var partOffset = partStaffOffsets[p] || 0;

                for (let m = 0; m < measEls.length; m++) {
                    var measEl = measEls[m];
                    var mIdx = m; // 0-based sequence index, exactly matching OSMD's measureListIndex
                    var mNum = parseInt(measEl.getAttribute('number'), 10);
                    if (isNaN(mNum)) mNum = m + 1;

                    // Update divisions statefully across measures within this part
                    var dEl = measEl.getElementsByTagName('divisions')[0];
                    if (dEl) {
                        var dVal = parseInt(dEl.textContent.trim(), 10);
                        if (!isNaN(dVal) && dVal > 0) currentDivisions = dVal;
                    }

                    if (!xmlMeasureNotes.has(mIdx)) xmlMeasureNotes.set(mIdx, []);
                    var list = xmlMeasureNotes.get(mIdx);

                    var currentTime = 0;
                    var prevStartTime = 0;

                    for (let c = 0; c < measEl.childNodes.length; c++) {
                        var node = measEl.childNodes[c];
                        if (node.nodeType !== 1) continue;

                        if (node.tagName === 'backup') {
                            var bDurEl = node.getElementsByTagName('duration')[0];
                            var bDur = bDurEl ? (parseInt(bDurEl.textContent.trim(), 10) || 0) : 0;
                            currentTime -= bDur;
                            if (currentTime < 0) currentTime = 0;
                        } else if (node.tagName === 'forward') {
                            var fDurEl = node.getElementsByTagName('duration')[0];
                            var fDur = fDurEl ? (parseInt(fDurEl.textContent.trim(), 10) || 0) : 0;
                            currentTime += fDur;
                        } else if (node.tagName === 'note') {
                            // Skip invisible placeholder notes (e.g. multi-measure rest hidden notes)
                            if (node.getAttribute('print-object') === 'no') continue;

                            var isChord = (node.getElementsByTagName('chord').length > 0);
                            var durEl = node.getElementsByTagName('duration')[0];
                            var dur = durEl ? (parseInt(durEl.textContent.trim(), 10) || 0) : 0;
                            var noteStartTime = isChord ? prevStartTime : currentTime;
                            if (!isChord) prevStartTime = currentTime;

                            var isRest = (node.getElementsByTagName('rest').length > 0);
                            var pEl = node.getElementsByTagName('pitch')[0];
                            var step = pEl && pEl.getElementsByTagName('step')[0] ? pEl.getElementsByTagName('step')[0].textContent.trim().toUpperCase() : 'C';
                            var oct = pEl && pEl.getElementsByTagName('octave')[0] ? parseInt(pEl.getElementsByTagName('octave')[0].textContent.trim(), 10) : 4;
                            var altEl = pEl ? pEl.getElementsByTagName('alter')[0] : null;
                            var alt = altEl ? parseInt(altEl.textContent.trim(), 10) : 0;
                            var altStr = alt !== 0 ? (alt > 0 ? '#' : 'b') : '';
                            var sig = isRest ? 'REST' : (step + altStr + oct);

                            var stepOffsets = { 'C': 0, 'D': 2, 'E': 4, 'F': 5, 'G': 7, 'A': 9, 'B': 11 };
                            var midi = isRest ? -1 : ((oct + 1) * 12 + (stepOffsets[step] || 0) + alt);

                            var vEl = node.getElementsByTagName('voice')[0];
                            var voice = vEl ? (parseInt(vEl.textContent.trim(), 10) || 1) : 1;

                            var sEl = node.getElementsByTagName('staff')[0];
                            var staffLocal = sEl ? (parseInt(sEl.textContent.trim(), 10) || 1) : 1;
                            var staffIdx = partOffset + (staffLocal - 1);
                            var trackKey = (staffIdx * 100) + voice;

                            var tEl = node.getElementsByTagName('type')[0];
                            var type = tEl ? tEl.textContent.trim().toLowerCase() : 'quarter';

                            var vxIdStr = node.getAttribute('data-vx-id');
                            var vxId = vxIdStr ? parseInt(vxIdStr, 10) : null;
                            var customVoiceStr = node.getAttribute('data-vx-voice');
                            var customVoice = customVoiceStr ? parseInt(customVoiceStr, 10) : null;

                            list.push({
                                el: node,
                                id: vxId,
                                sig: sig,
                                step: step,
                                oct: oct,
                                alter: alt,
                                midi: midi,
                                voice: voice,
                                customVoice: customVoice,
                                staffLocal: staffLocal,
                                staffIdx: staffIdx,
                                trackKey: trackKey,
                                partIdx: p,
                                type: type,
                                isRest: isRest,
                                isChord: isChord,
                                startTime: currentDivisions > 0 ? (noteStartTime / currentDivisions) : 0,
                                duration: currentDivisions > 0 ? (dur / currentDivisions) : 1,
                                mNum: mNum,
                                mIdx: mIdx
                            });

                            if (!isChord) {
                                currentTime += dur;
                            }
                        }
                    }
                }
            }

            // Step 2: Extract all GraphicalNotes via DFS
            var root = osmd.graphic || osmd.GraphicSheet || osmd.graphicSheet || osmd;
            findGraphicalNotes(root, new Set(), allGraphicalNotes);

            // Step 3: Group OSMD graphical notes by measureListIndex (mIdx)
            var osmdMeasureNotes = new Map(); // key: mIdx (number) -> array of gNote items

            for (let i = 0; i < allGraphicalNotes.length; i++) {
                var gNote = allGraphicalNotes[i];
                var src = gNote.sourceNote || gNote.SourceNote;
                if (!src) continue;

                var staffIdx = getStaffIndex(gNote);
                var mNum = getMeasureNumber(gNote);
                var mIdx = getMeasureIndex(gNote);
                var vNum = getVoiceNumber(gNote);
                var trackKey = (staffIdx * 100) + vNum;
                var sig = getSourceNotePitchSignature(src);
                var isRest = (typeof src.isRest === 'function') ? src.isRest() : (src.isRest || src.IsRest || false);
                var pitch = src.Pitch || src.pitch;
                // Convert OSMD's numeric pitch.step enum (0=C,1=D,2=E,3=F,4=G,5=A,6=B) to string
                var stepNames = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
                var step = 'C';
                if (pitch) {
                    if (typeof pitch.step === 'string') step = pitch.step.toUpperCase();
                    else if (typeof pitch.Step === 'string') step = pitch.Step.toUpperCase();
                    else if (typeof pitch.step === 'number') step = stepNames[pitch.step % 7] || 'C';
                    else if (typeof pitch.Step === 'number') step = stepNames[pitch.Step % 7] || 'C';
                    else if (typeof pitch.fundamentalNote === 'number') step = stepNames[pitch.fundamentalNote % 7] || 'C';
                }
                var oct = pitch ? ((pitch.octave !== undefined) ? pitch.octave : (pitch.Octave || 4)) : 4;
                var alt = pitch ? ((typeof pitch.accidental === 'number') ? pitch.accidental : ((typeof pitch.Accidental === 'number') ? pitch.Accidental : 0)) : 0;

                var stepOffsets = { 'C': 0, 'D': 2, 'E': 4, 'F': 5, 'G': 7, 'A': 9, 'B': 11 };
                var midi = isRest ? -1 : ((oct + 1) * 12 + (stepOffsets[step] || 0) + alt);

                var fractionTime = 0;
                var timestampFound = false;
                if (src) {
                    var sse = src.parentStaffEntry || src.ParentStaffEntry || src.sourceStaffEntry || src.SourceStaffEntry;
                    if (sse) {
                        var tsObj = sse.Timestamp || sse.timestamp;
                        if (tsObj) {
                            fractionTime = getFractionValue(tsObj) * 4;
                            timestampFound = true;
                        }
                    }
                }
                if (!timestampFound) {
                    var pse = gNote.parentStaffEntry || gNote.ParentStaffEntry;
                    if (pse) {
                        var pm = pse.parentMeasure || pse.ParentMeasure;
                        var psm = pm ? (pm.parentSourceMeasure || pm.ParentSourceMeasure) : null;
                        var absTs = pse.AbsoluteTimestamp || pse.absoluteTimestamp || pse.Timestamp || pse.timestamp;
                        var mTs = psm ? (psm.AbsoluteTimestamp || psm.absoluteTimestamp) : null;
                        if (absTs && mTs) {
                            fractionTime = Math.max(0, (getFractionValue(absTs) - getFractionValue(mTs)) * 4);
                            timestampFound = true;
                        } else if (absTs) {
                            fractionTime = getFractionValue(absTs) * 4;
                            timestampFound = true;
                        }
                    }
                }

                var bbox = gNote.positionAndShape || gNote.PositionAndShape;
                var absPos = bbox ? (bbox.absolutePosition || bbox.AbsolutePosition) : null;
                var posX = absPos ? absPos.x : 0;
                var posY = absPos ? absPos.y : 0;

                if (!osmdMeasureNotes.has(mIdx)) osmdMeasureNotes.set(mIdx, []);
                osmdMeasureNotes.get(mIdx).push({
                    gNote: gNote,
                    src: src,
                    sig: sig,
                    step: step,
                    oct: oct,
                    alter: alt,
                    midi: midi,
                    voice: vNum,
                    staffIdx: staffIdx,
                    trackKey: trackKey,
                    isRest: isRest,
                    mNum: mNum,
                    mIdx: mIdx,
                    time: fractionTime,
                    x: posX,
                    y: posY
                });
            }

            // Step 4: Calculate coordinate scaling helpers
            var unitToPx = 10;
            if (root && root.rules && root.rules.unitInPixels) unitToPx = root.rules.unitInPixels;
            else if (root && root.Rules && root.Rules.unitInPixels) unitToPx = root.Rules.unitInPixels;
            var zoom = osmd.zoom || 1.0;

            // Step 5: Structurally Invariant 1:1 Note Mapping per Measure (mIdx)
            var nextVxId = getNextVxId();

            osmdMeasureNotes.forEach(function (gList, mIdx) {
                var xmlList = xmlMeasureNotes.has(mIdx) ? xmlMeasureNotes.get(mIdx) : [];

                // Compute chordPos for all XML notes at the same (staffIdx, rounded startTime)
                var tsGroups = new Map();
                for (let x = 0; x < xmlList.length; x++) {
                    var xn = xmlList[x];
                    var key = xn.staffIdx + '_' + Math.round(xn.startTime * 100);
                    if (!tsGroups.has(key)) tsGroups.set(key, []);
                    tsGroups.get(key).push(xn);
                }
                tsGroups.forEach(function (group) {
                    if (group.length > 1) {
                        group.sort(function (a, b) { return a.midi - b.midi; });
                        for (let i = 0; i < group.length; i++) {
                            if (i === 0) group[i].chordPos = 'bottom';
                            else if (i === group.length - 1) group[i].chordPos = 'top';
                            else group[i].chordPos = 'middle';
                        }
                    } else if (group.length === 1) {
                        group[0].chordPos = 'single';
                    }
                });

                // Sort gList strictly by staffIdx ASC, then time ASC, then MIDI ASC
                gList.sort(function (a, b) {
                    if (a.staffIdx !== b.staffIdx) return a.staffIdx - b.staffIdx;
                    if (Math.abs(a.time - b.time) > 0.02) return a.time - b.time;
                    return a.midi - b.midi;
                });

                // Sort xmlList strictly by staffIdx ASC, then startTime ASC, then MIDI ASC
                xmlList.sort(function (a, b) {
                    if (a.staffIdx !== b.staffIdx) return a.staffIdx - b.staffIdx;
                    if (Math.abs(a.startTime - b.startTime) > 0.02) return a.startTime - b.startTime;
                    return a.midi - b.midi;
                });

                var assignedG = new Set();
                var assignedX = new Set();
                var matchedPairs = [];

                // Pass 1: Same staffIdx + Exact Time (<0.05) + Exact Pitch (midi) match
                for (let g = 0; g < gList.length; g++) {
                    if (assignedG.has(g)) continue;
                    var gn = gList[g];
                    for (let x = 0; x < xmlList.length; x++) {
                        if (assignedX.has(x)) continue;
                        var xn = xmlList[x];
                        if (gn.staffIdx === xn.staffIdx && Math.abs(gn.time - xn.startTime) < 0.05 && gn.midi === xn.midi) {
                            assignedG.add(g);
                            assignedX.add(x);
                            matchedPairs.push({ gItem: gn, xItem: xn });
                            break;
                        }
                    }
                }

                // Pass 2: Same staffIdx + Exact Time (<0.05) match (invariant to pitch edits)
                for (let g = 0; g < gList.length; g++) {
                    if (assignedG.has(g)) continue;
                    var gn = gList[g];
                    for (let x = 0; x < xmlList.length; x++) {
                        if (assignedX.has(x)) continue;
                        var xn = xmlList[x];
                        if (gn.staffIdx === xn.staffIdx && Math.abs(gn.time - xn.startTime) < 0.05) {
                            assignedG.add(g);
                            assignedX.add(x);
                            matchedPairs.push({ gItem: gn, xItem: xn });
                            break;
                        }
                    }
                }

                // Pass 3: Same staffIdx + Proximity Time (<0.25) match
                for (let g = 0; g < gList.length; g++) {
                    if (assignedG.has(g)) continue;
                    var gn = gList[g];
                    for (let x = 0; x < xmlList.length; x++) {
                        if (assignedX.has(x)) continue;
                        var xn = xmlList[x];
                        if (gn.staffIdx === xn.staffIdx && Math.abs(gn.time - xn.startTime) < 0.25) {
                            assignedG.add(g);
                            assignedX.add(x);
                            matchedPairs.push({ gItem: gn, xItem: xn });
                            break;
                        }
                    }
                }

                // Pass 4: Fallback within the exact same staff in strict sequential order
                for (let g = 0; g < gList.length; g++) {
                    if (assignedG.has(g)) continue;
                    var gn = gList[g];
                    for (let x = 0; x < xmlList.length; x++) {
                        if (assignedX.has(x)) continue;
                        var xn = xmlList[x];
                        if (gn.staffIdx === xn.staffIdx) {
                            assignedG.add(g);
                            assignedX.add(x);
                            matchedPairs.push({ gItem: gn, xItem: xn });
                            break;
                        }
                    }
                }

                // Pass 5: Fallback across remaining elements in measure
                for (let g = 0; g < gList.length; g++) {
                    if (assignedG.has(g)) continue;
                    for (let x = 0; x < xmlList.length; x++) {
                        if (assignedX.has(x)) continue;
                        assignedG.add(g);
                        assignedX.add(x);
                        matchedPairs.push({ gItem: gList[g], xItem: xmlList[x] });
                        break;
                    }
                    if (!assignedG.has(g) && xmlList.length > 0) {
                        matchedPairs.push({ gItem: gList[g], xItem: xmlList[Math.min(g, xmlList.length - 1)] });
                        assignedG.add(g);
                    }
                }

                // Process all matched pairs into noteMap and noteCoordinates
                for (let m = 0; m < matchedPairs.length; m++) {
                    var pair = matchedPairs[m];
                    var gn = pair.gItem;
                    var xn = pair.xItem;
                    if (!xn || !xn.el) continue;

                    var vxId = xn.id;
                    if (vxId === null || isNaN(vxId)) {
                        vxId = nextVxId++;
                        xn.el.setAttribute('data-vx-id', vxId.toString());
                        xn.id = vxId;
                    }
                    var gNote = gn.gNote;

                    // Priority: Real Screen Bounding Box from SVG DOM
                    var domEls = getSvgElements(gNote);
                    var sx = 0, sy = 0, sw = 16, sh = 20;

                        try {
                            var rect = domEls[0].getBoundingClientRect();
                            var containerRect = scoreContainer.getBoundingClientRect();
                            sx = (rect.left - containerRect.left) + scoreContainer.scrollLeft;
                            sy = (rect.top - containerRect.top) + scoreContainer.scrollTop;
                            sw = rect.width > 0 ? rect.width : 16;
                            sh = rect.height > 0 ? rect.height : 20;
                            foundDom = true;
                        } catch (e) { }
                    }

                    if (!foundDom) {
                        var bbox = gNote.positionAndShape || gNote.PositionAndShape;
                        if (bbox) {
                            var absPos = bbox.absolutePosition || bbox.AbsolutePosition;
                            var size = bbox.size || bbox.Size;
                            if (absPos && size) {

                                sy = absPos.y * unitToPx * zoom;
                                sw = (size.width || size.Width || 1.5) * unitToPx * zoom;
                                sh = (size.height || size.Height || 2.0) * unitToPx * zoom;
                            }
                        }

                    var cx = sx + sw / 2;
                    var cy = sy + sh / 2;
                    var coord = { id: vxId, x: sx, y: sy, w: sw, h: sh, cx: cx, cy: cy };
                    noteCoordinates.push(coord);

                    // Store stable 1:1 mapping
                    gNote.__vx_id = vxId;
                    if (gNote.sourceNote) gNote.sourceNote.__vx_id = vxId;
                    noteMap.set(vxId, {
                        gNote: gNote,
                        srcNote: gNote.sourceNote,
                        xmlNote: xn.el,
                        coord: coord,
                        staffIdx: gn.staffIdx,
                        measureIdx: mIdx,
                        measureNum: gn.mNum,
                        voiceNum: xn.voice,
                        chordPos: xn.chordPos,
                        customVoice: xn.customVoice
                    });

                    // Tag ONLY specific notehead SVG elements with exact data-vx-id & Vocal Part Color
                    var voiceColor = getVocalPartColor(xn.voice, gn.staffIdx, xn.partIdx, xmlParts.length, xn.chordPos, xn.customVoice);

                    if (domEls.length > 0) {
                        for (let d = 0; d < domEls.length; d++) {
                            let el = domEls[d];
                            if (!el) continue;
                            el.setAttribute('data-vx-id', vxId.toString());
                            el.style.cursor = 'pointer';

                    if (!xn.isRest) {

                    }
