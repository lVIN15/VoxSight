<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>VoxSight OMR Editor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            overflow-x: auto;
            -webkit-user-select: none;
            user-select: none;
        }

        #score-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background: #ffffff;
            padding: 16px;
            cursor: pointer;
        }

        #osmd-render {
            width: 100%;
            min-height: 200px;
        }

        /* Canvas overlay for selected note highlighting */
        #highlight-canvas {
            position: absolute;
            top: 16px;
            left: 16px;
            width: calc(100% - 32px);
            height: calc(100% - 32px);
            pointer-events: none;
            z-index: 10;
        }

        #status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        #status-text { font-size: 12px; color: #94a3b8; }
        #editor-hint { font-size: 11px; color: #38bdf8; font-weight: 500; }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-overlay.hidden { display: none; }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <div id="score-container">
        <div id="osmd-render"></div>
        <canvas id="highlight-canvas"></canvas>
    </div>

    <div id="status-bar">
        <span id="status-text">Ready</span>
        <span id="editor-hint">Tap notes to edit</span>
    </div>

    <script src="opensheetmusicdisplay.min.js"></script>

    <script>
    // ─── Globals ───────────────────────────────────────────────────────────
    let osmd = null;
    let highlightCtx = null;
    let xmlDoc = null;
    let selectedNoteId = null;
    let currentTpq = 960;

    // noteMap: vxId (number) → { gNote, srcNote, coord }
    let noteMap = new Map();
    // noteCoordinates: flat array of { id, x, y, w, h, cx, cy } for nearest-neighbor click
    let noteCoordinates = [];
    // allGraphicalNotes: cached from DFS traversal (same approach as renderer.html)
    let allGraphicalNotes = [];

    const scoreContainer = document.getElementById('score-container');
    const renderDiv = document.getElementById('osmd-render');
    const canvas = document.getElementById('highlight-canvas');
    const statusText = document.getElementById('status-text');
    const loadingOverlay = document.getElementById('loading-overlay');

    // ─── OSMD init ─────────────────────────────────────────────────────────
    function initOSMD() {
        osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(renderDiv, {
            backend: 'svg',
            autoResize: false,
            newSystemFromXML: true,
            newPageFromXML: true,
            drawTitle: true,
            drawComposer: true,
            drawPartNames: true,
            drawMeasureNumbers: true,
            drawLyrics: true,
            drawSlurs: true,
            drawCredits: true,
            drawFingerings: true,
            drawingParameters: 'default',
            coloringEnabled: true,
            colorStemsLikeNoteheads: true
        });
        highlightCtx = canvas.getContext('2d');
        updateStatus('Editor Ready');
    }

    // ─── Helper: DFS to find all GraphicalNote objects (proven approach from renderer.html) ──
    function findGraphicalNotes(obj, visited, results) {
        if (!obj || typeof obj !== 'object') return results;
        if (visited.has(obj)) return results;
        visited.add(obj);

        const srcNote = obj.sourceNote || obj.SourceNote;
        const bbox = obj.positionAndShape || obj.PositionAndShape;

        if (srcNote && bbox && (bbox.absolutePosition || bbox.AbsolutePosition)) {
            results.push(obj);
            return results;
        }

        if (obj instanceof HTMLElement || obj instanceof SVGElement || obj instanceof Node) return results;
        if (Array.isArray(obj)) {
            for (let i = 0; i < obj.length; i++) {
                findGraphicalNotes(obj[i], visited, results);
            }
        } else {
            for (let key of Object.keys(obj)) {
                findGraphicalNotes(obj[key], visited, results);
            }
        }
        return results;
    }

    // ─── Helper: Extract SVG elements from a GraphicalNote ──
    function getSvgElements(gNote) {
        const svgs = [];
        if (!gNote) return svgs;
        const vfnotes = gNote.vfnote;
        if (!vfnotes) return svgs;
        const arr = Array.isArray(vfnotes) ? vfnotes : [vfnotes];
        for (let i = 0; i < arr.length; i++) {
            const vf = arr[i];
            if (!vf) continue;
            let el = null;
            if (typeof vf.getSVGGElement === 'function') {
                el = vf.getSVGGElement();
            } else if (vf.getAttribute && typeof vf.getAttribute === 'function') {
                el = vf.getAttribute('el');
            }
            if (el) svgs.push(el);
        }
        return svgs;
    }

    function getFractionValue(fraction) {
        if (!fraction) return 0;
        if (typeof fraction.RealValue === 'number') return fraction.RealValue;
        if (typeof fraction.realValue === 'number') return fraction.realValue;
        if (fraction.numerator !== undefined && fraction.denominator !== undefined)
            return fraction.numerator / fraction.denominator;
        return 0;
    }

    // ─── Load & render ─────────────────────────────────────────────
    async function loadScore(musicXml, tpq, preserveDoc) {
        if (tpq !== undefined) currentTpq = tpq;
        if (!osmd) initOSMD();

        try {
            loadingOverlay.classList.remove('hidden');

            if (!preserveDoc || !xmlDoc) {
                // Parse the XML DOM from the string
                xmlDoc = new DOMParser().parseFromString(musicXml, 'text/xml');

                // Check for XML parse errors
                var parseError = xmlDoc.querySelector('parsererror');
                if (parseError) {
                    console.error('XML parse error:', parseError.textContent);
                    updateStatus('Error: Invalid XML');
                    loadingOverlay.classList.add('hidden');
                    return;
                }

                // Stamp stable IDs on XML notes that don't already have one.
                stampNoteIds();
            }

            // Strip data-vx-id attributes before passing to OSMD.
            var cleanXml = sanitizeMusicXmlString(new XMLSerializer().serializeToString(xmlDoc));

            await osmd.load(cleanXml);
            osmd.zoom = 0.55;
            osmd.render();

            resizeCanvas();
            buildNoteMap();

            loadingOverlay.classList.add('hidden');
            updateStatus('Score loaded – ' + noteMap.size + ' notes – tap to edit');

            // Re-draw selection highlight if a note was previously selected
            if (selectedNoteId !== null) {
                var entry = noteMap.get(selectedNoteId);
                if (entry && entry.coord) {
                    drawHighlight(entry.coord.x, entry.coord.y, entry.coord.w, entry.coord.h);
                } else {
                    clearHighlights();
                }
            } else {
                clearHighlights();
            }

        } catch (err) {
            console.error('OSMD load error:', err);
            updateStatus('Error: ' + err.message);
            loadingOverlay.classList.add('hidden');
        }
    }

    // Load a base64‑encoded MusicXML string, decode it and forward to loadScore
    function loadScoreBase64(b64) {
        try {
            const xmlStr = atob(b64);
            loadScore(xmlStr);
        } catch (e) {
            console.error('Base64 decoding failed:', e);
            updateStatus('Error decoding MusicXML');
        }
    }

    // ─── Stamp stable IDs ──────────────────────────────────────────
    // Assigns data-vx-id to each non-rest <note> element in the XML DOM.
    function stampNoteIds() {
        if (!xmlDoc) return;
        let maxId = -1;
        var allNoteEls = xmlDoc.getElementsByTagName('note');
        for (let i = 0; i < allNoteEls.length; i++) {
            var existing = allNoteEls[i].getAttribute('data-vx-id');
            if (existing !== null) {
                var parsed = parseInt(existing, 10);
                if (!isNaN(parsed) && parsed > maxId) maxId = parsed;
            }
        }
        var nextId = maxId + 1;

        // Stamp only notes that don't already have an ID
        for (let i = 0; i < allNoteEls.length; i++) {
            var noteEl = allNoteEls[i];
            if (noteEl.getElementsByTagName('rest').length > 0) continue; // skip rests
            if (noteEl.getAttribute('data-vx-id') !== null) continue; // already stamped
            noteEl.setAttribute('data-vx-id', String(nextId++));
        }
    }

    // ─── Pitch, Voice and Measure Key Helpers ──────────────────────
    function getPitchKeyFromPitchObj(pitch) {
        if (!pitch) return "UNKNOWN";
        var step = "C";
        if (typeof pitch.step === 'string') step = pitch.step.toUpperCase();
        else if (typeof pitch.Step === 'string') step = pitch.Step.toUpperCase();
        else if (typeof pitch.fundamentalNote === 'number') {
            var map = ["C", "D", "E", "F", "G", "A", "B"];
            step = map[(pitch.fundamentalNote % 7 + 7) % 7] || "C";
        } else if (typeof pitch.FundamentalNote === 'number') {
            var map = ["C", "D", "E", "F", "G", "A", "B"];
            step = map[(pitch.FundamentalNote % 7 + 7) % 7] || "C";
        }

        var alter = 0;
        if (typeof pitch.alter === 'number') alter = Math.round(pitch.alter);
        else if (typeof pitch.Alter === 'number') alter = Math.round(pitch.Alter);

        var octave = 4;
        if (typeof pitch.octave === 'number') octave = pitch.octave;
        else if (typeof pitch.Octave === 'number') octave = pitch.Octave;

        return step + "_" + alter + "_" + octave;
    }

    function getPitchKeyFromXmlNote(noteEl) {
        var pitchEl = noteEl.getElementsByTagName('pitch')[0];
        if (!pitchEl) return "REST";

        var stepEl = pitchEl.getElementsByTagName('step')[0];
        var step = stepEl ? stepEl.textContent.trim().toUpperCase() : "C";
        step = step.charAt(0);

        var alterEl = pitchEl.getElementsByTagName('alter')[0];
        var alter = alterEl ? parseInt(alterEl.textContent.trim(), 10) || 0 : 0;

        var octaveEl = pitchEl.getElementsByTagName('octave')[0];
        var octave = octaveEl ? parseInt(octaveEl.textContent.trim(), 10) || 4 : 4;

        return step + "_" + alter + "_" + octave;
    }

    function getVoiceFromXmlNote(noteEl) {
        var vEl = noteEl.getElementsByTagName('voice')[0];
        return vEl ? (parseInt(vEl.textContent.trim(), 10) || 1) : 1;
    }

    function getVoiceFromSrcNote(srcNote) {
        if (!srcNote) return 1;
        if (srcNote.voice && typeof srcNote.voice.VoiceId === 'number') return srcNote.voice.VoiceId;
        if (srcNote.Voice && typeof srcNote.Voice.VoiceId === 'number') return srcNote.Voice.VoiceId;
        if (typeof srcNote.voice === 'number') return srcNote.voice;
        if (typeof srcNote.Voice === 'number') return srcNote.Voice;
        return 1;
    }

    function getMeasureNumberFromXmlNote(noteEl) {
        var parent = noteEl.parentNode;
        while (parent && parent.tagName !== 'measure') {
            parent = parent.parentNode;
        }
        if (parent && parent.getAttribute('number')) {
            var num = parseInt(parent.getAttribute('number'), 10);
            if (!isNaN(num)) return num;
        }
        return 1;
    }

    function getMeasureNumberFromSrcNote(srcNote) {
        if (!srcNote) return 1;
        if (srcNote.SourceMeasure && srcNote.SourceMeasure.MeasureNumber) {
            return srcNote.SourceMeasure.MeasureNumber;
        }
        if (srcNote.sourceMeasure && srcNote.sourceMeasure.MeasureNumber) {
            return srcNote.sourceMeasure.MeasureNumber;
        }
        return 1;
    }

    // ─── Build Note Map (Structural Measure + Voice + Pitch Matching) ──────
    function buildNoteMap() {
        noteMap = new Map();
        noteCoordinates = [];
        allGraphicalNotes = [];

        if (!xmlDoc || !osmd) return;

        // Step 1: Index non-rest XML notes by (measureNum:voice:pitchKey) and (measureNum:voice)
        var xmlPitchBuckets = new Map();
        var xmlVoiceBuckets = new Map();
        var xmlMeasureBuckets = new Map();
        var allXmlNonRestNotes = [];

        var allNoteEls = xmlDoc.getElementsByTagName('note');
        for (let i = 0; i < allNoteEls.length; i++) {
            var noteEl = allNoteEls[i];
            if (noteEl.getElementsByTagName('rest').length > 0) continue; // skip rests

            allXmlNonRestNotes.push(noteEl);

            var mNum = getMeasureNumberFromXmlNote(noteEl);
            var voice = getVoiceFromXmlNote(noteEl);
            var pKey = getPitchKeyFromXmlNote(noteEl);

            var fullKey = mNum + ":" + voice + ":" + pKey;
            var voiceKey = mNum + ":" + voice;

            if (!xmlPitchBuckets.has(fullKey)) xmlPitchBuckets.set(fullKey, []);
            xmlPitchBuckets.get(fullKey).push(noteEl);

            if (!xmlVoiceBuckets.has(voiceKey)) xmlVoiceBuckets.set(voiceKey, []);
            xmlVoiceBuckets.get(voiceKey).push(noteEl);

            if (!xmlMeasureBuckets.has(mNum)) xmlMeasureBuckets.set(mNum, []);
            xmlMeasureBuckets.get(mNum).push(noteEl);
        }

        // Step 2: Find all graphical notes via DFS
        var root = osmd.graphic || osmd.GraphicSheet || osmd.graphicSheet || osmd;
        findGraphicalNotes(root, new Set(), allGraphicalNotes);

        // Step 3: Get coordinate helpers
        var unitToPx = 10;
        if (root && root.rules && root.rules.unitInPixels) unitToPx = root.rules.unitInPixels;
        else if (root && root.Rules && root.Rules.unitInPixels) unitToPx = root.Rules.unitInPixels;
        var zoom = osmd.zoom || 1.0;

        // Step 4: Match each GraphicalNote to its corresponding XML note
        var unmappedCount = 0;
        for (let i = 0; i < allGraphicalNotes.length; i++) {
            var gNote = allGraphicalNotes[i];
            var srcNote = gNote.sourceNote || gNote.SourceNote;
            if (!srcNote) continue;

            var isRest = (typeof srcNote.isRest === 'function') ? srcNote.isRest() : (srcNote.isRest || srcNote.IsRest);
            if (isRest) continue;

            var mNum = getMeasureNumberFromSrcNote(srcNote);
            var voice = getVoiceFromSrcNote(srcNote);
            var pitch = srcNote.pitch || srcNote.Pitch;
            var pKey = getPitchKeyFromPitchObj(pitch);

            var fullKey = mNum + ":" + voice + ":" + pKey;
            var voiceKey = mNum + ":" + voice;

            var xmlNote = null;
            if (xmlPitchBuckets.has(fullKey) && xmlPitchBuckets.get(fullKey).length > 0) {
                xmlNote = xmlPitchBuckets.get(fullKey).shift();
            } else if (xmlVoiceBuckets.has(voiceKey) && xmlVoiceBuckets.get(voiceKey).length > 0) {
                xmlNote = xmlVoiceBuckets.get(voiceKey).shift();
            } else if (xmlMeasureBuckets.has(mNum) && xmlMeasureBuckets.get(mNum).length > 0) {
                xmlNote = xmlMeasureBuckets.get(mNum).shift();
            } else if (unmappedCount < allXmlNonRestNotes.length) {
                xmlNote = allXmlNonRestNotes[unmappedCount++];
            }

            if (!xmlNote) continue;

            var vxIdStr = xmlNote.getAttribute('data-vx-id');
            var vxId = (vxIdStr !== null) ? parseInt(vxIdStr, 10) : i;

            // Compute screen coordinates for click detection
            var coord = null;
            var bbox = gNote.positionAndShape || gNote.PositionAndShape;
            if (bbox) {
                var absPos = bbox.absolutePosition || bbox.AbsolutePosition;
                var size = bbox.size || bbox.Size;
                if (absPos && size) {
                    var x = absPos.x * unitToPx * zoom;
                    var y = absPos.y * unitToPx * zoom;
                    var w = (size.width || size.Width || 1.5) * unitToPx * zoom;
                    var h = (size.height || size.Height || 2) * unitToPx * zoom;

                    var domElements = getSvgElements(gNote);
                    if (domElements.length > 0 && domElements[0]) {
                        try {
                            var rect = domElements[0].getBoundingClientRect();
                            var canvasRect = canvas.getBoundingClientRect();
                            x = rect.left - canvasRect.left;
                            y = rect.top - canvasRect.top;
                            w = rect.width;
                            h = rect.height;
                        } catch (e) {}
                    }

                    var cx = x + w / 2;
                    var cy = y + h / 2;
                    coord = { id: vxId, x: x, y: y, w: w, h: h, cx: cx, cy: cy };
                    noteCoordinates.push(coord);
                }
            }

            // Store in map: vxId → { gNote, srcNote, coord }
            gNote.__vx_id = vxId;
            srcNote.__vx_id = vxId;
            noteMap.set(vxId, { gNote: gNote, srcNote: srcNote, coord: coord });
        }

        console.log('[VoxSight Editor] Note map built: ' + noteMap.size + ' notes mapped structurally');

        // Step 5: Attach click handlers to SVG elements
        setupClickListeners();
    }

    // ─── Click Handlers ─────────────────────────────────────────────
    function setupClickListeners() {
        noteMap.forEach(function(entry, vxId) {
            var svgEls = getSvgElements(entry.gNote);
            for (let j = 0; j < svgEls.length; j++) {
                svgEls[j].style.cursor = 'pointer';
                // Use a closure to capture the correct vxId
                (function(id) {
                    svgEls[j].onclick = function(event) {
                        event.stopPropagation();
                        selectNote(id);
                    };
                })(vxId);
            }
        });
    }

    // Fallback: click anywhere on the score container → find nearest note
    scoreContainer.onclick = function(event) {
        if (noteCoordinates.length === 0) return;

        var rect = canvas.getBoundingClientRect();
        var clickX = event.clientX - rect.left;
        var clickY = event.clientY - rect.top;

        var minDist = Infinity;
        var bestId = null;
        for (let i = 0; i < noteCoordinates.length; i++) {
            var nc = noteCoordinates[i];
            var dist = Math.sqrt((clickX - nc.cx) * (clickX - nc.cx) + (clickY - nc.cy) * (clickY - nc.cy));
            if (dist < minDist) {
                minDist = dist;
                bestId = nc.id;
            }
        }
        // Only select if reasonably close
        if (bestId !== null && minDist < 80) {
            selectNote(bestId);
        }
    };

    // ─── Note Selection (sends info to Android bridge) ──────────────
    function selectNote(vxId) {
        selectedNoteId = vxId;
        var entry = noteMap.get(vxId);
        if (!entry) {
            console.warn('[VoxSight Editor] selectNote: vxId', vxId, 'not in noteMap');
            return;
        }

        // Draw highlight
        if (entry.coord) {
            drawHighlight(entry.coord.x, entry.coord.y, entry.coord.w, entry.coord.h);
        }

        // Extract note properties directly from XML DOM (100% ground truth)
        var xmlNoteEl = getXmlNoteElement(vxId);
        var pitchStep = 'C', alterVal = 0, octaveVal = 4;
        var durationType = 'quarter';
        var voiceId = 1;
        var measureNum = 1;

        if (xmlNoteEl) {
            var pitchEl = xmlNoteEl.getElementsByTagName('pitch')[0];
            if (pitchEl) {
                var stepEl = pitchEl.getElementsByTagName('step')[0];
                if (stepEl && stepEl.textContent.trim()) {
                    pitchStep = stepEl.textContent.trim().toUpperCase().charAt(0);
                }
                var alterEl = pitchEl.getElementsByTagName('alter')[0];
                if (alterEl && alterEl.textContent.trim()) {
                    alterVal = parseFloat(alterEl.textContent.trim()) || 0;
                }
                var octEl = pitchEl.getElementsByTagName('octave')[0];
                if (octEl && octEl.textContent.trim()) {
                    octaveVal = parseInt(octEl.textContent.trim(), 10) || 4;
                }
            }

            var typeEl = xmlNoteEl.getElementsByTagName('type')[0];
            if (typeEl && typeEl.textContent.trim()) {
                durationType = typeEl.textContent.trim().toLowerCase();
            }

            var voiceEl = xmlNoteEl.getElementsByTagName('voice')[0];
            if (voiceEl && voiceEl.textContent.trim()) {
                voiceId = parseInt(voiceEl.textContent.trim(), 10) || 1;
            }

            var measEl = xmlNoteEl.parentNode;
            while (measEl && measEl.tagName !== 'measure') measEl = measEl.parentNode;
            if (measEl && measEl.getAttribute('number')) {
                measureNum = parseInt(measEl.getAttribute('number'), 10) || 1;
            }
        } else {
            // Fallback from OSMD SourceNote
            var srcNote = entry.srcNote;
            var pitch = srcNote ? (srcNote.pitch || srcNote.Pitch) : null;
            if (pitch) {
                pitchStep = pitch.step || pitch.Step || 'C';
                if (typeof pitch.alter === 'number') alterVal = pitch.alter;
                else if (typeof pitch.Alter === 'number') alterVal = pitch.Alter;
                octaveVal = (pitch.octave !== undefined) ? pitch.octave : (pitch.Octave || 4);
            }
        }

        console.log('[VoxSight Editor] Note selected: vxId=' + vxId + ' pitch=' + pitchStep + alterVal + ' oct=' + octaveVal + ' dur=' + durationType + ' voice=' + voiceId + ' measure=' + measureNum);

        // Send to Android
        if (window.VoxSightBridge) {
            window.VoxSightBridge.onNoteSelected(
                vxId, pitchStep, alterVal, octaveVal,
                durationType, voiceId, measureNum
            );
        }
    }

    // ─── XML Mutation API (called from Android via evaluateJavascript) ────
    // Looks up the XML <note> element by its stable data-vx-id attribute.
    function getXmlNoteElement(noteId) {
        if (!xmlDoc) return null;
        return xmlDoc.querySelector('note[data-vx-id="' + noteId + '"]') || null;
    }

    window.updateNoteVoice = function(noteId, newVoice) {
        var noteEl = getXmlNoteElement(noteId);
        if (!noteEl) { console.warn('updateNoteVoice: note', noteId, 'not found in XML'); return; }

        var voiceEl = noteEl.getElementsByTagName('voice')[0];
        if (!voiceEl) {
            voiceEl = xmlDoc.createElement('voice');
            // Insert before <type> or at end
            var typeEl = noteEl.getElementsByTagName('type')[0];
            if (typeEl) noteEl.insertBefore(voiceEl, typeEl);
            else noteEl.appendChild(voiceEl);
        }
        voiceEl.textContent = newVoice.toString();
        reloadScore();
    };

    window.updateNotePitch = function(noteId, step, alter, octave) {
        var noteEl = getXmlNoteElement(noteId);
        if (!noteEl) { console.warn('updateNotePitch: note', noteId, 'not found in XML'); return; }

        var pitchEl = noteEl.getElementsByTagName('pitch')[0];
        if (!pitchEl) {
            pitchEl = xmlDoc.createElement('pitch');
            noteEl.insertBefore(pitchEl, noteEl.firstChild);
        }

        var stepEl = pitchEl.getElementsByTagName('step')[0];
        if (!stepEl) { stepEl = xmlDoc.createElement('step'); pitchEl.appendChild(stepEl); }
        stepEl.textContent = step.toUpperCase();

        var octaveEl = pitchEl.getElementsByTagName('octave')[0];
        if (!octaveEl) { octaveEl = xmlDoc.createElement('octave'); pitchEl.appendChild(octaveEl); }
        octaveEl.textContent = octave.toString();

        var alterEl = pitchEl.getElementsByTagName('alter')[0];
        if (alter !== 0) {
            if (!alterEl) {
                alterEl = xmlDoc.createElement('alter');
                pitchEl.insertBefore(alterEl, octaveEl);
            }
            alterEl.textContent = alter.toString();
        } else if (alterEl) {
            pitchEl.removeChild(alterEl);
        }

        reloadScore();
    };

    window.updateNoteDuration = function(noteId, typeName) {
        var noteEl = getXmlNoteElement(noteId);
        if (!noteEl) { console.warn('updateNoteDuration: note', noteId, 'not found in XML'); return; }

        // Find divisions for duration calculation
        var divisions = 1;
        var parentMeas = noteEl.parentNode;
        while (parentMeas && parentMeas.tagName !== 'measure') parentMeas = parentMeas.parentNode;
        if (parentMeas) {
            var attrs = parentMeas.getElementsByTagName('attributes');
            for (let a = 0; a < attrs.length; a++) {
                var divEl = attrs[a].getElementsByTagName('divisions')[0];
                if (divEl) { divisions = parseInt(divEl.textContent, 10) || 1; break; }
            }
        }
        if (divisions <= 1) {
            var divEls = xmlDoc.getElementsByTagName('divisions');
            if (divEls.length > 0) divisions = parseInt(divEls[0].textContent, 10) || 1;
        }

        var multipliers = { whole: 4.0, half: 2.0, quarter: 1.0, eighth: 0.5, '16th': 0.25, '32nd': 0.125 };
        var mult = multipliers[typeName.toLowerCase()] || 1.0;
        var newDuration = Math.max(1, Math.round(divisions * mult));

        var durationEl = noteEl.getElementsByTagName('duration')[0];
        if (!durationEl) {
            durationEl = xmlDoc.createElement('duration');
            var pitchEl = noteEl.getElementsByTagName('pitch')[0];
            if (pitchEl && pitchEl.nextSibling) noteEl.insertBefore(durationEl, pitchEl.nextSibling);
            else noteEl.appendChild(durationEl);
        }
        durationEl.textContent = newDuration.toString();

        var typeEl = noteEl.getElementsByTagName('type')[0];
        if (!typeEl) {
            typeEl = xmlDoc.createElement('type');
            var voiceEl = noteEl.getElementsByTagName('voice')[0];
            if (voiceEl && voiceEl.nextSibling) noteEl.insertBefore(typeEl, voiceEl.nextSibling);
            else if (durationEl.nextSibling) noteEl.insertBefore(typeEl, durationEl.nextSibling);
            else noteEl.appendChild(typeEl);
        }
        typeEl.textContent = typeName.toLowerCase();

        reloadScore();
    };

    window.deleteNote = function(noteId) {
        var noteEl = getXmlNoteElement(noteId);
        if (!noteEl) { console.warn('deleteNote: note', noteId, 'not found in XML'); return; }

        var isBaseNote = (noteEl.getElementsByTagName('chord').length === 0);
        var nextNote = noteEl.nextElementSibling;
        while (nextNote && nextNote.tagName !== 'note') {
            nextNote = nextNote.nextElementSibling;
        }

        // If we delete the base note of a chord, the next note in the chord MUST drop its <chord/> tag
        // so it becomes a valid standalone base note in MusicXML.
        if (isBaseNote && nextNote && nextNote.getElementsByTagName('chord').length > 0) {
            var chordTag = nextNote.getElementsByTagName('chord')[0];
            if (chordTag) nextNote.removeChild(chordTag);
        }

        if (noteEl.parentNode) noteEl.parentNode.removeChild(noteEl);
        selectedNoteId = null;
        reloadScore();
    };

    // ─── XML Serialization & Sanitization ─────────────────────────────────
    function sanitizeMusicXmlString(xmlString) {
        if (!xmlString) return '';
        return xmlString
            .replace(/\s+xmlns=""/g, '')
            .replace(/\s+xmlns="http:\/\/www\.w3\.org\/1999\/xhtml"/g, '')
            .replace(/\s+data-vx-id="[^"]*"/g, '');
    }

    function reloadScore() {
        loadScore('', currentTpq, true);
    }

    window.getModifiedXml = function() {
        if (!xmlDoc) return '';
        var serializer = new XMLSerializer();
        var rawXml = serializer.serializeToString(xmlDoc);
        return sanitizeMusicXmlString(rawXml);
    };

    // ─── Highlight rendering ────────────────────────────────────────────────
    function resizeCanvas() {
        var osmdDiv = document.getElementById('osmd-render');
        canvas.width = osmdDiv.offsetWidth;
        canvas.height = osmdDiv.offsetHeight;
    }

    function drawHighlight(x, y, w, h) {
        if (!highlightCtx) return;
        highlightCtx.clearRect(0, 0, canvas.width, canvas.height);
        highlightCtx.save();
        highlightCtx.beginPath();
        var cx = x + w / 2, cy = y + h / 2;
        var rx = w * 1.5, ry = h * 1.5;
        highlightCtx.ellipse(cx, cy, rx, ry, 0, 0, 2 * Math.PI);
        highlightCtx.fillStyle = 'rgba(56, 189, 248, 0.25)';
        highlightCtx.fill();
        highlightCtx.strokeStyle = '#38bdf8';
        highlightCtx.lineWidth = 2;
        highlightCtx.stroke();
        highlightCtx.restore();
    }

    function clearHighlights() {
        if (highlightCtx) highlightCtx.clearRect(0, 0, canvas.width, canvas.height);
    }

    window.clearHighlights = clearHighlights;

    function updateStatus(msg) { statusText.textContent = msg; }

    var resizeTimer = null;
    window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
            resizeCanvas();
            buildNoteMap();
            if (selectedNoteId !== null) {
                var entry = noteMap.get(selectedNoteId);
                if (entry && entry.coord) {
                    drawHighlight(entry.coord.x, entry.coord.y, entry.coord.w, entry.coord.h);
                }
            }
        }, 300);
    });

    initOSMD();
    </script>
</body>
</html>
