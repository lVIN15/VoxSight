            showCurvesGroup: true,
            showVoiceGroup: true,
            showActionsGroup: true,
            lastSelectedToolGroup: 'notes'
        };

        window.applyEditorPreferences = function (prefJson) {
            try {
                var prefs = typeof prefJson === 'string' ? JSON.parse(prefJson) : prefJson;
                if (!prefs) return;
                window.editorPreferences = Object.assign({}, window.editorPreferences, prefs);
                var body = document.body;
                if (!body) return;

                // 1. Performance Profile
                var isPerf = (window.editorPreferences.performanceProfile === 'performance');
                if (isPerf) {
                    body.classList.add('performance-mode');
                } else {
                    body.classList.remove('performance-mode');
                }

                // 2. Toolbar Density
                if (window.editorPreferences.toolbarDensity === 'comfortable') {
                    body.classList.add('density-comfortable');
                    body.classList.remove('density-compact');
                } else {
                    body.classList.add('density-compact');
                    body.classList.remove('density-comfortable');
                }

                // 3. Tool Labels
                if (window.editorPreferences.showToolLabels === false) {
                    body.classList.add('hide-tool-labels');
                } else {
                    body.classList.remove('hide-tool-labels');
                }

                // 4. Notation Display Toggles
                if (window.editorPreferences.showLyrics === false) {
                    body.classList.add('hide-lyrics');
                } else {
                    body.classList.remove('hide-lyrics');
                }

                if (window.editorPreferences.showVoiceLabels === false) {
                    body.classList.add('hide-voice-labels');
                } else {
                    body.classList.remove('hide-voice-labels');
                }

                if (window.editorPreferences.showMeasureNumbers === false) {
                    body.classList.add('hide-measure-numbers');
                } else {
                    body.classList.remove('hide-measure-numbers');
                }

                // 5. Individual Tool Groups Visibility
                function setGroupVis(groupId, dividerId, isVis) {
                    var grp = document.getElementById(groupId);
                    var div = dividerId ? document.getElementById(dividerId) : null;
                    if (grp) grp.style.display = (isVis !== false) ? '' : 'none';
                    if (div) div.style.display = (isVis !== false) ? '' : 'none';
                }

                setGroupVis('deck-group-notes', 'deck-divider-notes', window.editorPreferences.showNotesGroup);
                setGroupVis('deck-group-rests', 'deck-divider-rests', window.editorPreferences.showRestsGroup);
                setGroupVis('deck-group-mod', 'deck-divider-mod', window.editorPreferences.showModGroup);
                setGroupVis('deck-group-curves', 'deck-divider-curves', window.editorPreferences.showCurvesGroup);
                setGroupVis('deck-group-voice', 'deck-divider-voice', window.editorPreferences.showVoiceGroup);
                setGroupVis('deck-group-actions', null, window.editorPreferences.showActionsGroup);

                // 6. Score Scaling
                if (window.editorPreferences.scoreScaling === 'fit_page' && typeof window.calculateFitToPageZoom === 'function') {
                    applyZoom(window.calculateFitToPageZoom());
                } else if (window.editorPreferences.scoreScaling === 'fit_width' && typeof window.calculateFitToWidthZoom === 'function') {
                    applyZoom(window.calculateFitToWidthZoom());
                }

                // 7. Auto collapse deck state sync
                if (selectedNoteId === null || selectedNoteId === undefined) {
                    updateDeckUI(null);
                }
            } catch (e) {
                console.warn('[VoxSight Editor] applyEditorPreferences error:', e);
            }
        };

        // ─── Soundslice Deck Controller & Navigation ────────────────────────
        let isPianoOpen = false;

        function updateDeckUI(noteId) {
            var deck = document.getElementById('soundslice-deck');
            if (!deck) return;
            if (noteId === null || noteId === undefined) {
                if (window.editorPreferences && window.editorPreferences.autoCollapseDeck === false) {
                    deck.classList.add('visible');
                    var pitchBadge = document.getElementById('deck-note-pitch');
                    var measBadge = document.getElementById('deck-note-meas');
                    var voiceBadge = document.getElementById('deck-note-voice');
                    if (pitchBadge) { pitchBadge.textContent = '--'; pitchBadge.style.background = '#9CA3AF'; }
                    if (measBadge) measBadge.textContent = 'M.--';
                    if (voiceBadge) { voiceBadge.textContent = '--'; voiceBadge.className = 'deck-voice-badge'; }
                } else {
                    deck.classList.remove('visible');
                }
                return;
            }
            deck.classList.add('visible');

            var noteEl = getXmlNoteElement(noteId);
            var pitchBadge = document.getElementById('deck-note-pitch');
            var measBadge = document.getElementById('deck-note-meas');
            var voiceBadge = document.getElementById('deck-note-voice');

            if (!noteEl) {
                if (pitchBadge) pitchBadge.textContent = '--';
                return;
            }

            var isR = (noteEl.getElementsByTagName('rest').length > 0);
            var pEl = noteEl.getElementsByTagName('pitch')[0];
            var step = 'C', oct = 4, alt = 0;
            if (pEl) {
                step = (pEl.getElementsByTagName('step')[0] ? pEl.getElementsByTagName('step')[0].textContent.trim().toUpperCase() : 'C');
                oct = parseInt(pEl.getElementsByTagName('octave')[0] ? pEl.getElementsByTagName('octave')[0].textContent.trim() : '4', 10) || 4;
                alt = parseInt(pEl.getElementsByTagName('alter')[0] ? pEl.getElementsByTagName('alter')[0].textContent.trim() : '0', 10) || 0;
            }

            if (pitchBadge) {
                if (isR) {
                    var rEl = noteEl.getElementsByTagName('rest')[0];
                    var isWholeMeas = (rEl && rEl.getAttribute('measure') === 'yes');
                    pitchBadge.textContent = isWholeMeas ? 'Rest (Bar)' : 'Rest';
                    pitchBadge.style.background = '#64748B';
                } else {
                    var altSym = alt === 1 ? '♯' : (alt === -1 ? '♭' : '');
                    pitchBadge.textContent = step + altSym + oct;
                    pitchBadge.style.background = '#5B2D8E';
                }
            }

            var meas = noteEl.parentNode;
            while (meas && meas.tagName !== 'measure') meas = meas.parentNode;
            var mNum = meas ? (meas.getAttribute('number') || '1') : '1';
            if (measBadge) measBadge.textContent = 'M.' + mNum;

            var vEl = noteEl.getElementsByTagName('voice')[0];
            var vNum = vEl ? vEl.textContent.trim() : '1';
            var customVoice = noteEl.getAttribute('data-vx-voice');
            var voiceLabel = customVoice ? customVoice : (vNum === '1' ? 'S' : (vNum === '2' ? 'A' : (vNum === '3' ? 'T' : (vNum === '4' ? 'B' : 'V' + vNum))));
            if (voiceBadge) {
                voiceBadge.textContent = voiceLabel;
                voiceBadge.className = 'deck-voice-badge';
                if (voiceLabel.startsWith('S')) voiceBadge.classList.add('voice-s');
                else if (voiceLabel.startsWith('A')) voiceBadge.classList.add('voice-a');
                else if (voiceLabel.startsWith('T')) voiceBadge.classList.add('voice-t');
                else if (voiceLabel.startsWith('B')) voiceBadge.classList.add('voice-b');
                else voiceBadge.classList.add('voice-other');
            }

            // Update duration buttons active state
            var tEl = noteEl.getElementsByTagName('type')[0];
            var curType = tEl ? tEl.textContent.trim().toLowerCase() : '';
            var glyphBtns = deck.querySelectorAll('.deck-glyph-btn[data-type]');
            glyphBtns.forEach(function(btn) {
                if (btn.getAttribute('data-type') === curType && !isR) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // Update accidental buttons active state
            var bSharp = document.getElementById('deck-btn-sharp');
            var bFlat = document.getElementById('deck-btn-flat');
            var bNat = document.getElementById('deck-btn-natural');
            var bDot = document.getElementById('deck-btn-dot');

            if (bSharp) bSharp.classList.toggle('active', alt === 1);
            if (bFlat) bFlat.classList.toggle('active', alt === -1);
            if (bNat) bNat.classList.toggle('active', alt === 0 && !isR);
            if (bDot) bDot.classList.toggle('active', noteEl.getElementsByTagName('dot').length > 0);

            // Update Slur & Tie buttons active state
            var notatEl = noteEl.getElementsByTagName('notations')[0];
            var hasSlur = notatEl && notatEl.getElementsByTagName('slur').length > 0;
            var hasTie = (noteEl.getElementsByTagName('tie').length > 0) || (notatEl && notatEl.getElementsByTagName('tied').length > 0);
            var bSlur = document.getElementById('deck-btn-slur');
            var bTie = document.getElementById('deck-btn-tie');
            if (bSlur) bSlur.classList.toggle('active', !!hasSlur);
            if (bTie) bTie.classList.toggle('active', !!hasTie);
        }
        window.updateDeckUI = updateDeckUI;

        // ─── Soundslice Sequential Note Stepper (◀ Prev / Next ▶) ─────────
        function getOrderedNoteIds() {
            var ids = [];
            if (!xmlDoc) return ids;
            var parts = xmlDoc.getElementsByTagName('part');
            for (var p = 0; p < parts.length; p++) {
                var measures = parts[p].getElementsByTagName('measure');
                for (var m = 0; m < measures.length; m++) {
                    var notes = measures[m].getElementsByTagName('note');
                    for (var n = 0; n < notes.length; n++) {
                        var idStr = notes[n].getAttribute('data-vx-id');
                        if (idStr) {
                            var id = parseInt(idStr, 10);
                            if (!isNaN(id) && ids.indexOf(id) === -1) {
                                ids.push(id);
                            }
                        }
                    }
                }
            }
            return ids;
        }

        function stepNote(direction) {
            var list = getOrderedNoteIds();
            if (list.length === 0) return;

            var curIdx = (selectedNoteId !== null) ? list.indexOf(selectedNoteId) : -1;
            var nextIdx = 0;
            if (curIdx === -1) {
                nextIdx = (direction > 0) ? 0 : (list.length - 1);
            } else {
                nextIdx = curIdx + direction;
                if (nextIdx < 0) nextIdx = 0;
                if (nextIdx >= list.length) nextIdx = list.length - 1;
            }

            var targetId = list[nextIdx];
            selectNote(targetId);

            // Smooth scroll into view if offscreen
            var targetCoord = null;
            for (var i = 0; i < noteCoordinates.length; i++) {
                if (noteCoordinates[i].id === targetId) {
                    targetCoord = noteCoordinates[i];
                    break;
                }
            }
            if (targetCoord && scoreContainer) {
                if (!window.editorPreferences || window.editorPreferences.autoScrollToNote !== false) {
                    var cTop = scoreContainer.scrollTop;
                    var cHeight = scoreContainer.clientHeight;
                    if (targetCoord.cy < cTop + 60 || targetCoord.cy > cTop + cHeight - 120) {
                        var isPerf = (window.editorPreferences && window.editorPreferences.performanceProfile === 'performance');
                        scoreContainer.scrollTo({
                            top: Math.max(0, targetCoord.cy - cHeight / 2),
                            behavior: isPerf ? 'auto' : 'smooth'
                        });
                    }
                }
            }
        }
        window.stepNote = stepNote;

        // ─── Visual Mini-Piano Strip Controller ────────────────────────
        function togglePianoStrip() {
            var strip = document.getElementById('soundslice-piano-strip');
            var btn = document.getElementById('deck-btn-piano');
            isPianoOpen = !isPianoOpen;
            if (strip) strip.classList.toggle('open', isPianoOpen);
            if (btn) btn.classList.toggle('active', isPianoOpen);
            if (isPianoOpen) buildPianoKeys();
        }
        window.togglePianoStrip = togglePianoStrip;

        function buildPianoKeys() {
            var track = document.getElementById('piano-keys-track');
            if (!track || track.children.length > 0) return;

            // 2 Octaves: C3 to B4
            var whiteNotes = [
                { step: 'C', oct: 3 }, { step: 'D', oct: 3 }, { step: 'E', oct: 3 }, { step: 'F', oct: 3 }, { step: 'G', oct: 3 }, { step: 'A', oct: 3 }, { step: 'B', oct: 3 },
                { step: 'C', oct: 4 }, { step: 'D', oct: 4 }, { step: 'E', oct: 4 }, { step: 'F', oct: 4 }, { step: 'G', oct: 4 }, { step: 'A', oct: 4 }, { step: 'B', oct: 4 },
                { step: 'C', oct: 5 }
            ];

            var blackKeysData = [
                { step: 'C', alt: 1, oct: 3, wIdx: 0 },
                { step: 'D', alt: 1, oct: 3, wIdx: 1 },
                { step: 'F', alt: 1, oct: 3, wIdx: 3 },
                { step: 'G', alt: 1, oct: 3, wIdx: 4 },
                { step: 'A', alt: 1, oct: 3, wIdx: 5 },
                { step: 'C', alt: 1, oct: 4, wIdx: 7 },
                { step: 'D', alt: 1, oct: 4, wIdx: 8 },
                { step: 'F', alt: 1, oct: 4, wIdx: 10 },
                { step: 'G', alt: 1, oct: 4, wIdx: 11 },
                { step: 'A', alt: 1, oct: 4, wIdx: 12 }
            ];

            var whiteKeyWidth = 25;
            whiteNotes.forEach(function(wn, idx) {
                var wKey = document.createElement('div');
                wKey.className = 'piano-white-key';
                wKey.textContent = (wn.step === 'C') ? ('C' + wn.oct) : wn.step;
                wKey.onclick = function() {
                    onPianoKeyClick(wn.step, 0, wn.oct);
                };
                track.appendChild(wKey);
            });

            blackKeysData.forEach(function(bn) {
                var bKey = document.createElement('div');
                bKey.className = 'piano-black-key';
                bKey.style.left = (bn.wIdx * whiteKeyWidth + whiteKeyWidth - 9) + 'px';
                bKey.onclick = function(e) {
                    e.stopPropagation();
                    onPianoKeyClick(bn.step, bn.alt, bn.oct);
                };
                track.appendChild(bKey);
            });
        }

        function onPianoKeyClick(step, alt, oct) {
            if (selectedNoteId === null) return;
            var noteEl = getXmlNoteElement(selectedNoteId);
            if (noteEl && noteEl.getElementsByTagName('rest').length > 0) {
                convertToNote(selectedNoteId, step, alt, oct);
            } else {
                updateNotePitch(selectedNoteId, step, alt, oct);
            }
            var stepOffsets = { 'C': 0, 'D': 2, 'E': 4, 'F': 5, 'G': 7, 'A': 9, 'B': 11 };
            var midi = (oct + 1) * 12 + (stepOffsets[step] || 0) + alt;
            playNotePreview(midi, 180);
            updateStatus('Pitch set to ' + step + (alt === 1 ? '♯' : '') + oct);
        }

        function shiftSelectedNoteOctave(delta) {
            if (selectedNoteId === null) return;
            var noteEl = getXmlNoteElement(selectedNoteId);
            if (!noteEl) return;
            var pEl = noteEl.getElementsByTagName('pitch')[0];
            if (!pEl) return;
            var step = (pEl.getElementsByTagName('step')[0] ? pEl.getElementsByTagName('step')[0].textContent.trim().toUpperCase() : 'C');
            var curOct = parseInt(pEl.getElementsByTagName('octave')[0] ? pEl.getElementsByTagName('octave')[0].textContent.trim() : '4', 10) || 4;
            var curAlt = parseInt(pEl.getElementsByTagName('alter')[0] ? pEl.getElementsByTagName('alter')[0].textContent.trim() : '0', 10) || 0;
            var newOct = Math.max(1, Math.min(7, curOct + delta));
            updateNotePitch(selectedNoteId, step, curAlt, newOct);
            updateStatus('Octave changed to ' + newOct);
        }
        window.shiftSelectedNoteOctave = shiftSelectedNoteOctave;

        // ─── Musical Editing Operations ──────────────────────────────
        function applyDurationTool(typeName, isDotted) {
            if (selectedNoteId === null) return;
            var noteEl = getXmlNoteElement(selectedNoteId);
            if (noteEl && noteEl.getElementsByTagName('rest').length > 0) {
                convertToNote(selectedNoteId, 'C', 0, 4);
            }
            updateNoteDuration(selectedNoteId, typeName, isDotted);
            updateStatus('Duration set to ' + typeName);
        }
        window.applyDurationTool = applyDurationTool;

        function applyRestDurationTool(typeName) {
            if (selectedNoteId === null) return;
            convertToRest(selectedNoteId);
            updateNoteDuration(selectedNoteId, typeName, false);
            updateStatus('Converted to ' + typeName + ' rest');
        }
        window.applyRestDurationTool = applyRestDurationTool;

        function applyWholeMeasureRestTool() {
            if (selectedNoteId === null) return;
            pushUndoSnapshot();
            var noteEl = getXmlNoteElement(selectedNoteId);
            if (!noteEl || !xmlDoc) return;

            var fullDivs = getMeasureDivisions(noteEl) * 4;
            var pitchEl = noteEl.getElementsByTagName('pitch')[0];
            if (pitchEl) noteEl.removeChild(pitchEl);
            var dotEl = noteEl.getElementsByTagName('dot')[0];
            if (dotEl) noteEl.removeChild(dotEl);
            var lyricEl = noteEl.getElementsByTagName('lyric')[0];
            if (lyricEl) noteEl.removeChild(lyricEl);

            var restEl = noteEl.getElementsByTagName('rest')[0];
            if (!restEl) {
                restEl = xmlDoc.createElement('rest');
                noteEl.insertBefore(restEl, noteEl.firstChild);
            }
            restEl.setAttribute('measure', 'yes');

            var durEl = noteEl.getElementsByTagName('duration')[0];
            if (!durEl) {
                durEl = xmlDoc.createElement('duration');
                noteEl.appendChild(durEl);
            }
            durEl.textContent = String(fullDivs);

            var typeEl = noteEl.getElementsByTagName('type')[0];
            if (typeEl) noteEl.removeChild(typeEl);

            reloadScore();
            selectNote(selectedNoteId);
            updateStatus('Set to Whole-Measure Rest');
        }
        window.applyWholeMeasureRestTool = applyWholeMeasureRestTool;

        function applyAccidentalTool(altVal) {
            if (selectedNoteId === null) {
                updateStatus('Select a note first to apply accidental');
                return;
            }
            var noteEl = getXmlNoteElement(selectedNoteId);
            if (!noteEl) return;
            var pEl = noteEl.getElementsByTagName('pitch')[0];
            if (pEl) {
                var step = (pEl.getElementsByTagName('step')[0] ? pEl.getElementsByTagName('step')[0].textContent.trim().toUpperCase() : 'C');
                var oct = parseInt(pEl.getElementsByTagName('octave')[0] ? pEl.getElementsByTagName('octave')[0].textContent.trim() : '4', 10) || 4;
                updateNotePitch(selectedNoteId, step, altVal, oct);
                var sign = altVal === 1 ? '♯' : (altVal === -1 ? '♭' : '♮');
                updateStatus('Applied ' + sign + ' to ' + step + oct);
            }
        }
        window.applyAccidentalTool = applyAccidentalTool;

        function applyDotTool() {
            if (selectedNoteId !== null) {
                toggleSelectedNoteDot();
            } else {
                updateStatus('Select a note first to toggle dot');
            }
        }
        window.applyDotTool = applyDotTool;

        function applyVoiceTool(voiceCode) {
            if (selectedNoteId !== null) {
                updateNoteVoice(selectedNoteId, voiceCode);
                updateStatus('Voice set to ' + voiceCode);
            } else {
                updateStatus('Select a note first to assign voice');
            }
        }
        window.applyVoiceTool = applyVoiceTool;

        // ─── "The Curve Thingy" (Slurs and Ties) ────────────────────────
        function findNextPitchedNote(noteEl) {
            if (!noteEl) return null;
            var vEl = noteEl.getElementsByTagName('voice')[0];
            var voiceNum = vEl ? vEl.textContent.trim() : '1';

            var cur = noteEl.nextElementSibling;
            while (cur) {
                if (cur.tagName === 'note') {
                    var isR = (cur.getElementsByTagName('rest').length > 0);
                    var cv = cur.getElementsByTagName('voice')[0] ? cur.getElementsByTagName('voice')[0].textContent.trim() : '1';
                    if (!isR && cv === voiceNum && cur.getElementsByTagName('pitch').length > 0) {
                        return cur;
                    }
                }
                cur = cur.nextElementSibling;
            }

            var meas = noteEl.parentNode;
            while (meas && meas.tagName !== 'measure') meas = meas.parentNode;
            if (meas) {
                var nextM = meas.nextElementSibling;
                while (nextM && nextM.tagName === 'measure') {
                    var notes = nextM.getElementsByTagName('note');
                    for (var i = 0; i < notes.length; i++) {
                        var n = notes[i];
                        var isR2 = (n.getElementsByTagName('rest').length > 0);
                        var nv = n.getElementsByTagName('voice')[0] ? n.getElementsByTagName('voice')[0].textContent.trim() : '1';
                        if (!isR2 && nv === voiceNum && n.getElementsByTagName('pitch').length > 0) {
                            return n;
                        }
                    }
                    nextM = nextM.nextElementSibling;
                }
            }
            return null;
        }
        window.findNextPitchedNote = findNextPitchedNote;

        function toggleSlur(noteId) {
            var noteEl = getXmlNoteElement(noteId);
            if (!noteEl || !xmlDoc) return;
            pushUndoSnapshot();

            var notatEl = noteEl.getElementsByTagName('notations')[0];
            if (!notatEl) {
                notatEl = xmlDoc.createElement('notations');
                noteEl.appendChild(notatEl);
            }

            var existingSlur = notatEl.getElementsByTagName('slur')[0];
            if (existingSlur) {
                var sNum = existingSlur.getAttribute('number') || '1';
                notatEl.removeChild(existingSlur);

                var parentMeas = noteEl.parentNode;
                while (parentMeas && parentMeas.tagName !== 'measure') parentMeas = parentMeas.parentNode;
                if (parentMeas) {
                    var matches = parentMeas.querySelectorAll('slur[number="' + sNum + '"]');
                    matches.forEach(function(s) {
                        if (s.parentNode) s.parentNode.removeChild(s);
                    });
                }
                updateStatus('Slur curve removed');
            } else {
                var slurStart = xmlDoc.createElement('slur');
                slurStart.setAttribute('type', 'start');
                slurStart.setAttribute('number', '1');
                slurStart.setAttribute('placement', 'above');
                notatEl.appendChild(slurStart);

                var nextNote = findNextPitchedNote(noteEl);
                if (nextNote) {
                    var nextNotat = nextNote.getElementsByTagName('notations')[0];
                    if (!nextNotat) {
                        nextNotat = xmlDoc.createElement('notations');
                        nextNote.appendChild(nextNotat);
                    }
                    var slurStop = xmlDoc.createElement('slur');
                    slurStop.setAttribute('type', 'stop');
                    slurStop.setAttribute('number', '1');
                    nextNotat.appendChild(slurStop);
                }
                updateStatus('Slur curve added');
            }

            reloadScore();
            selectNote(noteId);
        }
        window.toggleSlur = toggleSlur;

        function toggleTie(noteId) {
            var noteEl = getXmlNoteElement(noteId);
            if (!noteEl || !xmlDoc) return;
            pushUndoSnapshot();

            var notatEl = noteEl.getElementsByTagName('notations')[0];
            var existingTie = noteEl.getElementsByTagName('tie')[0];
            var existingTied = notatEl ? notatEl.getElementsByTagName('tied')[0] : null;

            if (existingTie || existingTied) {
                if (existingTie && existingTie.parentNode) existingTie.parentNode.removeChild(existingTie);
                if (existingTied && existingTied.parentNode) existingTied.parentNode.removeChild(existingTied);

                var nextNote = findNextPitchedNote(noteEl);
                if (nextNote) {
                    var nTie = nextNote.getElementsByTagName('tie')[0];
                    var nNotat = nextNote.getElementsByTagName('notations')[0];
                    var nTied = nNotat ? nNotat.getElementsByTagName('tied')[0] : null;
                    if (nTie && nTie.parentNode) nTie.parentNode.removeChild(nTie);
                    if (nTied && nTied.parentNode) nTied.parentNode.removeChild(nTied);
                }
                updateStatus('Tie curve removed');
            } else {
                var tieEl = xmlDoc.createElement('tie');
                tieEl.setAttribute('type', 'start');
                noteEl.appendChild(tieEl);

                if (!notatEl) {
                    notatEl = xmlDoc.createElement('notations');
                    noteEl.appendChild(notatEl);
                }
                var tiedEl = xmlDoc.createElement('tied');
                tiedEl.setAttribute('type', 'start');
                notatEl.appendChild(tiedEl);

                var nextNote = findNextPitchedNote(noteEl);
                if (nextNote) {
                    var nTie2 = xmlDoc.createElement('tie');
                    nTie2.setAttribute('type', 'stop');
                    nextNote.appendChild(nTie2);

                    var nNotat2 = nextNote.getElementsByTagName('notations')[0];
                    if (!nNotat2) {
                        nNotat2 = xmlDoc.createElement('notations');
                        nextNote.appendChild(nNotat2);
                    }
                    var nTied2 = xmlDoc.createElement('tied');
                    nTied2.setAttribute('type', 'stop');
                    nNotat2.appendChild(nTied2);
                }
                updateStatus('Tie curve added');
            }

            reloadScore();
            selectNote(noteId);
        }
        window.toggleTie = toggleTie;

        function applySlurTool() {
            if (selectedNoteId !== null) toggleSlur(selectedNoteId);
            else updateStatus('Select a note first to add a Slur');
        }
        window.applySlurTool = applySlurTool;

        function applyTieTool() {
            if (selectedNoteId !== null) toggleTie(selectedNoteId);
            else updateStatus('Select a note first to add a Tie');
        }
        window.applyTieTool = applyTieTool;


        function initPaletteInteractions() {
            var chips = document.querySelectorAll('.palette-chip');
            paletteDragGhost = document.getElementById('palette-drag-ghost');

            chips.forEach(function(chip) {
                var type = chip.getAttribute('data-type');

                chip.addEventListener('click', function() {
                    chips.forEach(function(c) { c.classList.remove('active'); });
                    chip.classList.add('active');
                    activePaletteType = type;

                    if (selectedNoteId !== null) {
                        if (type === 'rest') {
                            convertToRest(selectedNoteId);
                            updateStatus('Converted to Rest');
                        } else {
                            var noteEl = getXmlNoteElement(selectedNoteId);
                            if (noteEl && noteEl.getElementsByTagName('rest').length > 0) {
                                convertToNote(selectedNoteId, 'C', 0, 4);
                            }
                            updateNoteDuration(selectedNoteId, type, false);
                            updateStatus('Duration updated to ' + type);
                        }
                    }
                });

                var touchStartX = 0, touchStartY = 0;
                var hasLifted = false;

                chip.addEventListener('touchstart', function(e) {
                    if (e.touches.length !== 1) return;
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    hasLifted = false;
                }, { passive: true });

                chip.addEventListener('touchmove', function(e) {
                    if (e.touches.length !== 1) return;
                    var cx = e.touches[0].clientX;
                    var cy = e.touches[0].clientY;
                    var dist = Math.hypot(cx - touchStartX, cy - touchStartY);

                    if (dist > 12 && !hasLifted) {
                        hasLifted = true;
                        isPaletteDragging = true;
                        var glyph = chip.querySelector('.chip-glyph') ? chip.querySelector('.chip-glyph').textContent : '𝅘';
                        var name = chip.querySelector('.chip-name') ? chip.querySelector('.chip-name').textContent : type;
                        if (paletteDragGhost) {
                            var gGlyph = document.getElementById('palette-ghost-glyph');
                            var gType = document.getElementById('palette-ghost-type');
                            if (gGlyph) gGlyph.textContent = glyph;
                            if (gType) gType.textContent = name;
                            paletteDragGhost.classList.add('visible');
                        }
                    }

                    if (hasLifted && paletteDragGhost) {
                        paletteDragGhost.style.left = cx + 'px';
                        paletteDragGhost.style.top = cy + 'px';
                    }
                }, { passive: true });

                chip.addEventListener('touchend', function(e) {
                    if (hasLifted) {
                        hasLifted = false;
                        isPaletteDragging = false;
                        if (paletteDragGhost) paletteDragGhost.classList.remove('visible');

                        var changedTouch = (e.changedTouches && e.changedTouches.length > 0) ? e.changedTouches[0] : null;
                        if (changedTouch) {
                            handlePaletteDropAt(changedTouch.clientX, changedTouch.clientY, type);
                        }
                    }
                });
            });
        }

        function handlePaletteDropAt(clientX, clientY, type) {
            var container = document.getElementById('score-container');
            if (!container) return;
            var r = container.getBoundingClientRect();
            var dropX = clientX - r.left + container.scrollLeft;
            var dropY = clientY - r.top + container.scrollTop;

            var bestDist = 55;
            var bestId = null;
            for (var i = 0; i < noteCoordinates.length; i++) {
                var nc = noteCoordinates[i];
                var d = Math.hypot(nc.cx - dropX, nc.cy - dropY);
                if (d < bestDist) {
                    bestDist = d;
                    bestId = nc.id;
                }
            }

            if (bestId !== null) {
                if (type === 'rest') {
                    convertToRest(bestId);
                    selectNote(bestId);
                    updateStatus('Stamped Rest');
                } else {
                    var noteEl = getXmlNoteElement(bestId);
                    if (noteEl && noteEl.getElementsByTagName('rest').length > 0) {
                        convertToNote(bestId, 'C', 0, 4);
                    }
                    updateNoteDuration(bestId, type, false);
                    selectNote(bestId);
                    updateStatus('Stamped ' + type + ' note');
                }
                playNotePreview(60, 150);
            }
        }

        // ─── Keyboard Shortcuts for Power Users ────────────────────────────────
        window.addEventListener('keydown', function(e) {
            if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;

            if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z')) {
                e.preventDefault();
                undo();
                return;
            }

            if (((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')) ||
                ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'z' || e.key === 'Z'))) {
                e.preventDefault();
                redo();
                return;
            }

            if (e.key === 'Escape') {
                clearHighlights();
                selectedNoteId = null;
                return;
            }

            if (selectedNoteId !== null) {
                if (e.key === 'Delete' || e.key === 'Backspace') {
                    e.preventDefault();
                    deleteSelectedNote();
                    return;
                }

                if (e.key === 'r' || e.key === 'R') {
                    e.preventDefault();
                    toggleSelectedNoteRest();
                    return;
                }

                if (e.key === '.') {
                    e.preventDefault();
                    toggleSelectedNoteDot();
                    return;
                }

                if (e.key === '#' || e.key === '+' || e.key === '=') {
                    e.preventDefault();
                    cycleSelectedNoteAccidental();
                    return;
                }

                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    stepSelectedNotePitch(e.shiftKey ? 7 : 1);
                    return;
                }
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    stepSelectedNotePitch(e.shiftKey ? -7 : -1);
                    return;
                }

                if (e.key === '1') { e.preventDefault(); updateNoteDuration(selectedNoteId, 'whole', false); return; }
                if (e.key === '2') { e.preventDefault(); updateNoteDuration(selectedNoteId, 'half', false); return; }
                if (e.key === '4') { e.preventDefault(); updateNoteDuration(selectedNoteId, 'quarter', false); return; }
                if (e.key === '8') { e.preventDefault(); updateNoteDuration(selectedNoteId, 'eighth', false); return; }
            }
        });

        function stepSelectedNotePitch(stepDelta) {
            if (selectedNoteId === null) return;
            var noteEl = getXmlNoteElement(selectedNoteId);
            if (!noteEl) return;
            var pEl = noteEl.getElementsByTagName('pitch')[0];
            if (!pEl) return;

            var step = (pEl.getElementsByTagName('step')[0] ? pEl.getElementsByTagName('step')[0].textContent.trim().toUpperCase() : 'C');
            var alt = pEl.getElementsByTagName('alter')[0] ? (parseInt(pEl.getElementsByTagName('alter')[0].textContent.trim(), 10) || 0) : 0;
            var oct = parseInt(pEl.getElementsByTagName('octave')[0] ? pEl.getElementsByTagName('octave')[0].textContent.trim() : '4', 10) || 4;

            var sIdx = DIATONIC_STEPS.indexOf(step);
            if (sIdx === -1) sIdx = 0;
            var dIdx = Math.max(14, Math.min(50, oct * 7 + sIdx + stepDelta));
            var newOct = Math.floor(dIdx / 7);
            var newStep = DIATONIC_STEPS[((dIdx % 7) + 7) % 7];

            updateNotePitch(selectedNoteId, newStep, alt, newOct);
            var midi = (newOct + 1) * 12 + (STEP_MIDI_OFFSETS[newStep] || 0) + alt;
            playNotePreview(midi, 120);
        }

        initOSMD();
        initPitchDragging();
        initPaletteInteractions();

        var urlParams = new URLSearchParams(window.location.search);
        var targetFile = urlParams.get('score') || urlParams.get('file');
        if (targetFile) {
            fetch(targetFile).then(function (r) { return r.text(); }).then(function (xml) {
                loadScore(xml);
            }).catch(function (err) {
                console.error('Failed to load file:', err);
                loadingOverlay.classList.add('hidden');
            });
        } else {
            loadingOverlay.classList.add('hidden');
        }
    </script>
