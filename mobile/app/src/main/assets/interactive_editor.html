                var isAlto = !isCondensedPair && (combined.indexOf('alto') !== -1 || combined.indexOf('alt') !== -1 || combined === 'a' || combined === 'a.' || /\ba\b/i.test(combined)) && combined.indexOf('soprano') === -1;
                var isTenor = !isCondensedPair && (combined.indexOf('tenor') !== -1 || combined.indexOf('ten') !== -1 || combined === 't' || combined === 't.' || /\bt\b/i.test(combined)) && combined.indexOf('bass') === -1;
                var isBass = !isCondensedPair && (combined.indexOf('bass') !== -1 || combined.indexOf('bas') !== -1 || combined === 'b' || combined === 'b.' || /\bb\b/i.test(combined)) && combined.indexOf('tenor') === -1;

                    claimedRoles["ALTO"] = true;

                    vocalPartMap[m.index] = { voice: "TENOR", part: "T", color: VOICE_PALETTE.T, partId: 3, participating: ["T"] };
                    claimedRoles["TENOR"] = true;
                } else if (m.isBass) {
                    vocalPartMap[m.index] = { voice: "BASS", part: "B", color: VOICE_PALETTE.B, partId: 4, participating: ["B"] };
                    claimedRoles["BASS"] = true;
                }
            });

            // Pass 2.5: Structural Soloist Detection for >= 5-part vocal ensembles with generic OMR part names
            var hasAssignedSolo = vocalPartMap.some(function(entry) { return entry && entry.part === "SOLO"; });
            var vocalCandidates = meta.filter(function(m) { return !m.isAccomp && m.activeMeasures > 0; });
            if (vocalCandidates.length >= 5 && !hasAssignedSolo) {
                var activeSorted = vocalCandidates.map(function(m) { return m.activeMeasures; }).sort(function(a, b) { return b - a; });
                var mCore = activeSorted[3];
                var coreCandidates = vocalCandidates.filter(function(m) { return mCore < 4 || m.activeMeasures >= mCore * 0.45; });
                var sopranoAnchor = null;
                coreCandidates.forEach(function(m) {
                    if (!m.hasFClef && (!sopranoAnchor || m.avgMidi > sopranoAnchor.avgMidi)) {
                        sopranoAnchor = m;
                    }
                });

                vocalCandidates.forEach(function(m) {
                    if (vocalPartMap[m.index]) return;
                    var isSparseSolo = (mCore >= 4 && m.activeMeasures < mCore * 0.45);
                    var isAboveChoirSolo = Boolean(
                        sopranoAnchor &&
                        m.index < sopranoAnchor.index &&
                        (m.hasFClef || (m.avgMidi > 0 && m.avgMidi < sopranoAnchor.avgMidi - 3.0))
                    );
                    if (isSparseSolo || isAboveChoirSolo) {
                        var remainingVocal = vocalCandidates.filter(function(cand) {
                            return cand.index !== m.index && !(vocalPartMap[cand.index] && vocalPartMap[cand.index].part === "SOLO");
                        }).length;
                        if (remainingVocal >= 4) {
                            vocalPartMap[m.index] = { voice: "SOLO", part: "SOLO", color: VOICE_PALETTE.SOLO, partId: 5, participating: ["SOLO"] };

                });
            }

            // Pass 3: Fill unassigned vocal parts using Clef + Tessitura against unclaimed roles
            var unassigned = meta.filter(function(m) { return !vocalPartMap[m.index]; });
            if (unassigned.length > 0) {
                var unassignedBass = unassigned.filter(function(m) { return m.hasFClef || (m.avgMidi > 0 && m.avgMidi < 60.0); });
                var unassignedTreble = unassigned.filter(function(m) { return !m.hasFClef && (m.avgMidi === 0 || m.avgMidi >= 60.0); });

                unassignedBass.sort(function(a, b) { return b.avgMidi - a.avgMidi; });
                unassignedTreble.sort(function(a, b) { return b.avgMidi - a.avgMidi; });

                unassignedTreble.forEach(function(m) {
                    if (!claimedRoles["SOPRANO"]) {
                        vocalPartMap[m.index] = { voice: "SOPRANO", part: "S", color: VOICE_PALETTE.S, partId: 1, participating: ["S"] };
                        claimedRoles["SOPRANO"] = true;
                    } else if (!claimedRoles["ALTO"]) {
                        vocalPartMap[m.index] = { voice: "ALTO", part: "A", color: VOICE_PALETTE.A, partId: 2, participating: ["A"] };
                        claimedRoles["ALTO"] = true;
                    } else if (unassignedTreble.length >= 3 && unassignedBass.length <= 1 && !claimedRoles["TENOR"]) {
                        vocalPartMap[m.index] = { voice: "TENOR", part: "T", color: VOICE_PALETTE.T, partId: 3, participating: ["T"] };
                        claimedRoles["TENOR"] = true;
                    } else {
                        var role = (m.avgMidi >= 66.5) ? "SOPRANO" : "ALTO";
                        var clr = (role === "SOPRANO") ? VOICE_PALETTE.S : VOICE_PALETTE.A;
                        var pId = (role === "SOPRANO") ? 1 : 2;
                        vocalPartMap[m.index] = { voice: role, part: role[0], color: clr, partId: pId, participating: [role[0]] };
                    }
                });

                unassignedBass.forEach(function(m) {
                    if (unassignedBass.length >= 2 && !claimedRoles["TENOR"]) {
                        vocalPartMap[m.index] = { voice: "TENOR", part: "T", color: VOICE_PALETTE.T, partId: 3, participating: ["T"] };
                        claimedRoles["TENOR"] = true;
                    } else if (unassignedBass.length >= 2 && !claimedRoles["BASS"]) {
                        vocalPartMap[m.index] = { voice: "BASS", part: "B", color: VOICE_PALETTE.B, partId: 4, participating: ["B"] };
                        claimedRoles["BASS"] = true;
                    } else if (claimedRoles["TENOR"] && !claimedRoles["BASS"]) {
                        vocalPartMap[m.index] = { voice: "BASS", part: "B", color: VOICE_PALETTE.B, partId: 4, participating: ["B"] };
                        claimedRoles["BASS"] = true;
                    } else if (claimedRoles["BASS"] && !claimedRoles["TENOR"]) {
                        vocalPartMap[m.index] = { voice: "TENOR", part: "T", color: VOICE_PALETTE.T, partId: 3, participating: ["T"] };
                        claimedRoles["TENOR"] = true;
                    } else {
                        var role = (m.avgMidi > 0 && m.avgMidi < 55.0) ? "BASS" : "TENOR";
                        var clr = (role === "TENOR") ? VOICE_PALETTE.T : VOICE_PALETTE.B;
                        var pId = (role === "TENOR") ? 3 : 4;
                        vocalPartMap[m.index] = { voice: role, part: role[0], color: clr, partId: pId, participating: [role[0]] };
                    }
                });
            }

            return vocalPartMap;
        }

        // ─── Vocal Part Color Coding Helper (SATB - Identical to Playback Mode) ─
        function getVocalPartColor(voiceNum, staffIdx, partIdx, totalParts, chordPos, customVoice, isDivisiChord) {
            function applyInStaffDivisiColor(baseColor) {
                if (!isDivisiChord || (chordPos !== 'top' && chordPos !== 'bottom')) return baseColor;
                var isTop = (chordPos === 'top');
                switch (String(baseColor).toUpperCase()) {
                    case '#E11D48': return isTop ? '#FB7185' : '#881337';
                    case '#8E24AA': return isTop ? '#C084FC' : '#4C1D95';
                    case '#2563EB': return isTop ? '#0284C7' : '#1E3A8A';
                    case '#16A34A': return isTop ? '#65A30D' : '#064E3B';
                    default: return baseColor;
                }
            }
            var isPartSolo = false;
            if (xmlDoc && typeof partIdx === 'number') {
                try {
                    var partsList = xmlDoc.getElementsByTagName('part');
                    if (partsList && partIdx >= 0 && partIdx < partsList.length) {
                        var pElem = partsList[partIdx];
                        var pid = pElem.getAttribute('id');
                        var sp = pid ? xmlDoc.querySelector("score-part[id='" + pid + "']") : null;
                        var pName = (sp && sp.querySelector('part-name')) ? (sp.querySelector('part-name').textContent || '').trim().toLowerCase() : '';
                        var pAbbr = (sp && sp.querySelector('part-abbreviation')) ? (sp.querySelector('part-abbreviation').textContent || '').trim().toLowerCase() : '';
                        var comb = pName + " " + pAbbr;
                        var hasFClef = false;
                        var clefSigns = pElem.querySelectorAll('clef > sign');
                        for (var ci = 0; ci < clefSigns.length; ci++) {

                        }
                        var isSoloNamed = ['solo', 'cantor', 'leader', 'descant'].some(function(w) { return comb.indexOf(w) !== -1; });
                        if (comb.indexOf('baritone') !== -1 || isSoloNamed) {

            if (customVoice !== null && customVoice !== undefined) {

                switch (cv) {
                    case "1": case "S": case "SOPRANO": return "#E11D48";
                    case "S1": case "SOPRANO1": case "SOPRANO 1": return "#FB7185";
                    case "S2": case "SOPRANO2": case "SOPRANO 2": return "#881337";
                    case "2": case "A": case "ALTO": return "#8E24AA";
                    case "A1": case "ALTO1": case "ALTO 1": return "#C084FC";
                    case "A2": case "ALTO2": case "ALTO 2": return "#4C1D95";
                    case "3": case "T": case "TENOR": return "#2563EB";
                    case "T1": case "TENOR1": case "TENOR 1": return "#0284C7";
                    case "T2": case "TENOR2": case "TENOR 2": return "#1E3A8A";
                    case "4": case "B": case "BASS": return "#16A34A";
                    case "B1": case "BASS1": case "BASS 1": return "#65A30D";
                    case "B2": case "BASS2": case "BASS 2": return "#064E3B";
                    case "UNISON_TB": case "TB": return "#0D9488";
                    case "UNISON_SA": case "SA": return "#4F46E5";
                    case "UNISON_S1S2": case "S1S2": return "#E11D48";
                    case "UNISON_A1A2": case "A1A2": return "#8E24AA";
                    case "UNISON_T1T2": case "T1T2": return "#2563EB";
                    case "UNISON_B1B2": case "B1B2": return "#16A34A";
                    case "TUTTI": case "UNISON_ALL": case "ALL": return "#CA8A04";
                    case "5": case "SOLO": case "BARITONE_SOLO": case "BARITONE SOLO": case "BARITONE":
                    case "TENOR SOLO": case "SOPRANO SOLO": case "ALTO SOLO": case "BASS SOLO": return "#FF6D00";
                    case "6": case "OTHERS": case "OTHER": return "#546E7A";
                    default:
                        if (cv !== "") return "#808080";
                        break;
                }
            }

            // Priority 2: Inspect declared Part Name / Abbreviation from <score-part>
            if (isPartSolo) {
                return '#FF6D00'; // Solo - Vivid Tangerine Orange
            }
            if (xmlDoc && typeof partIdx === 'number') {
                try {
                    var partsList = xmlDoc.getElementsByTagName('part');
                    if (partsList && partIdx >= 0 && partIdx < partsList.length) {
                        var pElem = partsList[partIdx];
                        var pid = pElem.getAttribute('id');
                        var sp = pid ? xmlDoc.querySelector("score-part[id='" + pid + "']") : null;
                        var pName = (sp && sp.querySelector('part-name')) ? (sp.querySelector('part-name').textContent || '').trim().toLowerCase() : '';
                        var pAbbr = (sp && sp.querySelector('part-abbreviation')) ? (sp.querySelector('part-abbreviation').textContent || '').trim().toLowerCase() : '';
                        var combinedStr = pName + " " + pAbbr;

                        if (['baritone solo', 'baritone', 'solo', 'cantor', 'leader', 'descant'].some(function(w) { return combinedStr.indexOf(w) !== -1; })) {
                            if (totalParts > 1) {
                                return '#FF6D00'; // Solo - Vivid Tangerine Orange
                            }
                        }
                        if (['piano', 'organ', 'keyboard', 'guitar', 'acc', 'accomp', 'orch', 'strings', 'other'].some(function(w) { return combinedStr.indexOf(w) !== -1; })) {
                            return '#546E7A'; // Others - Slate Grey
                        }

                        // Composite / Condensed Part Check (e.g. "Soprano / Alto", "S/A", "Tenor / Bass", "T/B")
                        var isCondensedSA = ['s/a', 's / a', 'soprano / alto', 'soprano/alto', 'women'].some(function(w) { return combinedStr.indexOf(w) !== -1; });
                        var isCondensedTB = ['t/b', 't / b', 'tenor / bass', 'tenor/bass', 'men'].some(function(w) { return combinedStr.indexOf(w) !== -1; });

                        if (isCondensedSA) {
                            if (chordPos === 'bottom' || voiceNum === 2) {

                            }
                            return '#E11D48'; // Soprano - Crimson Rose
                        }
                        if (isCondensedTB) {
                            if (chordPos === 'bottom' || voiceNum === 2 || voiceNum === 4) {
                                return '#16A34A'; // Bass - Kelly Emerald Green
                            }
                            return '#2563EB'; // Tenor - Royal Cobalt Blue
                        }

                        // Explicit Divisi Part Names checked before generic section strings
                        if (combinedStr.indexOf('soprano 1') !== -1 || combinedStr.indexOf('sopr 1') !== -1 || combinedStr.indexOf('sop 1') !== -1 || combinedStr === 's1' || combinedStr === 's 1') {
                            return '#FB7185'; // Soprano 1
                        }
                        if (combinedStr.indexOf('soprano 2') !== -1 || combinedStr.indexOf('sopr 2') !== -1 || combinedStr.indexOf('sop 2') !== -1 || combinedStr === 's2' || combinedStr === 's 2') {
                            return '#881337'; // Soprano 2
                        }
                        if (combinedStr.indexOf('alto 1') !== -1 || combinedStr.indexOf('alt 1') !== -1 || combinedStr === 'a1' || combinedStr === 'a 1') {
                            return '#C084FC'; // Alto 1
                        }
                        if (combinedStr.indexOf('alto 2') !== -1 || combinedStr.indexOf('alt 2') !== -1 || combinedStr === 'a2' || combinedStr === 'a 2') {
                            return '#4C1D95'; // Alto 2
                        }
                        if (combinedStr.indexOf('tenor 1') !== -1 || combinedStr.indexOf('ten 1') !== -1 || combinedStr === 't1' || combinedStr === 't 1') {
                            return '#0284C7'; // Tenor 1
                        }
                        if (combinedStr.indexOf('tenor 2') !== -1 || combinedStr.indexOf('ten 2') !== -1 || combinedStr === 't2' || combinedStr === 't 2') {
                            return '#1E3A8A'; // Tenor 2
                        }
                        if (combinedStr.indexOf('bass 1') !== -1 || combinedStr.indexOf('bas 1') !== -1 || combinedStr === 'b1' || combinedStr === 'b 1') {
                            return '#65A30D'; // Bass 1
                        }
                        if (combinedStr.indexOf('bass 2') !== -1 || combinedStr.indexOf('bas 2') !== -1 || combinedStr === 'b2' || combinedStr === 'b 2') {
                            return '#064E3B'; // Bass 2
                        }

                        // Pure Single-Voice Part Names (mutually guarded, including single-letter abbreviations)
                        if ((combinedStr.indexOf('soprano') !== -1 || combinedStr.indexOf('sopr') !== -1 || combinedStr.indexOf('sop') !== -1 || /\bs\b/i.test(combinedStr) || combinedStr.trim() === 's' || combinedStr.trim() === 's.') && combinedStr.indexOf('alto') === -1) {
                            return applyInStaffDivisiColor('#E11D48');
                        }
                        if ((combinedStr.indexOf('alto') !== -1 || combinedStr.indexOf('alt') !== -1 || /\ba\b/i.test(combinedStr) || combinedStr.trim() === 'a' || combinedStr.trim() === 'a.') && combinedStr.indexOf('soprano') === -1) {
                            return applyInStaffDivisiColor('#8E24AA');
                        }
                        if ((combinedStr.indexOf('tenor') !== -1 || combinedStr.indexOf('ten') !== -1 || /\bt\b/i.test(combinedStr) || combinedStr.trim() === 't' || combinedStr.trim() === 't.') && combinedStr.indexOf('bass') === -1) {
                            return applyInStaffDivisiColor('#2563EB');
                        }
                        if ((combinedStr.indexOf('bass') !== -1 || combinedStr.indexOf('bas') !== -1 || /\bb\b/i.test(combinedStr) || combinedStr.trim() === 'b' || combinedStr.trim() === 'b.') && combinedStr.indexOf('tenor') === -1) {
                            return applyInStaffDivisiColor('#16A34A');
                        }
                    }
                } catch (e) { }
            }

            // Priority 3: Universal Musical Classifier (Clefs + Tessitura) when names are omitted or generic (Voice, Part...)
            if (xmlDoc && typeof partIdx === 'number') {

            if (totalParts === 4) {
                var p = (typeof partIdx === 'number') ? partIdx : (voiceNum - 1);
                switch (p) {
                    case 0: return applyInStaffDivisiColor('#E11D48'); // Soprano - Crimson Rose
                    case 1: return applyInStaffDivisiColor('#8E24AA'); // Alto - Royal Purple
                    case 2: return applyInStaffDivisiColor('#2563EB'); // Tenor - Royal Cobalt Blue
                    case 3: return applyInStaffDivisiColor('#16A34A'); // Bass - Kelly Emerald Green
                    default: break;
                }

            // 2-part score or 2-staff score (Treble = S/A, Bass = T/B)
            if (totalParts === 2) {
                var isStaff1 = (staffIdx === 0 || partIdx === 0);
                var isStaff2 = (staffIdx === 1 || partIdx === 1);

                if (isStaff1) {
                    if (chordPos === 'bottom') return '#8E24AA'; // Alto - Royal Purple
                    if (chordPos === 'top') return '#E11D48'; // Soprano - Crimson Rose
                    if (voiceNum === 2) return '#8E24AA'; // Alto - Royal Purple
                    return '#E11D48'; // Soprano - Crimson Rose
                } else if (isStaff2) {
                    if (chordPos === 'bottom') return '#16A34A'; // Bass - Kelly Emerald Green
                    if (chordPos === 'top') return '#2563EB'; // Tenor - Royal Cobalt Blue
                    if (voiceNum === 2 || voiceNum === 4) return '#16A34A'; // Bass - Kelly Emerald Green
                    return '#2563EB'; // Tenor - Royal Cobalt Blue
                }
            }

            // Fallback based on voice number
            switch (voiceNum) {
                case 1: return '#E11D48'; // Soprano - Crimson Rose
                case 2: return '#8E24AA'; // Alto - Royal Purple
                case 3: return '#2563EB'; // Tenor - Royal Cobalt Blue
                case 4: return '#16A34A'; // Bass - Kelly Emerald Green
                case 5:
                    // In 2-staff scores (or staffIdx === 1), voice 5 is Tenor (voice 1 on staff 2 in Sibelius)
                    if (staffIdx === 1) return '#2563EB';
                    if (xmlDoc && typeof partIdx === 'number' && xmlDoc._vxVocalPartMap && xmlDoc._vxVocalPartMap[partIdx]) {

                    }
                    return '#FF6D00'; // Solo - Tangerine Orange
                case 6:
                    // In 2-staff scores (or staffIdx === 1), voice 6 is Bass (voice 2 on staff 2 in Sibelius)
                    if (staffIdx === 1) return '#16A34A';
                    return '#546E7A'; // Others - Slate Grey
                default: return '#E11D48';
            }
        }

        // ─── Color Notehead, Stem, Tail/Flag & Beam ─────────────────────
        function applyNoteVoiceColor(gNote, voiceColor) {
            if (!gNote || !voiceColor) return;
            var src = gNote.sourceNote || gNote.SourceNote;
            if (src && (typeof src.isRest === 'function' ? src.isRest() : (src.isRest === true || src.IsRest === true))) {
                return; // Rests are never sung and must NEVER be colored with vocal colors!
            }

            // Set OSMD source note properties
            if (gNote.sourceNote) {
                gNote.sourceNote.NoteheadColor = voiceColor;
                gNote.sourceNote.StemColor = voiceColor;
                gNote.sourceNote.Color = voiceColor;
            }

            var vf = null;
            if (gNote.vfnote && gNote.vfnote.length > 0) vf = gNote.vfnote[0];
            else if (gNote.parentVoiceEntry && gNote.parentVoiceEntry.vfnote && gNote.parentVoiceEntry.vfnote.length > 0) {
                vf = gNote.parentVoiceEntry.vfnote[0];
            }

            if (vf) {
                var vfG = null;
                if (typeof vf.getSVGGElement === 'function') vfG = vf.getSVGGElement();
                else if (vf.getAttribute && typeof vf.getAttribute === 'function') vfG = vf.getAttribute('el');
                else if (vf.elem) vfG = vf.elem;

                if (vfG) {
                    // 1. Color Notehead (.vf-notehead)
                    var nhs = vfG.querySelectorAll ? Array.from(vfG.querySelectorAll('.vf-notehead')) : [];
                    var targetNh = null;
                    if (nhs.length > 1) {
                        nhs.sort(function (a, b) {
                            var rA = a.getBoundingClientRect();
                            var rB = b.getBoundingClientRect();
                            return rB.top - rA.top; // descending Y: lowest pitch first
                        });
                        var nhIdx = (typeof gNote.vfnoteIndex === 'number') ? gNote.vfnoteIndex : 0;
                        targetNh = nhs[Math.min(nhIdx, nhs.length - 1)] || nhs[0];
                    } else if (nhs.length === 1) {
                        targetNh = nhs[0];
                    }

                    if (targetNh) {
                        targetNh.style.fill = voiceColor;
                        targetNh.style.stroke = 'none';
                        targetNh.setAttribute('fill', voiceColor);
                        targetNh.removeAttribute('stroke');
                        var paths = targetNh.querySelectorAll ? targetNh.querySelectorAll('path, ellipse, polygon') : [];
                        for (let p = 0; p < paths.length; p++) {
                            paths[p].style.fill = voiceColor;
                            paths[p].style.stroke = 'none';
                            paths[p].setAttribute('fill', voiceColor);
                            paths[p].removeAttribute('stroke');
                        }

                    // 2. Color Stem (.vf-stem)
                    var stems = vfG.querySelectorAll ? vfG.querySelectorAll('.vf-stem, path.vf-stem, rect.vf-stem, [class*="stem"]') : [];
                    for (let s = 0; s < stems.length; s++) {
                        stems[s].style.stroke = voiceColor;
                        stems[s].style.fill = voiceColor;
                        stems[s].setAttribute('stroke', voiceColor);
                        stems[s].setAttribute('fill', voiceColor);
                    }

                    // 3. Color Flag / Tail (.vf-flag)
                    var flags = vfG.querySelectorAll ? vfG.querySelectorAll('.vf-flag, path.vf-flag, [class*="flag"]') : [];
                    for (let f = 0; f < flags.length; f++) {
                        flags[f].style.stroke = voiceColor;
                        flags[f].style.fill = voiceColor;
                        flags[f].setAttribute('stroke', voiceColor);
                        flags[f].setAttribute('fill', voiceColor);
                        var fPaths = flags[f].querySelectorAll ? flags[f].querySelectorAll('path') : [];
                        for (let fp = 0; fp < fPaths.length; fp++) {
                            fPaths[fp].style.stroke = voiceColor;
                            fPaths[fp].style.fill = voiceColor;
                            fPaths[fp].setAttribute('stroke', voiceColor);
                            fPaths[fp].setAttribute('fill', voiceColor);
                        }
                    }

                    // 4. Color Beam if connected
                    if (vf.beam) {
                        var beamG = (typeof vf.beam.getSVGGElement === 'function') ? vf.beam.getSVGGElement() : (vf.beam.elem || null);
                        if (beamG) {
                            beamG.style.fill = voiceColor;
                            beamG.style.stroke = voiceColor;
                            beamG.setAttribute('fill', voiceColor);
                            beamG.setAttribute('stroke', voiceColor);
                            var bPaths = beamG.querySelectorAll ? beamG.querySelectorAll('path, rect, polygon') : [];
                            for (let bp = 0; bp < bPaths.length; bp++) {
                                bPaths[bp].style.fill = voiceColor;
                                bPaths[bp].style.stroke = voiceColor;
                                bPaths[bp].setAttribute('fill', voiceColor);
                                bPaths[bp].setAttribute('stroke', voiceColor);
                            }
                        }
                    }
                }
            }
        }

        // ─── Build Note Map (100% Deterministic Measure & Timestamp 1:1 Match) ──
        function buildNoteMap() {
            noteMap = new Map();

                    var sVal = parseInt(stavesEl.textContent.trim(), 10);

                var partEl = xmlParts[p];

                var partOffset = partStaffOffsets[p] || 0;

                for (let m = 0; m < measEls.length; m++) {

                    var mNum = parseInt(measEl.getAttribute('number'), 10);
                    if (isNaN(mNum)) mNum = m + 1;

                    // Update divisions statefully across measures within this part
                    var dEl = measEl.getElementsByTagName('divisions')[0];

        // ─── Draggable Stepper Modal (Touch & Mouse) ───
        (function initDraggableStepper() {
            var panel = document.getElementById('multirest-stepper-panel');
            if (!panel) return;

            var isDragging = false;
            var startX, startY, origLeft, origTop;

            function startDrag(e) {
                // Do not drag when clicking inside interactive buttons
                if (e.target.closest('button')) return;

                isDragging = true;
                panel.setAttribute('data-has-dragged', 'true');
                panel.classList.add('dragging');

                var clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
                var clientY = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;

                var r = panel.getBoundingClientRect();
                startX = clientX;
                startY = clientY;
                origLeft = r.left;
                origTop = r.top;

                panel.style.transform = 'none';
                panel.style.left = origLeft + 'px';
                panel.style.top = origTop + 'px';
                panel.style.bottom = 'auto';

                document.addEventListener('mousemove', moveDrag, { passive: false });
                document.addEventListener('mouseup', endDrag);
                document.addEventListener('touchmove', moveDrag, { passive: false });
                document.addEventListener('touchend', endDrag);
            }

            function moveDrag(e) {
                if (!isDragging) return;
                if (e.cancelable) e.preventDefault();

                var clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
                var clientY = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;

                var dx = clientX - startX;
                var dy = clientY - startY;

                var newLeft = origLeft + dx;
                var newTop = origTop + dy;

                var w = panel.offsetWidth || 220;
                var h = panel.offsetHeight || 38;
                var maxL = Math.max(8, window.innerWidth - w - 8);
                var maxT = Math.max(8, window.innerHeight - h - 8);

                newLeft = Math.min(Math.max(8, newLeft), maxL);
                newTop = Math.min(Math.max(8, newTop), maxT);

                panel.style.left = newLeft + 'px';
                panel.style.top = newTop + 'px';
            }

            function endDrag() {
                if (!isDragging) return;
                isDragging = false;
                panel.classList.remove('dragging');

                document.removeEventListener('mousemove', moveDrag);
                document.removeEventListener('mouseup', endDrag);
                document.removeEventListener('touchmove', moveDrag);
                document.removeEventListener('touchend', endDrag);
            }

            panel.addEventListener('mousedown', startDrag);
            panel.addEventListener('touchstart', startDrag, { passive: true });
        })();

        window.adjustMultiRestCount = function (delta) {
            pushUndoSnapshot();
            if (!selectedMultiRest || !xmlDoc) return;
            var mr = selectedMultiRest;
            var oldCount = mr.count;
            var newCount = Math.max(1, oldCount + delta);
            if (newCount === oldCount) return;

            var xmlMIdx = mr.xmlMIdx;
            var startNum = mr.measureNum;
            var savedStaffIdx = mr.staffIndex;
            var countDiff = newCount - oldCount;

            var xmlParts = Array.from(xmlDoc.getElementsByTagName('part'));
            xmlParts.forEach(function (p) {
                var pMeasures = Array.from(p.getElementsByTagName('measure'));
                if (xmlMIdx >= pMeasures.length) return;
                var currM = pMeasures[xmlMIdx];

                // 1. Update <multiple-rest> count
                var mrEl = currM.querySelector('measure-style > multiple-rest');
                if (!mrEl) {
                    var msEl = currM.getElementsByTagName('measure-style')[0];
                    if (!msEl) {
                        var attrEl = currM.getElementsByTagName('attributes')[0];
                        if (!attrEl) {
                            attrEl = xmlDoc.createElement('attributes');
                            currM.insertBefore(attrEl, currM.firstChild);
                        }
                        msEl = xmlDoc.createElement('measure-style');
                        attrEl.appendChild(msEl);
                    }
                    mrEl = xmlDoc.createElement('multiple-rest');
                    msEl.appendChild(mrEl);
                }
                mrEl.textContent = String(newCount);

                // Get rest duration
                var durText = '12';
                var noteEl = currM.getElementsByTagName('note')[0];
                if (noteEl) {
                    var dEl = noteEl.getElementsByTagName('duration')[0];
                    if (dEl && dEl.textContent) durText = dEl.textContent.trim();
                }

                if (countDiff > 0) {
                    // Insert countDiff placeholder measures right after existing rest measures
                    var refNode = (xmlMIdx + oldCount < pMeasures.length) ? pMeasures[xmlMIdx + oldCount] : null;
                    for (var k = 0; k < countDiff; k++) {
                        var pNum = String(startNum + oldCount + k);
                        var placeholderM = xmlDoc.createElement('measure');
                        placeholderM.setAttribute('number', pNum);
                        var nElem = xmlDoc.createElement('note');
                        var rElem = xmlDoc.createElement('rest');
                        rElem.setAttribute('measure', 'yes');
                        var durEl = xmlDoc.createElement('duration');
                        durEl.textContent = durText;
                        nElem.appendChild(rElem);
                        nElem.appendChild(durEl);
                        placeholderM.appendChild(nElem);
                        p.insertBefore(placeholderM, refNode);
                    }
                } else if (countDiff < 0) {
                    // Remove |countDiff| placeholder measures from the end of the rest span
                    var toRemove = Math.abs(countDiff);
                    for (var k = 0; k < toRemove; k++) {
                        var removeIdx = xmlMIdx + oldCount - 1 - k;
                        if (removeIdx > xmlMIdx && removeIdx < pMeasures.length) {
                            p.removeChild(pMeasures[removeIdx]);
                        }
                    }
                }

                // Renumber downstream measures by countDiff
                var updatedMeasures = Array.from(p.getElementsByTagName('measure'));
                for (var smIdx = xmlMIdx + newCount; smIdx < updatedMeasures.length; smIdx++) {
                    var sm = updatedMeasures[smIdx];
                    var smNumRaw = sm.getAttribute('number');
                    if (smNumRaw && /^\d+$/.test(smNumRaw)) {
                        sm.setAttribute('number', String(parseInt(smNumRaw, 10) + countDiff));
                    }
                }
            });

            mr.count = newCount;
            var countDisp = document.getElementById('mr-count-display');
            if (countDisp) countDisp.textContent = String(newCount);

            var savedMNum = startNum;

            reloadScore();

            // Re-select on the exact staff after reload
            setTimeout(function () {
                var found = multiRestMeasures.find(function (item) {
                    return item.measureNum === savedMNum && item.staffIndex === savedStaffIdx;
                });
                if (!found) {
                    found = multiRestMeasures.find(function (item) { return item.measureNum === savedMNum; });
                }
                if (found) {
                    selectMultiRest(found);
                }
            }, 300);
        };

        // ─── Proximity & Layer Hit Testing ──────────────────────────────
        function findNoteAtPoint(clientX, clientY) {
            var clickTarget = document.getElementById('score-container');
            if (!clickTarget) return null;
            var containerRect = clickTarget.getBoundingClientRect();
            var clickX = clientX - containerRect.left + clickTarget.scrollLeft;
            var clickY = clientY - containerRect.top + clickTarget.scrollTop;

            var candidates = [];
            function addCandidate(id) {
                if (!isNaN(id) && noteMap.has(id) && candidates.indexOf(id) === -1) {
                    candidates.push(id);
                }
            }

            // 1. Direct SVG element from point layers
            if (typeof document.elementsFromPoint === 'function') {
                var elements = document.elementsFromPoint(clientX, clientY);
                for (let i = 0; i < elements.length; i++) {
                    var el = elements[i];
                    var matchEl = el.closest ? el.closest('[data-vx-id]') : null;
                    if (matchEl && matchEl.hasAttribute('data-vx-id')) {
                        addCandidate(parseInt(matchEl.getAttribute('data-vx-id'), 10));
                    }
                }
            }

            // 2. Proximity search within 42px
            for (let i = 0; i < noteCoordinates.length; i++) {
                var nc = noteCoordinates[i];
                var dx = nc.cx - clickX;
                var dy = nc.cy - clickY;
                var dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 42) {
                    addCandidate(nc.id);
                }
            }

            if (candidates.length > 0) {
                var bestId = candidates[0];
                var bestDist = Infinity;
                for (let i = 0; i < candidates.length; i++) {
                    var cId = candidates[i];
                    var entry = noteMap.get(cId);
                    if (entry && entry.coord) {
                        var dx = entry.coord.cx - clickX;
                        var dy = entry.coord.cy - clickY;
                        var d = Math.sqrt(dx * dx + dy * dy);
                        if (d < bestDist) {
                            bestDist = d;
                            bestId = cId;
                        }
                    }
                }
                return bestId;
            }
            return null;
        }
        window.findNoteAtPoint = findNoteAtPoint;

        // ─── Click Handlers ─────────────────────────────────────────────
        function setupClickListeners() {
            var clickTarget = document.getElementById('score-container');
            if (clickTarget) {
                clickTarget.onclick = function (e) {
                    // Suppress click immediately following drag-and-drop
                    if (Date.now() - lastPitchDragEndTime < 350) return;

                    var targetEl = e.target;
                    // Ignore clicks on micro-HUD, palette dock, or floating stepper
                    if (targetEl && targetEl.closest && (
                        targetEl.closest('#note-micro-hud') ||
                        targetEl.closest('#soundslice-deck') ||
                        targetEl.closest('#multirest-stepper-panel') ||
                        targetEl.closest('#zoom-controls') ||
                        targetEl.closest('#palette-drag-ghost')
                    )) {
                        return;
                    }

                    var containerRect = clickTarget.getBoundingClientRect();
                    var clickX = e.clientX - containerRect.left + clickTarget.scrollLeft;
                    var clickY = e.clientY - containerRect.top + clickTarget.scrollTop;

                    // 0. Multimeasure Rest Hit Test (Staff-Specific Precision)
                    var clickedMrSvg = targetEl ? (targetEl.closest ? targetEl.closest('.multirest, g[id*="vf-multi"]') : null) : null;
                    var matchedMrItem = null;
                    if (clickedMrSvg) {
                        matchedMrItem = multiRestMeasures.find(function (item) {
                            return item.svgEl === clickedMrSvg;
                        });
                    }

                    if (!matchedMrItem) {
                        var bestDist = 9999;
                        for (var mri = 0; mri < multiRestMeasures.length; mri++) {
                            var mrItem = multiRestMeasures[mri];
                            if (clickX >= (mrItem.minX - 10) && clickX <= (mrItem.maxX + 10) &&
                                clickY >= (mrItem.minY - 10) && clickY <= (mrItem.maxY + 10)) {
                                var dist = Math.abs(clickY - ((mrItem.minY + mrItem.maxY) / 2));
                                if (dist < bestDist) {
                                    bestDist = dist;
                                    matchedMrItem = mrItem;
                                }
                            }
                        }
                    }

                    if (matchedMrItem) {
                        selectMultiRest(matchedMrItem);
                        return;
                    }

                    // If clicked outside of multirest, close stepper panel
                    closeMultiRestPanel();

                    // 1. Proximity & layer lookup for note selection
                    var bestId = findNoteAtPoint(e.clientX, e.clientY);
                    if (bestId !== null) {
                        selectNote(bestId);
                    } else {
                        // Tapped on empty score whitespace: DESELECT immediately!
                        deselectNote();
                    }
                };
            }
        }

        function drawHighlight(vxId) {
            clearHighlights();
            if (vxId === null || vxId === undefined) return;
            var entry = noteMap.get(vxId);
            if (!entry || !entry.gNote) return;

            var ind = document.getElementById('selection-indicator');
            var domEls = getSvgElements(entry.gNote);
            var targetEl = (domEls && domEls.length > 0 && domEls[0]) ? domEls[0] : null;

            var rect = null;
            if (targetEl) {
                // If chord (multiple noteheads inside targetEl), pick the notehead closest to entry.coord.cy
                var noteheads = targetEl.querySelectorAll ? targetEl.querySelectorAll('.vf-notehead, path') : [];
                if (noteheads.length > 1 && entry.coord) {
                    var bestDist = 9999;
                    for (let n = 0; n < noteheads.length; n++) {
                        var nhRect = noteheads[n].getBoundingClientRect();
                        if (nhRect.width === 0 || nhRect.height === 0) continue;
                        var dist = Math.abs((nhRect.top + nhRect.height / 2) - entry.coord.cy);
                        if (dist < bestDist) {
                            bestDist = dist;
                            targetEl = noteheads[n];

                    rect = targetEl.getBoundingClientRect();

                ind.style.top = top + 'px';

                ind.style.width = (entry.coord.w + 10) + 'px';

            // Position and update Floating Micro-HUD right above selected element
            var hud = document.getElementById('note-micro-hud');

                var indTop = parseFloat(ind.style.top) || 0;
                var indWidth = parseFloat(ind.style.width) || 20;

                var hudDesiredX = indLeft + indWidth / 2;
                var containerW = (scoreContainer ? scoreContainer.clientWidth : window.innerWidth) || window.innerWidth;
                var minX = 85;
                var maxX = Math.max(minX, containerW - 85);
                var clampedX = Math.max(minX, Math.min(maxX, hudDesiredX));

                hud.style.left = clampedX + 'px';
                hud.style.top = (indTop - 6) + 'px';
                hud.classList.add('visible');

                var xmlNote = getXmlNoteElement(vxId);
                var hudBadge = document.getElementById('hud-note-badge');
                if (hudBadge && xmlNote) {
                    var isR = (xmlNote.getElementsByTagName('rest').length > 0);
                    if (isR) {
                        hudBadge.textContent = 'Rest';
                    } else {
                        var pEl = xmlNote.getElementsByTagName('pitch')[0];
                        var step = pEl && pEl.getElementsByTagName('step')[0] ? pEl.getElementsByTagName('step')[0].textContent.trim().toUpperCase() : 'C';
                        var oct = pEl && pEl.getElementsByTagName('octave')[0] ? pEl.getElementsByTagName('octave')[0].textContent.trim() : '4';
                        var altEl = pEl ? pEl.getElementsByTagName('alter')[0] : null;
                        var alt = altEl ? parseInt(altEl.textContent.trim(), 10) : 0;
                        var altSign = (alt > 0) ? '♯' : ((alt < 0) ? '♭' : '');
                        hudBadge.textContent = step + altSign + oct;

        // ─── Note Selection (sends info to Android bridge) ──────────────
        function selectNote(vxId) {
            selectedNoteId = vxId;
            var entry = noteMap.get(vxId);
            if (!entry) {
                console.warn('[VoxSight Editor] selectNote: vxId', vxId, 'not in noteMap');
                return;
            }

            // Draw direct SVG highlight locked to the exact notehead
            drawHighlight(vxId);
            updateDeckUI(vxId);

            // Extract note properties directly from XML DOM (100% ground truth)
            var xmlNoteEl = getXmlNoteElement(vxId);
            var pitchStep = 'C', alterVal = 0, octaveVal = 4;
            var durationType = 'quarter';
            var voiceId = 1;
            var measureNum = 1;
            var isRest = false;
            var isDotted = false;

            var lyricText = '';
            if (xmlNoteEl) {
                isRest = (xmlNoteEl.getElementsByTagName('rest').length > 0);
                isDotted = (xmlNoteEl.getElementsByTagName('dot').length > 0);

                var lyricEl = xmlNoteEl.getElementsByTagName('lyric')[0];
                if (lyricEl) {
                    var textEl = lyricEl.getElementsByTagName('text')[0];
                    if (textEl && textEl.textContent) {
                        lyricText = textEl.textContent.trim();
                    }
                }

                var pitchEl = xmlNoteEl.getElementsByTagName('pitch')[0];
                if (pitchEl) {
                    var stepEl = pitchEl.getElementsByTagName('step')[0];
                    if (stepEl && stepEl.textContent.trim()) {
                        pitchStep = stepEl.textContent.trim().toUpperCase().charAt(0);
                    }
                    var alterEl = pitchEl.getElementsByTagName('alter')[0];
                    if (alterEl && alterEl.textContent.trim()) {
                        alterVal = parseFloat(alterEl.textContent.trim()) || 0;
                    }
                    var octEl = pitchEl.getElementsByTagName('octave')[0];
                    if (octEl && octEl.textContent.trim()) {
                        octaveVal = parseInt(octEl.textContent.trim(), 10) || 4;
                    }
                }

                var typeEl = xmlNoteEl.getElementsByTagName('type')[0];
                if (typeEl && typeEl.textContent.trim()) {
                    durationType = typeEl.textContent.trim().toLowerCase();
                }

                var voiceEl = xmlNoteEl.getElementsByTagName('voice')[0];
                var parsedVoice = voiceEl ? (parseInt(voiceEl.textContent.trim(), 10) || 1) : 1;

                // Check explicit override
                var customVoiceStr = xmlNoteEl.getAttribute('data-vx-voice');
                var voiceCode = (customVoiceStr && customVoiceStr.trim() !== '') ? customVoiceStr.trim().toUpperCase() : null;
                if (customVoiceStr) {
                    var parsedInt = parseInt(customVoiceStr, 10);
                    if (!isNaN(parsedInt)) {
                        voiceId = parsedInt;
                    } else {
                        var cu = customVoiceStr.trim().toUpperCase();
                        if (cu.startsWith('S') || cu === 'UNISON_SA' || cu === 'UNISON_S1S2') voiceId = 1;
                        else if (cu.startsWith('A') || cu === 'UNISON_A1A2') voiceId = 2;
                        else if (cu.startsWith('T') || cu === 'UNISON_TB' || cu === 'UNISON_T1T2') voiceId = 3;
                        else if (cu.startsWith('B') || cu === 'UNISON_B1B2') voiceId = 4;
                        else if (cu.indexOf('BARITONE') !== -1) { voiceId = 5; voiceCode = 'BARITONE SOLO'; }
                        else if (cu === 'SOLO') { voiceId = 5; voiceCode = 'SOLO'; }
                        else if (cu === 'OTHERS' || cu === 'OTHER') voiceId = 6;
                        else voiceId = 1;
                    }
                } else if (entry.staffIdx !== undefined) {
                    // In 2-part scores or staves: determine SATB voice (1=S, 2=A, 3=T, 4=B)
                    if (entry.staffIdx === 0) {
                        voiceId = (entry.chordPos === 'bottom' || parsedVoice === 2) ? 2 : 1;
                        voiceCode = (voiceId === 2) ? 'A' : 'S';
                    } else if (entry.staffIdx === 1) {
                        voiceId = (entry.chordPos === 'bottom' || parsedVoice === 2 || parsedVoice === 4 || parsedVoice === 6) ? 4 : 3;
                        voiceCode = (voiceId === 4) ? 'B' : 'T';
                    } else {
                        voiceId = parsedVoice;
                        voiceCode = (voiceId === 1) ? 'S' : (voiceId === 2) ? 'A' : (voiceId === 3) ? 'T' : (voiceId === 4) ? 'B' : (voiceId === 5) ? 'SOLO' : 'OTHERS';
                    }
                } else {
                    voiceId = parsedVoice;
                    voiceCode = (voiceId === 1) ? 'S' : (voiceId === 2) ? 'A' : (voiceId === 3) ? 'T' : (voiceId === 4) ? 'B' : (voiceId === 5) ? 'SOLO' : 'OTHERS';
                }
                if (!voiceCode) {
                    voiceCode = (voiceId === 1) ? 'S' : (voiceId === 2) ? 'A' : (voiceId === 3) ? 'T' : (voiceId === 4) ? 'B' : (voiceId === 5) ? 'SOLO' : 'OTHERS';
                }
                if (voiceId === 5 || voiceCode === 'SOLO') {
                    voiceCode = 'SOLO';
                    voiceId = 5;
                }

                var measEl = xmlNoteEl.parentNode;
                while (measEl && measEl.tagName !== 'measure') measEl = measEl.parentNode;
                if (measEl && measEl.getAttribute('number')) {
                    measureNum = parseInt(measEl.getAttribute('number'), 10) || 1;
                }
            } else {
                // Fallback from OSMD SourceNote
                var srcNote = entry.srcNote;
                if (srcNote) {
                    isRest = (typeof srcNote.isRest === 'function') ? srcNote.isRest() : (srcNote.isRest === true || srcNote.IsRest === true);
                    var pitch = srcNote.pitch || srcNote.Pitch;
                    if (pitch) {
                        // Handle numeric pitch.step enum (0=C,1=D,...6=B) same as buildNoteMap
                        var sNames = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
                        if (typeof pitch.step === 'string') pitchStep = pitch.step.toUpperCase();
                        else if (typeof pitch.Step === 'string') pitchStep = pitch.Step.toUpperCase();
                        else if (typeof pitch.step === 'number') pitchStep = sNames[pitch.step % 7] || 'C';
                        else if (typeof pitch.Step === 'number') pitchStep = sNames[pitch.Step % 7] || 'C';
                        else if (typeof pitch.fundamentalNote === 'number') pitchStep = sNames[pitch.fundamentalNote % 7] || 'C';
                        if (typeof pitch.alter === 'number') alterVal = pitch.alter;
                        else if (typeof pitch.Alter === 'number') alterVal = pitch.Alter;
                        else if (typeof pitch.accidental === 'number') alterVal = pitch.accidental;
                        else if (typeof pitch.Accidental === 'number') alterVal = pitch.Accidental;
                        octaveVal = (pitch.octave !== undefined) ? pitch.octave : (pitch.Octave || 4);
                    }
                }

                if (partsForRest.length > 0) {
