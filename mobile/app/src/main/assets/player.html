<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoxSight Player</title>
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, hsl(210, 30%, 15%), hsl(230, 30%, 10%));
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #scoreContainer {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin: 10px;
            min-height: 240px;
        }

        #score {
            width: 100%;
        }

        #controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
        }

        button {
            padding: 8px 16px;
            font-size: 0.9rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: hsl(200, 70%, 45%);
            color: #fff;
            transition: background 0.2s;
        }

        button:hover {
            background: hsl(200, 70%, 55%);
        }

        button.muted {
            background: hsl(0, 70%, 45%);
        }
    </style>
    <!-- OpenSheetMusicDisplay -->
    <script src="opensheetmusicdisplay.min.js"></script>
    <!-- Tone.js -->
    <script src="Tone.min.js"></script>
    <script src="https://www.verovio.org/javascript/latest/verovio.js"></script>
</head>

<body>
    <div id="scoreContainer">
        <div id="score"></div>
    </div>
    <div id="controls">
        <button id="playBtn">Play</button>
        <button id="pauseBtn">Pause</button>
        <button id="stopBtn">Stop</button>
        <button id="muteSBtn" data-part="S">Mute S</button>
        <button id="muteABtn" data-part="A">Mute A</button>
        <button id="muteTBtn" data-part="T">Mute T</button>
        <button id="muteBBtn" data-part="B">Mute B</button>
    </div>

    <script>
        let osmd;
        let synthS, synthA, synthT, synthB;
        let masterLimiter;
        let masterGain;
        let masterCompressor;
        let toneConfigured = false;
        const muteState = { S: false, A: false, T: false, B: false };

        // ---------- MusicXML parsing ----------
        async function parseMusicXML(musicxmlString) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(musicxmlString, 'application/xml');
            const satb = { S: [], A: [], T: [], B: [] };
            const partOrder = ['S', 'A', 'T', 'B'];
            let partIndex = 0;

            let tempo = 120;
            const sound = xmlDoc.querySelector('sound[tempo]');
            if (sound) tempo = Number(sound.getAttribute('tempo')) || tempo;

            const parts = xmlDoc.querySelectorAll('part');
            parts.forEach(part => {
                const id = part.getAttribute('id') || '';
                const label = (id.includes('S') ? 'S' :
                    id.includes('A') ? 'A' :
                        id.includes('T') ? 'T' :
                            id.includes('B') ? 'B' :
                                partOrder[partIndex] || 'S');
                partIndex++;

                let currentDivisions = 1;
                let measureStartBeat = 0;

                part.querySelectorAll('measure').forEach(measure => {
                    let timeInMeasure = 0;
                    let measureMaxBeats = 0;

                    Array.from(measure.childNodes).forEach(node => {
                        if (node.nodeType !== 1) return; // Element nodes only
                        const tagName = node.tagName.toLowerCase();

                        if (tagName === 'attributes') {
                            const divEl = node.querySelector('divisions');
                            if (divEl) {
                                const val = Number(divEl.textContent);
                                if (val > 0) currentDivisions = val;
                            }
                        } else if (tagName === 'backup') {
                            const durEl = node.querySelector('duration');
                            if (durEl) {
                                const dur = Number(durEl.textContent) || 0;
                                timeInMeasure -= dur / currentDivisions;
                                if (timeInMeasure < 0) timeInMeasure = 0;
                            }
                        } else if (tagName === 'forward') {
                            const durEl = node.querySelector('duration');
                            if (durEl) {
                                const dur = Number(durEl.textContent) || 0;
                                timeInMeasure += dur / currentDivisions;
                            }
                        } else if (tagName === 'note') {
                            const isChord = !!node.querySelector('chord');
                            const durNode = node.querySelector('duration');
                            const durationBeats = durNode ? (Number(durNode.textContent) / currentDivisions) : 1.0;

                            const noteStartBeat = measureStartBeat + timeInMeasure;

                            if (node.querySelector('rest')) {
                                if (!isChord) {
                                    timeInMeasure += durationBeats;
                                    if (timeInMeasure > measureMaxBeats) measureMaxBeats = timeInMeasure;
                                }
                                return;
                            }

                            const step = node.querySelector('step')?.textContent;
                            const octave = node.querySelector('octave')?.textContent;
                            const alter = node.querySelector('alter')?.textContent;

                            if (!step || !octave) {
                                if (!isChord) {
                                    timeInMeasure += durationBeats;
                                    if (timeInMeasure > measureMaxBeats) measureMaxBeats = timeInMeasure;
                                }
                                return;
                            }

                            let pitch = step + (alter == 1 ? '#' : alter == -1 ? 'b' : '') + octave;

                            const type = node.querySelector('type')?.textContent;
                            const durationMap = { whole: '1m', half: '2n', quarter: '4n', eighth: '8n', '16th': '16n', '32nd': '32n' };
                            const toneDur = durationMap[type] || '4n';

                            satb[label].push({
                                time: noteStartBeat,
                                pitch: pitch,
                                duration: toneDur,
                                durationBeats: durationBeats,
                                voice: label
                            });

                            if (!isChord) {
                                timeInMeasure += durationBeats;
                                if (timeInMeasure > measureMaxBeats) measureMaxBeats = timeInMeasure;
                            }
                        }
                    });

                    measureStartBeat += Math.max(measureMaxBeats, 1.0);
                });
            });

            return { satb, tempo };
        }

        let parts = {};
        const firedCounts = { S: 0, A: 0, T: 0, B: 0 };
        let pendingSatb = null;
        let pendingTempo = 120;

        function teardownAudioEngine() {
            try { Tone.Transport.stop(); } catch (_) { }
            try { Tone.Transport.seconds = 0; } catch (_) { }
            try { Tone.Transport.cancel(0); } catch (_) { }

            Object.values(parts).forEach(p => p?.dispose?.());
            parts = {};

            firedCounts.S = 0;
            firedCounts.A = 0;
            firedCounts.T = 0;
            firedCounts.B = 0;

            [synthS, synthA, synthT, synthB].forEach(s => {
                try { s?.disconnect?.(); } catch (_) { }
                try { s?.dispose?.(); } catch (_) { }
            });
            synthS = synthA = synthT = synthB = undefined;

            try { masterGain?.disconnect(); masterGain?.dispose(); } catch (_) { }
            try { masterCompressor?.disconnect(); masterCompressor?.dispose(); } catch (_) { }
            try { masterLimiter?.disconnect(); masterLimiter?.dispose(); } catch (_) { }
            masterGain = masterCompressor = masterLimiter = undefined;
        }

        function init() {
            if (typeof opensheetmusicdisplay === 'undefined') {
                document.getElementById('score').innerHTML = '<p style="color: orange; padding: 20px;">Note: OpenSheetMusicDisplay library failed to load. Tone.js audio will still play.</p>';
                return;
            }
            osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay('score', {
                autoResize: true,
                drawTitle: false,
                autoGenerateMultipleRestMeasuresFromRestMeasures: true,
                renderMultipleRestMeasures: true
            });
            if (osmd.rules) {
                osmd.rules.AutoGenerateMultipleRestMeasuresFromRestMeasures = true;
                osmd.rules.RenderMultipleRestMeasures = true;
            }
        }

        function resizeScoreContainer() {
            const controls = document.getElementById('controls');
            const scoreContainer = document.getElementById('scoreContainer');
            if (!controls || !scoreContainer) return;
            const controlsHeight = controls.getBoundingClientRect().height || 0;
            const available = window.innerHeight - controlsHeight - 20;
            scoreContainer.style.height = Math.max(available, 240) + 'px';
        }

        async function loadScore(data) {
            console.log('loadScore called with:', data);
            if (!data || !data.musicxml) {
                document.getElementById('score').innerHTML = '<p style="color: red; padding: 20px;">Error: No MusicXML data received</p>';
                return;
            }
            if (osmd) {
                resizeScoreContainer();
                osmd.load(data.musicxml)
                    .then(() => {
                        requestAnimationFrame(() => {
                            osmd.render();
                            renderHBarRests();
                            if (typeof osmd.resize === 'function') {
                                osmd.resize();
                            }
                        });
                    })
                    .catch(e => {
                        console.error('OSMD load error:', e);
                        document.getElementById('score').innerHTML = '<p style="color: red; padding: 20px;">Error rendering score.</p>';
                    });
            }

            try {
                const { satb, tempo } = await parseMusicXML(data.musicxml);
                pendingSatb = satb;
                pendingTempo = Number(data.tempo) || Number(tempo) || 120;
                console.log('Parsed SATB from MusicXML. Tempo:', pendingTempo,
                    'S:', satb.S?.length || 0,
                    'A:', satb.A?.length || 0,
                    'T:', satb.T?.length || 0,
                    'B:', satb.B?.length || 0);
            } catch (e) {
                console.error('Failed to parse MusicXML:', e);
                pendingSatb = { S: [], A: [], T: [], B: [] };
                pendingTempo = 120;
            }
            window.SATB = pendingSatb;
            window.TEMPO = pendingTempo;

            teardownAudioEngine();
            console.log('Audio data prepared; press Play to start.');
        }

        function initAudioEngine(satb, tempo) {
            satb = satb || {};
            console.log('initAudioEngine called with tempo:', tempo, 'satb:', satb);

            try { Tone.Transport.stop(); } catch (_) { }
            try { Tone.Transport.seconds = 0; } catch (_) { }
            try { Tone.Transport.cancel(0); } catch (_) { }

            Object.values(parts).forEach(p => p?.dispose?.());
            parts = {};
            firedCounts.S = 0;
            firedCounts.A = 0;
            firedCounts.T = 0;
            firedCounts.B = 0;

            [synthS, synthA, synthT, synthB].forEach(s => {
                try { s?.disconnect?.(); } catch (_) { }
                try { s?.dispose?.(); } catch (_) { }
            });
            synthS = synthA = synthT = synthB = undefined;

            if (!toneConfigured) {
                Tone.setContext(new Tone.Context({ latencyHint: 'interactive' }));
                Tone.getContext().lookAhead = 0.1;
                Tone.getContext().updateInterval = 0.03;
                toneConfigured = true;
            }
            const bpm = Number(tempo) || 120;
            Tone.Transport.bpm.value = bpm;
            const secondsPerBeat = 60 / bpm;
            const minStartSeconds = getMinStartSeconds(satb, secondsPerBeat);
            console.log('Audio timing: secondsPerBeat=', secondsPerBeat, 'minStartSeconds=', minStartSeconds);

            masterLimiter = new Tone.Limiter(-6).toDestination();
            masterCompressor = new Tone.Compressor({
                threshold: -24,
                ratio: 6,
                attack: 0.005,
                release: 0.15
            });
            masterGain = new Tone.Gain(0.45);

            masterGain.connect(masterCompressor);
            masterCompressor.connect(masterLimiter);

            const synthOptions = {
                maxPolyphony: 8,
                oscillator: {
                    type: 'sine',
                    partials: [1, 2, 3]
                },
                envelope: {
                    attack: 0.008,
                    decay: 0.1,
                    sustain: 0.4,
                    release: 0.3
                }
            };

            synthS = new Tone.PolySynth(Tone.Synth, synthOptions).connect(masterGain);
            synthA = new Tone.PolySynth(Tone.Synth, synthOptions).connect(masterGain);
            synthT = new Tone.PolySynth(Tone.Synth, synthOptions).connect(masterGain);
            synthB = new Tone.PolySynth(Tone.Synth, synthOptions).connect(masterGain);

            parts.S = createPart(satb.S || [], synthS, 'S', secondsPerBeat, minStartSeconds);
            parts.A = createPart(satb.A || [], synthA, 'A', secondsPerBeat, minStartSeconds);
            parts.T = createPart(satb.T || [], synthT, 'T', secondsPerBeat, minStartSeconds);
            parts.B = createPart(satb.B || [], synthB, 'B', secondsPerBeat, minStartSeconds);
            console.log('Notes per voice: S=' + (satb.S?.length||0) + ' A=' + (satb.A?.length||0) + ' T=' + (satb.T?.length||0) + ' B=' + (satb.B?.length||0));
        }

        function getMinStartSeconds(satb, secondsPerBeat) {
            const all = [];
            ['S', 'A', 'T', 'B'].forEach(part => {
                const list = satb?.[part] || [];
                list.forEach(n => {
                    if (n && Number.isFinite(Number(n.time))) {
                        all.push(Number(n.time) * secondsPerBeat);
                    }
                });
            });
            if (all.length === 0) {
                return 0;
            }
            return Math.max(0, Math.min.apply(null, all));
        }

        function createPart(notes, synth, label, secondsPerBeat, offsetSeconds) {
            let badPitchCount = 0;
            const pitchPattern = /^[A-G](?:#|b)?\d{1,2}$/;

            const toneEvents = (notes || [])
                .filter(n => n && n.pitch)
                .map(n => {
                    const pitch = String(n.pitch).trim();
                    if (!pitchPattern.test(pitch)) {
                        badPitchCount++;
                        if (badPitchCount <= 5) {
                            console.warn(`[${label}] Invalid pitch skipped:`, pitch);
                        }
                        return null;
                    }

                    const beatTime = Number(n.time);
                    if (!Number.isFinite(beatTime)) {
                        return null;
                    }

                    let duration;
                    if (typeof n.duration === 'string' && isNaN(Number(n.duration))) {
                        duration = n.duration;
                    } else {
                        const durationBeats = Number(n.durationBeats ?? n.duration);
                        const safeDurationBeats = Number.isFinite(durationBeats) && durationBeats > 0 ? durationBeats : 0.5;
                        duration = Math.max(safeDurationBeats * secondsPerBeat, 0.05);
                    }

                    let startSeconds = beatTime * secondsPerBeat;
                    if (!Number.isFinite(startSeconds)) startSeconds = 0;
                    startSeconds = Math.max(0, startSeconds);

                    return [
                        startSeconds,
                        {
                            pitch,
                            duration,
                            label
                        }
                    ];
                })
                .filter(Boolean);

            toneEvents.sort((a, b) => a[0] - b[0]);

            const part = new Tone.Part((time, value) => {
                if (!value || muteState[value.label]) return;
                const key = value.label;
                if (key && firedCounts[key] != null) {
                    firedCounts[key] += 1;
                    if (firedCounts[key] <= 3) {
                        console.log(`[${key}] fired #${firedCounts[key]} @ ${time.toFixed(3)}s -> ${value.pitch}`);
                    }
                }
                synth.triggerAttackRelease(value.pitch, value.duration, time);
            }, toneEvents);

            part.loop = false;
            part.humanize = false;

            const firstTime = toneEvents.length ? toneEvents[0][0] : null;
            console.log(
                label,
                'events:',
                toneEvents.length,
                firstTime != null ? `(first @ ${firstTime.toFixed(3)}s)` : '(no events)',
                badPitchCount ? `(skipped ${badPitchCount} bad pitches)` : ''
            );

            return part;
        }

        function setupSync() {
            const bpm = pendingTempo || 120;
            const secondsPerBeat = 60 / bpm;
            const beatsPerMeasure = 4;
            window.measureMap = {};

            const allNotes = [].concat(pendingSatb?.S || [], pendingSatb?.A || [], pendingSatb?.T || [], pendingSatb?.B || []);
            const maxBeat = allNotes.reduce((max, n) => Math.max(max, n.time + (n.durationBeats || 0)), 0);
            const totalMeasures = Math.ceil(maxBeat / beatsPerMeasure);

            for (let i = 1; i <= totalMeasures; i++) {
                window.measureMap[i] = (i - 1) * beatsPerMeasure * secondsPerBeat;
            }
        }

        async function play() {
            if (!pendingSatb) {
                console.warn('Play requested but no SATB data is loaded');
                return;
            }

            if (!toneConfigured) {
                Tone.setContext(new Tone.Context({ latencyHint: 'interactive' }));
                Tone.getContext().lookAhead = 0.1;
                Tone.getContext().updateInterval = 0.03;
                toneConfigured = true;
            }

            await Tone.start();
            console.log('AudioContext state after Tone.start():', Tone.getContext().state);

            if (!parts || Object.keys(parts).length === 0) {
                try {
                    initAudioEngine(pendingSatb, pendingTempo);
                    console.log('Audio engine initialized (lazy)');
                    setupSync();
                } catch (e) {
                    console.error('Error initializing audio on Play:', e);
                    return;
                }
            }

            if (!parts || Object.keys(parts).length === 0) {
                console.warn('Play requested but no parts are loaded');
                return;
            }

            if (Tone.Transport.state === 'started') {
                return;
            }

            if (Tone.Transport.state === 'paused') {
                Tone.Transport.start();
                console.log('Transport resumed');
                return;
            }

            Tone.Transport.stop();
            Tone.Transport.seconds = 0;

            Tone.Transport.start("+0");

            Object.values(parts).forEach(part => {
                if (!part) return;
                try { part.start(0); } catch (e) {
                    console.error('Error starting part:', e);
                }
            });

            console.log('Transport started at', Tone.now().toFixed(3));
        }

        function pause() {
            Tone.Transport.pause();
            console.log('Transport paused');
        }

        function stop() {
            Tone.Transport.stop();
            Tone.Transport.seconds = 0;

            Object.values(parts).forEach(part => {
                try { part?.stop?.(0); } catch (_) { }
            });

            console.log('Transport stopped');
        }

        function toggleMute(part) {
            muteState[part] = !muteState[part];
            const btn = document.querySelector(`button[data-part="${part}"]`);
            btn.classList.toggle('muted', muteState[part]);
            btn.textContent = muteState[part] ? `Unmute ${part}` : `Mute ${part}`;
        }

        // ─── SVG H-Bar Rest Renderer for Multi-Measure Rests ───────────
        function renderHBarRests() {
            if (!osmd || !osmd.graphic) return;

            var scoreDiv = document.getElementById('score');
            if (!scoreDiv) return;

            var existing = scoreDiv.querySelectorAll('.voxsight-hbar-rest');
            for (let i = 0; i < existing.length; i++) {
                existing[i].remove();
            }

            var svgs = scoreDiv.querySelectorAll('svg');
            if (!svgs || svgs.length === 0) return;
            var pages = (osmd.graphic && osmd.graphic.MusicPages) ? osmd.graphic.MusicPages : [];

            var measureList = osmd.graphic.measureList;
            if (!measureList) return;

            var unitToPx = 10;
            if (osmd.graphic && osmd.graphic.rules && osmd.graphic.rules.unitInPixels) unitToPx = osmd.graphic.rules.unitInPixels;
            else if (osmd.rules && osmd.rules.unitInPixels) unitToPx = osmd.rules.unitInPixels;

            for (let mIdx = 0; mIdx < measureList.length; mIdx++) {
                var mRow = measureList[mIdx];
                if (!mRow) continue;

                for (let sIdx = 0; sIdx < mRow.length; sIdx++) {
                    var gMeas = mRow[sIdx];
                    if (!gMeas) continue;

                    if (gMeas.IsExtraGraphicalMeasure || gMeas.isExtraGraphicalMeasure || !gMeas.parentMusicSystem) continue;

                    var multirestCount = 0;
                    if (gMeas.parentSourceMeasure && gMeas.parentSourceMeasure.multipleRestMeasures) {
                        multirestCount = gMeas.parentSourceMeasure.multipleRestMeasures;
                    }

                    if (multirestCount >= 2) {
                        // Check if source measure has pitched notes
                        if (gMeas.parentSourceMeasure && gMeas.parentSourceMeasure.VerticalSourceStaffEntryContainers) {
                            var hasPitch = false;
                            var containers = gMeas.parentSourceMeasure.VerticalSourceStaffEntryContainers;
                            for (var vi = 0; vi < containers.length; vi++) {
                                var entries = containers[vi].StaffEntries;
                                if (entries) {
                                    for (var ei = 0; ei < entries.length; ei++) {
                                        var se = entries[ei];
                                        if (se.VoiceEntries) {
                                            for (var vei = 0; vei < se.VoiceEntries.length; vei++) {
                                                var ve = se.VoiceEntries[vei];
                                                if (ve.Notes) {
                                                    for (var ni = 0; ni < ve.Notes.length; ni++) {
                                                        if (ve.Notes[ni].Pitch || !ve.Notes[ni].isRest()) {
                                                            hasPitch = true;
                                                            break;
                                                        }
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                            if (hasPitch) continue;
                        }

                        var mNum = gMeas.parentSourceMeasure ? gMeas.parentSourceMeasure.MeasureNumber : (mIdx + 1);
                        var bbox = gMeas.PositionAndShape || gMeas.positionAndShape;
                        var absPos = bbox ? (bbox.absolutePosition || bbox.AbsolutePosition) : null;
                        var size = bbox ? (bbox.size || bbox.Size) : null;
                        if (!absPos || !size) continue;

                        var sys = gMeas.parentMusicSystem;
                        var page = sys ? (sys.Parent || sys.parentMusicPage || sys.ParentMusicPage) : null;
                        var pIdx = (pages && page) ? pages.indexOf(page) : 0;
                        if (pIdx < 0) pIdx = 0;
                        var targetSvg = (pIdx < svgs.length) ? svgs[pIdx] : svgs[0];

                        var pageY = (page && page.PositionAndShape && svgs.length > 1) ? page.PositionAndShape.AbsolutePosition.y : 0;
                        var pageX = (page && page.PositionAndShape && svgs.length > 1) ? page.PositionAndShape.AbsolutePosition.x : 0;

                        var sx = (absPos.x - pageX) * unitToPx;
                        var sy = (absPos.y - pageY) * unitToPx;
                        var sw = size.width * unitToPx;
                        var sh = size.height * unitToPx;

                        if (!sw || sw < 20 || !sh || sh < 15) continue;

                        var line1Y = sy;
                        var line3Y = sy + (sh * 0.5);
                        var serifTop = sy + (sh * 0.25);
                        var serifBottom = sy + (sh * 0.75);

                        var barWidth = Math.max(36, Math.min(70, sw * 0.38));
                        var leftX = sx + (sw - barWidth) / 2;
                        var rightX = leftX + barWidth;

                        var gEl = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                        gEl.setAttribute('class', 'voxsight-hbar-rest');
                        gEl.setAttribute('data-measure-num', mNum.toString());
                        gEl.setAttribute('data-staff-idx', sIdx.toString());

                        // Mask rectangle behind H-Bar to cleanly conceal any default rest symbol
                        var bgMask = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                        bgMask.setAttribute('x', (leftX - 4).toFixed(2));
                        bgMask.setAttribute('y', (line1Y + 2).toFixed(2));
                        bgMask.setAttribute('width', (barWidth + 8).toFixed(2));
                        bgMask.setAttribute('height', (sh - 4).toFixed(2));
                        bgMask.setAttribute('fill', '#ffffff');
                        bgMask.setAttribute('opacity', '0.92');
                        gEl.appendChild(bgMask);

                        var beam = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        beam.setAttribute('x1', leftX.toFixed(2));
                        beam.setAttribute('y1', line3Y.toFixed(2));
                        beam.setAttribute('x2', rightX.toFixed(2));
                        beam.setAttribute('y2', line3Y.toFixed(2));
                        beam.setAttribute('stroke', '#000000');
                        beam.setAttribute('stroke-width', '5.5');
                        beam.setAttribute('stroke-linecap', 'square');
                        gEl.appendChild(beam);

                        var lSerif = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        lSerif.setAttribute('x1', leftX.toFixed(2));
                        lSerif.setAttribute('y1', serifTop.toFixed(2));
                        lSerif.setAttribute('x2', leftX.toFixed(2));
                        lSerif.setAttribute('y2', serifBottom.toFixed(2));
                        lSerif.setAttribute('stroke', '#000000');
                        lSerif.setAttribute('stroke-width', '3.2');
                        gEl.appendChild(lSerif);

                        var rSerif = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        rSerif.setAttribute('x1', rightX.toFixed(2));
                        rSerif.setAttribute('y1', serifTop.toFixed(2));
                        rSerif.setAttribute('x2', rightX.toFixed(2));
                        rSerif.setAttribute('y2', serifBottom.toFixed(2));
                        rSerif.setAttribute('stroke', '#000000');
                        rSerif.setAttribute('stroke-width', '3.2');
                        gEl.appendChild(rSerif);

                        var text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        text.setAttribute('x', (sx + sw / 2).toFixed(2));
                        text.setAttribute('y', (line1Y - 7).toFixed(2));
                        text.setAttribute('font-family', 'serif, "Times New Roman", sans-serif');
                        text.setAttribute('font-weight', 'bold');
                        text.setAttribute('font-size', '16');
                        text.setAttribute('text-anchor', 'middle');
                        text.setAttribute('fill', '#000000');
                        text.textContent = multirestCount.toString();
                        gEl.appendChild(text);

                        targetSvg.appendChild(gEl);
                    }
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            init();
            resizeScoreContainer();
            window.addEventListener('resize', () => {
                resizeScoreContainer();
                if (osmd && typeof osmd.resize === 'function') {
                    osmd.resize();
                }
            });
            document.getElementById('playBtn').addEventListener('click', play);
            document.getElementById('pauseBtn').addEventListener('click', pause);
            document.getElementById('stopBtn').addEventListener('click', stop);
            document.querySelectorAll('#controls button[data-part]').forEach(btn => {
                const part = btn.getAttribute('data-part');
                btn.addEventListener('click', () => toggleMute(part));
            });
        });
    </script>
</body>

</html>
