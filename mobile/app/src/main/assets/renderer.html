<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>VoxSight Sheet Music</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            overflow-x: auto;
            -webkit-user-select: none;
            user-select: none;
        }

        #score-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background: #ffffff;
            padding: 12px 16px;
        }

        /* OSMD renders into this div */
        #osmd-render {
            width: 100%;
            min-height: 200px;
        }

        /* Canvas overlay for playback highlighting */
        #highlight-canvas {
            position: absolute;
            top: 12px;
            left: 16px;
            width: calc(100% - 32px);
            height: calc(100% - 24px);
            pointer-events: none;
            z-index: 10;
        }

        /* Status bar */
        #status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        #status-text {
            font-size: 12px;
            color: #a0a0a0;
            flex: 1;
        }

        #sync-confidence {
            font-size: 11px;
            color: #4ade80;
        }

        /* Loading state */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 26, 46, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Suppress dynamics/ornament SVG glyphs (defense-in-depth) */
        .vf-dynamics, .vf-ornament,
        [class*="dynamics"], [class*="ornament"],
        [class*="trill"], [class*="mordent"],
        [class*="turn"] {
            display: none !important;
            visibility: hidden !important;
        }
    </style>
</head>

<body>

    <!-- Loading overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <!-- Score container with canvas overlay -->
    <div id="score-container">
        <div id="osmd-render"></div>
        <canvas id="highlight-canvas"></canvas>
    </div>

    <!-- Status bar -->
    <div id="status-bar" style="display: none !important;">
        <span id="status-text">Ready</span>
        <span id="sync-confidence"></span>
    </div>

    <!-- OSMD Library (Local offline support) -->
    <script src="opensheetmusicdisplay.min.js"></script>
    <script src="Tone.min.js"></script>

    <script>
        /**
         * VoxSight OSMD Renderer v1.0
         * ============================
         * Architecture Contract (v3.7):
         *   - Read-only renderer: NEVER modifies MusicXML
         *   - Canvas overlay for note highlighting (no DOM mutation on OSMD SVG)
         *   - layout_hash gating: coordinates are versioned
         *   - Bipartite matching: extracts note positions for SyncManager
         *   - No audio code — playback is handled natively
         */

        // Helper function to safely get the float value of an OSMD Fraction
        function getFractionValue(fraction) {
            if (!fraction) return 0;
            if (typeof fraction.RealValue === 'number') return fraction.RealValue;
            if (typeof fraction.realValue === 'number') return fraction.realValue;
            if (fraction.numerator !== undefined && fraction.denominator !== undefined) {
                return fraction.numerator / fraction.denominator;
            }
            return 0;
        }

        // Helper function to extract VexFlow SVG elements from an OSMD GraphicalNote
        function getSvgElements(gNote) {
            const svgs = [];
            if (!gNote) return svgs;

            const vfnotes = gNote.vfnote;
            if (!vfnotes) return svgs;

            // vfnote can be an array or a single object depending on OSMD version
            const arr = Array.isArray(vfnotes) ? vfnotes : [vfnotes];
            for (let i = 0; i < arr.length; i++) {
                const vf = arr[i];
                if (!vf) continue;
                let el = null;
                if (typeof vf.getSVGGElement === 'function') {
                    el = vf.getSVGGElement();
                } else if (vf.getAttribute && typeof vf.getAttribute === 'function') {
                    el = vf.getAttribute('el');
                }
                if (el) svgs.push(el);
            }
            return svgs;
        }

        // ─── State ──────────────────────────────────────────────────────
        let osmd = null;
        let highlightCtx = null;
        let layoutHash = null;
        let noteCoordinates = [];  // Extracted from OSMD after render
        let allGraphicalNotes = []; // Cached references to bypass minification issues
        let xmlDoc = null;          // Global MusicXML DOM for H-bar and structure inspection
        let colorMappingList = [];
        let currentVisualFocus = null;

        // ─── Staff Index & Measure Number Helpers for OSMD GraphicalNotes ──────
        function getStaffIndex(gNote) {
            if (!gNote) return 0;
            if (gNote.ParentStaffEntry && gNote.ParentStaffEntry.parentStaff && typeof gNote.ParentStaffEntry.parentStaff.idInMusicSheet === 'number') {
                return gNote.ParentStaffEntry.parentStaff.idInMusicSheet;
            }
            if (gNote.parentStaffEntry && gNote.parentStaffEntry.parentStaff && typeof gNote.parentStaffEntry.parentStaff.idInMusicSheet === 'number') {
                return gNote.parentStaffEntry.parentStaff.idInMusicSheet;
            }
            var src = gNote.sourceNote || gNote.SourceNote;
            if (src) {
                if (src.ParentStaffEntry && src.ParentStaffEntry.ParentStaff && typeof src.ParentStaffEntry.ParentStaff.idInMusicSheet === 'number') {
                    return src.ParentStaffEntry.ParentStaff.idInMusicSheet;
                }
                if (src.parentStaffEntry && src.parentStaffEntry.parentStaff && typeof src.parentStaffEntry.parentStaff.idInMusicSheet === 'number') {
                    return src.parentStaffEntry.parentStaff.idInMusicSheet;
                }
                if (src.ParentStaffEntry && src.ParentStaffEntry.ParentStaff && typeof src.ParentStaffEntry.ParentStaff.Id === 'number') {
                    return src.ParentStaffEntry.ParentStaff.Id - 1;
                }
            }
            return 0;
        }

        function getMeasureIndex(gNote) {
            var src = gNote ? (gNote.sourceNote || gNote.SourceNote) : null;
            if (src) {
                var sm = src.SourceMeasure || src.sourceMeasure;
                if (sm) {
                    if (typeof sm.measureListIndex === 'number') return sm.measureListIndex;
                    if (typeof sm.MeasureListIndex === 'number') return sm.MeasureListIndex;
                }
            }
            if (gNote) {
                var pm = gNote.parentMeasure || gNote.ParentMeasure;
                if (pm) {
                    if (typeof pm.measureListIndex === 'number') return pm.measureListIndex;
                    if (typeof pm.MeasureListIndex === 'number') return pm.MeasureListIndex;
                    var psm = pm.parentSourceMeasure || pm.ParentSourceMeasure;
                    if (psm) {
                        if (typeof psm.measureListIndex === 'number') return psm.measureListIndex;
                        if (typeof psm.MeasureListIndex === 'number') return psm.MeasureListIndex;
                    }
                }
                var pse = gNote.parentStaffEntry || gNote.ParentStaffEntry;
                if (pse) {
                    var pm2 = pse.parentMeasure || pse.ParentMeasure;
                    if (pm2) {
                        if (typeof pm2.measureListIndex === 'number') return pm2.measureListIndex;
                        if (typeof pm2.MeasureListIndex === 'number') return pm2.MeasureListIndex;
                        var psm2 = pm2.parentSourceMeasure || pm2.ParentSourceMeasure;
                        if (psm2) {
                            if (typeof psm2.measureListIndex === 'number') return psm2.measureListIndex;
                            if (typeof psm2.MeasureListIndex === 'number') return psm2.MeasureListIndex;
                        }
                    }
                }
            }
            return 0;
        }

        function getMeasureNumber(gNote) {
            var src = gNote ? (gNote.sourceNote || gNote.SourceNote) : null;
            if (src) {
                if (src.SourceMeasure && typeof src.SourceMeasure.MeasureNumber === 'number') return src.SourceMeasure.MeasureNumber;
                if (src.sourceMeasure && typeof src.sourceMeasure.MeasureNumber === 'number') return src.sourceMeasure.MeasureNumber;
            }
            if (gNote.parentStaffEntry && gNote.parentStaffEntry.parentMeasure) {
                var m = gNote.parentStaffEntry.parentMeasure;
                if (typeof m.MeasureNumber === 'number') return m.MeasureNumber;
                if (m.ParentSourceMeasure && typeof m.ParentSourceMeasure.MeasureNumber === 'number') return m.ParentSourceMeasure.MeasureNumber;
            }
            return 1;
        }

        function getSourceNotePitchSignature(src) {
            if (!src) return null;
            if (typeof src.isRest === 'function' && src.isRest()) return 'REST';
            if (src.isRest === true) return 'REST';

            var pitchObj = src.Pitch || src.pitch;
            if (pitchObj) {
                var step = '';
                if (typeof pitchObj.step === 'string') step = pitchObj.step.toUpperCase();
                else if (typeof pitchObj.Step === 'string') step = pitchObj.Step.toUpperCase();
                else if (typeof pitchObj.step === 'number') {
                    var stepNames = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
                    step = stepNames[pitchObj.step % 7] || '';
                }

                var octave = (typeof pitchObj.octave === 'number') ? pitchObj.octave : ((typeof pitchObj.Octave === 'number') ? pitchObj.Octave : 4);
                var alter = (typeof pitchObj.accidental === 'number') ? pitchObj.accidental : ((typeof pitchObj.Accidental === 'number') ? pitchObj.Accidental : 0);
                var altStr = alter !== 0 ? (alter > 0 ? '#' : 'b') : '';
                return step + altStr + octave;
            }
            return null;
        }

        function getVoiceNumber(gNote) {
            var src = gNote ? (gNote.sourceNote || gNote.SourceNote) : null;
            if (src) {
                if (src.VoiceEntry && src.VoiceEntry.ParentVoice && src.VoiceEntry.ParentVoice.VoiceId !== undefined) {
                    return parseInt(src.VoiceEntry.ParentVoice.VoiceId, 10) || 1;
                }
                if (src.voice && typeof src.voice === 'object' && (src.voice.VoiceId || src.voice.voiceId)) {
                    return parseInt(src.voice.VoiceId || src.voice.voiceId, 10) || 1;
                }
                if (typeof src.voice === 'number') return src.voice;
                if (src.ParentVoice && src.ParentVoice.VoiceId !== undefined) {
                    return parseInt(src.ParentVoice.VoiceId, 10) || 1;
                }
            }
            if (gNote && gNote.ParentStaffEntry && gNote.ParentStaffEntry.ParentVoice && gNote.ParentStaffEntry.ParentVoice.VoiceId !== undefined) {
                return parseInt(gNote.ParentStaffEntry.ParentVoice.VoiceId, 10) || 1;
            }
            return 1;
        }

        // ─── SATB Vocal Part Info (100% Parity with Editor) ──────────────
        function getVocalPartInfo(voiceNum, staffIdx, partIdx, totalParts, chordPos, customVoice) {
            // Priority 1: Explicit user override via data-vx-voice attribute
            if (typeof customVoice === 'number' && customVoice >= 1 && customVoice <= 4) {
                switch (customVoice) {
                    case 1: return { voice: "SOPRANO", part: "S", color: "#E91E63", partId: 1 };
                    case 2: return { voice: "ALTO", part: "A", color: "#9C27B0", partId: 2 };
                    case 3: return { voice: "TENOR", part: "T", color: "#2196F3", partId: 3 };
                    case 4: return { voice: "BASS", part: "B", color: "#4CAF50", partId: 4 };
                }
            }

            // 4-part score (Soprano, Alto, Tenor, Bass separated by Part)
            if (totalParts >= 4) {
                var p = (typeof partIdx === 'number') ? partIdx : (voiceNum - 1);
                switch (p) {
                    case 0: return { voice: "SOPRANO", part: "S", color: "#E91E63", partId: 1 };
                    case 1: return { voice: "ALTO", part: "A", color: "#9C27B0", partId: 2 };
                    case 2: return { voice: "TENOR", part: "T", color: "#2196F3", partId: 3 };
                    case 3: return { voice: "BASS", part: "B", color: "#4CAF50", partId: 4 };
                    default: return { voice: "BASS", part: "B", color: "#4CAF50", partId: 4 };
                }
            }

            // 2-part score or 2-staff score (Treble = S/A, Bass = T/B)
            if (totalParts === 2 || staffIdx !== undefined) {
                var isStaff1 = (staffIdx === 0 || partIdx === 0);
                var isStaff2 = (staffIdx === 1 || partIdx === 1);

                if (isStaff1) {
                    if (chordPos === 'bottom') return { voice: "ALTO", part: "A", color: "#9C27B0", partId: 2 };
                    if (chordPos === 'top') return { voice: "SOPRANO", part: "S", color: "#E91E63", partId: 1 };
                    if (voiceNum === 2) return { voice: "ALTO", part: "A", color: "#9C27B0", partId: 2 };
                    return { voice: "SOPRANO", part: "S", color: "#E91E63", partId: 1 };
                } else if (isStaff2) {
                    if (chordPos === 'bottom') return { voice: "BASS", part: "B", color: "#4CAF50", partId: 4 };
                    if (chordPos === 'top') return { voice: "TENOR", part: "T", color: "#2196F3", partId: 3 };
                    if (voiceNum === 2 || voiceNum === 4) return { voice: "BASS", part: "B", color: "#4CAF50", partId: 4 };
                    return { voice: "TENOR", part: "T", color: "#2196F3", partId: 3 };
                }
            }

            // Fallback based on voice number
            switch (voiceNum) {
                case 1: return { voice: "SOPRANO", part: "S", color: "#E91E63", partId: 1 };
                case 2: return { voice: "ALTO", part: "A", color: "#9C27B0", partId: 2 };
                case 3: return { voice: "TENOR", part: "T", color: "#2196F3", partId: 3 };
                case 4: return { voice: "BASS", part: "B", color: "#4CAF50", partId: 4 };
                default: return { voice: "SOPRANO", part: "S", color: "#E91E63", partId: 1 };
            }
        }

        // ─── Direct SVG DOM Coloring (Parity with Editor) ───────────────
        function applyNoteVoiceColor(gNote, voiceColor) {
            if (!gNote || !voiceColor) return;

            // Set OSMD source note properties
            if (gNote.sourceNote) {
                gNote.sourceNote.NoteheadColor = voiceColor;
                gNote.sourceNote.StemColor = voiceColor;
                gNote.sourceNote.Color = voiceColor;
            }

            var vf = null;
            if (gNote.vfnote && gNote.vfnote.length > 0) vf = gNote.vfnote[0];
            else if (gNote.parentVoiceEntry && gNote.parentVoiceEntry.vfnote && gNote.parentVoiceEntry.vfnote.length > 0) {
                vf = gNote.parentVoiceEntry.vfnote[0];
            }

            if (vf) {
                var vfG = null;
                if (typeof vf.getSVGGElement === 'function') vfG = vf.getSVGGElement();
                else if (vf.getAttribute && typeof vf.getAttribute === 'function') vfG = vf.getAttribute('el');
                else if (vf.elem) vfG = vf.elem;

                if (vfG) {
                    // 1. Color Notehead (.vf-notehead)
                    var nhs = vfG.querySelectorAll ? Array.from(vfG.querySelectorAll('.vf-notehead')) : [];
                    var targetNh = null;
                    if (nhs.length > 1) {
                        nhs.sort(function(a, b) {
                            var rA = a.getBoundingClientRect();
                            var rB = b.getBoundingClientRect();
                            return rB.top - rA.top;
                        });
                        var nhIdx = (typeof gNote.vfnoteIndex === 'number') ? gNote.vfnoteIndex : 0;
                        targetNh = nhs[Math.min(nhIdx, nhs.length - 1)] || nhs[0];
                    } else if (nhs.length === 1) {
                        targetNh = nhs[0];
                    }

                    if (targetNh) {
                        targetNh.style.fill = voiceColor;
                        targetNh.style.stroke = voiceColor;
                        targetNh.setAttribute('fill', voiceColor);
                        targetNh.setAttribute('stroke', voiceColor);
                        var paths = targetNh.querySelectorAll ? targetNh.querySelectorAll('path, ellipse, polygon') : [];
                        for (let p = 0; p < paths.length; p++) {
                            paths[p].style.fill = voiceColor;
                            paths[p].style.stroke = voiceColor;
                            paths[p].setAttribute('fill', voiceColor);
                            paths[p].setAttribute('stroke', voiceColor);
                        }
                    }

                    // 2. Color Stem (.vf-stem)
                    var stems = vfG.querySelectorAll ? vfG.querySelectorAll('.vf-stem, path.vf-stem, rect.vf-stem, [class*="stem"]') : [];
                    for (let s = 0; s < stems.length; s++) {
                        stems[s].style.stroke = voiceColor;
                        stems[s].style.fill = voiceColor;
                        stems[s].setAttribute('stroke', voiceColor);
                        stems[s].setAttribute('fill', voiceColor);
                    }

                    // 3. Color Flag / Tail (.vf-flag)
                    var flags = vfG.querySelectorAll ? vfG.querySelectorAll('.vf-flag, path.vf-flag, [class*="flag"]') : [];
                    for (let f = 0; f < flags.length; f++) {
                        flags[f].style.stroke = voiceColor;
                        flags[f].style.fill = voiceColor;
                        flags[f].setAttribute('stroke', voiceColor);
                        flags[f].setAttribute('fill', voiceColor);
                        var fPaths = flags[f].querySelectorAll ? flags[f].querySelectorAll('path') : [];
                        for (let fp = 0; fp < fPaths.length; fp++) {
                            fPaths[fp].style.stroke = voiceColor;
                            fPaths[fp].style.fill = voiceColor;
                            fPaths[fp].setAttribute('stroke', voiceColor);
                            fPaths[fp].setAttribute('fill', voiceColor);
                        }
                    }

                    // 4. Color Beam if connected
                    if (vf.beam) {
                        var beamG = (typeof vf.beam.getSVGGElement === 'function') ? vf.beam.getSVGGElement() : (vf.beam.elem || null);
                        if (beamG) {
                            beamG.style.fill = voiceColor;
                            beamG.style.stroke = voiceColor;
                            beamG.setAttribute('fill', voiceColor);
                            beamG.setAttribute('stroke', voiceColor);
                            var bPaths = beamG.querySelectorAll ? beamG.querySelectorAll('path, rect, polygon') : [];
                            for (let bp = 0; bp < bPaths.length; bp++) {
                                bPaths[bp].style.fill = voiceColor;
                                bPaths[bp].style.stroke = voiceColor;
                                bPaths[bp].setAttribute('fill', voiceColor);
                                bPaths[bp].setAttribute('stroke', voiceColor);
                            }
                        }
                    }
                }
            }
        }

        function findGraphicalNotes(obj, visited = new Set(), results = []) {
            if (!obj || typeof obj !== 'object') return results;
            if (visited.has(obj)) return results;
            visited.add(obj);

            const srcNote = obj.sourceNote || obj.SourceNote;
            const bbox = obj.positionAndShape || obj.PositionAndShape;

            if (srcNote && bbox && (bbox.absolutePosition || bbox.AbsolutePosition)) {
                results.push(obj);
                return results;
            }

            if (Array.isArray(obj)) {
                for (let i = 0; i < obj.length; i++) {
                    findGraphicalNotes(obj[i], visited, results);
                }
            } else {
                if (obj instanceof HTMLElement || obj instanceof SVGElement || obj instanceof Node) return results;
                for (let key of Object.keys(obj)) {
                    findGraphicalNotes(obj[key], visited, results);
                }
            }
            return results;
        }

        // ─── DOM References ─────────────────────────────────────────────
        const renderDiv = document.getElementById('osmd-render');
        const canvas = document.getElementById('highlight-canvas');
        const statusText = document.getElementById('status-text');
        const syncConfidence = document.getElementById('sync-confidence');
        const loadingOverlay = document.getElementById('loading-overlay');

        // ─── Initialize OSMD ────────────────────────────────────────────
        function initOSMD() {
            osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(renderDiv, {
                backend: 'svg',
                autoResize: false,
                newSystemFromXML: true,
                newPageFromXML: true,
                drawTitle: true,
                drawComposer: true,
                drawPartNames: true,
                drawMeasureNumbers: true,
                drawLyrics: true,
                drawSlurs: true,
                drawCredits: false,
                drawFingerings: true,
                drawDynamics: false,
                drawOrnaments: false,
                drawingParameters: 'default',
                coloringEnabled: true,
                colorStemsLikeNoteheads: true,
                autoGenerateMultipleRestMeasuresFromRestMeasures: true,
                renderMultipleRestMeasures: true
            });

            if (osmd.rules) {
                osmd.rules.ColoringEnabled = true;
                osmd.rules.ColorStemsLikeNoteheads = true;
                osmd.rules.ColorBeams = true;
                osmd.rules.ColorFlags = true;
                osmd.rules.AutoGenerateMultipleRestMeasuresFromRestMeasures = true;
                osmd.rules.RenderMultipleRestMeasures = true;
                osmd.rules.DrawCredits = false;
            }

            highlightCtx = canvas.getContext('2d');
            updateStatus('Ready');
        }

        let currentTpq = 960;

        // ─── Base64 & UTF-8 Decoder Helper ────────────────────────────
        function decodeBase64ToXml(b64) {
            if (!b64) return '';
            try {
                var binary = atob(b64);
                var bytes = new Uint8Array(binary.length);
                for (var i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return new TextDecoder('utf-8').decode(bytes);
            } catch (e) {
                try {
                    return decodeURIComponent(escape(atob(b64)));
                } catch (e2) {
                    return atob(b64);
                }
            }
        }

        function sanitizeMusicXmlString(xmlString) {
            if (!xmlString) return '';
            var cleaned = xmlString
                .replace(/\s+xmlns=""/g, '')
                .replace(/\s+xmlns="http:\/\/www\.w3\.org\/1999\/xhtml"/g, '')
                .replace(/\s+data-vx-id="[^"]*"/g, '');

            // Client-side defense: strip any remaining <credit>...</credit> blocks
            cleaned = cleaned.replace(/<credit[\s\S]*?<\/credit>/gi, '');

            // Client-side defense: strip <dynamics>...</dynamics> from directions
            cleaned = cleaned.replace(/<dynamics[\s\S]*?<\/dynamics>/gi, '');

            // Client-side defense: strip <ornaments>...</ornaments> from notations
            cleaned = cleaned.replace(/<ornaments[\s\S]*?<\/ornaments>/gi, '');

            // Client-side defense: strip <sound dynamics="..."/> attribute
            cleaned = cleaned.replace(/(<sound\b[^>]*)\s+dynamics="[^"]*"/gi, '$1');

            return cleaned;
        }

        /**
         * Load and render MusicXML.
         * Called from Android via WebView.evaluateJavascript().
         */
        async function loadScore(musicXml, tpq = 960) {
            if (tpq !== undefined && typeof tpq === 'number' && tpq > 0) currentTpq = tpq;
            if (!osmd) initOSMD();

            try {
                updateStatus('Loading score...');
                loadingOverlay.classList.remove('hidden');

                var xmlToLoad = musicXml;
                if (typeof xmlToLoad === 'string' && !xmlToLoad.trim().startsWith('<')) {
                    xmlToLoad = decodeBase64ToXml(xmlToLoad.trim());
                }

                if (!xmlToLoad || typeof xmlToLoad !== 'string' || xmlToLoad.trim().length === 0) {
                    console.error('[VoxSight Renderer] loadScore: Empty XML string');
                    updateStatus('Error: No XML provided');
                    loadingOverlay.classList.add('hidden');
                    return;
                }

                try {
                    xmlDoc = new DOMParser().parseFromString(xmlToLoad, 'text/xml');
                    if (xmlDoc.querySelector('parsererror')) {
                        console.warn('DOM parser error in renderer.html');
                    } else {
                        cleanMusicXmlDom(xmlDoc);
                        xmlToLoad = new XMLSerializer().serializeToString(xmlDoc);
                    }
                } catch (e) {
                    console.warn('DOM parsing error in renderer.html:', e);
                }

                var cleanXml = sanitizeMusicXmlString(xmlToLoad);
                if (!cleanXml || cleanXml.indexOf('<score-partwise') === -1) {
                    cleanXml = xmlToLoad;
                }

                await osmd.load(cleanXml);

                // Set to fully zoomed-out view by default
                if ('zoom' in osmd) {
                    osmd.zoom = 0.4;
                } else if ('Zoom' in osmd) {
                    osmd.Zoom = 0.4;
                } else {
                    osmd.zoom = 0.4;
                }

                osmd.render();

                // Resize canvas to match rendered score
                resizeCanvas();

                // Build note map & directly color 100% of noteheads, stems, flags, beams from XML
                buildNoteMap();

                // Compute layout hash
                layoutHash = computeLayoutHash();

                loadingOverlay.classList.add('hidden');
                updateStatus(`Score loaded: ${noteCoordinates.length} notes`);

                // Notify Android that render is complete
                if (window.VoxSightBridge) {
                    window.VoxSightBridge.onRenderComplete(
                        layoutHash,
                        JSON.stringify(noteCoordinates)
                    );
                }

            } catch (err) {
                console.error('OSMD load error in renderer.html:', err);
                updateStatus('Error: ' + err.message);

                    console.warn("Failed to initialize Tone.js synth:", e);
                }
            }
            if (Tone.context && Tone.context.state !== 'running') {
                try { Tone.context.resume(); } catch (e) { }
            }
        }

        async function initSynth() {
            ensureSynth();
        }

        function playNote(midiNote, durationMs, velocity) {
            ensureSynth();
            if (synth) {
                try {
                    const freq = Tone.Frequency(midiNote, "midi").toFrequency();
                    const vel = (velocity || 80) / 127.0;
                    const dur = Math.max(0.1, (durationMs || 500) / 1000.0);
                    synth.triggerAttackRelease(freq, dur, Tone.now(), vel);
                } catch (e) {
                    console.warn("playNote error:", e);
                }
            }
        }

        // ─── Highlight API (called from Android via WebView) ────────────
        window.currentPitchOverlay = { version: 0, notes: [] };
        let overlayRafId = null;

        window.updatePitchOverlay = function (payload) {
            const data = typeof payload === "string" ? JSON.parse(payload) : payload;

            // Ignore stale frames
            if (data.version <= window.currentPitchOverlay.version) {
                return;
            }

            window.currentPitchOverlay = data;

            if (overlayRafId !== null) {
                cancelAnimationFrame(overlayRafId);
            }
            overlayRafId = requestAnimationFrame(renderPitchOverlay);
        };

        window.highlightNotes = function (notesJson) {
            try {
                const notes = typeof notesJson === 'string' ? JSON.parse(notesJson) : notesJson;
                window.updatePitchOverlay({
                    version: (window.currentPitchOverlay.version || 0) + 1,
                    notes: Array.isArray(notes) ? notes : []
                });
            } catch (e) {
                console.error("highlightNotes error:", e);
            }
        };

        /**
         * Render the pitch feedback overlay from state.
         * Uses canvas overlay — never mutates the OSMD SVG DOM.
         */
        function renderPitchOverlay() {
            if (!highlightCtx) return;

            // Clear previous highlights
            highlightCtx.clearRect(0, 0, canvas.width, canvas.height);

            try {
                const notes = window.currentPitchOverlay.notes;
                for (const note of notes) {
                    const { x, y, width, height, color } = note;
                    let r = 99, g = 102, b = 241; // Default
                    if (color) {
                        const hex = color.replace('#', '');
                        if (hex.length === 6) {
                            r = parseInt(hex.substring(0, 2), 16);
                            g = parseInt(hex.substring(2, 4), 16);
                            b = parseInt(hex.substring(4, 6), 16);
                        }
                    }

                    // Draw elegant elliptical highlight aura behind the notehead
                    highlightCtx.save();
                    highlightCtx.beginPath();

                    // Draw a soft glowing ellipse roughly the size of the note
                    const cx = x + width / 2;
                    const cy = y + height / 2;
                    const rx = width / 1.5;
                    const ry = height / 1.5;

                    highlightCtx.ellipse(cx, cy, rx, ry, 0, 0, 2 * Math.PI);

                    // Set up soft drop shadow
                    highlightCtx.shadowColor = `rgba(${r}, ${g}, ${b}, 0.8)`;
                    highlightCtx.shadowBlur = 15;

                    // Soft translucent fill for the aura
                    highlightCtx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.25)`;
                    highlightCtx.fill();

                    // Soft border ring for definition
                    highlightCtx.shadowBlur = 0;
                    highlightCtx.strokeStyle = `rgba(${r}, ${g}, ${b}, 0.6)`;
                    highlightCtx.lineWidth = 1.5;
                    highlightCtx.stroke();

                    highlightCtx.restore();
                }
            } catch (e) {
                console.error("Failed to render pitch overlay:", e);
            }
        }

        /**
         * Clear all highlights.
         */
        function clearHighlights() {
            if (!highlightCtx) return;
            window.currentPitchOverlay = { version: window.currentPitchOverlay.version + 1, notes: [] };
            if (overlayRafId !== null) {
                cancelAnimationFrame(overlayRafId);
            }
            highlightCtx.clearRect(0, 0, canvas.width, canvas.height);
        }

        /**
         * Update sync confidence display.
         */
        function updateSyncConfidence(confidence) {
            const pct = Math.round(confidence * 100);
            syncConfidence.textContent = `Sync: ${pct}%`;
            syncConfidence.style.color = pct >= 80 ? '#4ade80' :
                pct >= 50 ? '#facc15' : '#f87171';
        }

        // ─── XML Sanitization & Part Merging ──────────────────────────────────
        function cleanMusicXmlDom(doc) {
            if (!doc) return;

            // 1. Remove misplaced credit/copyright/annotation lyrics
            var creditKeywords = ['prepared', 'arranged by', 'arr.', 'composed by', 'music by', 'words by', 'lyrics by', 'copyright', 'all rights reserved', 'freely distributed', 'duplicated', 'performed', 'recorded', 'edition', 'published by', 'printed in', 'jedscott', '.com', '.org', '.net', 'http', 'www.', 'page '];
            var lyrics = doc.getElementsByTagName('lyric');
            var toRemoveLyrics = [];
            for (var i = 0; i < lyrics.length; i++) {
                var lyr = lyrics[i];
                var num = lyr.getAttribute('number') || '1';
                var text = (lyr.textContent || '').trim().toLowerCase();

                // Remove secondary orphan lyric layers (e.g. number != 1)
                if (num !== '1') {
                    toRemoveLyrics.push(lyr);
                    continue;
                }

                var isCredit = creditKeywords.some(function (kw) { return text.indexOf(kw) !== -1; });
                var isStrayAnnotation = ['descnr', 'descant', 'optional', 'scott', 'jedscott', 'arranged', 'composer'].some(function (w) { return text.indexOf(w) !== -1; });
                if (isCredit || isStrayAnnotation || (text.length > 35 && text.indexOf(' ') !== -1)) {
                    toRemoveLyrics.push(lyr);
                }
            }
            for (var i = 0; i < toRemoveLyrics.length; i++) {
                var lyr = toRemoveLyrics[i];
                if (lyr.parentNode) lyr.parentNode.removeChild(lyr);
            }

            // 2. Clean colliding footer license/copyright credits while preserving header credits
            var credits = doc.getElementsByTagName('credit');
            var toRemoveCredits = [];
            for (var c = 0; c < credits.length; c++) {
                var cr = credits[c];
                var cw = cr.getElementsByTagName('credit-words')[0];
                if (cw) {
                    var yVal = parseFloat(cw.getAttribute('default-y') || '1000');
                    var cText = (cw.textContent || '').toLowerCase();
                    if (yVal < 400 || ['distributed', 'duplicated', 'performed', 'recorded', 'prepared by', 'jedscott.com', 'all rights reserved'].some(function (w) { return cText.indexOf(w) !== -1; })) {
                        toRemoveCredits.push(cr);
                    }
                }
            }
            for (var c = 0; c < toRemoveCredits.length; c++) {
                var cr = toRemoveCredits[c];
                if (cr.parentNode) cr.parentNode.removeChild(cr);
            }

            // 3. Remove footer rights / licensing elements
            var rights = doc.getElementsByTagName('rights');
            for (var r = rights.length - 1; r >= 0; r--) {
                if (rights[r].parentNode) rights[r].parentNode.removeChild(rights[r]);
            }

            // 3a. Reconstruct Misclassified Multimeasure Rests
            try {
                var partsForRest = Array.from(doc.getElementsByTagName('part'));
                if (partsForRest.length > 0) {
                    var firstPart = partsForRest[0];
                    var firstPartMeasures = Array.from(firstPart.getElementsByTagName('measure'));
                    for (var mIdx = 0; mIdx < firstPartMeasures.length; mIdx++) {
                        var mElem = firstPartMeasures[mIdx];
                        var mrElem = mElem.querySelector('measure-style > multiple-rest');
                        if (mrElem && (mrElem.textContent || '').trim() === '1') {
                            var matchedCredit = null;
                            var matchedN = null;
                            var creditsList = Array.from(doc.getElementsByTagName('credit'));
                            for (var ci = 0; ci < creditsList.length; ci++) {
                                var cr = creditsList[ci];
                                var pageAttr = cr.getAttribute('page') || '1';
                                if (pageAttr !== '1') continue;
                                var cwList = cr.getElementsByTagName('credit-words');
                                for (var cwi = 0; cwi < cwList.length; cwi++) {
                                    var cw = cwList[cwi];
                                    var txt = (cw.textContent || '').trim();
                                    if (/^\d+$/.test(txt)) {
                                        var val = parseInt(txt, 10);
                                        if (val >= 2 && val <= 99) {
                                            var x = parseFloat(cw.getAttribute('default-x') || '0');
                                            var y = parseFloat(cw.getAttribute('default-y') || '0');
                                            if (x > 250 && y > 1400) {
                                                matchedCredit = cr;
                                                matchedN = val;
                                                break;
                                            }
                                        }
                                    }
                                }
                                if (matchedCredit) break;
                            }

                            if (matchedCredit && matchedN) {
                                var N = matchedN;
                                var startNumRaw = mElem.getAttribute('number') || '1';
                                var startNum = /^\d+$/.test(startNumRaw) ? parseInt(startNumRaw, 10) : 1;
                                var noteElem = mElem.getElementsByTagName('note')[0];
                                var durText = '12';
                                if (noteElem) {
                                    var dElem = noteElem.getElementsByTagName('duration')[0];
                                    if (dElem && dElem.textContent) durText = dElem.textContent.trim();
                                }

                                partsForRest.forEach(function(p) {
                                    var pMeasures = Array.from(p.getElementsByTagName('measure'));
                                    if (mIdx >= pMeasures.length) return;
                                    var currM = pMeasures[mIdx];
                                    var currMr = currM.querySelector('measure-style > multiple-rest');
                                    if (currMr) currMr.textContent = String(N);

                                    // Remove print-object="no" on rest notes so OSMD renders the rest
                                    var notes = Array.from(currM.getElementsByTagName('note'));
                                    notes.forEach(function(n) {
                                        if (n.hasAttribute('print-object')) n.removeAttribute('print-object');
                                    });

                                    var nextMIdx = mIdx + 1;
                                    var offset = N - 1;
                                    if (nextMIdx < pMeasures.length) {
                                        var nextNumRaw = pMeasures[nextMIdx].getAttribute('number') || '1';
                                        if (/^\d+$/.test(nextNumRaw)) {
                                            offset = (startNum + N) - parseInt(nextNumRaw, 10);
                                        }
                                    }

                                    var refNode = currM.nextSibling;
                                    for (var k = 1; k < N; k++) {
                                        var placeholderNum = String(startNum + k);
                                        var placeholderM = doc.createElement('measure');
                                        placeholderM.setAttribute('number', placeholderNum);
                                        var nElem = doc.createElement('note');
                                        var rElem = doc.createElement('rest');
                                        rElem.setAttribute('measure', 'yes');
                                        var durEl = doc.createElement('duration');
                                        durEl.textContent = durText;
                                        nElem.appendChild(rElem);
                                        nElem.appendChild(durEl);
                                        placeholderM.appendChild(nElem);
                                        p.insertBefore(placeholderM, refNode);
                                    }

                                    var updatedMeasures = Array.from(p.getElementsByTagName('measure'));
                                    for (var smIdx = mIdx + N; smIdx < updatedMeasures.length; smIdx++) {
                                        var sm = updatedMeasures[smIdx];
                                        var smNumRaw = sm.getAttribute('number');

                                        }
                                    }
                                });

                                    matchedCredit.parentNode.removeChild(matchedCredit);
                                }

                                break;
                            }
                        }
                    }
                }
            } catch (err) {
                console.warn('[cleanMusicXmlDom] Multimeasure rest repair error:', err);
            }

            // 3b. Prune Non-SATB Accompaniment (Piano, Organ, Keyboard, Guitar, etc.) and Solo staves
            var accompKeywords = ['piano', 'pno', 'keyboard', 'kbd', 'organ', 'org', 'accomp', 'accompaniment', 'guitar', 'gtr', 'harp', 'strings', 'orchestra', 'synth', 'continuo'];
            var soloKeywords = ['solo', 'cantor', 'leader', 'soloist', 'obbligato', 'descant'];
            var vocalKeywords = ['soprano', 'alto', 'tenor', 'bass', 's/a', 'sa', 't/b', 'tb', 's', 'a', 't', 'b', 'women', 'men', 'treble'];

            var allPartsList = Array.from(doc.getElementsByTagName('part'));
            var partListElem = doc.getElementsByTagName('part-list')[0];

            if (partListElem && allPartsList.length > 1) {
                var partMeta = allPartsList.map(function(p) {
                    var pid = p.getAttribute('id');
                    var sp = partListElem.querySelector("score-part[id='" + pid + "']");
                    var pName = (sp && sp.querySelector('part-name')) ? (sp.querySelector('part-name').textContent || '').trim().toLowerCase() : '';
                    var pAbbr = (sp && sp.querySelector('part-abbreviation')) ? (sp.querySelector('part-abbreviation').textContent || '').trim().toLowerCase() : '';
                    var instr = (sp && sp.querySelector('instrument-name')) ? (sp.querySelector('instrument-name').textContent || '').trim().toLowerCase() : '';
                    var midiProgElem = sp ? sp.querySelector('midi-program') : null;
                    var midiProg = midiProgElem ? parseInt(midiProgElem.textContent, 10) : -1;

                    var stavesElem = p.querySelector('attributes > staves');
                    var stavesCount = stavesElem ? (parseInt(stavesElem.textContent, 10) || 1) : 1;

                    var lyrics = p.querySelectorAll('lyric text');
                    var validLyrics = 0;
                    lyrics.forEach(function(l) {
                        var txt = (l.textContent || '').trim();
                        if (txt.length > 1 || /[a-zA-Z]/.test(txt)) validLyrics++;
                    });

                    var notes = p.querySelectorAll('note');
                    var noteCount = notes.length;
                    var chords = p.querySelectorAll('note > chord').length;

                    var pNameNorm = pName.replace(/[\s.]+/g, '');
                    var pAbbrNorm = pAbbr.replace(/[\s.]+/g, '');

                    var isExplicitSolo = soloKeywords.some(function(kw) {
                        return pName.indexOf(kw) !== -1 || pAbbr.indexOf(kw) !== -1 || instr.indexOf(kw) !== -1;
                    }) || pNameNorm === 'sol' || pNameNorm === 'solo' || pAbbrNorm === 'sol' || pAbbrNorm === 'solo' || pName.indexOf('sol.') !== -1;

                    var isExplicitAccomp = accompKeywords.some(function(kw) {
                        return pName.indexOf(kw) !== -1 || pAbbr.indexOf(kw) !== -1 || instr.indexOf(kw) !== -1;
                    }) || ['piano', 'pno', 'org', 'organ', 'kbd', 'keyboard', 'gtr', 'guitar'].indexOf(pNameNorm) !== -1 || (midiProg >= 1 && midiProg <= 8) || (midiProg >= 17 && midiProg <= 24);

                    var isVocalName = vocalKeywords.some(function(kw) {
                        var kwNorm = kw.replace(/[\s.]+/g, '');
                        return pName === kw || pAbbr === kw || pNameNorm === kwNorm || pName.startsWith(kw + ' ') || pName.indexOf('/' + kw) !== -1;
                    });

                    return {
                        partElem: p,
                        scorePartElem: sp,
                        id: pid,
                        name: pName,
                        abbr: pAbbr,
                        staves: stavesCount,
                        noteCount: noteCount,
                        validLyrics: validLyrics,
                        chords: chords,
                        isExplicitSolo: isExplicitSolo,
                        isExplicitAccomp: isExplicitAccomp,
                        isVocalName: isVocalName
                    };
                });

                var choralVocalParts = partMeta.filter(function(m) {
                    return !m.isExplicitSolo && !m.isExplicitAccomp && (m.isVocalName || m.validLyrics >= 5);
                });

                if (choralVocalParts.length >= 2 || (choralVocalParts.length >= 1 && allPartsList.length >= 3)) {
                    var toPrune = [];

                    partMeta.forEach(function(m) {
                        if (m.isExplicitAccomp) {
                            toPrune.push(m);
                            return;
                        }
                        if (m.isExplicitSolo && choralVocalParts.length >= 2) {
                            toPrune.push(m);
                            return;
                        }
                        if (m.staves >= 2 && m.validLyrics < 5) {
                            toPrune.push(m);
                            return;
                        }
                        // Non-vocal parts with negligible/no lyrics (e.g. instrument accompaniment or stray OCR staff)
                        if (choralVocalParts.indexOf(m) === -1 && !m.isVocalName) {
                            var lyricRatio = m.noteCount > 0 ? (m.validLyrics / m.noteCount) : 0;
                            if (lyricRatio < 0.08 && (m.chords > 0 || m.validLyrics <= 2)) {
                                toPrune.push(m);
                                return;
                            }
                        }
                    });

                    if (toPrune.length > 0 && (allPartsList.length - toPrune.length) >= 1) {
                        toPrune.forEach(function(m) {
                            if (m.partElem && m.partElem.parentNode) {
                                m.partElem.parentNode.removeChild(m.partElem);
                            }
                            if (m.scorePartElem && m.scorePartElem.parentNode) {
                                m.scorePartElem.parentNode.removeChild(m.scorePartElem);
                            }
                        });
                    }
                }
            }

            // 4. Detect and merge complementary parts (e.g. S/A + Alto, T/B + Bass, or S, A, T, B + Soprano, Alto, Tenor, Bass)
            var partList = doc.getElementsByTagName('part-list')[0];
            var parts = doc.getElementsByTagName('part');
            if (!partList || parts.length < 2) return;

            var nameMap = {
                's': 'Soprano', 'sop': 'Soprano', 'sopr': 'Soprano', 'soprano': 'Soprano',
                'a': 'Alto', 'alt': 'Alto', 'alto': 'Alto',
                't': 'Tenor', 'ten': 'Tenor', 'tenor': 'Tenor',
                'b': 'Bass', 'bas': 'Bass', 'bass': 'Bass'
            };

            var tier1Names = new Set(['s', 'sop', 'sopr', 'soprano', 'a', 'alt', 'alto', 's/a', 'sa', 's.a.', 'soprano/alto', 'soprano / alto', 'women', 'treble', 's1', 's2', 'a1', 'a2']);
            var tier2Names = new Set(['t', 'ten', 'tenor', 'b', 'bas', 'bass', 't/b', 'tb', 't.b.', 'tenor/bass', 'tenor / bass', 'men', 't1', 't2', 'b1', 'b2']);

            function getChoralTier(n) {
                var s = (n || '').trim().toLowerCase();
                if (tier1Names.has(s)) return 1;
                if (tier2Names.has(s)) return 2;
                return 0;
            }

            function getCompositePartNameAndAbbr(raw1, raw2) {
                var r1 = (raw1 || '').trim();
                var r2 = (raw2 || '').trim();
                var compMap = {
                    's/a': ['Soprano / Alto', 'S/A'],
                    'sa': ['Soprano / Alto', 'S/A'],
                    't/b': ['Tenor / Bass', 'T/B'],
                    'tb': ['Tenor / Bass', 'T/B'],
                    's/t': ['Soprano / Tenor', 'S/T'],
                    'st': ['Soprano / Tenor', 'S/T'],
                    'a/b': ['Alto / Bass', 'A/B'],
                    'ab': ['Alto / Bass', 'A/B']
                };
                if (compMap[r1.toLowerCase()]) return compMap[r1.toLowerCase()];
                if (compMap[r2.toLowerCase()]) return compMap[r2.toLowerCase()];

                var t1 = getChoralTier(r1);
                var t2 = getChoralTier(r2);
                if (t1 === 1 || t2 === 1) {
                    if ((r1.toLowerCase().indexOf('alto') !== -1 || r2.toLowerCase().indexOf('alto') !== -1) &&
                        (r1.toLowerCase().indexOf('sop') !== -1 || r2.toLowerCase().indexOf('sop') !== -1 || r1.toLowerCase().indexOf('s/a') !== -1 || r2.toLowerCase().indexOf('s/a') !== -1)) {
                        return ['Soprano / Alto', 'S/A'];
                    }
                }
                if (t1 === 2 || t2 === 2) {
                    if ((r1.toLowerCase().indexOf('bass') !== -1 || r2.toLowerCase().indexOf('bass') !== -1) &&
                        (r1.toLowerCase().indexOf('ten') !== -1 || r2.toLowerCase().indexOf('ten') !== -1 || r1.toLowerCase().indexOf('t/b') !== -1 || r2.toLowerCase().indexOf('t/b') !== -1)) {
                        return ['Tenor / Bass', 'T/B'];
                    }
                }

                var cName = r1.length >= r2.length ? r1 : r2;
                var abbr = cName.length > 4 ? cName.slice(0, 4) : cName;
                return [cName, abbr];
            }

            var partInfo = [];
            for (var i = 0; i < parts.length; i++) {
                var p = parts[i];
                var pid = p.getAttribute('id');
                var sp = doc.querySelector("score-part[id='" + pid + "']");
                var rawName = (sp && sp.getElementsByTagName('part-name')[0]) ? sp.getElementsByTagName('part-name')[0].textContent.trim() : pid;
                var rawAbbr = (sp && sp.getElementsByTagName('part-abbreviation')[0]) ? sp.getElementsByTagName('part-abbreviation')[0].textContent.trim() : rawName;
                var normName = nameMap[rawName.toLowerCase()] || rawName;
                var tier = getChoralTier(rawName);

                var measures = {};
                var measElems = p.getElementsByTagName('measure');
                for (var m = 0; m < measElems.length; m++) {
                    var me = measElems[m];
                    var mnum = me.getAttribute('number');
                    var notes = me.getElementsByTagName('note');
                    var nonRest = 0;
                    for (var n = 0; n < notes.length; n++) {
                        if (notes[n].getElementsByTagName('rest').length === 0) nonRest++;
                    }
                    measures[mnum] = (measures[mnum] || 0) + nonRest;
                }
                partInfo.push({ element: p, scorePart: sp, pid: pid, rawName: rawName, rawAbbr: rawAbbr, normName: normName, tier: tier, measures: measures });
            }

            var mergedPids = new Set();
            var mergePairs = [];
            for (var i = 0; i < partInfo.length; i++) {
                var p1 = partInfo[i];
                if (mergedPids.has(p1.pid)) continue;
                for (var j = i + 1; j < partInfo.length; j++) {
                    var p2 = partInfo[j];
                    if (mergedPids.has(p2.pid)) continue;

                    var tierMatch = (p1.tier !== 0 && p1.tier === p2.tier);
                    var nameMatch = (p1.normName.toLowerCase() === p2.normName.toLowerCase()) || tierMatch || (partInfo.length === 8 && j === i + 4);
                    if (nameMatch) {
                        var overlap = false;
                        for (var mnum in p1.measures) {
                            if (p2.measures[mnum] && p1.measures[mnum] > 0 && p2.measures[mnum] > 0) {
                                overlap = true;
                                break;
                            }
                        }
                        if (!overlap) {
                            var compNames = getCompositePartNameAndAbbr(p1.rawName, p2.rawName);
                            mergePairs.push({ p1: p1, p2: p2, canonName: compNames[0], canonAbbr: compNames[1] });
                            mergedPids.add(p1.pid);
                            mergedPids.add(p2.pid);
                            break;
                        }
                    }
                }
            }

            for (var i = 0; i < mergePairs.length; i++) {
                var pair = mergePairs[i];
                var elem1 = pair.p1.element;
                var elem2 = pair.p2.element;
                var sp1 = pair.p1.scorePart;
                var sp2 = pair.p2.scorePart;

                if (sp1) {
                    var pn = sp1.getElementsByTagName('part-name')[0];
                    if (!pn) {
                        pn = doc.createElement('part-name');
                        sp1.appendChild(pn);
                    }
                    pn.textContent = pair.canonName;

                    var pa = sp1.getElementsByTagName('part-abbreviation')[0];
                    if (!pa) {
                        pa = doc.createElement('part-abbreviation');
                        sp1.appendChild(pa);
                    }
                    pa.textContent = pair.canonAbbr;
                }

                var seenM2Nums = {};
                var m2List = elem2.getElementsByTagName('measure');
                var m2Arr = Array.prototype.slice.call(m2List);
                for (var m = 0; m < m2Arr.length; m++) {
                    var m2 = m2Arr[m];
                    var mnum = m2.getAttribute('number');
                    var k = seenM2Nums[mnum] || 0;
                    seenM2Nums[mnum] = k + 1;

                    var notes2 = m2.getElementsByTagName('note');
                    var hasNotes2 = false;
                    for (var n = 0; n < notes2.length; n++) {
                        if (notes2[n].getElementsByTagName('rest').length === 0) { hasNotes2 = true; break; }
                    }
                    if (hasNotes2) {
                        var m1Candidates = elem1.querySelectorAll("measure[number='" + mnum + "']");
                        if (m1Candidates && m1Candidates.length > 0) {
                            var targetM1 = (k < m1Candidates.length) ? m1Candidates[k] : m1Candidates[0];

                            var tNotes = targetM1.getElementsByTagName('note');
                            var tHasNotes = false;
                            for (var tn = 0; tn < tNotes.length; tn++) {
                                if (tNotes[tn].getElementsByTagName('rest').length === 0) { tHasNotes = true; break; }
                            }

                            // Only replace targetM1 if targetM1 is a pure rest (no pitched notes)
                            if (!tHasNotes) {
                                var m2Clone = m2.cloneNode(true);

                                // Preserve <measure-style> (contains <multiple-rest>) from the target
                                var targetMeasureStyles = targetM1.getElementsByTagName('measure-style');
                                for (var msi = 0; msi < targetMeasureStyles.length; msi++) {
                                    var msClone = targetMeasureStyles[msi].cloneNode(true);
                                    var cloneAttrs = m2Clone.getElementsByTagName('attributes')[0];
                                    if (!cloneAttrs) {
                                        cloneAttrs = doc.createElement('attributes');
                                        m2Clone.insertBefore(cloneAttrs, m2Clone.firstChild);
                                    }
                                    cloneAttrs.appendChild(msClone);
                                }

                                var tAttrs = targetM1.getElementsByTagName('attributes')[0];
                                var m2Attrs = m2Clone.getElementsByTagName('attributes')[0];
                                if (tAttrs && !m2Attrs) {
                                    m2Clone.insertBefore(tAttrs.cloneNode(true), m2Clone.firstChild);
                                } else if (tAttrs && m2Attrs) {
                                    for (var ch = 0; ch < tAttrs.children.length; ch++) {
                                        var tag = tAttrs.children[ch].tagName;
                                        if (tag === 'measure-style') continue; // already handled above
                                        if (!m2Attrs.getElementsByTagName(tag)[0]) {
                                            m2Attrs.appendChild(tAttrs.children[ch].cloneNode(true));
                                        }
                                    }
                                }
                                elem1.replaceChild(m2Clone, targetM1);
                            }
                        } else {
                            elem1.appendChild(m2.cloneNode(true));
                        }
                    }
                }

                if (elem2.parentNode) elem2.parentNode.removeChild(elem2);
                if (sp2 && sp2.parentNode) sp2.parentNode.removeChild(sp2);
            }

            // 5. Clef fallback: ensure every surviving part has a clef in measure 1
            var finalParts = doc.getElementsByTagName('part');
            for (var pIdx = 0; pIdx < finalParts.length; pIdx++) {
                var fPart = finalParts[pIdx];
                var fM1 = fPart.getElementsByTagName('measure')[0];
                if (fM1) {
                    var clefEl = fM1.querySelector('attributes > clef, clef');
                    if (!clefEl) {
                        var totalPitch = 0;
                        var countPitch = 0;
                        var stepToSemi = { 'C': 0, 'D': 2, 'E': 4, 'F': 5, 'G': 7, 'A': 9, 'B': 11 };
                        var allNotes = fPart.getElementsByTagName('note');
                        for (var nIdx = 0; nIdx < allNotes.length; nIdx++) {
                            var pEl = allNotes[nIdx].getElementsByTagName('pitch')[0];
                            if (pEl) {
                                var st = (pEl.getElementsByTagName('step')[0] ? pEl.getElementsByTagName('step')[0].textContent.trim().toUpperCase() : 'C');
                                var oc = parseInt(pEl.getElementsByTagName('octave')[0] ? pEl.getElementsByTagName('octave')[0].textContent.trim() : '4', 10);
                                var semi = (oc + 1) * 12 + (stepToSemi[st] || 0);
                                totalPitch += semi;
                                countPitch++;
                            }
                        }
                        var avgMidi = countPitch > 0 ? (totalPitch / countPitch) : 60;
                        var attrsEl = fM1.getElementsByTagName('attributes')[0];
                        if (!attrsEl) {
                            attrsEl = doc.createElement('attributes');
                            fM1.insertBefore(attrsEl, fM1.firstChild);
                        }
                        var newSign = doc.createElement('sign');
                        var newLine = doc.createElement('line');
                        var pNameLower = ((fPart.getAttribute('id') || '') + ' ' + (fPart.getElementsByTagName('part-name')[0] ? fPart.getElementsByTagName('part-name')[0].textContent : '')).toLowerCase();
                        if (avgMidi < 60 || pNameLower.indexOf('bass') !== -1 || pNameLower.indexOf('tenor') !== -1 || pNameLower.indexOf('t/b') !== -1) {
                            newSign.textContent = 'F';
                            newLine.textContent = '4';
                        } else {
                            newSign.textContent = 'G';
                            newLine.textContent = '2';
                        }
                        newClef.appendChild(newSign);
                        newClef.appendChild(newLine);
                        attrsEl.appendChild(newClef);
                    }
                }
            }

            // 6. Ensure any measure without notes has an explicit full-measure rest
            for (var pIdx = 0; pIdx < finalParts.length; pIdx++) {
                var fPart = finalParts[pIdx];
                var fMeasures = fPart.getElementsByTagName('measure');
                for (var mIdx = 0; mIdx < fMeasures.length; mIdx++) {
                    var fM = fMeasures[mIdx];
                    if (fM.getElementsByTagName('note').length === 0) {
                        var restNote = doc.createElement('note');
                        var restElem = doc.createElement('rest');
                        restElem.setAttribute('measure', 'yes');
                        var durElem = doc.createElement('duration');
                        durElem.textContent = '12';
                        var voiceElem = doc.createElement('voice');
                        voiceElem.textContent = '1';
                        restNote.appendChild(restElem);
                        restNote.appendChild(durElem);
                        restNote.appendChild(voiceElem);
                        fM.appendChild(restNote);
                    } else {
                        // NOTE: Do NOT strip <measure-style> here. After voice merging,
                        // a measure may legitimately have both pitched notes (from one voice)
                        // and <multiple-rest> (from the other voice's rest). Stripping would
                        // destroy valid H-bar rendering data.
                    }
                }
            }

        }

        // ─── Utilities ──────────────────────────────────────────────────
        function updateStatus(msg) {
            statusText.textContent = msg;
            console.log('[VoxSight]', msg);
        }

        // Handle window resize — invalidate layout only on real window/orientation changes
        let lastWindowWidth = window.innerWidth;
        let lastWindowHeight = window.innerHeight;
        let resizeTimer = null;

        window.addEventListener('resize', () => {
            if (window.innerWidth === lastWindowWidth && window.innerHeight === lastWindowHeight) {
                return;
            }
            lastWindowWidth = window.innerWidth;
            lastWindowHeight = window.innerHeight;

            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                resizeCanvas();
                const newHash = computeLayoutHash();
                if (newHash !== layoutHash && !window.__vx_is_internal_render) {
                    layoutHash = newHash;
                    extractNoteCoordinates();
                    updateStatus('Layout changed — re-extracted coordinates');

                    if (window.VoxSightBridge) {
                        window.VoxSightBridge.onLayoutChanged(
                            layoutHash,
                            JSON.stringify(noteCoordinates)
                        );
                    }
                }
            }, 300);
        });

        // Initialize on load
        initOSMD();

        if (window.location.search.indexOf('score=') !== -1) {
            var scoreParam = new URLSearchParams(window.location.search).get('score');
            if (scoreParam) {
                fetch(scoreParam).then(function (r) { return r.text(); }).then(function (xml) {
                    loadScore(xml);
                });
            }
        }
    </script>
</body>
