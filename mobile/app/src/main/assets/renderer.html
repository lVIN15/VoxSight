                    if (/^(soprano|sopr|sop|s)1?$/.test(s)) return 10;
                    if (/^(soprano|sopr|sop|s)2$/.test(s)) return 20;
                    if (/^(soprano|sopr|sop|s)[3-9]$/.test(s)) return 25;
                    if (/^(mezzosoprano|mezzo)$/.test(s)) return 28;
                    if (/^(alto|alt|a|contralto)1?$/.test(s)) return 30;
                    if (/^(alto|alt|a|contralto)2$/.test(s)) return 40;
                    if (/^(alto|alt|a|contralto)[3-9]$/.test(s)) return 45;
                    if (/^(sa|sopranoalto)$/.test(s)) return 48;
                    if (/^(tenor|ten|t)1?$/.test(s)) return 50;
                    if (/^(tenor|ten|t)2$/.test(s)) return 60;
                    if (/^(tenor|ten|t)[3-9]$/.test(s)) return 65;
                    if (/^(baritone|bar)$/.test(s)) return 70;
                    if (/^(bass|bas|b)1?$/.test(s)) return 80;
                    if (/^(bass|bas|b)2$/.test(s)) return 90;
                    if (/^(bass|bas|b)[3-9]$/.test(s)) return 95;
                    if (/^(tb|tenorbass)$/.test(s)) return 98;
                    return 100;
                }

                // Unconditional purge of any stray or voice parts in choral scores
                var allParts = Array.from(doc.getElementsByTagName('part'));
                var hasAuthenticChoral = allParts.some(function(p) {
                    var sp = doc.querySelector("score-part[id='" + p.getAttribute('id') + "']");
                    var name = (sp && sp.querySelector('part-name') ? sp.querySelector('part-name').textContent : '').trim();
                    return getVoiceOrderRank(name) < 100;
                });
                if (hasAuthenticChoral) {
                    allParts.forEach(function(p) {
                        var pid = p.getAttribute('id');
                        var sp = doc.querySelector("score-part[id='" + pid + "']");
                        var name = (sp && sp.querySelector('part-name') ? sp.querySelector('part-name').textContent : '').trim().toLowerCase();
                        if (name.indexOf('voice') !== -1 || isStrayVoiceName(name)) {
                            console.log('[sortChoralParts] Purging unneeded voice part ' + pid + ' (' + name + ')');
                            if (p.parentNode) p.parentNode.removeChild(p);
                            if (sp && sp.parentNode) sp.parentNode.removeChild(sp);
                        }
                    });
                }

                var scoreParts = Array.from(pList.getElementsByTagName('score-part'));
                if (scoreParts.length <= 1) return;

                scoreParts.sort(function(a, b) {
                    var na = (a.querySelector('part-name') ? a.querySelector('part-name').textContent : '').trim();
                    var nb = (b.querySelector('part-name') ? b.querySelector('part-name').textContent : '').trim();
                    return getVoiceOrderRank(na) - getVoiceOrderRank(nb);
                });

                scoreParts.forEach(function(sp) {
                    pList.appendChild(sp);
                });

                var orderedPids = scoreParts.map(function(sp) { return sp.getAttribute('id'); });
                var partsMap = {};
                Array.from(doc.getElementsByTagName('part')).forEach(function(p) {
                    partsMap[p.getAttribute('id')] = p;
                });

                orderedPids.forEach(function(pid) {
                    if (partsMap[pid]) {
                        rootElem.appendChild(partsMap[pid]);
                    }
                });
            })();

            // 4b. Universal Choral Lyric Synchronization & Dynamic Disambiguation
            (function synchronizeChoralLyricsDom() {
                var dynRegex = /^([pP]{1,4}|[fF]{1,4}|[mM][pPfF]|[sS][fF][zZ]?|[rR][fF][zZ]?|[fF][pP]|[fF][zZ])\.?$/;
                var authenticLetters = { 'a': 1, 'i': 1, 'o': 1, 'e': 1 };
                var commonLWords = { 'lift': 1, 'lord': 1, 'love': 1, 'life': 1, 'light': 1, 'lead': 1, 'live': 1, 'line': 1, 'lost': 1, 'land': 1, 'loud': 1, 'lamb': 1 };
                var commonOmrFusions = {
                    'thehouse': 'the house', 'thelord': 'the Lord', 'theking': 'the King', 'theearth': 'the earth',
                    'allmy': 'all my', 'allthe': 'all the', 'allour': 'all our',
                    'myhead': 'my head', 'myheart': 'my heart', 'mysoul': 'my soul', 'myvoice': 'my voice', 'mylord': 'my Lord',
                    'gazeon': 'gaze on', 'walkin': 'walk in', 'walkon': 'walk on', 'livein': 'live in', 'trustin': 'trust in',
                    'bringsme': 'brings me', 'givesme': 'gives me', 'leadsme': 'leads me', 'savesme': 'saves me', 'hearmer': 'hear me',
                    'upmy': 'up my', 'uponmy': 'upon my', 'umphthat': 'umph that',
                    'shei': 'shelter', 'sheiter': 'shelter'
                };

                function normalizeLyricStr(txt) {
                    if (!txt) return txt;
                    txt = txt.replace(/[|\\~]/g, '').trim();
                    txt = txt.replace(/([a-zA-Z])II/g, '$1ll').replace(/\baII\b/g, 'all').replace(/\baII([a-z])/g, 'all$1');
                    txt = txt.replace(/([a-z])([A-Z])/g, '$1 $2');
                    txt = txt.replace(/\b([a-zA-Z]{3,})l\b/g, function(match, stem) {
                        var low = stem.toLowerCase();
                        if (['thing', 'sing', 'that', 'with', 'and', 'as', 'for', 'when', 'if', 'hear'].indexOf(low) !== -1) {
                            return stem + ' I';
                        }
                        return match;
                    });
                    txt = txt.replace(/\bI[a-zA-Z]{3,}\b/g, function(match) {
                        var lowAsL = 'l' + match.slice(1).toLowerCase();
                        if (commonLWords[lowAsL]) {
                            return (match[1] === match[1].toLowerCase() && match[0] === 'I' ? 'L' : 'l') + match.slice(1);
                        }
                        return match;
                    });
                    var words = txt.split(/\s+/);
                    var outWords = [];
                    for (var wIdx = 0; wIdx < words.length; wIdx++) {
                        var w = words[wIdx];
                        var cleanW = w.replace(/[.,!?;:]+$/, '');
                        var punc = w.slice(cleanW.length);
                        var lowW = cleanW.toLowerCase();
                        if (commonOmrFusions[lowW]) {
                            var rep = commonOmrFusions[lowW];
                            if (cleanW[0] === cleanW[0].toUpperCase() && rep[0] === rep[0].toLowerCase()) {
                                rep = rep[0].toUpperCase() + rep.slice(1);
                            }
                            outWords.push(rep + punc);
                        } else {
                            outWords.push(w);
                        }
                    }
                    return outWords.join(' ');
                }

                // Strip stray dynamic markings from note <lyric>
                var allNotes = doc.getElementsByTagName('note');
                for (var n = 0; n < allNotes.length; n++) {
                    var noteEl = allNotes[n];
                    var noteLyrics = noteEl.getElementsByTagName('lyric');
                    for (var lIdx = noteLyrics.length - 1; lIdx >= 0; lIdx--) {
                        var lyrEl = noteLyrics[lIdx];
                        var textNodes = lyrEl.getElementsByTagName('text');
                        var lyrTxt = '';
                        for (var tn = 0; tn < textNodes.length; tn++) {
                            lyrTxt += (textNodes[tn].textContent || '');
                        }
                        lyrTxt = lyrTxt.trim();
                        if (dynRegex.test(lyrTxt) && !authenticLetters[lyrTxt.toLowerCase()]) {
                            if (lyrEl.parentNode) lyrEl.parentNode.removeChild(lyrEl);
                        } else if (lyrTxt) {
                            var normalized = normalizeLyricStr(lyrTxt);
                            if (textNodes[0] && normalized !== lyrTxt) {
                                textNodes[0].textContent = normalized;
                            }
                        }
                    }
                }

                // Onset-based cross-part synchronization
                var curParts = doc.getElementsByTagName('part');
                if (curParts.length < 2) return;

                var measureNums = [];
                var seenMNums = {};
                for (var p = 0; p < curParts.length; p++) {
                    var mList = curParts[p].getElementsByTagName('measure');
                    for (var m = 0; m < mList.length; m++) {
                        var num = mList[m].getAttribute('number');
                        if (num && !seenMNums[num]) {
                            seenMNums[num] = true;
                            measureNums.push(num);
                        }
                    }
                }

                for (var mi = 0; mi < measureNums.length; mi++) {
                    var mNum = measureNums[mi];
                    var partNotes = {};
                    var partLyrics = {};
                    var measurePool = {};

                    for (var pi = 0; pi < curParts.length; pi++) {
                        var pElem = curParts[pi];
                        var pid = pElem.getAttribute('id') || ('P' + (pi + 1));
                        var mElem = pElem.querySelector("measure[number='" + mNum + "']");
                        if (!mElem) continue;

                        var noteList = [];
                        var currTick = 0;
                        var lastNoteDur = 0;
                        var children = mElem.children;

                        for (var ci = 0; ci < children.length; ci++) {
                            var ch = children[ci];
                            var tag = ch.tagName.toLowerCase();
                            if (tag === 'note') {
                                var isChord = ch.getElementsByTagName('chord').length > 0;
                                var isRest = ch.getElementsByTagName('rest').length > 0;
                                var durEl = ch.getElementsByTagName('duration')[0];
                                var dur = durEl ? parseInt(durEl.textContent.trim() || '0', 10) : 0;
                                var onset = isChord ? (currTick - lastNoteDur) : currTick;
                                if (!isChord) {
                                    currTick += dur;
                                    lastNoteDur = dur;
                                }
                                if (!isRest && !isChord) {
                                    noteList.push({ onset: onset, note: ch });
                                }
                            } else if (tag === 'backup') {
                                var bDurEl = ch.getElementsByTagName('duration')[0];
                                var bDur = bDurEl ? parseInt(bDurEl.textContent.trim() || '0', 10) : 0;
                                currTick -= bDur;
                            } else if (tag === 'forward') {
                                var fDurEl = ch.getElementsByTagName('duration')[0];
                                var fDur = fDurEl ? parseInt(fDurEl.textContent.trim() || '0', 10) : 0;
                                currTick += fDur;
                            }
                        }

                        partNotes[pid] = noteList;

                        for (var nIdx = 0; nIdx < noteList.length; nIdx++) {
                            var nItem = noteList[nIdx];
                            var lyr = nItem.note.getElementsByTagName('lyric')[0];
                            if (lyr) {
                                var txtEl = lyr.getElementsByTagName('text')[0];
                                var lText = txtEl ? (txtEl.textContent || '').trim() : '';
                                if (lText && !dynRegex.test(lText)) {
                                    if (!partLyrics[pid]) partLyrics[pid] = {};
                                    partLyrics[pid][nItem.onset] = lyr;
                                    if (!measurePool[nItem.onset]) {
                                        measurePool[nItem.onset] = lyr;
                                    } else {
                                        var existingTxt = (measurePool[nItem.onset].textContent || '').trim();
                                        if (lText.length > existingTxt.length) {
                                            measurePool[nItem.onset] = lyr;
                                        }
                                    }
                                }
                            }
                        }
                    }

                    if (Object.keys(measurePool).length === 0) continue;

                    // NOTE: Forced lyric cloning disabled to protect polyphony & staggered entrances.
                    // In pieces like "Be Not Afraid", the Solo sings while SATB rests — copying
                    // Solo lyrics onto resting choir parts corrupts the score.
                    // for (var pi = 0; pi < curParts.length; pi++) {
                    //     var pElem = curParts[pi];
                    //     var pid = pElem.getAttribute('id') || ('P' + (pi + 1));
                    //     var nList = partNotes[pid];
                    //     if (!nList) continue;
                    //
                    //     var pLyrMap = partLyrics[pid] || {};
                    //     for (var nIdx = 0; nIdx < nList.length; nIdx++) {
                    //         var nItem = nList[nIdx];
                    //         if (!pLyrMap[nItem.onset] && measurePool[nItem.onset]) {
                    //             var clonedLyr = measurePool[nItem.onset].cloneNode(true);
                    //             nItem.note.appendChild(clonedLyr);
                    //         }
                    //     }
                    // }
                }
            })();

            // 5. Clef fallback: ensure every surviving part has a clef in measure 1
            var finalParts = doc.getElementsByTagName('part');
            for (var pIdx = 0; pIdx < finalParts.length; pIdx++) {
                var fPart = finalParts[pIdx];
                var fM1 = fPart.getElementsByTagName('measure')[0];
                if (fM1) {
                    var clefEl = fM1.querySelector('attributes > clef, clef');
                    if (!clefEl) {
                        var totalPitch = 0;
                        var countPitch = 0;
                        var stepToSemi = { 'C': 0, 'D': 2, 'E': 4, 'F': 5, 'G': 7, 'A': 9, 'B': 11 };
                        var allNotes = fPart.getElementsByTagName('note');
                        for (var nIdx = 0; nIdx < allNotes.length; nIdx++) {
                            var pEl = allNotes[nIdx].getElementsByTagName('pitch')[0];
                            if (pEl) {
                                var st = (pEl.getElementsByTagName('step')[0] ? pEl.getElementsByTagName('step')[0].textContent.trim().toUpperCase() : 'C');
                                var oc = parseInt(pEl.getElementsByTagName('octave')[0] ? pEl.getElementsByTagName('octave')[0].textContent.trim() : '4', 10);
                                var semi = (oc + 1) * 12 + (stepToSemi[st] || 0);
                                totalPitch += semi;
                                countPitch++;
                            }
                        }
                        var avgMidi = countPitch > 0 ? (totalPitch / countPitch) : 60;
                        var attrsEl = fM1.getElementsByTagName('attributes')[0];
                        if (!attrsEl) {
                            attrsEl = doc.createElement('attributes');
                            fM1.insertBefore(attrsEl, fM1.firstChild);
                        }
                        var newSign = doc.createElement('sign');
                        var newLine = doc.createElement('line');
                        var pNameLower = ((fPart.getAttribute('id') || '') + ' ' + (fPart.getElementsByTagName('part-name')[0] ? fPart.getElementsByTagName('part-name')[0].textContent : '')).toLowerCase();
                        if (avgMidi < 60 || pNameLower.indexOf('bass') !== -1 || pNameLower.indexOf('tenor') !== -1 || pNameLower.indexOf('t/b') !== -1) {
                            newSign.textContent = 'F';
                            newLine.textContent = '4';
                        } else {
                            newSign.textContent = 'G';
                            newLine.textContent = '2';
                        }
                        newClef.appendChild(newSign);
                        newClef.appendChild(newLine);
                        attrsEl.appendChild(newClef);
                    }
                }
            }

            // 6. Ensure any measure without notes has an explicit full-measure rest
            for (var pIdx = 0; pIdx < finalParts.length; pIdx++) {
                var fPart = finalParts[pIdx];
                var fMeasures = fPart.getElementsByTagName('measure');
                for (var mIdx = 0; mIdx < fMeasures.length; mIdx++) {
                    var fM = fMeasures[mIdx];
                    if (fM.getElementsByTagName('note').length === 0) {
                        var restNote = doc.createElement('note');
                        var restElem = doc.createElement('rest');
                        restElem.setAttribute('measure', 'yes');
                        var durElem = doc.createElement('duration');
                        durElem.textContent = '12';
                        var voiceElem = doc.createElement('voice');
                        voiceElem.textContent = '1';
                        restNote.appendChild(restElem);
                        restNote.appendChild(durElem);
                        restNote.appendChild(voiceElem);
                        fM.appendChild(restNote);
                    } else {
                        // NOTE: Do NOT strip <measure-style> here. After voice merging,
                        // a measure may legitimately have both pitched notes (from one voice)
                        // and <multiple-rest> (from the other voice's rest). Stripping would
                        // destroy valid H-bar rendering data.
                    }
                }
            }

            // 7. Global Multi-Part Measure Synchronization & Padding for Staggered Entrances (e.g. Be Not Afraid)
            if (finalParts.length > 1) {
                var canonicalMeasureNumbers = [];
                var seenMeasureNums = {};
                var measureTemplates = {};
                var globalDivisions = '4';

                for (var pi = 0; pi < finalParts.length; pi++) {
                    var p = finalParts[pi];
                    var mList = p.getElementsByTagName('measure');
                    for (var mi = 0; mi < mList.length; mi++) {
                        var m = mList[mi];
                        var mnum = m.getAttribute('number');
                        var dElem = m.querySelector('attributes > divisions, divisions');
                        if (dElem && dElem.textContent.trim()) {
                            globalDivisions = dElem.textContent.trim();
                        }
                        if (mnum && !seenMeasureNums[mnum]) {
                            seenMeasureNums[mnum] = true;
                            canonicalMeasureNumbers.push(mnum);
                        }
                        if (mnum && !measureTemplates[mnum]) {
                            var attrsElem = m.getElementsByTagName('attributes')[0];
                            measureTemplates[mnum] = {
                                divisions: globalDivisions,
                                attrs: attrsElem ? attrsElem.cloneNode(true) : null
                            };
                        }
                    }
                }

                // If all measure numbers are numeric, sort numerically
                var allNumeric = canonicalMeasureNumbers.every(function (num) { return /^\d+$/.test(num); });
                if (allNumeric) {
                    canonicalMeasureNumbers.sort(function (a, b) { return parseInt(a, 10) - parseInt(b, 10); });
                }

                for (var pi = 0; pi < finalParts.length; pi++) {
                    var p = finalParts[pi];
                    var partPid = (p.getAttribute('id') || '').toLowerCase();
                    var sp = doc.querySelector("score-part[id='" + p.getAttribute('id') + "']");
                    var partPname = ((sp && sp.querySelector('part-name')) ? (sp.querySelector('part-name').textContent || '') : '').toLowerCase();
                    var isBassClef = ['bass', 'tenor', 't/b', 'men'].some(function(w) { return partPid.indexOf(w) !== -1 || partPname.indexOf(w) !== -1; });

                    var existingMap = {};
                    var curMList = Array.from(p.getElementsByTagName('measure'));
                    for (var ci = 0; ci < curMList.length; ci++) {
                        var curM = curMList[ci];
                        existingMap[curM.getAttribute('number')] = curM;
                    }

                    for (var cmi = 0; cmi < canonicalMeasureNumbers.length; cmi++) {
                        var targetNum = canonicalMeasureNumbers[cmi];
                        if (!existingMap[targetNum]) {
                            var newMeasure = doc.createElement('measure');
                            newMeasure.setAttribute('number', targetNum);
                            var tmpl = measureTemplates[targetNum] || { divisions: globalDivisions, attrs: null };

                            var newAttrs = doc.createElement('attributes');
                            var divEl = doc.createElement('divisions');
                            divEl.textContent = tmpl.divisions || globalDivisions;
                            newAttrs.appendChild(divEl);

                            if (targetNum === canonicalMeasureNumbers[0]) {
                                var clefEl = doc.createElement('clef');
                                var signEl = doc.createElement('sign');
                                signEl.textContent = isBassClef ? 'F' : 'G';
                                var lineEl = doc.createElement('line');
                                lineEl.textContent = isBassClef ? '4' : '2';
                                clefEl.appendChild(signEl);
                                clefEl.appendChild(lineEl);
                                newAttrs.appendChild(clefEl);
                            }
                            if (tmpl.attrs) {
                                var keyEl = tmpl.attrs.getElementsByTagName('key')[0];
                                if (keyEl) newAttrs.appendChild(keyEl.cloneNode(true));
                                var timeEl = tmpl.attrs.getElementsByTagName('time')[0];
                                if (timeEl) newAttrs.appendChild(timeEl.cloneNode(true));
                            }
                            newMeasure.appendChild(newAttrs);

                            var restNote = doc.createElement('note');
                            var restElem = doc.createElement('rest');
                            restElem.setAttribute('measure', 'yes');
                            var durElem = doc.createElement('duration');
                            durElem.textContent = String(parseInt(tmpl.divisions || '4', 10) * 4);
                            var voiceElem = doc.createElement('voice');
                            voiceElem.textContent = '1';
                            restNote.appendChild(restElem);
                            restNote.appendChild(durElem);
                            restNote.appendChild(voiceElem);
                            newMeasure.appendChild(restNote);

                            p.appendChild(newMeasure);
                        }
                    }

                    // Re-sort measures strictly in canonical order
                    var updatedMList = Array.from(p.getElementsByTagName('measure'));
                    var updatedMap = {};
                    for (var ui = 0; ui < updatedMList.length; ui++) {
                        var uM = updatedMList[ui];
                        updatedMap[uM.getAttribute('number')] = uM;
                        if (uM.parentNode === p) p.removeChild(uM);
                    }
                    for (var cmi = 0; cmi < canonicalMeasureNumbers.length; cmi++) {
                        var numToAppend = canonicalMeasureNumbers[cmi];
                        if (updatedMap[numToAppend]) {
                            p.appendChild(updatedMap[numToAppend]);
                        }
                    }
                }
            }

        }

        // ─── Utilities ──────────────────────────────────────────────────
        function updateStatus(msg) {
            statusText.textContent = msg;
            console.log('[VoxSight]', msg);
        }

        // Handle window resize — resize canvas only; avoid heavy DOM re-mapping during playback / fullscreen
        let lastWindowWidth = window.innerWidth;
        let resizeTimer = null;

        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                resizeCanvas();
                // Viewport height changes (like entering/exiting fullscreen) do NOT alter SVG note geometry!
                // Only re-map if the window width actually changed AND audio synthesis is not actively playing.
                if (window.innerWidth !== lastWindowWidth) {
                    lastWindowWidth = window.innerWidth;
                    const isAudioActive = (typeof synthStarted !== 'undefined' && synthStarted);
                    if (!isAudioActive) {
                        const newHash = computeLayoutHash();
                        if (newHash !== layoutHash && !window.__vx_is_internal_render) {
                            layoutHash = newHash;
                            buildNoteMap();
                            if (window.VoxSightBridge) {
                                window.VoxSightBridge.onLayoutChanged(
                                    layoutHash,
                                    JSON.stringify(noteCoordinates)
                                );
                            }
                        }
                    }
                }
            }, 300);
        });

        // Initialize on load
        initOSMD();

        if (window.location.search.indexOf('score=') !== -1) {
            var scoreParam = new URLSearchParams(window.location.search).get('score');
            if (scoreParam) {
                fetch(scoreParam).then(function (r) { return r.text(); }).then(function (xml) {
                    loadScore(xml);
                });
            }
        }
    </script>
