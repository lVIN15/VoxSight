        // ─── Initialize OSMD ────────────────────────────────────────────
        function initOSMD() {
            osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(renderDiv, {
                backend: 'svg',
                autoResize: false,
                pageFormat: 'Endless',
                newPageFromXML: false,
                newSystemFromXML: true,
                drawTitle: true,
                drawComposer: true,
                drawPartNames: true,
                drawMeasureNumbers: true,
                drawLyrics: true,
                drawSlurs: true,
                drawCredits: false,
                drawFingerings: true,
                drawDynamics: true,
                drawOrnaments: true,
                drawingParameters: 'default',
                coloringEnabled: true,
                colorStemsLikeNoteheads: true,
                autoGenerateMultipleRestMeasuresFromRestMeasures: true,
                renderMultipleRestMeasures: true
            });

            if (typeof osmd.setLogLevel === 'function') {
                osmd.setLogLevel('warn');
            }
            if (osmd.rules) {
                // Classic standard Bravura music font (open oval "o" whole notehead)
                osmd.rules.DefaultVexFlowNoteFont = "bravura";
                if (opensheetmusicdisplay.AlignRestOption) {
                    osmd.rules.AlignRests = opensheetmusicdisplay.AlignRestOption.Always;
                }

                osmd.rules.ColoringEnabled = true;
                osmd.rules.ColorStemsLikeNoteheads = true;
                osmd.rules.ColorBeams = true;
                osmd.rules.ColorFlags = true;
                osmd.rules.AutoGenerateMultipleRestMeasuresFromRestMeasures = true;
                osmd.rules.RenderMultipleRestMeasures = true;
                osmd.rules.RenderPedals = false;
                osmd.rules.DrawCredits = false;
                osmd.rules.BetweenStaffDistance = 5.0;
                osmd.rules.StaffDistance = 6.0;
                osmd.rules.MinimumStaffDistance = 4.0;
                osmd.rules.TitleTopDistance = 5.0;
                osmd.rules.TitleBottomDistance = 5.0;
                osmd.rules.SystemComposerDistance = 3.0;
                osmd.rules.SheetTitleHeight = 4.0;
                osmd.rules.SheetComposerHeight = 2.0;
                if (opensheetmusicdisplay.FillEmptyMeasuresWithWholeRests) {
                    osmd.rules.FillEmptyMeasuresWithWholeRest = opensheetmusicdisplay.FillEmptyMeasuresWithWholeRests.No;
                }
            }

            highlightCtx = canvas.getContext('2d');
            updateStatus('Ready');
        }

        let currentTpq = 960;

        // ─── Base64 & UTF-8 Decoder Helper ────────────────────────────
        function decodeBase64ToXml(b64) {
            if (!b64) return '';
            try {
                var binary = atob(b64);
                var bytes = new Uint8Array(binary.length);
                for (var i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return new TextDecoder('utf-8').decode(bytes);
            } catch (e) {
                try {
                    return decodeURIComponent(escape(atob(b64)));
                } catch (e2) {
                    return atob(b64);
                }
            }
        }

                function ensureMeasureAndLyricIntegrity(doc) {
            if (!doc) return;
            try {
                // Remap reserved percussion MIDI channel 10 for pitched parts to prevent OSMD from suppressing key signature
                const midiChannels = doc.querySelectorAll('midi-channel');
                midiChannels.forEach(mc => {
                    if (mc.textContent && mc.textContent.trim() === '10') {
                        mc.textContent = '15';
                    }
                });

                // Ensure print new-page also has new-system="yes" so OSMD breaks systems properly in endless view
                doc.querySelectorAll('print[new-page="yes"]').forEach(pr => {
                    if (!pr.hasAttribute('new-system')) pr.setAttribute('new-system', 'yes');
                });

                // Strip fixed measure widths so OSMD dynamically allocates natural spacing for notes and lyrics
                doc.querySelectorAll('measure[width]').forEach(m => {
                    m.removeAttribute('width');
                });

                const parts = doc.querySelectorAll('part');
                parts.forEach((part, partIdx) => {
                    let partName = '';
                    const pid = part.getAttribute('id');
                    const sp = doc.querySelector("score-part[id='" + pid + "']");
                    if (sp) {
                        const pn = sp.querySelector('part-name');
                        if (pn) partName = pn.textContent.toLowerCase();
                    }

                    let prevDivisions = '4';
                    let prevBeats = 4;
                    let prevBeatType = 4;
                    const measures = part.querySelectorAll('measure');
                    measures.forEach(m => {
                        const mNum = m.getAttribute('number');
                        const divElem = m.querySelector('divisions');
                        if (divElem && divElem.textContent) {
                            prevDivisions = divElem.textContent.trim();
                        }
                        const beatsEl = m.querySelector('time > beats');
                        const beatTypeEl = m.querySelector('time > beat-type');
                        if (beatsEl && beatsEl.textContent) {
                            const b = parseInt(beatsEl.textContent.trim(), 10);
                            if (b > 0) prevBeats = b;
                        }
                        if (beatTypeEl && beatTypeEl.textContent) {
                            const bt = parseInt(beatTypeEl.textContent.trim(), 10);
                            if (bt > 0) prevBeatType = bt;
                        }
                        const fullDur = Math.round(prevBeats * (4.0 / prevBeatType) * parseInt(prevDivisions, 10));

                        const allNotes = Array.from(m.querySelectorAll('note'));
                        const pitchedNotes = allNotes.filter(n => !n.querySelector('rest'));

                        // Dynamic Unresolved Incoming Tie Resolution across any measure
                        if (pitchedNotes.length === 0 && m.previousElementSibling) {
                            const prevM = m.previousElementSibling;
                            const prevNotes = Array.from(prevM.querySelectorAll('note')).filter(n => !n.querySelector('rest'));
                            let incomingTieNote = null;
                            for (let pi = prevNotes.length - 1; pi >= 0; pi--) {
                                const pn = prevNotes[pi];
                                const hasTieStart = Boolean(pn.querySelector('tie[type="start"], tied[type="start"]'));
                                const hasTieStop = Boolean(pn.querySelector('tie[type="stop"], tied[type="stop"]'));
                                if (hasTieStart && !hasTieStop) {
                                    incomingTieNote = pn;
                                    break;
                                }
                            }
                            if (incomingTieNote) {
                                const prevPitch = incomingTieNote.querySelector('pitch');
                                if (prevPitch) {
                                    allNotes.forEach(n => n.remove());
                                    const newNote = doc.createElement('note');
                                    newNote.appendChild(prevPitch.cloneNode(true));
                                    const dur = doc.createElement('duration'); dur.textContent = String(fullDur); newNote.appendChild(dur);
                                    const v = doc.createElement('voice'); v.textContent = '1'; newNote.appendChild(v);
                                    const t = doc.createElement('type'); t.textContent = 'whole'; newNote.appendChild(t);
                                    const s = doc.createElement('stem'); s.textContent = 'none'; newNote.appendChild(s);
                                    const notat = doc.createElement('notations');
                                    const tied = doc.createElement('tied'); tied.setAttribute('type', 'stop');
                                    notat.appendChild(tied);
                                    newNote.appendChild(notat);
                                    m.appendChild(newNote);
                                    return;
                                }
                            }
                        }

                        // 4. Standard Empty Measure and Whole Measure Rest Preservation
                        if (allNotes.length === 0) {
                            const isCutaway = m.getAttribute('print-object') === 'no' ||
                                (m.querySelector('staff-details') && m.querySelector('staff-details').getAttribute('print-object') === 'no');

                            const note = doc.createElement('note');
                            if (isCutaway) {
                                note.setAttribute('print-object', 'no');
                            }
                            const rest = doc.createElement('rest');
                            rest.setAttribute('measure', 'yes');
                            note.appendChild(rest);
                            const dur = doc.createElement('duration');
                            dur.textContent = String(fullDur);
                            note.appendChild(dur);
                            const voice = doc.createElement('voice');
                            voice.textContent = '1';
                            note.appendChild(voice);
                            m.appendChild(note);
                        } else if (pitchedNotes.length === 0 && allNotes.length === 1) {
                            const n0 = allNotes[0];
                            const r = n0.querySelector('rest');
                            if (r) {
                                const durEl = n0.querySelector('duration');
                                const curDur = durEl ? parseInt(durEl.textContent.trim(), 10) : 0;
                                if (r.getAttribute('measure') === 'yes' || curDur >= fullDur) {
                                    r.setAttribute('measure', 'yes');
                                    const dot = n0.querySelector('dot');
                                    if (dot) dot.remove();
                                    const type = n0.querySelector('type');
                                    if (type) type.remove();
                                    const ds = r.querySelector('display-step');
                                    if (ds) ds.remove();
                                    const doEl = r.querySelector('display-octave');
                                    if (doEl) doEl.remove();
                                    if (durEl) durEl.textContent = String(fullDur);
                                }
                            }
                        }
                    });

                    const allNotes = Array.from(part.querySelectorAll('note'));
                    allNotes.forEach((n, idx) => {
                        const syl = n.querySelector('lyric > syllabic');
                        if (syl && (syl.textContent === 'begin' || syl.textContent === 'middle')) {
                            let restsAhead = 0;
                            let hasPitchedAhead = false;
                            for (let j = idx + 1; j < allNotes.length; j++) {
                                if (allNotes[j].querySelector('rest')) {
                                    restsAhead++;
                                } else {
                                    hasPitchedAhead = true;
                                    break;
                                }
                            }
                            if (!hasPitchedAhead || restsAhead >= 2) {
                                syl.textContent = syl.textContent === 'begin' ? 'single' : 'end';
                            }
                        }
                    });
                });

                sanitizeBeamMisreadSlursAndOrphans(doc);
            } catch (err) {
                console.warn('[VoxSight] ensureMeasureAndLyricIntegrity warning:', err);
            }
        }

        function sanitizeBeamMisreadSlursAndOrphans(doc) {
            if (!doc) return;
            const childByTag = (el, tag) => {
                const kids = el ? el.children : null;
                if (!kids) return null;
                for (let i = 0; i < kids.length; i++) {
                    if (kids[i].tagName === tag) return kids[i];
                }
                return null;
            };
            const childrenByTag = (el, tag) => {
                const res = [];
                const kids = el ? el.children : null;
                if (!kids) return res;
                for (let i = 0; i < kids.length; i++) {
                    if (kids[i].tagName === tag) res.push(kids[i]);
                }
                return res;
            };
            const childText = (el, tag, defVal) => {
                const c = childByTag(el, tag);
                return (c && c.textContent !== null) ? c.textContent.trim() : defVal;
            };
            const pitchKey = (nEl) => {
                const p = childByTag(nEl, 'pitch');
                if (!p) return null;
                return childText(p, 'step', '') + ':' + childText(p, 'alter', '0') + ':' + childText(p, 'octave', '');
            };
            const isBeamMisreadSlur = (noteEl, slurEl) => {
                if ((slurEl.getAttribute('type') || '').trim() !== 'start') return false;
                if (childByTag(noteEl, 'rest') || childByTag(noteEl, 'beam')) return false;
                const stemEl = childByTag(noteEl, 'stem');
                if (!stemEl || !stemEl.textContent || !stemEl.hasAttribute('default-y')) return false;
                if (!slurEl.hasAttribute('default-x') || !slurEl.hasAttribute('default-y') || !slurEl.hasAttribute('bezier-y')) return false;
                const stemDir = stemEl.textContent.trim();
                const stemY = parseFloat(stemEl.getAttribute('default-y'));
                const sx = parseFloat(slurEl.getAttribute('default-x'));
                const sy = parseFloat(slurEl.getAttribute('default-y'));
                const by = parseFloat(slurEl.getAttribute('bezier-y'));
                if (isNaN(stemY) || isNaN(sx) || isNaN(sy) || isNaN(by)) return false;
                const placement = (slurEl.getAttribute('placement') || '').trim();
                const diffY = sy - stemY;
                if (stemDir === 'down' && placement === 'below') {
                    return sx >= -4.0 && sx <= 6.0 && diffY >= -2.0 && diffY <= 13.5 && Math.abs(by) <= 4.5;
                }
                if (stemDir === 'up' && placement === 'above') {
                    return sx >= 7.0 && sx <= 18.0 && diffY >= -13.5 && diffY <= 2.0 && Math.abs(by) <= 4.5;
                }
                return false;
            };
            const insertBeamsOrdered = (noteEl, beamSpecs) => {
                childrenByTag(noteEl, 'beam').forEach(b => b.remove());
                const afterTags = { notations: true, lyric: true, play: true, listen: true };
                let refNode = null;
                const kids = noteEl.children;
                for (let i = 0; i < kids.length; i++) {
                    if (afterTags[kids[i].tagName]) {
                        refNode = kids[i];
                        break;
                    }
                }
                beamSpecs.forEach(spec => {
                    const bEl = doc.createElement('beam');
                    bEl.setAttribute('number', String(spec[0]));
                    bEl.textContent = spec[1];
                    if (refNode) noteEl.insertBefore(bEl, refNode);
                    else noteEl.appendChild(bEl);
                });
            };
            const scaleScoreDivisions = (factor) => {
                if (factor <= 1) return;
                doc.querySelectorAll('divisions, duration').forEach(el => {
                    if (el.textContent) {
                        const v = parseInt(el.textContent.trim(), 10);
                        if (!isNaN(v)) el.textContent = String(v * factor);
                    }
                });
            };

            const parts = Array.from(doc.querySelectorAll('part'));
            if (parts.length === 0) return;

            // Pass 1: Strip stem-tip beam-misread slurs and record same-measure candidate spans
            const partSpans = new Map();
            parts.forEach((part, pIdx) => {
                const measures = childrenByTag(part, 'measure');
                const openBeamSlurs = new Map();
                const mSpans = new Map();

                measures.forEach((m, mIdx) => {
                    childrenByTag(m, 'note').forEach(n => {
                        const notat = childByTag(n, 'notations');
                        if (!notat) return;
                        childrenByTag(notat, 'slur').forEach(s => {
                            const sType = (s.getAttribute('type') || '').trim();
                            const sNum = (s.getAttribute('number') || '1').trim();
                            if (sType === 'start') {
                                if (isBeamMisreadSlur(n, s)) {
                                    s.remove();
                                    openBeamSlurs.set(sNum, { mIdx: mIdx, note: n });
                                } else {
                                    openBeamSlurs.delete(sNum);
                                }
                            } else if (sType === 'stop') {
                                if (openBeamSlurs.has(sNum)) {
                                    const st = openBeamSlurs.get(sNum);
                                    openBeamSlurs.delete(sNum);
                                    s.remove();
                                    if (st.mIdx === mIdx && st.note !== n) {
                                        if (!mSpans.has(mIdx)) mSpans.set(mIdx, []);
                                        const arr = mSpans.get(mIdx);
                                        if (!arr.some(pair => pair[0] === st.note && pair[1] === n)) {
                                            arr.push([st.note, n]);
                                        }
                                    }
                                }
                            }
                        });
                        if (notat.children.length === 0) notat.remove();
                    });
                });

                if (mSpans.size > 0) partSpans.set(pIdx, mSpans);
            });

            // Pass 2: Reconstruct beamed eighth / 16th rhythms in overflowed measures
            if (partSpans.size > 0) {
                const partMeta = new Map();
                let globalScale = 1;

                partSpans.forEach((mSpans, pIdx) => {
                    const measures = childrenByTag(parts[pIdx], 'measure');
                    let divs = 1, beats = 4, beatType = 4;
                    const meta = measures.map(m => {
                        const dEl = m.querySelector('divisions');
                        if (dEl && dEl.textContent) {
                            const dv = parseInt(dEl.textContent.trim(), 10);
                            if (dv > 0) divs = dv;
                        }
                        const bEl = m.querySelector('time > beats');
                        const btEl = m.querySelector('time > beat-type');
                        if (bEl && bEl.textContent) {
                            const bv = parseInt(bEl.textContent.trim(), 10);
                            if (bv > 0) beats = bv;
                        }
                        if (btEl && btEl.textContent) {
                            const btv = parseInt(btEl.textContent.trim(), 10);
                            if (btv > 0) beatType = btv;
                        }
                        return { divs: divs, beats: beats, beatType: beatType };
                    });
                    partMeta.set(pIdx, meta);

                    mSpans.forEach((rawSpans, mIdx) => {
                        const cur = meta[mIdx];
                        const expDur = Math.round(cur.beats * (4.0 / cur.beatType) * cur.divs);
                        const m = measures[mIdx];
                        const byVoice = new Map();
                        rawSpans.forEach(pair => {
                            const vId = childText(pair[0], 'voice', '1');
                            if (childText(pair[1], 'voice', '1') === vId) {
                                if (!byVoice.has(vId)) byVoice.set(vId, []);
                                byVoice.get(vId).push(pair);
                            }
                        });
                        byVoice.forEach((vSpans, vId) => {
                            const vNotes = childrenByTag(m, 'note').filter(x =>
                                !childByTag(x, 'chord') && !childByTag(x, 'grace') && childText(x, 'voice', '1') === vId
                            );
                            const actualDur = vNotes.reduce((acc, x) => acc + (parseInt(childText(x, 'duration', '0'), 10) || 0), 0);
                            const excess = actualDur - expDur;
                            if (excess <= 0) return;
                            let validKSum = 0, singleK = 0;
                            const used = new Set();
                            vSpans.forEach(pair => {
                                const i0 = vNotes.indexOf(pair[0]);
                                let i1 = vNotes.indexOf(pair[1]);
                                if (i0 < 0 || i1 <= i0) return;
                                const endType = childText(vNotes[i1], 'type', '');
                                if (i1 - i0 >= 2 && (endType === 'half' || endType === 'whole')) {
                                    let allPrevQ = true;
                                    for (let k = i0; k < i1; k++) {
                                        if (childText(vNotes[k], 'type', '') !== 'quarter') { allPrevQ = false; break; }
                                    }
                                    if (allPrevQ) i1 -= 1;
                                }
                                for (let k = i0; k <= i1; k++) {
                                    if (used.has(k)) return;
                                }
                                const seg = vNotes.slice(i0, i1 + 1);
                                const ok = seg.length >= 2 && seg.every(x =>
                                    !childByTag(x, 'rest') &&
                                    childText(x, 'type', '') === 'quarter' &&
                                    !childByTag(x, 'dot') &&
                                    !childByTag(x, 'beam') &&
                                    parseInt(childText(x, 'duration', '0'), 10) === cur.divs
                                );
                                if (ok) {
                                    validKSum += seg.length;
                                    singleK = seg.length;
                                    for (let k = i0; k <= i1; k++) used.add(k);
                                }
                            });
                            if (validKSum === 0) return;
                            if (2 * excess === validKSum * cur.divs) {
                                if ((cur.divs * globalScale) % 2 !== 0) globalScale = Math.max(globalScale, 2);
                            } else if (4 * excess === 3 * validKSum * cur.divs || (used.size === 3 && singleK === 3 && excess === 2 * cur.divs)) {
                                while ((cur.divs * globalScale) % 4 !== 0) globalScale *= 2;
                            }
                        });
                    });
                });

                if (globalScale > 1) {
                    scaleScoreDivisions(globalScale);
                    partMeta.forEach(meta => {
                        meta.forEach(item => { item.divs *= globalScale; });
                    });
                }

                partSpans.forEach((mSpans, pIdx) => {
                    const measures = childrenByTag(parts[pIdx], 'measure');
                    const meta = partMeta.get(pIdx);
                    mSpans.forEach((rawSpans, mIdx) => {
                        const cur = meta[mIdx];
                        const expDur = Math.round(cur.beats * (4.0 / cur.beatType) * cur.divs);
                        const m = measures[mIdx];
                        const byVoice = new Map();
                        rawSpans.forEach(pair => {
                            const vId = childText(pair[0], 'voice', '1');
                            if (childText(pair[1], 'voice', '1') === vId) {
                                if (!byVoice.has(vId)) byVoice.set(vId, []);
                                byVoice.get(vId).push(pair);
                            }
                        });

                        byVoice.forEach((vSpans, vId) => {
                            const vNotes = childrenByTag(m, 'note').filter(x =>
                                !childByTag(x, 'chord') && !childByTag(x, 'grace') && childText(x, 'voice', '1') === vId
                            );
                            const oldActualDur = vNotes.reduce((acc, x) => acc + (parseInt(childText(x, 'duration', '0'), 10) || 0), 0);
                            const excess = oldActualDur - expDur;
                            if (excess <= 0) return;

                            const resolvedSegs = [];
                            const usedIndices = new Set();
                            vSpans.forEach(pair => {
                                const i0 = vNotes.indexOf(pair[0]);
                                let i1 = vNotes.indexOf(pair[1]);
                                if (i0 < 0 || i1 <= i0) return;
                                const endType = childText(vNotes[i1], 'type', '');
                                if (i1 - i0 >= 2 && (endType === 'half' || endType === 'whole')) {
                                    let allPrevQ = true;
                                    for (let k = i0; k < i1; k++) {
                                        if (childText(vNotes[k], 'type', '') !== 'quarter') { allPrevQ = false; break; }
                                    }
                                    if (allPrevQ) i1 -= 1;
                                }
                                for (let k = i0; k <= i1; k++) {
                                    if (usedIndices.has(k)) return;
                                }
                                const seg = vNotes.slice(i0, i1 + 1);
                                const ok = seg.length >= 2 && seg.every(x =>
                                    !childByTag(x, 'rest') &&
                                    childText(x, 'type', '') === 'quarter' &&
                                    !childByTag(x, 'dot') &&
                                    !childByTag(x, 'beam') &&
                                    parseInt(childText(x, 'duration', '0'), 10) === cur.divs
                                );
                                if (ok) {
                                    resolvedSegs.push(seg);
                                    for (let k = i0; k <= i1; k++) usedIndices.add(k);
                                }
                            });

                            if (resolvedSegs.length === 0) return;
                            const totalK = resolvedSegs.reduce((acc, s) => acc + s.length, 0);
                            let reconstructed = false;

                            if (2 * excess === totalK * cur.divs && cur.divs % 2 === 0) {
                                const eDur = cur.divs / 2;
                                resolvedSegs.forEach(seg => {
                                    seg.forEach((nEl, idxInSeg) => {
                                        const dNode = childByTag(nEl, 'duration');
                                        const tNode = childByTag(nEl, 'type');
                                        if (dNode) dNode.textContent = String(eDur);
                                        if (tNode) tNode.textContent = 'eighth';
                                        const bVal = idxInSeg === 0 ? 'begin' : (idxInSeg === seg.length - 1 ? 'end' : 'continue');
                                        insertBeamsOrdered(nEl, [['1', bVal]]);
                                    });
                                });
                                reconstructed = true;
                            } else if (4 * excess === 3 * totalK * cur.divs && cur.divs % 4 === 0) {
                                const sDur = cur.divs / 4;
                                resolvedSegs.forEach(seg => {
                                    seg.forEach((nEl, idxInSeg) => {
                                        const dNode = childByTag(nEl, 'duration');
                                        const tNode = childByTag(nEl, 'type');
                                        if (dNode) dNode.textContent = String(sDur);
                                        if (tNode) tNode.textContent = '16th';
                                        const bVal = idxInSeg === 0 ? 'begin' : (idxInSeg === seg.length - 1 ? 'end' : 'continue');
                                        insertBeamsOrdered(nEl, [['1', bVal], ['2', bVal]]);
                                    });
                                });
                                reconstructed = true;
                            } else if (resolvedSegs.length === 1 && resolvedSegs[0].length === 3 && excess === 2 * cur.divs && cur.divs % 4 === 0) {
                                const seg = resolvedSegs[0];
                                const eDur = cur.divs / 2;
                                const sDur = cur.divs / 4;
                                const xs = seg.map(x => parseFloat(x.getAttribute('default-x')));
                                const hasX = xs.every(v => !isNaN(v));
                                const is16168 = hasX && (xs[1] - xs[0]) < (xs[2] - xs[1]) * 0.85;
                                const specs = is16168
                                    ? [
                                        ['16th', sDur, [['1', 'begin'], ['2', 'begin']]],
                                        ['16th', sDur, [['1', 'continue'], ['2', 'end']]],
                                        ['eighth', eDur, [['1', 'end']]]
                                    ]
                                    : [
                                        ['eighth', eDur, [['1', 'begin']]],
                                        ['16th', sDur, [['1', 'continue'], ['2', 'begin']]],
                                        ['16th', sDur, [['1', 'end'], ['2', 'end']]]
                                    ];
                                seg.forEach((nEl, idxInSeg) => {
                                    const sp = specs[idxInSeg];
                                    const dNode = childByTag(nEl, 'duration');
                                    const tNode = childByTag(nEl, 'type');
                                    if (dNode) dNode.textContent = String(sp[1]);
                                    if (tNode) tNode.textContent = sp[0];
                                    insertBeamsOrdered(nEl, sp[2]);
                                });
                                reconstructed = true;
                            }

                            if (reconstructed) {
                                const newActualDur = oldActualDur - excess;
                                childrenByTag(m, 'backup').forEach(bk => {
                                    const bkDur = childByTag(bk, 'duration');
                                    if (bkDur && bkDur.textContent && parseInt(bkDur.textContent.trim(), 10) === oldActualDur) {
                                        bkDur.textContent = String(newActualDur);
                                    }
                                });
                            }
                        });
                    });
                });
            }

            // Pass 3: Sanitize orphan stops, colliding starts, and runaway (>4 measure) unclosed slurs
            parts.forEach(part => {
                const measures = childrenByTag(part, 'measure');
                const openSlurs = new Map();

                const resolveUnclosedStart = (sNum, stInfo) => {
                    const vId = childText(stInfo.note, 'voice', '1');
                    const mVNotes = childrenByTag(stInfo.mEl, 'note').filter(x =>
                        !childByTag(x, 'chord') && !childByTag(x, 'grace') && childText(x, 'voice', '1') === vId
                    );
                    let closedLocally = false;
                    const pos = mVNotes.indexOf(stInfo.note);
                    if (pos >= 0 && pos + 1 < mVNotes.length) {
                        const cand = mVNotes[pos + 1];
                        if (!childByTag(cand, 'rest') && pitchKey(cand) !== pitchKey(stInfo.note)) {
                            let cNotat = childByTag(cand, 'notations');
                            const alreadyHas = cNotat && childrenByTag(cNotat, 'slur').some(
                                cs => (cs.getAttribute('number') || '1').trim() === sNum
                            );
                            if (!alreadyHas) {
                                if (!cNotat) {
                                    cNotat = doc.createElement('notations');
                                    let refNode = null;
                                    const cKids = cand.children;
                                    for (let ci = 0; ci < cKids.length; ci++) {
                                        const tn = cKids[ci].tagName;
                                        if (tn === 'lyric' || tn === 'play' || tn === 'listen') {
                                            refNode = cKids[ci];
                                            break;
                                        }
                                    }
                                    if (refNode) cand.insertBefore(cNotat, refNode);
                                    else cand.appendChild(cNotat);
                                }
                                const stopSlur = doc.createElement('slur');
                                stopSlur.setAttribute('type', 'stop');
                                stopSlur.setAttribute('number', sNum);
                                cNotat.appendChild(stopSlur);
                                closedLocally = true;
                            }
                        }
                    }
                    if (!closedLocally) {
                        const stNotat = childByTag(stInfo.note, 'notations');
                        if (stNotat && stInfo.slur.parentNode === stNotat) {
                            stInfo.slur.remove();
                            if (stNotat.children.length === 0) stNotat.remove();
                        }
                    }
                };

                measures.forEach((m, mIdx) => {
                    Array.from(openSlurs.keys()).forEach(sNum => {
                        const stInfo = openSlurs.get(sNum);
                        if (mIdx - stInfo.mIdx > 4) {
                            openSlurs.delete(sNum);
                            resolveUnclosedStart(sNum, stInfo);
                        }
                    });

                    childrenByTag(m, 'note').forEach(n => {
                        const notat = childByTag(n, 'notations');
                        if (!notat) return;
                        childrenByTag(notat, 'slur').forEach(s => {
                            const sType = (s.getAttribute('type') || '').trim();
                            const sNum = (s.getAttribute('number') || '1').trim();
                            if (sType === 'start') {
                                if (openSlurs.has(sNum)) {
                                    const prevInfo = openSlurs.get(sNum);
                                    openSlurs.delete(sNum);
                                    resolveUnclosedStart(sNum, prevInfo);
                                }
                                openSlurs.set(sNum, { mIdx: mIdx, mEl: m, note: n, slur: s });
                            } else if (sType === 'stop') {
                                if (openSlurs.has(sNum)) {
                                    openSlurs.delete(sNum);
                                } else {
                                    s.remove();
                                }
                            }
                        });
                        if (notat.children.length === 0) notat.remove();
                    });
                });

                Array.from(openSlurs.keys()).forEach(sNum => {
                    const stInfo = openSlurs.get(sNum);
                    openSlurs.delete(sNum);
                    resolveUnclosedStart(sNum, stInfo);
                });
            });
        }

        function sanitizeMusicXmlString(xmlString) {
            if (!xmlString) return '';
            var cleaned = xmlString
                .replace(/\s+xmlns=""/g, '')
                .replace(/\s+xmlns="http:\/\/www\.w3\.org\/1999\/xhtml"/g, '');

            return cleaned;
        }


        // ─── Dynamic Cutaway System Pruning & Header Separation Helper ──────────────
        function pruneCutawayStaffLines(osmdInstance, xmlDocument) {
            if (!osmdInstance || !osmdInstance.graphic) return;
            var pages = osmdInstance.graphic.MusicPages;
            if (!pages || pages.length === 0) return;

            function isXmlMeasureCutaway(partIndex, measureNumber) {
                if (!xmlDocument) return false;
                var parts = xmlDocument.getElementsByTagName('part');
                if (partIndex >= parts.length) return false;
                var partEl = parts[partIndex];
                var meas = partEl.querySelector('measure[number="' + measureNumber + '"]');
                if (!meas) return false;
                if (meas.getAttribute('print-object') === 'no') return true;
                var sd = meas.querySelector('staff-details');
                if (sd && sd.getAttribute('print-object') === 'no') return true;
                var notes = meas.getElementsByTagName('note');
                var hasPitched = false;
                for (var i = 0; i < notes.length; i++) {
                    if (notes[i].getElementsByTagName('pitch').length > 0) {
                        hasPitched = true;
                        break;
                    }
                }
                if (!hasPitched) {
                    var rests = meas.getElementsByTagName('rest');
                    if (rests.length > 0) {
                        var pNote = rests[0].parentNode;
                        if (pNote && pNote.getAttribute('print-object') === 'no') return true;
                    }
                }
                return false;
            }

            for (var pIdx = 0; pIdx < pages.length; pIdx++) {
                var page = pages[pIdx];
                var systems = page.MusicSystems;
                if (!systems || systems.length === 0) continue;

                var anyPruned = false;

                for (var sIdx = 0; sIdx < systems.length; sIdx++) {
                    var system = systems[sIdx];
                    if (!system.StaffLines || system.StaffLines.length <= 1) continue;

                    var activeStaffLines = [];
                    for (var slIdx = 0; slIdx < system.StaffLines.length; slIdx++) {
                        var sl = system.StaffLines[slIdx];
                        var hasPitchedNotes = false;
                        var allMeasuresCutaway = true;

                        if (sl.Measures && sl.Measures.length > 0) {
                            for (var mIdx = 0; mIdx < sl.Measures.length; mIdx++) {
                                var gm = sl.Measures[mIdx];
                                var mNum = gm.parentSourceMeasure ? gm.parentSourceMeasure.MeasureNumber : null;
                                var staffId = (sl.ParentStaff && typeof sl.ParentStaff.idInMusicSheet === 'number')
                                    ? sl.ParentStaff.idInMusicSheet : slIdx;

                                if (gm.staffEntries && gm.staffEntries.length > 0) {
                                    for (var seIdx = 0; seIdx < gm.staffEntries.length; seIdx++) {
                                        var se = gm.staffEntries[seIdx];
                                        if (se.graphicalVoiceEntries) {
                                            for (var veIdx = 0; veIdx < se.graphicalVoiceEntries.length; veIdx++) {
                                                var ve = se.graphicalVoiceEntries[veIdx];
                                                if (ve.notes) {
                                                    for (var nIdx = 0; nIdx < ve.notes.length; nIdx++) {
                                                        var sn = ve.notes[nIdx].sourceNote;
                                                        var isRest = sn ? (typeof sn.isRest === 'function' ? sn.isRest() : sn.isRest) : true;
                                                        if (!isRest) {
                                                            hasPitchedNotes = true;
                                                            allMeasuresCutaway = false;
                                                            break;
                                                        }
                                                    }
                                                }
                                                if (hasPitchedNotes) break;
                                            }
                                        }
                                        if (hasPitchedNotes) break;
                                    }
                                }

                                if (!hasPitchedNotes && mNum !== null) {
                                    var isCutawayInXml = isXmlMeasureCutaway(staffId, mNum);
                                    if (!isCutawayInXml) {
                                        allMeasuresCutaway = false;
                                    }
                                }
                            }
                        }

                        if (hasPitchedNotes || !allMeasuresCutaway) {
                            activeStaffLines.push(sl);
                        } else {
                            anyPruned = true;
                        }
                    }

                    if (activeStaffLines.length > 0 && activeStaffLines.length < system.StaffLines.length) {
                        system.StaffLines = activeStaffLines;

                        // Identify active instruments in the remaining stafflines
                        var activeInstruments = new Set();
                        for (var aIdx = 0; aIdx < activeStaffLines.length; aIdx++) {
                            var aSl = activeStaffLines[aIdx];
                            if (aSl.ParentStaff && aSl.ParentStaff.ParentInstrument) {
                                activeInstruments.add(aSl.ParentStaff.ParentInstrument);
                            }
                        }

                        // Remove inactive instrument labels to prevent overlapping / stacked text
                        if (system.labels && typeof system.labels.keys === 'function') {
                            var allKeys = system.labels.keys();
                            for (var kIdx = 0; kIdx < allKeys.length; kIdx++) {
                                var instKey = allKeys[kIdx];
                                if (!activeInstruments.has(instKey)) {
                                    if (typeof system.labels.remove === 'function') {
                                        system.labels.remove(instKey);
                                    }
                                }
                            }
                        }

                        var currentY = 0;
                        var staffHeight = (osmdInstance.rules && osmdInstance.rules.StaffHeight) ? osmdInstance.rules.StaffHeight : 4.0;
                        var betweenStaffDist = (osmdInstance.rules && osmdInstance.rules.BetweenStaffDistance) ? osmdInstance.rules.BetweenStaffDistance : 5.0;

                        for (var aIdx = 0; aIdx < system.StaffLines.length; aIdx++) {
                            var aSl = system.StaffLines[aIdx];
                            if (aSl.PositionAndShape && aSl.PositionAndShape.RelativePosition) {
                                aSl.PositionAndShape.RelativePosition.y = currentY;
                            }
                            currentY += staffHeight;
                            if (aIdx + 1 < system.StaffLines.length) {
                                currentY += betweenStaffDist;
                            }
                        }

                        if (system.PositionAndShape) {
                            system.PositionAndShape.BorderTop = 0;
                            system.PositionAndShape.BorderBottom = currentY;
                        }

                        // Re-center remaining active staff labels vertically
                        if (typeof system.setMusicSystemLabelsYPosition === 'function') {
                            try {
                                system.setMusicSystemLabelsYPosition();
                            } catch (eLbl) {
                                console.warn('[VoxSight] setMusicSystemLabelsYPosition notice:', eLbl);
                            }
                        }
                    }
                }

                // ── Header Clearance & System Spacing Calculation ──
                // Compute the safe starting Y position for System 0 so it never overlaps Title, Subtitle, Composer
                var minFirstSystemY = (pIdx === 0) ? 18.0 : 4.0;
                if (systems[0] && systems[0].PositionAndShape && systems[0].PositionAndShape.RelativePosition) {
                    minFirstSystemY = Math.max(minFirstSystemY, systems[0].PositionAndShape.RelativePosition.y);
                }

                // Dynamically inspect all header labels on page 0 (Title, Subtitle, Composer, Lyricist)
                if (pIdx === 0 && page.Labels && page.Labels.length > 0) {
                    var maxHeaderBottom = 0;
                    for (var lIdx = 0; lIdx < page.Labels.length; lIdx++) {
                        var hLbl = page.Labels[lIdx];
                        if (hLbl && hLbl.PositionAndShape) {
                            var lblY = hLbl.PositionAndShape.RelativePosition ? hLbl.PositionAndShape.RelativePosition.y : 0;
                            var lblHeight = (hLbl.PositionAndShape.Size && hLbl.PositionAndShape.Size.height > 0)
                                ? hLbl.PositionAndShape.Size.height
                                : (hLbl.PositionAndShape.BorderBottom || 4.0);
                            var lblBottom = lblY + lblHeight;
                            if (lblBottom > maxHeaderBottom) {
                                maxHeaderBottom = lblBottom;
                            }
                        }
                    }
                    var titleClearance = (osmdInstance.rules && osmdInstance.rules.TitleBottomDistance) ? osmdInstance.rules.TitleBottomDistance : 5.0;
                    minFirstSystemY = Math.max(minFirstSystemY, maxHeaderBottom + titleClearance);
                }

                var runningY = minFirstSystemY;
                var systemDist = (osmdInstance.rules && (osmdInstance.rules.BetweenMusicSystemsDistance || osmdInstance.rules.StaffDistance)) ? (osmdInstance.rules.BetweenMusicSystemsDistance || osmdInstance.rules.StaffDistance) : 6.0;

                for (var sysIdx = 0; sysIdx < systems.length; sysIdx++) {
                    var sys = systems[sysIdx];
                    if (sys.PositionAndShape && sys.PositionAndShape.RelativePosition) {
                        sys.PositionAndShape.RelativePosition.y = runningY;
                        var sysHeight = sys.PositionAndShape.BorderBottom - (sys.PositionAndShape.BorderTop || 0);
                        runningY += sysHeight + systemDist;
                    }
                }

                if (page.PositionAndShape) {
                    page.PositionAndShape.BorderBottom = runningY;
                }

                try {
                    if (page.PositionAndShape && typeof page.PositionAndShape.calculateAbsolutePositionsRecursive === 'function') {
                        var absPos = page.PositionAndShape.AbsolutePosition || { x: 0, y: 0 };
                        page.PositionAndShape.calculateAbsolutePositionsRecursive(absPos.x, absPos.y);
                    }
                } catch (err) {
                    console.warn('[VoxSight] Relative to absolute transform warning:', err);
                }
            }
        }

        /**
         * Load and render MusicXML.
         * Called from Android via WebView.evaluateJavascript().
         */
        async function loadScore(musicXml, tpq = 960) {
            if (tpq !== undefined && typeof tpq === 'number' && tpq > 0) currentTpq = tpq;
            if (!osmd) initOSMD();

            try {
                updateStatus('Loading score...');
                loadingOverlay.classList.remove('hidden');

                var xmlToLoad = musicXml;
                if (typeof xmlToLoad === 'string' && !xmlToLoad.trim().startsWith('<')) {
                    xmlToLoad = decodeBase64ToXml(xmlToLoad.trim());
                }

                if (!xmlToLoad || typeof xmlToLoad !== 'string' || xmlToLoad.trim().length === 0) {
                    console.error('[VoxSight Renderer] loadScore: Empty XML string');
                    updateStatus('Error: No XML provided');
                    loadingOverlay.classList.add('hidden');
                    return;
                }

                try {
                    xmlDoc = new DOMParser().parseFromString(xmlToLoad, 'text/xml');
                    if (xmlDoc.querySelector('parsererror')) {
                        console.warn('DOM parser error in renderer.html');
                    } else {
                        ensureMeasureAndLyricIntegrity(xmlDoc);
                        xmlToLoad = new XMLSerializer().serializeToString(xmlDoc);
                    }
                } catch (e) {
                    console.warn('DOM parsing error in renderer.html:', e);
                }

                var cleanXml = sanitizeMusicXmlString(xmlToLoad);
                if (!cleanXml || cleanXml.indexOf('<score-partwise') === -1) {
                    cleanXml = xmlToLoad;
                }

                await osmd.load(cleanXml);
                if (osmd.graphic && typeof osmd.graphic.reCalculate === 'function' && !osmd.graphic.__vxCutawayGuarded) {
                    const origReCalc = osmd.graphic.reCalculate.bind(osmd.graphic);
                    osmd.graphic.reCalculate = function() {
                        origReCalc();
                        try {
                            pruneCutawayStaffLines(osmd, xmlDoc);
                        } catch (err) {
                            console.warn('[VoxSight] Cutaway staff pruning notice:', err);
                        }
                    };
                    osmd.graphic.__vxCutawayGuarded = true;
                }
                if (osmd.calculator && typeof osmd.calculator.calculateSingleLyricWord === 'function' && !osmd.calculator.__vxGuarded) {
                    const origCalc = osmd.calculator.calculateSingleLyricWord;
                    osmd.calculator.calculateSingleLyricWord = function() {
                        try {
                            return origCalc.apply(this, arguments);
                        } catch (err) {
                            console.warn('[VoxSight] Guarded OSMD lyric layout error:', err);
                            return;
                        }
                    };
                    osmd.calculator.__vxGuarded = true;
                }

                // Set to comfortable, readable mobile zoom by default
                currentScoreZoom = calculateFitToWidthZoom();
                if ('zoom' in osmd) {
                    osmd.zoom = currentScoreZoom;
                } else if ('Zoom' in osmd) {
                    osmd.Zoom = currentScoreZoom;
                } else {
                    osmd.zoom = currentScoreZoom;
                }

                osmd.render();

                // Overflow guard: only step down zoom if a dense measure actually overflows container width
                var containerW = renderDiv.clientWidth || window.innerWidth || 360;
                var scrollW = renderDiv.scrollWidth || containerW;
                if (scrollW > containerW + 8 && containerW > 0) {
                    var targetW = Math.max(240, containerW - 12);
                    var fittedZoom = Math.max(0.24, Math.min(currentScoreZoom, currentScoreZoom * (targetW / scrollW)));
                    currentScoreZoom = Math.round(fittedZoom * 100) / 100;
                    osmd.zoom = currentScoreZoom;
                    if ('Zoom' in osmd) osmd.Zoom = currentScoreZoom;
                    osmd.render();
                }

                // Resize canvas to match rendered score
                resizeCanvas();

                // Build note map & directly color 100% of noteheads, stems, flags, beams from XML
                buildNoteMap();

                // Compute layout hash
                layoutHash = computeLayoutHash();

                // Reset scroll position and auto-scroll target for newly loaded score
                window.scrollTo(0, 0);
                lastAutoScrollTargetY = -1;
                lastAutoScrollTargetX = -1;

                loadingOverlay.classList.add('hidden');
                updateStatus(`Score loaded: ${noteCoordinates.length} notes`);

                // Notify Android that render is complete
                if (window.VoxSightBridge) {
                    window.VoxSightBridge.onRenderComplete(
                        layoutHash,
                        JSON.stringify(noteCoordinates)
                    );
                }

            } catch (err) {
                console.error('OSMD load error in renderer.html:', err);
                updateStatus('Error: ' + err.message);
                loadingOverlay.classList.add('hidden');

                if (window.VoxSightBridge) {
                    window.VoxSightBridge.onRenderError(err.message);
                }
            }
        }

        // Load a base64-encoded MusicXML string into OSMD
        function loadScoreBase64(b64, tpq = 960) {
            try {
                const xmlStr = decodeBase64ToXml(b64);
                loadScore(xmlStr, tpq);
            } catch (e) {
                console.error('Base64 decoding failed in renderer.html:', e);
                updateStatus('Error decoding MusicXML');
                if (window.VoxSightBridge) {
                    window.VoxSightBridge.onRenderError('Base64 decoding failed');
                }
            }
        }

        window.loadScore = loadScore;
        window.loadScoreBase64 = loadScoreBase64;

        window.setVisualFocus = function (partLabel) {
            currentVisualFocus = partLabel ? partLabel.trim().toUpperCase() : null;
            updateColorsAndRender();
        };

        window.clearVisualFocus = function () {
            currentVisualFocus = null;
            updateColorsAndRender();
        };

        window.setAudioFocus = function (partLabel) {
            currentAudioFocus = partLabel ? partLabel.trim().toUpperCase() : null;
        };

        window.clearAudioFocus = function () {
            currentAudioFocus = null;
        };

        window.setFocusedVoicePart = function (partLabel) {
            currentFocusedVoicePart = partLabel ? partLabel.trim().toUpperCase() : null;
        };

        window.applySyncColors = function (colorsJson) {
            // Visual notehead colors are already rendered from XML DOM in buildNoteMap.
            if (currentVisualFocus !== null) {
                updateColorsAndRender();
            }
        };

        // ─── Dynamic Score Zoom Support ──────────────────────────────
        // (calculateFitToWidthZoom and currentScoreZoom declared at state top)

        function applyZoom(newZoom) {
            if (!osmd) return;
            var targetZoom = Math.max(0.20, Math.min(1.50, parseFloat(newZoom) || calculateFitToWidthZoom()));
            currentScoreZoom = targetZoom;

            if (zoomDebounceTimer) {
                clearTimeout(zoomDebounceTimer);
            }

            zoomDebounceTimer = setTimeout(function () {
                try {
                    osmd.zoom = currentScoreZoom;
                    if ('Zoom' in osmd) osmd.Zoom = currentScoreZoom;
                    osmd.render();
                    resizeCanvas();
                    buildNoteMap();
                    layoutHash = computeLayoutHash();
                    if (window.VoxSightBridge) {
                        window.VoxSightBridge.onLayoutChanged(
                            layoutHash,
                            JSON.stringify(noteCoordinates)
                        );
                    }
                    if (currentVisualFocus !== null) {
                        updateColorsAndRender();
                    }
                } catch (err) {
                    console.error('[VoxSight] Error during debounced zoom render:', err);
                } finally {
                    zoomDebounceTimer = null;
                }
            }, 180);
        }

        window.zoomIn = function () {
            applyZoom(currentScoreZoom + 0.08);
        };

        window.zoomOut = function () {
            applyZoom(currentScoreZoom - 0.08);
        };

        window.zoomFit = function () {
            applyZoom(calculateFitToWidthZoom());
        };

        window.setZoom = function (val) {
            applyZoom(val);
        };

        // Multi-touch pinch-to-zoom & single-touch tap-to-seek note repetition
        let pinchInitialDist = null;
        let pinchBaseZoom = 0.40;
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;
        let isPinchZooming = false;
        let lastPinchEndTime = 0;
        let pinchPendingZoom = null;
        let pinchDebounceTimer = null;
        let renderTargetDiv = null;

        function handleNoteTap(clientX, clientY) {
            if (!noteCoordinates || noteCoordinates.length === 0) return;
            const container = document.getElementById('score-container');
            if (!container) return;

            const rect = container.getBoundingClientRect();
            const tapX = clientX - rect.left + container.scrollLeft;
            const tapY = clientY - rect.top + container.scrollTop;

            // Search for closest note within 60px radius (weighted dy for stave isolation)
            let closestNote = null;
            let minDistSq = 60 * 60;

            for (let i = 0; i < noteCoordinates.length; i++) {
                const n = noteCoordinates[i];
                const noteCenterX = n.x + ((n.width || 16) / 2);
                const noteCenterY = n.y + ((n.height || 14) / 2);

                const dx = tapX - noteCenterX;
                const dy = (tapY - noteCenterY) * 1.5;
                const distSq = dx * dx + dy * dy;

                if (distSq < minDistSq) {
                    minDistSq = distSq;
                    closestNote = n;
                }
            }

            if (closestNote) {
                console.log('[VoxSight Renderer] Note tapped:', closestNote.id, 'tick:', closestNote.tick, 'measure:', closestNote.measureNumber);
                // 1. Instant visual highlight on tapped note
                window.highlightNotes([{
                    eventId: "note_" + closestNote.id,
                    x: closestNote.x,
                    y: closestNote.y,
                    width: closestNote.width,
                    height: closestNote.height,
                    color: closestNote.color || "#00E676"
                }]);

                // 2. Dispatch to Android native playback engine to jump & play/repeat
                if (window.VoxSightBridge && typeof window.VoxSightBridge.onNoteClicked === 'function') {
                    window.VoxSightBridge.onNoteClicked(closestNote.tick, closestNote.id, closestNote.measureNumber);
                }

                // 3. Fallback audio preview via Tone.js synth if active
                if (synth && closestNote.midiNote) {
                    playNote(closestNote.midiNote, 400, 90);
                }
            }
        }
        window.handleNoteTap = handleNoteTap;

        const scoreContainer = document.getElementById('score-container');
        if (scoreContainer) {
            scoreContainer.addEventListener('touchstart', function (e) {
                if (e.touches.length === 2) {
                    isPinchZooming = true;
                    touchStartTime = 0;
                    if (pinchDebounceTimer) {
                        clearTimeout(pinchDebounceTimer);
                        pinchDebounceTimer = null;
                    }
                    pinchInitialDist = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                    pinchBaseZoom = currentScoreZoom;
                    pinchPendingZoom = currentScoreZoom;
                    if (!renderTargetDiv) {
                        renderTargetDiv = document.getElementById('osmd-render');
                    }
                    if (renderTargetDiv) {
                        renderTargetDiv.style.transformOrigin = 'top left';
                    }
                } else if (e.touches.length === 1) {
                    if (isPinchZooming || (Date.now() - lastPinchEndTime) < 350) {
                        touchStartTime = 0;
                    } else {
                        isPinchZooming = false;
                        touchStartX = e.touches[0].clientX;
                        touchStartY = e.touches[0].clientY;
                        touchStartTime = Date.now();
                    }
                }
            }, { passive: true });

            scoreContainer.addEventListener('touchmove', function (e) {
                if (e.touches.length === 2 && pinchInitialDist) {
                    const dist = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                    const factor = dist / pinchInitialDist;
                    pinchPendingZoom = Math.max(0.20, Math.min(1.50, pinchBaseZoom * factor));
                    if (renderTargetDiv) {
                        const scale = pinchPendingZoom / pinchBaseZoom;
                        renderTargetDiv.style.transform = 'scale(' + scale + ')';
                    }
                } else if (e.touches.length === 1 && !isPinchZooming) {
                    const dx = e.touches[0].clientX - touchStartX;
                    const dy = e.touches[0].clientY - touchStartY;
                    if (Math.hypot(dx, dy) > 12) {
                        touchStartTime = 0; // User is scrolling/panning, cancel tap
                    }
                }
            }, { passive: true });

            scoreContainer.addEventListener('touchend', function (e) {
                if (e.touches.length < 2) {
                    pinchInitialDist = null;
                }
                if (isPinchZooming && pinchPendingZoom !== null) {
                    isPinchZooming = false;
                    lastPinchEndTime = Date.now();
                    touchStartTime = 0;
                    if (pinchDebounceTimer) clearTimeout(pinchDebounceTimer);
                    const targetZoom = pinchPendingZoom;
                    pinchDebounceTimer = setTimeout(function () {
                        if (renderTargetDiv) {
                            renderTargetDiv.style.transform = 'none';
                        }
                        applyZoom(targetZoom);
                        pinchDebounceTimer = null;
                        pinchPendingZoom = null;
                    }, 150);
                } else {
                    const timeSincePinch = Date.now() - lastPinchEndTime;
                    if (!isPinchZooming && timeSincePinch > 350 && touchStartTime > 0 && (Date.now() - touchStartTime) < 400) {
                        const touch = e.changedTouches[0];
                        if (touch) {

        /**
         * Multi-part relational matcher for Visual Focus illumination.
         * Ensures merged notes (UNISON_TB) stay illuminated for both Tenor and Bass!
         */
        function isVisualFocusMatch(focus, partLabel, participating) {
            if (!focus) return true;
            var nf = String(focus).trim().toUpperCase();
            var np = String(partLabel || '').trim().toUpperCase();
            if (nf === 'OTHER') nf = 'OTHERS';
            if (np === 'OTHER') np = 'OTHERS';

            // 1. Direct string match
            if (nf === np) return true;

            // 2. Participating parts array (e.g. UNISON_TB has ["T", "B"])
            if (participating && Array.isArray(participating)) {
                for (var i = 0; i < participating.length; i++) {
                    var p = String(participating[i]).trim().toUpperCase();
                    if (p === nf) return true;
                    if (nf === 'S' && (p === 'S1' || p === 'S2')) return true;
                    if (nf === 'A' && (p === 'A1' || p === 'A2')) return true;
                    if (nf === 'T' && (p === 'T1' || p === 'T2')) return true;
                    if (nf === 'B' && (p === 'B1' || p === 'B2')) return true;
                }
            }

            // 3. TUTTI or UNISON_ALL matches any vocal focus
            if (np === 'TUTTI' || np === 'UNISON_ALL' || np === 'ALL') {
                return (nf !== 'OTHERS');
            }

            // 4. Section matching (Focus = S matches S1, S2, UNISON_SA, UNISON_S1S2)
            if (nf === 'S' && (np === 'S1' || np === 'S2' || np === 'UNISON_SA' || np === 'UNISON_S1S2' || np === 'SA')) return true;
            if (nf === 'A' && (np === 'A1' || np === 'A2' || np === 'UNISON_SA' || np === 'UNISON_A1A2' || np === 'SA')) return true;
            if (nf === 'T' && (np === 'T1' || np === 'T2' || np === 'UNISON_TB' || np === 'UNISON_T1T2' || np === 'TB')) return true;
            if (nf === 'B' && (np === 'B1' || np === 'B2' || np === 'UNISON_TB' || np === 'UNISON_B1B2' || np === 'TB')) return true;

            if ((nf === 'S1' || nf === 'S2') && (np === 'UNISON_S1S2' || np === 'S')) return true;
            if ((nf === 'A1' || nf === 'A2') && (np === 'UNISON_A1A2' || np === 'A')) return true;
            if ((nf === 'T1' || nf === 'T2') && (np === 'UNISON_T1T2' || np === 'T')) return true;
            if ((nf === 'B1' || nf === 'B2') && (np === 'UNISON_B1B2' || np === 'B')) return true;

            // 6. Compound tokens string matching (e.g. "UNISON_TB" matches "T", "B", "T1", "T2", "B1", "B2")
            if ((np === 'UNISON_TB' || np === 'TB') && (nf === 'T' || nf === 'B' || nf === 'T1' || nf === 'T2' || nf === 'B1' || nf === 'B2')) return true;
            if ((np === 'UNISON_SA' || np === 'SA') && (nf === 'S' || nf === 'A' || nf === 'S1' || nf === 'S2' || nf === 'A1' || nf === 'A2')) return true;

            return false;
        }

        /**

        // ─── Build Note Map (100% Deterministic Measure & Timestamp 1:1 Match) ──
        function buildNoteMap() {

            // Step 3: Group OSMD graphical notes by measureListIndex (mIdx)
