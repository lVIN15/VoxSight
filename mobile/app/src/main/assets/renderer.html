<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>VoxSight Sheet Music</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #1e293b;
            width: 100%;
            min-height: 100%;
            overflow-x: auto;
            -webkit-user-select: none;
            user-select: none;
        }

        #score-container {
            position: relative;
            width: 100%;
            max-width: 100vw;
            min-height: 100vh;
            background: #ffffff;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow-x: auto;
        }

        /* OSMD renders into this div */
        #osmd-render {
            position: relative;
            width: 100%;
            margin: 0;
            padding: 0;
            min-height: 200px;
            box-sizing: border-box;
        }

        /* Canvas overlay for playback highlighting */
        #highlight-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 10;
        }

        /* Status bar */
        #status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        #status-text {
            font-size: 12px;
            color: #a0a0a0;
            flex: 1;
        }

        #sync-confidence {
            font-size: 11px;
            color: #4ade80;
        }

        /* Loading state - WebView overlay disabled in favor of native Compose loading pill */
        .loading-overlay {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        .loading-overlay.hidden {
            display: none !important;
        }

        .spinner {
            display: none !important;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Suppress dynamics/ornament SVG glyphs (defense-in-depth) */
        .vf-dynamics, .vf-ornament,
        [class*="dynamics"], [class*="ornament"],
        [class*="trill"], [class*="mordent"],
        [class*="turn"] {
            display: none !important;
            visibility: hidden !important;
        }
    
        .vf-notehead path, [class*="notehead"] path {
            fill-rule: evenodd !important;
            -webkit-fill-rule: evenodd !important;
            shape-rendering: geometricPrecision !important;
        }
</style>
</head>

<body>

    <!-- Loading overlay (disabled in favor of native Compose loading pill) -->
    <div id="loading-overlay" class="loading-overlay" style="display: none !important;"></div>

    <!-- Score container with canvas overlay -->
    <div id="score-container">
        <div id="osmd-render"></div>
        <canvas id="highlight-canvas"></canvas>
    </div>

    <!-- Status bar -->
    <div id="status-bar" style="display: none !important;">
        <span id="status-text">Ready</span>
        <span id="sync-confidence"></span>
    </div>

    <!-- OSMD Library (Local offline support) -->
    <script src="opensheetmusicdisplay.min.js"></script>
    <script src="Tone.min.js"></script>

    <script>
        /**
         * VoxSight OSMD Renderer v1.0
         * ============================
         * Architecture Contract (v3.7):
         *   - Read-only renderer: NEVER modifies MusicXML
         *   - Canvas overlay for note highlighting (no DOM mutation on OSMD SVG)
         *   - layout_hash gating: coordinates are versioned
         *   - Bipartite matching: extracts note positions for SyncManager
         *   - No audio code — playback is handled natively
         */

        // Helper function to safely get the float value of an OSMD Fraction
        function getFractionValue(fraction) {
            if (!fraction) return 0;
            if (typeof fraction.RealValue === 'number') return fraction.RealValue;
            if (typeof fraction.realValue === 'number') return fraction.realValue;
            if (fraction.numerator !== undefined && fraction.denominator !== undefined) {
                return fraction.numerator / fraction.denominator;
            }
            return 0;
        }

        // Helper function to extract VexFlow SVG elements from an OSMD GraphicalNote
        function getSvgElements(gNote) {
            const svgs = [];
            if (!gNote) return svgs;

            const vfnotes = gNote.vfnote;
            if (!vfnotes) return svgs;

            // vfnote can be an array or a single object depending on OSMD version
            const arr = Array.isArray(vfnotes) ? vfnotes : [vfnotes];
            for (let i = 0; i < arr.length; i++) {
                const vf = arr[i];
                if (!vf) continue;
                let el = null;
                if (typeof vf.getSVGGElement === 'function') {
                    el = vf.getSVGGElement();
                } else if (vf.getAttribute && typeof vf.getAttribute === 'function') {
                    el = vf.getAttribute('el');
                }
                if (el) svgs.push(el);
            }
            return svgs;
        }

        // ─── State ──────────────────────────────────────────────────────
        let osmd = null;
        var VOICE_PALETTE = { S: '#E11D48', A: '#8E24AA', T: '#2563EB', B: '#16A34A', SOLO: '#FF6D00', OTHER: '#546E7A', UNKNOWN: '#808080' };
        window.setVoicePalette = function(palette) {
            if (!palette || typeof palette !== 'object') return;
            ['S', 'A', 'T', 'B', 'SOLO', 'OTHER', 'UNKNOWN'].forEach(function(key) {
                if (typeof palette[key] === 'string' && /^#[0-9A-F]{6}$/i.test(palette[key])) {
                    VOICE_PALETTE[key] = palette[key];
                }
            });
        };
        let highlightCtx = null;
        let layoutHash = null;
        let noteCoordinates = [];  // Extracted from OSMD after render
        let allGraphicalNotes = []; // Cached references to bypass minification issues
        let xmlDoc = null;          // Global MusicXML DOM for H-bar and structure inspection
        let colorMappingList = [];
        let currentVisualFocus = null;
        let currentAudioFocus = null;
        let currentFocusedVoicePart = null;

        function calculateFitToWidthZoom() {
            var container = document.getElementById('score-container') || document.getElementById('osmd-render');
            var vpWidth = (container && container.clientWidth > 0) ? container.clientWidth : (window.innerWidth || document.documentElement.clientWidth || 360);
            var targetWidth = Math.max(240, vpWidth - 16);
            // 50% zoomed-out full-system mobile view (~0.32 on 360px portrait mobile)
            var optimalZoom = (targetWidth / 360.0) * 0.33;
            return Math.max(0.28, Math.min(0.65, Math.round(optimalZoom * 100) / 100));
        }

        var currentScoreZoom = calculateFitToWidthZoom();
        let zoomDebounceTimer = null;

        // ─── Staff Index & Measure Number Helpers for OSMD GraphicalNotes ──────
        function getStaffIndex(gNote) {
            if (!gNote) return 0;
            if (gNote.ParentStaffEntry && gNote.ParentStaffEntry.parentStaff && typeof gNote.ParentStaffEntry.parentStaff.idInMusicSheet === 'number') {
                return gNote.ParentStaffEntry.parentStaff.idInMusicSheet;
            }
            if (gNote.parentStaffEntry && gNote.parentStaffEntry.parentStaff && typeof gNote.parentStaffEntry.parentStaff.idInMusicSheet === 'number') {
                return gNote.parentStaffEntry.parentStaff.idInMusicSheet;
            }
            var src = gNote.sourceNote || gNote.SourceNote;
            if (src) {
                if (src.ParentStaffEntry && src.ParentStaffEntry.ParentStaff && typeof src.ParentStaffEntry.ParentStaff.idInMusicSheet === 'number') {
                    return src.ParentStaffEntry.ParentStaff.idInMusicSheet;
                }
                if (src.parentStaffEntry && src.parentStaffEntry.parentStaff && typeof src.parentStaffEntry.parentStaff.idInMusicSheet === 'number') {
                    return src.parentStaffEntry.parentStaff.idInMusicSheet;
                }
                if (src.ParentStaffEntry && src.ParentStaffEntry.ParentStaff && typeof src.ParentStaffEntry.ParentStaff.Id === 'number') {
                    return src.ParentStaffEntry.ParentStaff.Id - 1;
                }
            }
            return 0;
        }

        function getMeasureIndex(gNote) {
            var src = gNote ? (gNote.sourceNote || gNote.SourceNote) : null;
            if (src) {
                var sm = src.SourceMeasure || src.sourceMeasure;
                if (sm) {
                    if (typeof sm.measureListIndex === 'number') return sm.measureListIndex;
                    if (typeof sm.MeasureListIndex === 'number') return sm.MeasureListIndex;
                }
            }
            if (gNote) {
                var pm = gNote.parentMeasure || gNote.ParentMeasure;
                if (pm) {
                    if (typeof pm.measureListIndex === 'number') return pm.measureListIndex;
                    if (typeof pm.MeasureListIndex === 'number') return pm.MeasureListIndex;
                    var psm = pm.parentSourceMeasure || pm.ParentSourceMeasure;
                    if (psm) {
                        if (typeof psm.measureListIndex === 'number') return psm.measureListIndex;
                        if (typeof psm.MeasureListIndex === 'number') return psm.MeasureListIndex;
                    }
                }
                var pse = gNote.parentStaffEntry || gNote.ParentStaffEntry;
                if (pse) {
                    var pm2 = pse.parentMeasure || pse.ParentMeasure;
                    if (pm2) {
                        if (typeof pm2.measureListIndex === 'number') return pm2.measureListIndex;
                        if (typeof pm2.MeasureListIndex === 'number') return pm2.MeasureListIndex;
                        var psm2 = pm2.parentSourceMeasure || pm2.ParentSourceMeasure;
                        if (psm2) {
                            if (typeof psm2.measureListIndex === 'number') return psm2.measureListIndex;
                            if (typeof psm2.MeasureListIndex === 'number') return psm2.MeasureListIndex;
                        }
                    }
                }
            }
            return 0;
        }

        function getMeasureNumber(gNote) {
            var src = gNote ? (gNote.sourceNote || gNote.SourceNote) : null;
            if (src) {
                if (src.SourceMeasure && typeof src.SourceMeasure.MeasureNumber === 'number') return src.SourceMeasure.MeasureNumber;
                if (src.sourceMeasure && typeof src.sourceMeasure.MeasureNumber === 'number') return src.sourceMeasure.MeasureNumber;
            }
            if (gNote.parentStaffEntry && gNote.parentStaffEntry.parentMeasure) {
                var m = gNote.parentStaffEntry.parentMeasure;
                if (typeof m.MeasureNumber === 'number') return m.MeasureNumber;
                if (m.ParentSourceMeasure && typeof m.ParentSourceMeasure.MeasureNumber === 'number') return m.ParentSourceMeasure.MeasureNumber;
            }
            return 1;
        }

        function getSourceNotePitchSignature(src) {
            if (!src) return null;
            if (typeof src.isRest === 'function' && src.isRest()) return 'REST';
            if (src.isRest === true) return 'REST';

            var pitchObj = src.Pitch || src.pitch;
            if (pitchObj) {
                var step = '';
                if (typeof pitchObj.step === 'string') step = pitchObj.step.toUpperCase();
                else if (typeof pitchObj.Step === 'string') step = pitchObj.Step.toUpperCase();
                else if (typeof pitchObj.step === 'number') {
                    var stepNames = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
                    step = stepNames[pitchObj.step % 7] || '';
                }

                var octave = (typeof pitchObj.octave === 'number') ? pitchObj.octave : ((typeof pitchObj.Octave === 'number') ? pitchObj.Octave : 4);
                var alter = (typeof pitchObj.accidental === 'number') ? pitchObj.accidental : ((typeof pitchObj.Accidental === 'number') ? pitchObj.Accidental : 0);
                var altStr = alter !== 0 ? (alter > 0 ? '#' : 'b') : '';
                return step + altStr + octave;
            }
            return null;
        }

        function getVoiceNumber(gNote) {
            var src = gNote ? (gNote.sourceNote || gNote.SourceNote) : null;
            if (src) {
                if (src.VoiceEntry && src.VoiceEntry.ParentVoice && src.VoiceEntry.ParentVoice.VoiceId !== undefined) {
                    return parseInt(src.VoiceEntry.ParentVoice.VoiceId, 10) || 1;
                }
                if (src.voice && typeof src.voice === 'object' && (src.voice.VoiceId || src.voice.voiceId)) {
                    return parseInt(src.voice.VoiceId || src.voice.voiceId, 10) || 1;
                }
                if (typeof src.voice === 'number') return src.voice;
                if (src.ParentVoice && src.ParentVoice.VoiceId !== undefined) {
                    return parseInt(src.ParentVoice.VoiceId, 10) || 1;
                }
            }
            if (gNote && gNote.ParentStaffEntry && gNote.ParentStaffEntry.ParentVoice && gNote.ParentStaffEntry.ParentVoice.VoiceId !== undefined) {
                return parseInt(gNote.ParentStaffEntry.ParentVoice.VoiceId, 10) || 1;
            }
            return 1;
        }

        // ─── Universal Musical Part Classifier (Clef + Tessitura + Structural Soloist) ───────
        function buildXmlDocVocalPartMap(doc) {
            if (!doc) return [];
            var partsList = doc.getElementsByTagName('part');
            var total = partsList.length;
            var meta = [];
            var stepOffsets = {'C': 0, 'D': 2, 'E': 4, 'F': 5, 'G': 7, 'A': 9, 'B': 11};

            for (var i = 0; i < total; i++) {
                var p = partsList[i];
                var pid = (p && typeof p.getAttribute === 'function') ? p.getAttribute('id') : null;
                var sp = (pid && typeof doc.querySelector === 'function') ? doc.querySelector("score-part[id='" + pid + "']") : null;
                var pName = (sp && sp.querySelector && sp.querySelector('part-name')) ? (sp.querySelector('part-name').textContent || '').trim().toLowerCase() : '';
                var pAbbr = (sp && sp.querySelector && sp.querySelector('part-abbreviation')) ? (sp.querySelector('part-abbreviation').textContent || '').trim().toLowerCase() : '';
                var combined = (pName + " " + pAbbr).trim();

                var isExplicitSolo = ['solo', 'cantor', 'leader', 'descant', 'baritone solo', 'baritone'].some(function(w) { return combined.indexOf(w) !== -1; });
                var isAccomp = ['piano', 'organ', 'keyboard', 'guitar', 'accomp', 'orch', 'strings'].some(function(w) { return combined.indexOf(w) !== -1; });
                var isCondensedPair = ['s/a', 's / a', 'soprano / alto', 'soprano/alto', 't/b', 't / b', 'tenor / bass', 'tenor/bass', 'women', 'men'].some(function(w) { return combined.indexOf(w) !== -1; });

                var isSoprano = !isCondensedPair && (combined.indexOf('soprano') !== -1 || combined.indexOf('sopr') !== -1 || combined.indexOf('sop') !== -1 || combined === 's' || combined === 's.' || /\bs\b/i.test(combined)) && combined.indexOf('alto') === -1;
                var isAlto = !isCondensedPair && (combined.indexOf('alto') !== -1 || combined.indexOf('alt') !== -1 || combined === 'a' || combined === 'a.' || /\ba\b/i.test(combined)) && combined.indexOf('soprano') === -1;
                var isTenor = !isCondensedPair && (combined.indexOf('tenor') !== -1 || combined.indexOf('ten') !== -1 || combined === 't' || combined === 't.' || /\bt\b/i.test(combined)) && combined.indexOf('bass') === -1;
                var isBass = !isCondensedPair && (combined.indexOf('bass') !== -1 || combined.indexOf('bas') !== -1 || combined === 'b' || combined === 'b.' || /\bb\b/i.test(combined)) && combined.indexOf('tenor') === -1;

                var hasFClef = false;
                var clefSigns = (p && typeof p.querySelectorAll === 'function') ? p.querySelectorAll('clef > sign') : [];
                for (var ci = 0; ci < clefSigns.length; ci++) {
                    if ((clefSigns[ci].textContent || '').trim().toUpperCase() === 'F') {
                        hasFClef = true;
                        break;
                    }
                }
                if (!hasFClef && p && typeof p.querySelectorAll === 'function') {
                    var clefOcts = p.querySelectorAll('clef > clef-octave-change');
                    for (var coi = 0; coi < clefOcts.length; coi++) {
                        var octVal = parseInt((clefOcts[coi].textContent || '').trim(), 10);
                        if (!isNaN(octVal) && octVal < 0) {
                            hasFClef = true;
                            break;
                        }
                    }
                }

                var noteEls = (p && typeof p.querySelectorAll === 'function') ? p.querySelectorAll('note') : [];
                var totalMidi = 0;
                var noteCount = 0;
                for (var ni = 0; ni < noteEls.length; ni++) {
                    var n = noteEls[ni];
                    if (n.querySelector && n.querySelector('rest')) continue;
                    var pEl = n.querySelector ? n.querySelector('pitch') : null;
                    if (!pEl) continue;
                    var step = (pEl.querySelector('step') ? pEl.querySelector('step').textContent.trim() : 'C').toUpperCase();
                    var oct = parseInt(pEl.querySelector('octave') ? pEl.querySelector('octave').textContent.trim() : '4', 10);
                    var alt = parseInt(pEl.querySelector('alter') ? pEl.querySelector('alter').textContent.trim() : '0', 10);
                    var midi = (oct + 1) * 12 + (stepOffsets[step] || 0) + alt;
                    totalMidi += midi;
                    noteCount++;
                }
                var avgMidi = noteCount > 0 ? (totalMidi / noteCount) : 0;

                var activeMeasures = 0;
                var measEls = (p && typeof p.getElementsByTagName === 'function') ? p.getElementsByTagName('measure')
                    : ((p && typeof p.querySelectorAll === 'function') ? p.querySelectorAll('measure') : []);
                if (measEls && measEls.length > 0) {
                    for (var mi = 0; mi < measEls.length; mi++) {
                        var mNotes = measEls[mi].querySelectorAll ? measEls[mi].querySelectorAll('note') : [];
                        var hasPitched = false;
                        for (var mni = 0; mni < mNotes.length; mni++) {
                            var mn = mNotes[mni];
                            if (mn.querySelector && !mn.querySelector('rest') && mn.querySelector('pitch')) {
                                hasPitched = true;
                                break;
                            }
                        }
                        if (hasPitched) activeMeasures++;
                    }
                } else if (typeof p.activeMeasures === 'number') {
                    activeMeasures = p.activeMeasures;
                } else {
                    activeMeasures = noteCount > 0 ? 1 : 0;
                }

                meta.push({
                    index: i,
                    pid: pid,
                    name: pName,
                    combined: combined,
                    isExplicitSolo: isExplicitSolo,
                    isAccomp: isAccomp,
                    isSoprano: isSoprano,
                    isAlto: isAlto,
                    isTenor: isTenor,
                    isBass: isBass,
                    hasFClef: hasFClef,
                    noteCount: noteCount,
                    activeMeasures: activeMeasures,
                    avgMidi: avgMidi
                });
            }

            var vocalPartMap = new Array(total);
            var claimedRoles = {};

            // Pass 1: Explicit Solo and Accompaniment
            meta.forEach(function(m) {
                if (m.isExplicitSolo && total > 1) {
                    vocalPartMap[m.index] = { voice: "SOLO", part: "SOLO", color: VOICE_PALETTE.SOLO, partId: 5, participating: ["SOLO"] };
                } else if (m.isAccomp) {
                    vocalPartMap[m.index] = { voice: "OTHERS", part: "OTHERS", color: VOICE_PALETTE.OTHER, partId: 6, participating: ["OTHERS"] };
                }
            });

            // Pass 2: Explicit SATB names
            meta.forEach(function(m) {
                if (vocalPartMap[m.index]) return;
                if (m.isSoprano) {
                    vocalPartMap[m.index] = { voice: "SOPRANO", part: "S", color: VOICE_PALETTE.S, partId: 1, participating: ["S"] };
                    claimedRoles["SOPRANO"] = true;
                } else if (m.isAlto) {
                    vocalPartMap[m.index] = { voice: "ALTO", part: "A", color: VOICE_PALETTE.A, partId: 2, participating: ["A"] };
                    claimedRoles["ALTO"] = true;
                } else if (m.isTenor) {
                    vocalPartMap[m.index] = { voice: "TENOR", part: "T", color: VOICE_PALETTE.T, partId: 3, participating: ["T"] };
                    claimedRoles["TENOR"] = true;
                } else if (m.isBass) {
                    vocalPartMap[m.index] = { voice: "BASS", part: "B", color: VOICE_PALETTE.B, partId: 4, participating: ["B"] };
                    claimedRoles["BASS"] = true;
                }
            });

            // Pass 2.5: Structural Soloist Detection for >= 5-part vocal ensembles with generic OMR part names
            var hasAssignedSolo = vocalPartMap.some(function(entry) { return entry && entry.part === "SOLO"; });
            var vocalCandidates = meta.filter(function(m) { return !m.isAccomp && m.activeMeasures > 0; });
            if (vocalCandidates.length >= 5 && !hasAssignedSolo) {
                var activeSorted = vocalCandidates.map(function(m) { return m.activeMeasures; }).sort(function(a, b) { return b - a; });
                var mCore = activeSorted[3];
                var coreCandidates = vocalCandidates.filter(function(m) { return mCore < 4 || m.activeMeasures >= mCore * 0.45; });
                var sopranoAnchor = null;
                coreCandidates.forEach(function(m) {
                    if (!m.hasFClef && (!sopranoAnchor || m.avgMidi > sopranoAnchor.avgMidi)) {
                        sopranoAnchor = m;
                    }
                });

                vocalCandidates.forEach(function(m) {
                    if (vocalPartMap[m.index]) return;
                    var isSparseSolo = (mCore >= 4 && m.activeMeasures < mCore * 0.45);
                    var isAboveChoirSolo = Boolean(
                        sopranoAnchor &&
                        m.index < sopranoAnchor.index &&
                        (m.hasFClef || (m.avgMidi > 0 && m.avgMidi < sopranoAnchor.avgMidi - 3.0))
                    );
                    if (isSparseSolo || isAboveChoirSolo) {
                        var remainingVocal = vocalCandidates.filter(function(cand) {
                            return cand.index !== m.index && !(vocalPartMap[cand.index] && vocalPartMap[cand.index].part === "SOLO");
                        }).length;
                        if (remainingVocal >= 4) {
                            vocalPartMap[m.index] = { voice: "SOLO", part: "SOLO", color: VOICE_PALETTE.SOLO, partId: 5, participating: ["SOLO"] };
                        }
                    }
                });
            }

            // Pass 3: Fill unassigned vocal parts using Clef + Tessitura against unclaimed roles
            var unassigned = meta.filter(function(m) { return !vocalPartMap[m.index]; });
            if (unassigned.length > 0) {
                var unassignedBass = unassigned.filter(function(m) { return m.hasFClef || (m.avgMidi > 0 && m.avgMidi < 60.0); });
                var unassignedTreble = unassigned.filter(function(m) { return !m.hasFClef && (m.avgMidi === 0 || m.avgMidi >= 60.0); });

                unassignedBass.sort(function(a, b) { return b.avgMidi - a.avgMidi; });
                unassignedTreble.sort(function(a, b) { return b.avgMidi - a.avgMidi; });

                unassignedTreble.forEach(function(m) {
                    if (!claimedRoles["SOPRANO"]) {
                        vocalPartMap[m.index] = { voice: "SOPRANO", part: "S", color: VOICE_PALETTE.S, partId: 1, participating: ["S"] };
                        claimedRoles["SOPRANO"] = true;
                    } else if (!claimedRoles["ALTO"]) {
                        vocalPartMap[m.index] = { voice: "ALTO", part: "A", color: VOICE_PALETTE.A, partId: 2, participating: ["A"] };
                        claimedRoles["ALTO"] = true;
                    } else if (unassignedTreble.length >= 3 && unassignedBass.length <= 1 && !claimedRoles["TENOR"]) {
                        vocalPartMap[m.index] = { voice: "TENOR", part: "T", color: VOICE_PALETTE.T, partId: 3, participating: ["T"] };
                        claimedRoles["TENOR"] = true;
                    } else {
                        var role = (m.avgMidi >= 66.5) ? "SOPRANO" : "ALTO";
                        var clr = (role === "SOPRANO") ? VOICE_PALETTE.S : VOICE_PALETTE.A;
                        var pId = (role === "SOPRANO") ? 1 : 2;
                        vocalPartMap[m.index] = { voice: role, part: role[0], color: clr, partId: pId, participating: [role[0]] };
                    }
                });

                unassignedBass.forEach(function(m) {
                    if (unassignedBass.length >= 2 && !claimedRoles["TENOR"]) {
                        vocalPartMap[m.index] = { voice: "TENOR", part: "T", color: VOICE_PALETTE.T, partId: 3, participating: ["T"] };
                        claimedRoles["TENOR"] = true;
                    } else if (unassignedBass.length >= 2 && !claimedRoles["BASS"]) {
                        vocalPartMap[m.index] = { voice: "BASS", part: "B", color: VOICE_PALETTE.B, partId: 4, participating: ["B"] };
                        claimedRoles["BASS"] = true;
                    } else if (claimedRoles["TENOR"] && !claimedRoles["BASS"]) {
                        vocalPartMap[m.index] = { voice: "BASS", part: "B", color: VOICE_PALETTE.B, partId: 4, participating: ["B"] };
                        claimedRoles["BASS"] = true;
                    } else if (claimedRoles["BASS"] && !claimedRoles["TENOR"]) {
                        vocalPartMap[m.index] = { voice: "TENOR", part: "T", color: VOICE_PALETTE.T, partId: 3, participating: ["T"] };
                        claimedRoles["TENOR"] = true;
                    } else {

                            fPaths[fp].setAttribute('fill', voiceColor);

        function findGraphicalNotes(obj, visited = new Set(), results = []) {
