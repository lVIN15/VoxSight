<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoxSight - Phase 1 Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f1f5f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: rgba(15, 23, 42, 0.95);
            padding: 16px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        #scoreContainer {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            background: rgba(30, 41, 59, 0.5);
        }

        #score {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 20px;
        }

        #errorArea {
            display: none;
            padding: 16px;
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid #dc2626;
            border-radius: 6px;
            color: #fca5a5;
            margin: 20px;
            text-align: center;
            font-size: 0.95rem;
        }

        #errorArea.show {
            display: block;
        }

        #loadingArea {
            display: none;
            padding: 20px;
            text-align: center;
            color: #0ea5e9;
            font-size: 1rem;
        }

        #loadingArea.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(14, 165, 233, 0.3);
            border-top: 3px solid #0ea5e9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        footer {
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid rgba(148, 163, 184, 0.2);
            padding: 16px;
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.3);
        }

        button {
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 500;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #0ea5e9;
            color: white;
            transition: all 0.2s ease;
            min-width: 90px;
        }

        button:hover {
            background: #0284c7;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #64748b;
            cursor: not-allowed;
            opacity: 0.6;
        }

        #tempoDisplay {
            color: #cbd5e1;
            font-size: 0.95rem;
            padding: 8px 16px;
            background: rgba(51, 65, 85, 0.6);
            border-radius: 6px;
            min-width: 140px;
            text-align: center;
        }

        #statusDisplay {
            color: #94a3b8;
            font-size: 0.9rem;
            padding: 8px 16px;
            background: rgba(51, 65, 85, 0.4);
            border-radius: 6px;
            min-width: 200px;
            text-align: center;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.2rem;
            }

            #scoreContainer {
                padding: 10px;
            }

            #score {
                padding: 10px;
            }

            footer {
                gap: 8px;
                padding: 12px;
            }

            button {
                padding: 8px 16px;
                font-size: 0.9rem;
                min-width: 80px;
            }

            #tempoDisplay,
            #statusDisplay {
                font-size: 0.85rem;
                padding: 6px 12px;
                min-width: auto;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header>
        <h1>🎼 VoxSight Choir Player - Phase 1</h1>
    </header>

    <!-- Score Display Area -->
    <div id="scoreContainer">
        <div id="loadingArea">
            <span class="spinner"></span>
            <span>Loading score...</span>
        </div>
        <div id="errorArea"></div>
        <div id="score"></div>
    </div>

    <!-- Playback Controls -->
    <footer>
        <button id="playBtn" onclick="play()">▶ Play</button>
        <button id="pauseBtn" onclick="pause()">⏸ Pause</button>
        <button id="stopBtn" onclick="stop()">⏹ Stop</button>
        <div id="tempoDisplay">—</div>
        <div id="statusDisplay">Ready</div>
    </footer>

    <!-- Libraries -->
    <script src="opensheetmusicdisplay.min.js"></script>
    <script src="Tone.min.js"></script>

    <script>
        // ============================================
        // GLOBALS
        // ============================================

        let osmd = null;
        let synth = null;
        let currentTempo = 120;
        let allNotes = [];
        let isPlaying = false;
        let tonePart = null;

        // ============================================
        // INITIALIZATION
        // ============================================

        function init() {
            console.log('=== VoxSight Phase 1 Player Initializing ===');

            // Initialize Tone.js synth
            try {
                synth = new Tone.PolySynth(Tone.Synth, {
                    maxPolyphony: 4,
                    oscillator: { type: 'triangle' },
                    envelope: { attack: 0.02, decay: 0.08, sustain: 0.2, release: 0.2 }
                }).toDestination();
                synth.volume.value = -8;
                console.log('✓ Tone.js synth initialized');
            } catch (e) {
                console.error('✗ Synth init failed:', e);
                showError('Failed to initialize audio synth');
                return;
            }

            // Initialize OSMD (optional - may fail on Android)
            try {
                if (typeof opensheetmusicdisplay !== 'undefined') {
                    osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay('score', {
                        autoResize: true,
                        drawTitle: false
                    });
                    console.log('✓ OSMD initialized');
                } else {
                    console.warn('⚠ OSMD not available');
                }
            } catch (e) {
                console.warn('⚠ OSMD init warning (non-critical):', e.message);
                document.getElementById('score').innerHTML =
                    '<p style="color: #999; padding: 20px; text-align: center;">Score rendering unavailable on this device</p>';
            }

            updateStatus('Ready');
            console.log('=== Initialization Complete ===\n');
        }

        // ============================================
        // SCORE LOADING (Android WebView Entry Point)
        // ============================================

        async function processScoreData(data) {
            console.log('=== processScoreData() called ===');

            if (!data) {
                showError('Error: No data received');
                return;
            }

            currentTempo = data.tempo || 120;
            console.log('Tempo:', currentTempo);

            showLoading(true);
            updateStatus('Processing score...');

            try {
                // Step 1: Render with OSMD (optional)
                if (osmd && data.musicxml) {
                    try {
                        await osmd.load(data.musicxml);
                        osmd.render();
                        console.log('✓ OSMD rendered');
                    } catch (e) {
                        console.warn('⚠ OSMD render skipped:', e.message);
                    }
                }

                // Step 2: Prepare notes from backend SATB data
                if (data.satb) {
                    prepareNotes(data.satb);
                    console.log('✓ Notes prepared:', allNotes.length);
                } else {
                    console.warn('⚠ No SATB data in response');
                }

                updateStatus('Score loaded. Press Play.');
                showLoading(false);
                console.log('=== processScoreData() Complete ===\n');

            } catch (error) {
                showLoading(false);
                console.error('Error:', error);
                showError('Error: ' + error.message);
            }
        }

        // ============================================
        // PREPARE NOTES FROM SATB DATA
        // ============================================

        function prepareNotes(satbData) {
            allNotes = [];
            const secondsPerBeat = 60 / currentTempo;

            // Flatten SATB into single note list
            ['S', 'A', 'T', 'B'].forEach(part => {
                const notes = satbData[part] || [];
                notes.forEach(note => {
                    if (note.pitch && note.time !== undefined) {
                        const startSeconds = (note.time || 0) * secondsPerBeat;
                        const durationSeconds =
                            (note.durationBeats || 0.5) * secondsPerBeat;

                        allNotes.push({
                            pitch: String(note.pitch).trim(),
                            startTime: startSeconds,
                            duration: Math.max(durationSeconds, 0.05),
                            part: part
                        });
                    }
                });
            });

            allNotes.sort((a, b) => a.startTime - b.startTime);
            console.log('Prepared', allNotes.length, 'notes');

            if (tonePart) {
                tonePart.dispose();
                tonePart = null;
            }
        }

        // ============================================
        // PLAYBACK CONTROLS
        // ============================================

        async function play() {
            if (allNotes.length === 0) {
                console.warn('No notes loaded');
                return;
            }

            if (Tone.Transport.state === 'started') {
                console.log('Already playing');
                return;
            }

            try {
                await Tone.start();
                console.log('AudioContext started');

                Tone.Transport.bpm.value = currentTempo;

                if (!tonePart) {
                    const toneEvents = allNotes.map(n => [n.startTime, { pitch: n.pitch, duration: n.duration }]);
                    tonePart = new Tone.Part((time, value) => {
                        synth.triggerAttackRelease(value.pitch, value.duration, time);
                    }, toneEvents);
                }

                if (Tone.Transport.state === 'paused') {
                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                    Tone.Transport.seconds = 0;
                    if (tonePart) tonePart.start(0);
                    Tone.Transport.start("+0.05");
                }

                isPlaying = true;
                updateStatus('Playing...');
                console.log('▶ Play started');

            } catch (e) {
                console.error('Play error:', e);
                showError('Playback error: ' + e.message);
                isPlaying = false;
            }
        }

        function pause() {
            if (Tone.Transport.state !== 'started') return;
            Tone.Transport.pause();
            isPlaying = false;
            updateStatus('Paused');
            console.log('⏸ Paused');
        }

        function stop() {
            Tone.Transport.stop();
            Tone.Transport.seconds = 0;
            if (tonePart) tonePart.stop(0);
            isPlaying = false;
            updateStatus('Stopped');
            console.log('⏹ Stopped');
        }

        // ============================================
        // UI HELPERS
        // ============================================

        function showError(message) {
            console.error('ERROR:', message);
            const errorArea = document.getElementById('errorArea');
            errorArea.textContent = message;
            errorArea.classList.add('show');
        }

        function clearError() {
            const errorArea = document.getElementById('errorArea');
            errorArea.classList.remove('show');
        }

        function showLoading(show) {
            const loadingArea = document.getElementById('loadingArea');
            loadingArea.classList.toggle('show', show);
        }

        function updateStatus(message) {
            const statusDisplay = document.getElementById('statusDisplay');
            statusDisplay.textContent = message;

            const tempoDisplay = document.getElementById('tempoDisplay');
            if (currentTempo) {
                tempoDisplay.textContent = '♩ = ' + currentTempo + ' BPM';
            }
        }

        // ============================================
        // PAGE LOAD
        // ============================================

        document.addEventListener('DOMContentLoaded', () => {
            console.log('\n=== PAGE LOAD ===');
            init();

            window.loadScore = function (data) {
                stop();
                clearError();
                processScoreData(data);
            };

            console.log('✓ Page ready\n');
        });
    </script>
</body>

</html>
